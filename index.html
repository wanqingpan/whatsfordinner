本豆腐煲是一道酱香浓郁的家常下饭菜，豆腐外焦里嫩，金针菇爽滑入味。金针菇富含氨基酸和膳食纤维，日本豆腐提供优质蛋白，营养开胃。这道菜步骤简单，新手也能轻松掌握，从备菜到出锅大约需要 30 分钟。","q":["金针菇 1-2 把","豆腐 2 袋","小米椒 3-5 根，切碎","蒜 2-3 瓣","生抽 15ml","蚝油 5ml","老抽 3ml","糖 3g","食用油 10-15ml"],"s":["豆腐切片，小火煎到两面金黄出锅备用。","切蒜成蒜末；将生抽，蚝油，老抽，糖，100ml 水调汁备用。","热锅放油，油热放小米椒、蒜末爆香，先放金针菇，炒软，把煎好的豆腐平铺在金针菇上，倒入#2 配好的料汁，焖 5 分钟，大火收汁。"],"x":["金针菇一定要先炒软。","豆腐尽量不要翻炒，容易碎。"]},{"t":"金钱蛋","c":"veg","cu":"Chinese","m":44,"p":"fish","ing":["鸡蛋","线椒","小米辣","豆瓣酱","蒜","小葱","玉米淀粉","食用油","生抽","蚝油"],"tp":"","d":3,"k":427,"i":"金钱蛋是一道外焦里嫩、咸香微辣的湘味家常菜，煎至金黄的蛋片形似铜钱，寓意吉祥。鸡蛋与青红椒搭配，富含优质蛋白质和多种维生素，营养均衡。制作难度中等，新手稍加练习也能掌握，全程约需 30 分钟即可完成下饭菜。","q":["鸡蛋 5 个","玉米淀粉 40 g","食用油 20-35 ml","线椒 15 g","小米辣 6-15 g（约 2-5 个）","豆瓣酱 15 ml","蒜 10 g（约 2-3 瓣）","小葱 3 g（约 1-2 根）","生抽 15 ml","蚝油 15 ml","糖 5 g"],"s":["鸡蛋冷水下锅，大火煮开转小火煮 8 分钟。","用自来水冲凉，方便剥皮。","蒜切沫（粒径不大于 1 mm），线椒和小米辣切小粒（约 2-3 mm）","每个熟鸡蛋沿短轴切成体积类似的 4 份。","如果打算沾淀粉，每片鸡蛋粘上淀粉，抖掉多余的淀粉。","锅内放入 25 ml 油（如果不沾淀粉，放 20 ml），放入熟鸡蛋片。","煎至微焦黄后，补 10 ml 油（如果不沾淀粉，补 10 ml），翻面。","第二面微黄后，加入线椒、小米辣、蒜末煎制约一分钟，翻面。","接着加豆瓣酱煎制约几十秒，翻面。","生抽、耗油、糖调成汁，轻轻颠锅后即可出锅。"],"x":["原汁原味的做法建议放 15 g，不能吃辣的减少到 6 g，还可以剔除辣椒籽。","推荐使用不粘锅，使用不粘锅时初次放油可以减少 5 ml。","应确保鸡蛋剥皮时已经完全凝固。","不宜过度翻炒，容易散。"]},{"t":"陕北熬豆角","c":"veg","cu":"Chinese","m":30,"p":"fish","ing":["豆角","土豆","西红柿","螺丝椒","盐","生抽","五香粉","蚝油","葱","姜"],"tp":"","d":2,"k":191,"i":"这是一道西北农家风味的炖菜，豆角绵软、土豆沙糯、番茄汤汁浓郁，酸香开胃。富含膳食纤维、维生素和碳水化合物，营养均衡。做法极其简单，食材用量可随喜好调整，几乎没有失败的可能，对新手特别友好。从备料到出锅，大约只需 30 分钟。","q":["注意，受食材个体影响，本菜谱为 2 人份菜谱","豆角 300g/人","土豆 1 个/人","西红柿 1 个/人","螺丝椒（可选）2 个/人","盐 6g/人","生抽 6ml/人","五香粉 3g/人","蚝油 6ml/人","葱 3 圈","姜 2g","蒜 2 颗","香菜碎（可选）根据口味加"],"s":["葱切花，蒜切沫，姜切丝，备用。","豆角去筋，切2-10cm小段，备用。","土豆去皮，切1cm³小块，备用。","西红柿去皮，切1cm³小块，备用。","辣椒去仔，切0.15cm 宽条，备用。","起锅烧油(10ml - 15ml)，冒烟后放入葱姜蒜，翻炒至闻到葱姜蒜香味。","加入豆角，翻炒至变色（青绿色变为翠绿色）","加入土豆块，翻炒 30s。","加入热水（水面刚刚漫过菜），盖上锅盖熬至土豆变软（可以用筷子确认）","加入西红柿块，加入盐，生抽，蚝油，五香粉，辣椒，熬至西红柿成汁（注意搅拌，防止糊锅）","加入香菜碎，出锅。"],"x":["加入西红柿后开始继续熬制后，需要偶尔翻搅防止糊底。"]},{"t":"雷椒皮蛋","c":"veg","cu":"Chinese","m":15,"p":"egg","ing":["皮蛋","长条青椒","葱","蒜","小米辣","食用油","生抽","陈醋","白糖","香油"],"tp":"","d":2,"k":448,"i":"雷椒皮蛋是一道卖相朴实但风味十足的家常凉菜，青椒的焦香与皮蛋的醇滑交融，酸辣开胃，尤其适合夏日佐餐。皮蛋富含蛋白质和矿物质，青椒提供丰富的维生素 C，大蒜则有助增进食欲。整道菜操作简单，新手也能轻松驾驭，从备料到完成大约只需 15 分钟。","q":["皮蛋 2 个","青椒 4 根 （长 10-15cm，宽 2-4cm）","葱 （大约 10cm 即可，葱绿最佳）","蒜 3-4 瓣","食用油 10-20ml","生抽 15-20ml","陈醋 15-20ml","白糖 6-10g","香油 5-7ml","小米辣 3-4 颗"],"s":["青椒清洗，去除根部，侧面切开，去除内部的子后在案板压平，备用（一定要去除青椒子，否则会在锅里炸开）","葱切成半厘米小段，备用。","蒜去皮，切成碎末，备用。","皮蛋去皮，备用。","小米辣，切成 5-10mm 的小段，备用。","热锅，锅内放入 10ml - 20ml 食用油。","放入全部青椒，改小火保持锅子温度，煎至青椒变软（可以用筷子试一下，插入即透即可）","关火，将皮蛋和青椒放入小铁盆中。","方法 1： 有擀面杖且砸东西不会吵到邻居：用擀面杖的一头在小盆中砸击皮蛋和青椒，至皮蛋与青椒混合（选项）","方法 2：将青椒用手撕开，撕成大约半厘米的条状，用叉子将皮蛋压碎（选项）","小米辣。","倒入生抽，陈醋，白糖，香油，以及其他未使用的备用食材。","均匀搅拌。"],"x":[]},{"t":"韭菜炒蛋","c":"veg","cu":"Chinese","m":10,"p":"egg","ing":["韭菜","鸡蛋","食用油","盐"],"tp":"","d":2,"k":180,"i":"韭菜炒蛋是一道经典的家常菜，韭菜香气浓郁，鸡蛋嫩滑鲜美，简单易做，营养丰富。韭菜含有丰富的维生素和纤维素，鸡蛋提供优质蛋白质。这道菜制作简单，原材料易得，特别适合厨房新手入门，从头备菜到盛盘出锅大约只需 10 分钟。","q":["韭菜 100g","鸡蛋 2 个","食用油 10ml","盐 2g"],"s":["韭菜洗净，沥干水分。","韭菜切成约 3cm 长的小段，即为 韭菜段。","将鸡蛋打入碗中，搅匀，即为 鸡蛋液。","热锅，加入食用油。","油热后，倒入 鸡蛋液，快速翻炒至鸡蛋凝固成块，盛出备用，即为 炒好的鸡蛋。","锅中再加 5ml 食用油，放入 韭菜段，大火快速翻炒 30 秒。","向锅中加入 炒好的鸡蛋，翻炒均匀。","加入盐，翻炒均匀。","关火，盛盘。"],"x":["韭菜炒蛋讲究大火快炒，韭菜炒久了容易失去香气和脆嫩口感。","如果喜欢韭菜更软烂，可以适当延长翻炒时间。"]},{"t":"鸡蛋火腿炒黄瓜","c":"veg","cu":"Chinese","m":10,"p":"pork","ing":["黄瓜","鸡蛋","火腿肠","盐","生抽","红尖椒"],"tp":"","d":2,"k":337,"i":"这是一道清爽快手的家常小炒，咸鲜适口，黄瓜脆嫩、鸡蛋软滑、火腿增香，属于大众化的中式家常菜。鸡蛋提供优质蛋白，黄瓜富含维生素和水分，火腿补充风味，整体营养均衡。烹饪步骤简单明了，难度很低，对厨房新手非常友好。从备菜到出锅，全程只需约 10 分钟。","q":["黄瓜 1 根（约 200g）","鸡蛋 2 个","火腿肠 1 根（约 40g）","红尖椒 1 个（可选）","食用油 10ml","生抽 3ml","盐 2g"],"s":["黄瓜洗净，切半圆形片，备用。","火腿切半圆形片，备用。","红尖椒（可选）切碎，备用。","将鸡蛋打入碗中，搅匀，即为 鸡蛋液。","热锅里倒 5ml 食用油。","油热后转小火，倒入打散的鸡蛋液，用筷子划散，翻炒至鸡蛋结为固体且颜色微微发黄，即为 半熟鸡蛋，盛出备用。","不用洗锅，往锅内倒入 5ml 食用油，倒入黄瓜片大火翻炒 1 分钟。","把 半熟鸡蛋 倒入锅中，调入 2g 盐、3ml 生抽，立刻倒入火腿片和辣椒碎（可选）翻炒均匀。","关火，盛盘。"],"x":["火腿是咸的，要在调味后才加入，这样不会让火腿也沾上盐。"]},{"t":"微波炉鸡蛋羹","c":"veg","cu":"Chinese","m":10,"p":"egg","ing":["鸡蛋","水"],"tp":"","d":2,"k":160,"i":"微波炉鸡蛋羹是一道简单快手的家常蒸蛋，口感嫩滑细腻，尤其适合作为夜宵或快速加餐。鸡蛋富含优质蛋白质和多种维生素，能为身体提供必要营养，虾皮还补充了钙质。这道菜对新手非常友好，无需掌握火候技巧，从打蛋调味到出炉，全程仅需约 10 分钟即可完成。","q":["鸡蛋 2 个","水 200ml","虾皮 10 个（可选）","葱 5g（可选）","盐 3g","芝麻油（香油） 1ml（可选）"],"s":["将鸡蛋打入可使用微波炉加热的陶瓷碗中，使用筷子将其打散。","加入水和盐，搅拌均匀。","将虾皮放入碗中，搅拌均匀，保证所有虾皮不会堆积在一起。","葱切碎至边长 0.6±3mm 状，放入碗中搅拌均匀。","将此碗及内容物放入微波炉中，容器表面覆盖保鲜膜或以可微波瓷盘加盖（注意：不得密封，必须留有涨缩量）加热 2 分钟(500W)。","小心地取下保鲜膜或其他覆盖物，然后继续加热 2 分钟。","若微波炉不带旋转式加热盘，将碗缓慢的水平旋转 180 度，以确保内容物加热均匀。","放入芝麻油。","小心地从微波炉中拿出碗（真的很烫）。","如果选择放入酱油，则确保酱油在鸡蛋羹表面流动后能以最薄的形式沾满鸡蛋羹表面即可。","开心的享受鸡蛋羹。"],"x":["鸡蛋 1 个约为 50±5g。若使用其他品种蛋品可按比例增减水量。","一定要确保将鸡蛋打散，否则可能会发生轻度鸡蛋爆炸。","鸡蛋和水不能超过碗容量的 2/3，否则可能发生溢出。"]},{"t":"蒸箱鸡蛋羹","c":"veg","cu":"Chinese","m":15,"p":"egg","ing":["鸡蛋","食用盐","食用油","生抽","蒸箱"],"tp":"","d":3,"k":118,"i":"这是一道利用蒸箱快速制作的嫩滑家常蛋羹，口感可调，水少则弹、水多则嫩。富含优质蛋白质和多种营养素，易于消化吸收。难度适中，新手稍加注意即可掌握，从准备到出锅大约只需 15 分钟。","q":["鸡蛋 1 个","食用盐 1g","食用油 5ml","生抽 / 味极鲜 6ml（可选调味）"],"s":["一个鸡蛋放入碗中打散。","向碗中加入鸡蛋体积 1.0-1.5 倍 60 度纯净水，并且搅拌均匀。","正确范围内水越少弹，水越多越嫩。","注意：超出范围后，水越少会口感变得太弹，水越多会变得太稀。","加入食用盐 1g。","盐起到了重要的增加底味和凝固作用。","加入食用油 5ml。","过滤蛋液，去掉蛋液中的浮沫（可选，不过滤蒸出来的蛋会有气泡导致不好看）","确认蒸箱的水源已经补充至足够（若不确定，可把水槽补满）","将已经完全搅拌均匀的鸡蛋液碗放入蒸箱。","调节至100摄氏度蒸 10 分钟。","打开蒸箱 （注意：蒸箱在开启时会有蒸气瞬间喷出，注意缓慢开启）","出锅（可加入生抽调味）","享用。"],"x":[]},{"t":"鸡蛋羹","c":"veg","cu":"Chinese","m":15,"p":"egg","ing":["鸡蛋","食用盐","香油","生抽 / 味极鲜","白醋","藤椒油"],"tp":"","d":2,"k":168,"i":"这道菜是一道简单快手的家常蒸菜，口感嫩滑如果冻，咸鲜适口，常作为早餐或配餐出现在各地餐桌。鸡蛋提供优质蛋白质和卵磷脂，易于消化吸收。对新手十分友好，只需简单几步就能蒸出平整细腻的蛋羹，全程大约需要 15 分钟。","q":["鸡蛋 2 个","食用盐 3g","香油（或芝麻油） 2-4ml","生抽 / 味极鲜 8ml","白醋（或料酒） 2ml（可选）"],"s":["两个鸡蛋放入碗中打散。","加入食用盐 3g。","盐起到了重要的增加底味和凝固作用。","加入 2ml 白醋，去除鸡蛋的腥味（可选）","加入米醋也行，但米醋的颜色会使鸡蛋微微发黑。","还可以加入料酒，同样具有去腥的作用，且没有醋的酸味。","向碗中加入鸡蛋体积 1-1.5 倍的 70 度纯净水，并且搅拌均匀。","1 倍的水鸡蛋更弹，1.5 倍的水鸡蛋更嫩。","过滤蛋液，去掉蛋液中的浮沫（可选，不过滤蒸出来的蛋会有气泡导致不好看）","向任意一口锅中加入 300-500ml 清水，水烧开后，放入盛有鸡蛋液的碗。","蒸碗要盖上一个盖子，倒扣一个有凹槽的铁碟子，或者使用保鲜膜来减少水汽进入，这是为了避免其变成蜂窝状。","蒸煮步骤（二选一）","开中火蒸10 分钟, 10 分钟之后关火再闷上5 分钟。","开大火蒸5 分钟，要保持锅中水一直处于沸腾状态，否则要延长时间。每隔2 分钟开盖一次释放水蒸气，开盖过晚蛋羹容易变成蜂窝状；开盖太早/频繁蒸的时间需要久一些。","如何判断已经熟了？","晃动碗，蛋羹不再处于液体状态，拥有类似果冻的 Q 弹状态即可出锅。","出锅。","加入香油和生抽即可享用。","也可用藤椒油代替香油，增加麻爽口感。"],"x":["上面介绍的是基础水蒸蛋做法，可以在此基础上派生，添加诸如火腿肠、肉馅、虾皮等材料，丰富鸡蛋羹的口感。"]},{"t":"鸡蛋花","c":"veg","cu":"Chinese","m":5,"p":"egg","ing":["鸡蛋","白糖","食盐","搅拌器"],"tp":"","d":1,"k":107,"i":"一道简单易做的家常食疗汤饮，有甜咸两种风味，口感柔滑嫩爽，属于民间润喉小方。富含优质蛋白质和卵磷脂，易于消化吸收，可缓解喉咙干痒不适。制作极简单，初学者看一遍就能上手，从烧水到完成大约只需 5 分钟。","q":["鸡蛋 1 个 （去壳后约 50 g）","沸水 100 - 150 ml","白糖 5 - 10 g （如制作甜口）","食盐 1 - 2 g （如制作咸口）"],"s":["将鸡蛋打入碗中。","使用筷子或搅拌器，顺着一个方向搅打蛋液，直至蛋清与蛋黄完全混合均匀，颜色一致。（此过程约需 1 - 2 分钟）","将糖或盐等调味料加入蛋液中，略微搅匀。","准备刚烧开的、100 ℃ 的沸水。","一边用筷子快速搅拌碗中的蛋液，一边将沸水以细流状冲入蛋液中。确保沸水与蛋液充分混合。","持续搅拌片刻，直至蛋液被完全烫熟，形成均匀的淡黄色蛋花。"],"x":["为了防止生鸡蛋中可能含有的沙门氏菌，建议使用刚烧开的、100 ℃ 的滚水，瞬间将鸡蛋液完全烫熟。"]},{"t":"勾芡香菇汤","c":"soup","cu":"Chinese","m":25,"p":"none","ing":["香菇","香葱","食用油","食用盐","鸡精","生粉"],"tp":"","d":3,"k":146,"i":"香菇勾芡汤汤浓味鲜，滑润适口，是一道快手的家常汤品。香菇含有丰富的氨基酸和多糖，有助于增强免疫力。制作过程需要一些基本的控火和勾芡技巧，但对新手依然友好。从备料到出锅，大约只需 25 分钟。","q":["鲜香菇 2 朵","香葱 0.5 根","鸡精 3 g","食用油 10 ml","食用盐 3 g","开水 350 ml","生粉 10 g"],"s":["香菇切片（每片厚度 0.5-1 cm,厚点相对薄点更有嚼劲），放入大碗中，倒入 2g 食用盐 浸泡 15 分钟。","生粉倒入小碗中，加入 50ml 水，搅拌生粉直至融化没有颗粒（即水淀粉）","倒掉碗中的盐水，适当去掉香菇本身的水分（方便下一步煎炸）【可选】。","小火，倒入油，待油开始冒小泡（小火 30s ，看每个锅的功率），倒入香菇，每面煎 10s 【可选】。","倒入开水 300ml ，调中火再煮 3-5 分钟。","倒入水淀粉，适当搅拌锅中汤汁后，加入 3g 盐、3 g ，最后撒上葱花出锅。"],"x":[]},{"t":"奶油蘑菇汤","c":"soup","cu":"Chinese","m":30,"p":"none","ing":["白蘑菇","洋葱","黄油","面粉","牛奶","淡奶油","黑胡椒碎","盐","清水","---"],"tp":"","d":1,"k":426,"i":"这是一道经典法式浓汤，口感丝滑绵密，菌香与奶香交融。蘑菇富含膳食纤维和微量元素，牛奶则提供优质蛋白与钙质。做法非常简单，新手也能轻松驾驭，从备料到完成大约需要 30 分钟。","q":["白蘑菇 200 克","洋葱 50 克","黄油 15 克","面粉 10 克","牛奶 200 毫升","淡奶油 30 毫升","清水 100 毫升","盐 2 克","黑胡椒碎 1 克"],"s":["白蘑菇切片备用，洋葱切末备用。","平底锅中放入黄油，小火融化后加入洋葱炒至透明。","加入白蘑菇翻炒至出水变软，撒入面粉搅拌均匀。","加入牛奶和清水，搅拌均匀后小火煮沸，保持搅拌防止糊底。","转小火煮约 10 分钟，汤汁浓稠。","倒入淡奶油继续加热 1 分钟，加入盐和黑胡椒调味。","熄火后可用料理机打成细腻浓汤（可选）。","--。"],"x":["可将部分蘑菇预留作为装饰，提前煎香再添加。","使用鸡高汤代替清水风味更佳，建议控制总液体不超过 300 毫升/份。","喜欢浓汤口感可适当增加面粉和淡奶油用量。"]},{"t":"小米粥","c":"soup","cu":"Chinese","m":30,"p":"none","ing":["小米","水"],"tp":"","d":2,"k":362,"i":"小米粥是一道北方常见的家常粥品，口感绵滑，米香浓郁，熬出的米油尤其养胃。它富含蛋白质、脂肪、碳水化合物和胡萝卜素，维生素 B1 含量在粮食中名列前茅，容易消化吸收。做法非常简单，新手也能轻松掌握，从烧水到出锅大约需要 30-35 分钟。","q":["小米 100 克","水（山泉水最佳） 2000 克"],"s":["小米 100 克，放入碗中，用水轻淘一遍（用手搅拌一下，将水倒掉，只是去掉外面的浮灰，不可搓洗！！！）","水烧开，务必烧开！！！","水烧开沸腾时，将小米倒入锅内。（很容易被忽视的一个很重要的环节）","搅拌使得小米不会粘连锅底，继续用大火熬 6-10 分钟，注意用中间穿插搅拌几次。","改中火、文火熬 15-20 分钟，锅盖要错开一条缝，千万不能让小米油溜掉哟，中间继续搅拌几次，不要糊锅底。"],"x":["这是普通锅熬制（只需 30-35 分钟即可出锅）,味道最佳。高压锅和电饭锅省事，不过效果下降，水量要适当减少，一般 100 克小米+1800 克水。","小米只需用水去除浮灰，千万不可过分淘，会损失掉小米油的。","千万记住小米需要在水开的时候下锅。","不喜欢放碱，更喜欢原汁原味的小米香。"]},{"t":"山药南瓜炖鸡汤","c":"soup","cu":"Chinese","m":50,"p":"chicken","ing":["鸡肉","姜","料酒","板栗","山药","小南瓜","红枣","盐"],"tp":"","d":2,"k":620,"i":"山药南瓜炖鸡汤是一道秋冬暖身汤品，山药健脾、南瓜香甜、板栗粉糯，一锅炖出鲜甜。富含蛋白质、膳食纤维与多种维生素，营养均衡。做法简单，从备料到出锅大约需要 50 分钟，新手也能轻松完成。","q":["鸡肉 500 g","板栗 150 g","山药 200 g","小南瓜 1 个（约 300 g，蒸熟后挖果肉做泥）","红枣 8 颗","姜 5 片","料酒 10 ml","盐 5 g"],"s":["鸡肉切块，加姜、料酒，冷水下锅焯水，水开后煮 3 分钟捞出备用。","山药去皮切滚刀块，板栗去壳备用。","小南瓜洗净，上锅蒸熟后挖出果肉，压成南瓜泥备用。","将焯好的鸡肉、山药、板栗、姜片放入锅中，加水没过食材，大火烧开后转小火炖 30 分钟。","加入南瓜泥搅开，放入红枣，再煮 10 分钟。","加盐调味，盛出即可。"],"x":["南瓜泥最后放，汤色金黄不浑浊。","山药去皮时建议戴手套，可避免手部发痒。"]},{"t":"排骨山药玉米汤","c":"soup","cu":"Chinese","m":60,"p":"pork","ing":["排骨","山药","胡萝卜","玉米","生姜","小葱","料酒","食盐","砂锅或深汤锅"],"tp":"","d":2,"k":1054,"i":"排骨山药玉米汤清甜醇厚，山药软糯、玉米回甘，融合了排骨的鲜香，属于老少皆宜的家常汤品。它富含蛋白质、膳食纤维和多种维生素，有健脾益胃、增强抵抗力的作用。做法简单，预处理和炖煮步骤清晰，新手也能轻松上手，全程大约需要 1 小时即可完成。","q":["排骨 500g","山药 1 根（大约 300g）","胡萝卜 1 根（大约 150g）","玉米 1 根（大约 250g）","生姜（大约 20g，切片备用）","小葱（大约 15g，打结或切末备用）","料酒 15ml","食用油 10ml","饮用水 1500ml - 2000ml","食盐 6g - 8g"],"s":["将胡萝卜洗净去皮，切成大约 3cm 的滚刀块。","玉米洗净，剁成大约 4cm 的圆柱状小块。","山药去皮（建议佩戴手套，防止粘液导致皮肤过敏），切成大约 4cm 的长段，备用。","锅中加入足量冷水，放入洗净的排骨。","加入大约 10g 姜片、葱结和 15ml 料酒。","大火煮沸，沸腾后等待 3 分钟，期间用勺子撇去表面浮沫。","捞出排骨，用大约 40℃ 的温水洗净杂质，沥干备用。","热锅，倒入 10ml 食用油，等待 10 秒让油温升高。","放入剩余大约 10g 姜片爆香。","放入全部准备好的排骨，保持中火翻炒大约 1 分钟，至排骨表面微焦。","在锅中一次性加入 1500ml - 2000ml 饮用水。","放入全部准备好的胡萝卜、玉米和山药。","大火烧开后转小火，盖上锅盖，慢炖 40 分钟。","加入 6g - 8g 食盐，用勺子搅拌均匀。","保持小火继续炖煮 2 分钟使盐分入味。","关火，根据个人喜好撒入小葱末，盛盘。"],"x":["防氧化技巧：山药去皮后若不立即下锅，应浸泡在清水中，防止接触空气氧化变黑。","口感控制：若喜欢山药极度软糯，可与排骨同时下锅；若喜欢山药成块不散，可在排骨炖煮 20 分钟后再放入山药。","补水须知：炖煮过程中如发现水位低于食材，务必添加热水，避免加入冷水导致肉质纤维瞬间收缩变柴。"]},{"t":"排骨苦瓜汤","c":"soup","cu":"Chinese","m":60,"p":"pork","ing":["可选工具","电压力锅","砂锅","必须材料","排骨","苦瓜","虾皮"],"tp":"","d":4,"k":905,"i":"排骨苦瓜汤是一道汤色清亮、鲜美回甘的粤式家常汤品，排骨软烂、苦瓜清热解腻。富含蛋白质与维生素，虾皮还能补充钙质。处理过程需要焯水去腥、仔细去除苦瓜瓤，对新手有一定挑战，但借助电压力锅可大幅简化；传统慢炖需 2 至 4 小时，建议提前 4 小时准备，压力锅则只需约 1 小时。","q":["排骨 250g 到 500g","苦瓜 100g 到 200g","虾皮 5g 到 15g","生姜 5~10g（可选，用于焯水时去腥）"],"s":["排骨洗净，切到约 4cm ±2cm×3 ± 2cm 的小块（如没有剁排骨的工具，可以求助摊主）","炒锅倒入冷水 700ml 和排骨一起加热至煮沸，关火捞出排骨。","苦瓜中间切为两半，清除干净内部的种子和苦瓜瓤，切为 0.5 ± 0.3 cm 的苦瓜条，洗净。","使用汤锅进行烹饪。","汤锅倒入水 1100ml 和排骨，大火。","等待水沸腾后将苦瓜和虾皮下锅转小火，放等待 120~240 分钟（在 120 分钟之后可以捞出一块肉进行品尝，若肉可以较为轻松的从骨头上分离即可关火）","出锅时加盐和白胡椒，推荐量为每 250ml 0.3 到 0.6g 盐，0.1 到 0.5g 白胡椒。","使用电压力锅进行烹饪。","倒入 1000ml 水和排骨，虾皮和苦瓜。","选择炖汤功能，进行烹饪（一般为加压烹饪 45 分钟）","出锅，和汤锅一样进行加盐和胡椒。"],"x":["可以使用其他带有鲜味的食材代替虾皮，如瑶柱。"]},{"t":"昂刺鱼豆腐汤","c":"soup","cu":"Chinese","m":40,"p":"fish","ing":["昂刺鱼或者沙光鱼","豆腐","香葱","姜","食用油","料酒","食用盐","胡椒粉"],"tp":"","d":3,"k":321,"i":"昂刺鱼豆腐汤是一道口感鲜嫩、汤白味浓的家常汤品，鱼肉刺少肉嫩，豆腐滑润，带有胡椒的微辛暖意，适合各个年龄层。鱼富含优质蛋白质，搭配豆腐能补充钙质，营养均衡好吸收。制作过程不算复杂，只要注意去腥和煎鱼防粘，一般初学者也可以上手，预计制作时长约 40 分钟。","q":["昂刺鱼或者沙光鱼 一条","豆腐 100 g","胡椒粉 3-5 g","食用油 15 ml","食用盐 10-15 g","开水 1L"],"s":["鱼处理好后洗净，（特别注意肚内的血丝、不洗干净会有腥味），放入大碗中，倒入料酒、10g 姜片、5g 盐，腌制 15 分钟。","豆腐切块，放入凉水浸泡 5 分钟，捞出备用。","煎鱼前，先用生姜片擦一下锅防止粘锅，倒入油（油量为 15ml × 鱼的条数 ），烧热后放入鱼煎 2~3 分钟，期间需要晃动一下鱼，防止粘底，且需要翻一次身。","待鱼全部煎好之后，倒入开水、5ml 料酒、姜片，小火转至大火，盖上锅盖、大火煮 10 分钟（水要稍微多一些，后面会蒸发掉一些）","见汤变白后倒入准备好的豆腐，调中火再煮 5 分钟，加入 10g 盐、3g 胡椒粉调味，最后撒上葱花出锅。"],"x":[]},{"t":"朱雀汤","c":"soup","cu":"Chinese","m":20,"p":"egg","ing":["鸡蛋","香油","白糖","水"],"tp":"","d":1,"k":168,"i":"朱雀汤是一道豫东地区的家常快手汤品，口感顺滑香甜，带着芝麻油的醇香。鸡蛋提供优质蛋白质，制作非常简单，只需烧水冲蛋几步就能完成，前后不到十分钟即可上桌，还有清热去火的效果。","q":["500ml 水","20 克白糖（根据个人口味调整）","2ml 香油"],"s":["鸡蛋在碗中打散，再倒入香油。","水烧开后，在沸腾状态下快速倒入盛有鸡蛋的碗中。","放入白糖。"],"x":["鸡蛋一定要打散，水一定要在沸腾冒泡状态倒入鸡蛋液中，否则汤可能会浑浊影响口感。","此为豫东地区做法，其他地区有不放白糖放盐的，口味不同，根据个人口味调整。","此汤乃去火神器！"]},{"t":"玉米排骨汤","c":"soup","cu":"Chinese","m":44,"p":"pork","ing":["排骨","玉米","胡箩卜","生姜","大葱","食用油","醋","料酒","黑胡椒粉","食用盐"],"tp":"","d":3,"k":1724,"i":"玉米排骨汤是一道鲜美清甜的家常汤品，排骨软烂，玉米和胡萝卜带来自然甜味。富含蛋白质、维生素和膳食纤维，营养均衡。做法简单，对新手友好，只需将排骨焯水煸香后慢炖约一小时即可完成。从备菜到出锅大约需要一个半小时。","q":["排骨 500-800g","玉米一根（喜欢吃玉米的可以多一根）","胡萝卜一根（喜欢吃胡箩卜的可以多一根）","食用油 10 ml","黑胡椒粉 4g","料酒 10ml","醋 10ml","食用盐 10-15g（根据最后汤剩余的量而定）","开水 1000 ml"],"s":["大葱切成 3-4cm 的大段，用刀背拍一下。","玉米剁成小块。","胡箩卜切成滚刀块。","生姜去皮切大片。","新鲜的排骨砍成小块。"],"x":["这道菜制作起来并不难，而且食材简单，对新手友好，适合降温的时候来上一大碗。"]},{"t":"生汆丸子汤","c":"soup","cu":"Chinese","m":60,"p":"egg","ing":["前腿肉","盐","胡椒粉","葱姜花椒水","一个鸡蛋的鸡蛋清","土豆淀粉","熟豆油"],"tp":"","d":4,"k":857,"i":"生汆丸子汤口感鲜嫩弹滑，是一道原汁原味的家常汤品。猪肉提供优质蛋白质，搭配木耳、黄花等食材，营养较为均衡。制作中需要自己剁肉并掌握挤丸子的火候，稍有些门槛，更适合有一定基础的厨艺爱好者。从备料到上桌大约需要 1 小时。","q":["盐量 每斤猪肉 6 克","胡椒粉量 每斤猪肉 2 克","土豆淀粉 多少人的用量 × 40 克，本教程以一人用量算"],"s":["肉改刀切开，肥瘦三七分。","上刀剁一剁，用刀背砸一砸，把肉筋打开打松疏。","剁一剁，砸一砸，剁成肉末，要想好吃得自己剁，机器打的太黏糊了。"],"x":["参考来自：生汆丸子汤，吃的就是一个鲜、嫩、弹，学会打丸子的这些技巧，这碗汤才地道。","辣椒油可以根据口味放。"]},{"t":"番茄牛肉蛋花汤","c":"soup","cu":"Chinese","m":44,"p":"beef","ing":["牛肉","番茄","鸡蛋","葱、姜、蒜","盐","胡椒粉"],"tp":"","d":3,"k":262,"i":"番茄牛肉蛋花汤是一道酸甜开胃的家常汤品，口感鲜嫩顺滑。牛肉富含优质蛋白和铁，番茄提供番茄红素和维生素 C，鸡蛋则补充卵磷脂。做法简单，新手也能轻松掌握，通常大约半 小时就能端上餐桌。","q":["牛肉用量为 150 g/人","番茄用量为 1 个/人","鸡蛋用量为 1 个/人","盐用量为 2 g/人","胡椒粉用量为 0.5 g/人"],"s":["牛肉切成薄片。","番茄切成小块。","葱切成葱花。","姜切成姜片。","蒜剁成蒜泥。"],"x":["可以根据口味加入一定的醋或糖来调整口感。","如果喜欢辣味，可以加入一定的辣椒或辣椒酱来调味。"]},{"t":"白萝卜丝清汤","c":"soup","cu":"Chinese","m":10,"p":"pork","ing":["白萝卜","食盐","白胡椒粉","味精","猪油","擦丝器"],"tp":"","d":1,"k":65,"i":"白萝卜丝清汤是一道清爽解腻、简单快手的家常素汤。白萝卜富含水分和维生素 C，煮熟后软嫩清甜，热量极低。制作难度极低，烹饪大约 10 分钟即可完成。","q":["白萝卜 200g","饮用水 800ml","食盐 3g","白胡椒粉 2g","味精 3g","猪油 3g（或芝麻香油 3g）"],"s":["白萝卜去皮，用擦丝器擦成细丝，备用。","锅内加入 800ml 饮用水，同时放入白萝卜丝。","加入食盐 3g、白胡椒粉 2g、味精 3g，用勺子搅拌均匀。","开大火将水烧至沸腾。","沸腾后将火调至中小火，继续煮 5 分钟至白萝卜丝变软呈半透明状。","关火前加入猪油 3g（或芝麻香油 3g），搅拌均匀后关火出锅。"],"x":["白萝卜冷水下锅能够更好地煮出萝卜自带的甘甜味，同时挥发掉生萝卜的辛辣气味。","如果喜欢更软烂的口感，可以在第 5 步延长烹煮时间至 8 分钟。","如果喜欢葱香，出锅后可撒入小葱碎 5g。"]},{"t":"皮蛋瘦肉粥","c":"soup","cu":"Chinese","m":44,"p":"fish","ing":["饮用水","皮蛋","瘦肉","大米","小葱","香菜","生菜","生姜","酱油","蚝油"],"tp":"","d":3,"k":776,"i":"皮蛋瘦肉粥是广东经典的家常粥品，粥底绵密顺滑，皮蛋的醇香与瘦肉的鲜嫩融合，口感温润鲜美。它富含碳水化合物和优质蛋白质，搭配蔬菜，营养较为均衡，易于消化吸收。这道粥步骤虽多，但操作直观，新手跟着流程也能顺利完成，预计制作时长约 1.5 小时，借助电饭锅的预约或保温功能，作为早餐尤为","q":["饮用水 1 升","皮蛋 2 颗","瘦肉 100g","大米 150ml","小葱 1 棵","香菜 1 棵","生菜 4 叶","生姜 1 拇指块","酱油 5 ml","蚝油 5 ml","盐 2g","胡椒粉 1g","食用油 10ml"],"s":["大米 - 洗净 - 放入电饭锅内胆 - 加入 1 升 饮用水。","瘦肉 - 洗净 - 简易晾去水分 - 加入 10ml 食用油 - 揉搓均匀 - 放入电饭锅内胆。","皮蛋 - 去壳 - 洗净 - 对半切开 - 分离蛋白蛋黄 - 蛋白简单切碎块 - 蛋黄揉碎 - 放入电饭锅内胆。","生姜 - 洗净 - 削皮 - 去除枯黄枯黑无法食用部分 - 切丝 - 放入电饭锅内胆。"],"x":["计量和处理食材时有条件带上一次性手套，生蔬食材建议提前洗净放置一旁。","作为早餐时可提前一夜准备好主料，保温模式到第二天早餐，再添加配料和酱料。"]},{"t":"米粥","c":"soup","cu":"Chinese","m":32,"p":"none","ing":["米","水","植物油"],"tp":"","d":2,"k":308,"i":"白粥清淡绵软，是家常必备的暖胃主食，米香纯粹，老少皆宜。富含碳水化合物和少量蛋白质，易于消化吸收，有补脾、和胃、清肺的食养之效。操作简单，只需掌握好火候和水量，初学者也能轻松完成，全程约需 25 分钟。","q":["一般一个人可以食用 60ml-110ml 的米。","水的体积是米饭的体积的 9-12 倍。","一碗容量是 500ml。","中断大火加热的最晚时间 T1：1.5 分钟/500ml × 水体积","米粥能够食用的最早时间 Tr：10 分钟/500ml × 水体积","油的质量 Mo：生米体积 / 10","冷藏时间 Tc 生米体积 /10 ml/分钟。"],"s":["（可选）将 Mo ml 的油与洗净的米混合， × 尽量确保完全混合，即每粒米上至少都沾上少量油。","（可选）将 米-油混合物品冷藏保存，冷藏时间 Tc。","将米和水加入锅中。","开大火，加热到 T1。","在 T1 之前将火关小。如果忘记此步骤，水可能会漫出而熄灭火焰。非常危险！","加热到 Tr。在 Tr 时关闭火源。"],"x":[]},{"t":"紫菜蛋花汤","c":"soup","cu":"Chinese","m":20,"p":"shrimp","ing":["鸡蛋","紫菜","葱花","水","盐","油","虾仁"],"tp":"","d":2,"k":217,"i":"紫菜蛋花汤是一道清淡鲜美的家常汤品，属于中式简易汤菜。紫菜富含碘、钙和膳食纤维，鸡蛋提供优质蛋白质，二者搭配营养均衡。做法非常简单，对新手友好，从准备到出锅仅需约 20 分钟。","q":["10g 的干紫菜（喜欢紫菜的可以多放些）","盐 2 克"],"s":["干紫菜用清水泡 15 分钟，捞起沥干水份备用。","热锅，倒入 1.5 升清水、5ml 油、2g 盐。待水开后放入紫菜。","紫菜烧开后 3 分钟，将打好的蛋液徐徐倒入锅内，30 秒既可起锅。","撒上葱花，转小火 20 秒。","关火，出锅前放入几滴香油，也有的会放入一点虾皮，味道也不错。"],"x":["水开后，将火关小，将打好的蛋液围绕中间沸腾的水倒入。为了使蛋花比较嫩，锅盖盖上熄灭火等半分钟后再打开.。","如果喜欢浓稠口感，可加入 2g 淀粉.。"]},{"t":"罗宋汤","c":"soup","cu":"Chinese","m":56,"p":"beef","ing":["蔬菜高汤","牛肉高汤","牛肉","番茄"],"tp":"","d":4,"k":2006,"i":"一道源自俄罗斯甜菜汤、在上海改良的海派家常汤品，以番茄和牛肉为主调，口感酸甜浓郁、醇厚鲜美。富含优质蛋白、番茄红素及多种维生素，营养均衡。制作简单，对初学者友好，全程预计 2–3 小时即可完成。","q":["牛肉高汤 500 mL","牛肉 250 g （可选用牛腩肉或牛尾肉）","番茄罐头 2 罐 （可用番茄替代、但风味欠佳）","番茄膏 5 g （增加番茄风味）","马铃薯 400 g","洋葱 100 g","胡萝卜 100 g","欧芹 100 g","包菜 200 g","红肠 100 - 200 g","盐 18 g","黑胡椒 3 g"],"s":["洋葱、胡萝卜、欧芹切 1cm 见方小丁。","红肠、马铃薯切 2cm 块。","包菜去梗后，手撕至 2cm 片。","牛肉撒盐 3 g 、黑胡椒 3 g 腌制 5 分钟。"],"x":["橄榄油 5 mL （橄榄油用于蔬菜的烹制，可以用植物油代替）","植物油 5 mL （植物油用于牛肉的烹制，不能用橄榄油代替）","番茄尽量不用新鲜番茄代替，番茄罐头+番茄膏的组合风味更足。","除了胡萝卜、洋葱、欧芹、牛肉是必备食材外，其余可自由搭配。"]},{"t":"羊肉汤","c":"soup","cu":"Chinese","m":30,"p":"lamb","ing":["羊肉或羊杂","食用油","料酒","大葱","白胡椒粉","食用盐","孜然粉","香菜"],"tp":"","d":3,"k":599,"i":"羊肉汤是一道家常暖身汤品，汤色乳白，肉质鲜嫩，带有大葱和白胡椒的清香与微辛。富含蛋白质、钙、铁等营养成分，有温补脾胃、抵御寒冷的功效。制作步骤简单，新手也能轻松掌握，整个烹饪过程大约需要 30 分钟。","q":["羊肉 300g","食用油 10ml","料酒 20ml","大葱 50g","开水 1000ml","白胡椒粉 1g","食用盐 5g","孜然粉 1g","香菜 20g"],"s":["羊肉切成长 5cm 宽 0.5cm 的块。","大葱切成小段。","羊肉放入锅中，加入 1000ml 常温水，加入料酒、大葱。","煮沸 2 分钟后，捞出羊肉，使用常温水洗净，沥干水分。","热锅加入食用油，加入羊肉，翻炒 2 分钟至羊肉表面微黄。","加入开水，开到大火档位。","5 分钟后，加入白胡椒粉、盐，继续煮沸 5 分钟。","出锅之后，加入香菜、孜然粉，搅拌均匀。"],"x":["加入开水时，注意要开大火，使油脂与汤汁更好的融合。"]},{"t":"腊八粥","c":"soup","cu":"Chinese","m":56,"p":"none","ing":["饮用水","大米","糯米","花生","红豆","红枣","粥锅","中号玻璃碗","小碗若干","薏米"],"tp":"","d":4,"k":2042,"i":"腊八粥是一道传统节令甜粥，粥体粘稠软糯，融合了多种谷物、豆类和干果的复合香气。富含碳水化合物、矿物质和多种维生素，莲子还有养心安神之效，适合工作压力大的人食用。虽然食材种类多，但操作简单，耐心慢熬即可，对新手友好。除去浸泡等准备时间，熬煮约需 3 小时。","q":["饮用水 1 L","大米 50 g","糯米 50 g","薏米 50 g","黑米 50 g","小米 50 g","莲子 25 g","绿豆 25 g","红豆 25 g","花生 25 g","黄豆 25 g","豌豆 25 g","红枣 25 g","桂圆 25 g","栗子 25 g","去壳核桃 25 g","葡萄干 25 g","红腰豆 25 g","冰糖 10~25 g","以上原料分量可以按照自己的口味偏好适当调整，对于米类，不建议超过 150 g ，对于其他豆类，不建议超过 50 g 。"],"s":["提前洗净好绿豆、红豆、花生、黄豆、豌豆、红腰豆，并用干净的玻璃碗盛放好，注入 3/4 玻璃碗大小的饮用水，浸泡一夜（或最少 8 小时）。","提前洗净好大米、糯米、薏米、黑米、小米、莲子，并用干净的玻璃碗盛放好，注入 3/4 玻璃碗大小的饮用水，浸泡 3 小时。","将步骤 1 中准备好的盛有绿豆、红豆、花生、黄豆、豌豆、红腰豆的玻璃碗中的水分分离倒出，其余原料倒入粥锅中，加入 1 升饮用水（或漫过食材 1 拇指块），大火煮沸，煮沸后合上锅盖，小火煮 30 分钟。","将步骤 2 中准备好的盛有大米、糯米、薏米、黑米、小米、莲子的玻璃碗中的水分分离倒出，其余原料继续倒入粥锅中，合上锅盖，小火煮 60 分钟。","洗净好红枣、桂圆、栗子、核桃、葡萄干（其中红枣切成小片）、冰糖，倒入锅中，合上锅盖，小火煮 60 分钟。","确认煮出的粥粘稠后即可关火、盛盘、食用。"],"x":["往粥锅加入食材时，应当进行搅拌，使食材原料均匀分布在各处，并注意观察水位线，如发现水位线低于米线及食材应立即补水。","注意控制火候，不要过大，定时搅拌。如果使用普通锅，建议烧开水后再下原料，搅拌到再次烧开改小火，避免锅底烧糊。如果有条件，建议改用高压锅或粥锅。","参考资料：全网最正宗腊八粥做法，香甜软糯一次成功！、_哔哩哔哩、_bilibili 、 腊八粥（在腊八节用多种食材熬制的粥）_百度百科。"]},{"t":"菌菇炖乳鸽","c":"soup","cu":"Chinese","m":56,"p":"none","ing":["乳鸽","菌菇","玉米","姜","料酒","食用盐","瓦罐或者高压锅"],"tp":"","d":4,"k":324,"i":"菌菇炖乳鸽汤色清亮、肉质细嫩，菌香与鸽鲜交融，属于家常粤式炖汤。乳鸽富含优质蛋白和多种氨基酸，菌菇提供多糖与膳食纤维，温和滋补。整道菜需先将乳鸽焯水去腥，再与玉米、菌菇同炖，对火候和时间的把控略有一些要求，新手稍加注意也能驾驭。从备料到出锅，使用高压锅约需 45 分钟，瓦罐慢炖则","q":["乳鸽 300 g","菌菇 100 g","玉米 200 g","姜 30 g","料酒 15 ml","食用盐 10 g"],"s":["冷水洗干净热心摊主处理好的乳鸽。","冷水锅中放入洗干净的乳鸽，加入 15ml 料酒与姜，水煮开即可捞出乳鸽，要不然会丢失营养。","把乳鸽放到高压缩或者瓦罐中、倒入的水要没过乳鸽，放入生姜 20 g，玉米 200 g、菌菇 100 g。","注意：高压锅 30 分钟，瓦罐需在水烧开后转小火慢炖 40-60 分钟。","时间到了，盛到碗中，加入 3~5g 盐 即可。"],"x":[]},{"t":"西红柿鸡蛋汤","c":"soup","cu":"Chinese","m":15,"p":"egg","ing":["西红柿","鸡蛋","香油","味素","盐","葱、姜、蒜"],"tp":"","d":2,"k":258,"i":"西红柿鸡蛋汤是一道酸甜开胃、口感滑嫩的家常汤品，做法极简，属于老少皆宜的大众菜肴。富含番茄红素、维生素 C 和优质蛋白质，营养均衡易吸收。对新手非常友好，快手省时，预计制作时长 大约 15 分钟。","q":["西红柿 1 个","鸡蛋 1-2 个（依照自己的口味而定，喜欢吃鸡蛋就放 2 个，一般就放 1 个）","香油 2 滴","味素 5 克（可选）","盐 15 克","葱、姜、蒜共 15 克"],"s":["将西红柿洗净，切块。","葱姜蒜切碎。","鸡蛋打到碗中，用筷子（或打蛋器）搅拌均匀。","热锅，并放入 15 毫升的油，待能从油中看到冒出一丝烟时，放入葱姜蒜翻炒 30 秒。","放入西红柿翻炒 1 分钟。","倒入水，水的高度大约为锅内菜品高度的 1.2 倍，并放入盐。","待开锅后，将鸡蛋液放入，并用筷子将鸡蛋打散，放入味素和香油。","等待 30 秒，关火出锅。"],"x":["味素可加可不加。"]},{"t":"金针菇汤","c":"soup","cu":"Chinese","m":10,"p":"egg","ing":["金针菇","鸡蛋"],"tp":"","d":2,"k":149,"i":"这是一道清淡爽口的家常汤品，口味鲜美，属简易快手菜。金针菇含有丰富的氨基酸和膳食纤维，加鸡蛋还能补充优质蛋白。制作门槛极低，新手也能轻松驾驭，从备菜到出锅大约只需 10 分钟。","q":["金针菇 400-500 克 （市场里面售卖的一袋即可）","食盐 15 克","味精 5 克"],"s":["金针菇徒手掰散，越散越好不然容易藏牙，洗净备用。","用菜刀或者水果刀将上述金针菇段段切，可依据个人喜好，但长度不宜超过 5 cm。","将金针菇放入锅中，加水没过约食材总高度 1.1 倍，沸腾后等待 3 分钟。","加入味精和食盐并搅拌。","继续加热约 30 秒，关火装盘。"],"x":["如果喜欢在汤里加入鸡蛋，可在步骤 3 中水沸腾之后将打散的鸡蛋液倒入锅中。","出锅后可加入 3-4 滴香油（或者麻油）增香。"]},{"t":"银耳莲子粥","c":"soup","cu":"Chinese","m":56,"p":"none","ing":["银耳","去心莲子","红枣","枸杞","冰糖"],"tp":"","d":4,"k":282,"i":"银耳莲子粥清甜润滑，银耳软糯、莲子绵密，是常见的滋补粥品。富含天然胶质、膳食纤维及多种微量元素，有助养心安神。制作需经历浸泡和慢熬，对新手的耐心是个考验，全程大约需要 3.5 小时。","q":["银耳 60g","去心莲子 20g","红枣 6g","枸杞 5-6g","冰糖 10-20g"],"s":["把银耳、莲子用清水浸泡 2 个小时，红枣浸泡 10 - 20 分钟，枸杞洗净，备用。","在锅中倒入 600ml 水，烧开后依次放入银耳、莲子、红枣。","等待水再次烧开后，盖上锅盖，转至中火继续熬。","熬到大约 1 小时后，放入 5g - 10g 冰糖和 5g - 6g 枸杞，转至小火熬。","小火继续熬 30 分钟，此时银耳开始呈现粘稠状态。","再次放入 5g - 10g 冰糖，用勺子搅拌 5 - 10 分钟。","关火，用勺子盛出。"],"x":["当银耳呈现粘稠状态时，需要用勺子及时搅拌，防止银耳糊在锅底。"]},{"t":"陈皮排骨汤","c":"soup","cu":"Chinese","m":44,"p":"pork","ing":["排骨","陈皮","西洋参","石斛","玉竹","麦冬","煲汤盅","盐"],"tp":"","d":3,"k":365,"i":"这道汤品属于粤式老火靓汤，汤色清亮，入口甘润回香，带有陈皮的独特陈韵。排骨提供优质蛋白质和钙质，搭配陈皮、西洋参、石斛等食材，有助于理气健脾、滋阴润肺，适合长期熬夜或咽喉不适时饮用。整体操作不难，只需备好料、掌握炖煮时间，新手也能轻松完成。从备菜到出锅大约需要两小时。","q":["排骨，用猪骨也替代也可，4-5 块","陈皮（一般选用 8-20 年制），一般 1 块陈皮是 3 瓣，取 1 瓣即可","西洋参（又名花旗参），9 片","石斛， 6 颗","玉竹， 5 片","麦冬， 7 个","煲汤盅，按 1 人份","食盐 ，5g"],"s":["排骨用热水过一边，去血水。","陈皮、麦冬、玉竹、石斛和西洋参，冲洗干净即可。","煲汤盅洗干净。"],"x":["煲汤盅很烫，拿的时候小心别烫到或者手滑摔破。","广东老火靓汤，讲究用料和火候，只要备好料和炖够一定时辰，就算大功告成！"]},{"t":"黄瓜皮蛋汤","c":"soup","cu":"Chinese","m":32,"p":"egg","ing":["黄瓜","皮蛋","大蒜","小葱","食用油","盐","鸡精"],"tp":"","d":2,"k":311,"i":"黄瓜皮蛋汤是一道快手家常汤品，口味清淡，带着皮蛋与蒜瓣煸炒出的焦香，暖心暖胃且不油腻。黄瓜清热补水，皮蛋提供一定蛋白质，低脂少负担。做法几乎没有技术门槛，厨房新手也能轻松完成，从备料到出锅只需大约十 分钟。","q":["黄瓜 1 根","皮蛋 2 个","大蒜 2 瓣","食用油 10-15 g","盐 2-3 g","鸡精 0.5-1 g","水 400-500 ml"],"s":["黄瓜洗净，切成 0.5-1.2 mm 厚的薄片。","葱洗净切成末，蒜用刀拍几下去皮，对半切一下。","皮蛋剥去壳，然后每个切成 6-8 份。锅里倒入油，放入切好的皮蛋和大蒜。","小火炒至皮蛋和大蒜表面有些焦黄，加入水，转大火烧开。","放入黄瓜片。水再次沸腾以后立马关火，放入盐、鸡精调味即可出锅。","装入碗中，再撒上葱花即可。"],"x":["黄瓜可以根据喜好决定是否去皮。","黄瓜薄片可以用刮皮刀刮。","皮蛋切块时抹点香油不容易粘刀。","参考资料：【黄瓜皮蛋汤的做法步骤图，黄瓜皮蛋汤怎么做好吃】是春天呐下厨房。"]},{"t":"反沙芋头","c":"dessert","cu":"Chinese","m":20,"p":"none","ing":["荔浦芋头","白砂糖或冰糖","水","葱"],"tp":"cool","d":3,"k":397,"i":"反沙芋头是一道外酥里糯、甜香可口的潮汕传统小吃，常作下午茶点。荔浦芋头富含膳食纤维、钾和多种维生素，能提供持久饱腹感。制作不难但需要掌握熬糖火候，适合稍有基础的初学者尝试，全程大约 20 分钟即可完成。","q":["荔浦芋头 200g","白砂糖 30g","水 15g"],"s":["芋头切长条（稍微大条一点，翻炒过程不容易烂）","加入可以没过芋头的油，等油温起来（插入筷子冒小泡即可）","放进芋头到油里，去炸到芋头浮起来，一般是微微泛黄并且可以用筷子很轻松戳洞。","炸芋头的油放起来别浪费，后面炒菜啥的都能用。","接下来关键的一步，把糖(30g)和水(15g)按照 2：1 比例，加热至不变色且冒小泡。","倒入葱花和芋头，关火翻炒，此时等温度下来，糖就会有反沙的效果。","装盘上桌！"],"x":["刚做好的反沙芋头很烫，小心烫嘴哦。","再配上茶，啊~真惬意啊。"]},{"t":"咖啡椰奶冻","c":"dessert","cu":"Chinese","m":240,"p":"none","ing":["125ml 淡奶油","250ml 椰树牌椰汁","50ml 椰子水","10g 吉利丁","过滤网"],"tp":"cool","d":4,"k":162,"i":"这款甜品融合了咖啡的醇厚与椰奶的清甜，口感像布丁般细腻滑嫩，层次丰富。淡奶油和椰汁提供了优质脂肪与植物营养，食用能带来满足感。做法非常友好，只需混合加热，无需复杂技巧，新手也能一次成功。不算冷藏的话，实际操作约需 1 小时，加上冷藏定型共 大约 4 小时即可享用。","q":["125ml 淡奶油(whipping cream, 35% M.E)","250ml 椰树牌椰汁","35ml espresso 意式浓缩（个人不推荐用 fruity 的咖啡豆）","50ml 椰子水（推荐 vita coco coconut water，有条件可以敲一个椰子）","10g 吉利丁"],"s":["将定量淡奶油，椰树牌椰汁，espresso，椰子水混合备用。","将以上液体加热 1 分钟，温度达到 50-60 度即可。","（可选）如果格外嗜甜可以加额外的糖。","倒入吉利丁，搅拌至融化，煮 1 分钟。","（可选）过筛 （这一步可以让椰奶冻口感更佳顺畅）。","放入模具。","（可选）过滤掉表层的泡泡。这一步可以让椰奶冻口感更好，并且看着也会更棒。","放入冰箱冷藏区，等待 3 小时。"],"x":["注意事项：请务必不要让液体煮沸！！！也不要冒泡泡！！！","关于厨具清洗：建议直接用洗碗机，如果没有的话可以用温水洗。（因为 gelatin 不好清洗，洗碗机会比较好）"]},{"t":"奥利奥冰淇淋","c":"dessert","cu":"Chinese","m":44,"p":"egg","ing":["淡奶油","原味奥利奥","电动打蛋器","小刀","冰淇淋模具"],"tp":"cool","d":3,"k":1160,"i":"奥利奥冰淇淋口感细腻，奶香与奥利奥的酥脆甜蜜相融，纯动物奶油令整体轻盈不腻。它主要提供能量，含有脂肪和碳水化合物，适合作为消暑小甜点。制作过程较为简单，只需处理饼干夹心和搅打奶油，新手稍加耐心也可完成，全程准备约需半小时，再冷冻 4 小时以上即可享用。","q":["奥利奥 6 块","白砂糖 18 克","淡奶油 250 毫升"],"s":["将奥利奥拧开后去除利利（夹心），备用。","用筷子将奥奥剁碎，需要有一半奥奥变成粉状，另一半的奥奥最大长度小于 0.5 厘米，备用（某宝可搜“奥利奥饼干碎”，节省时间精力^-^）","将奶油全部倒置于深容器中，并加入准备好的糖。","开始用电动打蛋器高速挡 搅打至 电动打蛋器提起后下方会出现悬挂住的奶油（ 0.5 厘米 - 1 厘米），而不是全部像液体一样滴下（部分滴下是正常现象）。","搅打完成后将奥奥放入奶油中，搅拌均匀直至底部有奥奥。","可选：将混合物倒入冰淇淋模具中。","放置冰箱冷冻室（ -18 度） 4 小时以上可取出。"],"x":["剁碎奥利奥的容器注意不要使用易碎容器。","去除奥利奥夹心时切忌注意割到手。","参考资料：5分钟搞定【奥利奥麦旋风】太解馋叭！"]},{"t":"戚风蛋糕","c":"dessert","cu":"Chinese","m":68,"p":"egg","ing":["烤箱","打蛋器或筷子","铝合金阳极模具","刮刀"],"tp":"cool","d":5,"k":274,"i":"这道烘焙入门甜品口感细腻绵软，拥有云朵般的轻盈质地，属于西点中的经典基础款。主要原料鸡蛋和牛奶提供了优质蛋白与钙质，营养丰富。制作过程对打发、翻拌及烘烤火候要求较高，具有一定挑战，但只要耐心按步骤操作，新手也能成功。从准备到出炉一般需要 1.5 至 2 小时。","q":["每份基准为 1 个鸡蛋（正常中等大小，约 50g）。","| 鸡蛋 | 1 个 | 3 个 | 5 个 |","| 白糖 | 16g | 50g | 80g |","| 食用油 | 8g | 25g | 40g |","| 牛奶 | 10g | 30g | 50g |","| 低筋面粉 | 17g | 50g | 90g |"],"s":["从冰箱中取出新鲜的鸡蛋。","准备两个容器并擦干，分别盛放蛋清与蛋黄。","对盛放蛋清的容器，可稍有水珠，但不能有任何油；盛放蛋黄的容器不能有水珠。","打蛋，手工或利用分蛋器，将蛋清与蛋黄分离到两个容器中。","分离过程中蛋黄不能破碎，蛋清中不能混有任何蛋黄，否则会严重影响打发。（白色系带可进入蛋清，不影响）","（注意，不使用厨房机的情况下，盛放蛋清的容器也是打蛋的容器，为避免溢出，加入全部蛋清后不要超过容器的 1/8）"],"x":["| 原料 | 1 份 （基准） | 6 寸 （3 份，面积 36） | 8 寸 （5 份，面积 64） |。","| :--- | :--- | :--- | :--- |。","为了做好这个戚风蛋糕，用了一整箱鸡蛋，从此告别凹底和塌陷。","对戚风蛋糕而言，蛋清打发是次要问题，关键是烤制时的温度和时间。"]},{"t":"提拉米苏","c":"dessert","cu":"Chinese","m":56,"p":"egg","ing":["马斯卡彭芝士","手指饼干","放凉浓缩咖啡","无菌鸡蛋","白砂糖","可可粉","朗姆酒","一个装成品的容器","打蛋器"],"tp":"cool","d":4,"k":809,"i":"这道意大利传统甜品无需烤箱，奶酪糊绵密轻盈，浸润咖啡液的手指饼干香醇柔软，属于入门级甜点。富含蛋白质和钙质，但糖分与热量较高，宜偶尔享用。操作简便，对烘焙新手十分友好，只需大约半 小时动手，再冷藏四小时即可成型品尝。","q":["马斯卡彭芝士 450g","手指饼干 1 包","放凉浓缩咖啡 350ml","无菌鸡蛋 4 个","白砂糖 50g","可可粉 10g","朗姆酒 35ml"],"s":["分离蛋黄蛋清。","盛有蛋白的碗中加 10g 白砂糖湿性打发。","盛有蛋黄的碗中将 40g 白砂糖分三次加入，搅拌至均匀。","蛋黄中分三次加入马斯卡彭芝士，搅拌至均匀。","蛋黄中最后加入朗姆酒，搅拌均匀。","将打发好的蛋白分三次加入蛋黄芝士液中。","手指饼干两面浸湿咖啡液，平铺入容器。","两层芝士液两层饼干交替放入容器（这一步按照大家意愿及容器高度酌情处理）","放入冰箱冷藏四个小时（心急的小伙伴可以提早拿出来）","取出后在表面筛上可可粉，即可享用啦。"],"x":["下厨房蛋白打发具体教程。"]},{"t":"无厨师机蜂蜜面包","c":"dessert","cu":"Chinese","m":180,"p":"egg","ing":["面包本体","高筋面粉：400g","牛奶: 200g","酵母：4g","鸡蛋：1 个","白砂糖：70g","盐: 2g","黄油: 30g","蜂蜜水","蜂蜜：20g"],"tp":"cool","d":5,"k":176,"i":"这是一款无需厨师机的家常蜂蜜小面包，松软香甜，底部略带脆感，表面刷满蜂蜜水再撒上芝麻，透着朴实的甜香。主要用料为高筋面粉、牛奶、鸡蛋和黄油，提供充足的碳水化合物、蛋白质和钙质，作为早餐或加餐都很安心。做法简单，全程手揉，发酵时间灵活，甚至可以提前一晚放入冰箱冷藏，第二天再烘烤，对","q":[],"s":["制作面团：将面粉，牛奶（建议加热到 40°，本人使用微波炉 15 - 20s），酵母，鸡蛋，面粉，糖和盐混合起来。","搅拌面团，将原料混合均匀成团。","加入黄油混合。","继续搅拌 + 手揉，均匀混合。","开始发面，使用保鲜膜覆盖容器，普通气温(10 - 20°)放置 1 - 2 小时，稍长时间对效果影响不大。","明显看到面团发酵变大（2 倍）即可开始切分面团, 此时面团应该不再十分黏手。","切分面团：理想状态每一份 60g（美观），可根据喜好适当调整大小。","将每一份小面团使用擀面杖擀成舌状后卷起, 再次醒面 10。","再次使用擀面杖擀成舌状后卷起, 从中间切开（一个变成两个）。","再次使用擀面杖擀成舌状后卷起, 从中间切开（两个变成四个）。（此步骤可以按照自己的时间多擀/卷几次, 把握一份的大小就行）","烤盘放入油纸并倒入花生油, （每份卷好的）底部蘸水 + 面粉后放入烤盘。","再次醒发（盖上保鲜膜）, 这一步可以放入冰箱, 第二天再烤。","刷上蛋液。","烤箱 180°(355°F), 18 - 20 分钟。","出炉后, 刷上蜂蜜水, 撒上芝麻。"],"x":["以下用料烤制时使用一个长方形烤盘（10×15 英寸（约 25×38 厘米）） + 一个正方形烤盘（9×9 英寸（约 23×23 厘米）） + 油纸。建议按照需求减少用量，每顿早餐吃大概可以吃两周（冰箱储存）, 冰箱储存会变硬, 微波炉加热 10 - 20s 即可。","发面时间并不固定, 每 1 小时看一下确认就可以, 明显发酵变大即可, 建议发酵 2 - 2.5 倍大。","面团大小不会显著影响口感和烘烤效果，可根据喜好调整。","参考资料：下厨房 - 脆底蜂蜜小面包。"]},{"t":"炸鲜奶","c":"dessert","cu":"Chinese","m":44,"p":"egg","ing":["牛奶","玉米淀粉","低筋面粉或普通面粉","面包糠","鸡蛋","白糖","厨房纸"],"tp":"hot","d":3,"k":1100,"i":"炸鲜奶是一道外壳酥脆、内馅柔软的甜点。制作本身不难，但奶糊必须充分加热并冷藏定型，否则切块和油炸时容易散开。实际操作约需 30 分钟，另需至少 2 小时冷藏定型。","q":["以下用量约可制作 12 块炸鲜奶，适合 3 - 4 人食用。","牛奶 250ml","玉米淀粉 30g","白糖 25g","低筋面粉或普通面粉 40g","鸡蛋 1 个，去壳后约 50g","面包糠 80g","食用油 700ml，实际消耗量会少于此数值"],"s":["从牛奶中取出 80ml，与玉米淀粉混合，搅拌至没有可见颗粒。","将剩余的 170ml 牛奶和白糖倒入锅中，小火加热并持续搅拌，直至白糖完全溶解。","再次搅匀玉米淀粉液，将其缓慢倒入锅中，同时持续搅拌。","保持小火加热并不断搅拌约 3 - 5 分钟，直至奶糊浓稠，刮过锅底后留下的纹路能保持 3 秒不消失。","在耐热容器内壁均匀涂抹约 2ml 食用油，倒入奶糊并将表面抹平，使奶糊厚度约为 2cm。","奶糊冷却至室温后盖好，放入冰箱冷藏至少 2 小时；轻按表面不粘手且整体不会流动时即可取出。","将定型后的奶糊脱模，切成约 6cm×2cm×2cm 的长条，共约 12 条。","将面粉、打散的鸡蛋液和面包糠分别放入 3 个容器。","每块奶条依次均匀裹上面粉、鸡蛋液和面包糠，确保各面都被覆盖。","锅中倒入 700ml 食用油，中火加热至 165 - 175℃；没有温度计时，可放入少量面包糠测试，面包糠应在 2 秒内浮起并持续冒出小气泡。","将奶条分 2 - 3 批放入油中，每批炸约 60 - 90 秒；期间翻动 1 - 2 次，使各面受热均匀。","奶条表面呈均匀金黄色时捞出，放在厨房纸上沥油约 2 分钟后食用。"],"x":["玉米淀粉容易沉底，倒入锅前必须再次搅匀。","一次放入过多奶条会使油温快速下降，导致外壳吸油且容易破裂。","刚炸好的奶馅温度较高，食用前应先从中间掰开散热，避免烫伤。","参考资料：王刚的教学视频。"]},{"t":"烤箱版巴斯克芝士蛋糕","c":"dessert","cu":"Chinese","m":30,"p":"egg","ing":["奶油奶酪：212g","白砂糖：60g","鸡蛋：2 个","鸡蛋黄：1 个","淡奶油：120g","低筋面粉：10g","可选","巧克力：38g"],"tp":"hot","d":2,"k":266,"i":"巴斯克芝士蛋糕是一道口感浓郁绵密、表面焦香内部湿润的甜品，属于西班牙巴斯克地区的经典风味。主要原料为奶油奶酪和鸡蛋，富含优质蛋白质和钙质。制作过程非常简单，新手也能轻松驾驭。从准备到出炉仅需约 30 分钟，但建议冷藏过夜后食用，总耗时约 8 小时以上。","q":[],"s":["奶油奶酪软化，微波炉 10s + 10s。","奶油奶酪加入白砂糖，打蛋器打至顺滑。","加入 2 个全蛋 + 1 个蛋黄，搅拌均匀。","加入淡奶油，搅拌均匀。","加入低筋面粉，搅拌均匀。","烤箱 220°(425°F)，20 - 25 分钟（本人一般 20 或者 22 分钟）。","放凉之后放入冰箱，最好过夜。"],"x":["以下用料使用烤制时使用一个 7 寸圆形模具，原教程使用 6 寸圆形模具。","烤箱出来成品抖动是正常的，放凉后口感还不是最好的，一定要冷藏才好吃！","参考资料：下厨房 - 巴斯克芝士蛋糕『最简单的蛋糕』零失败🔥芝士控。"]},{"t":"烤蛋挞","c":"dessert","cu":"Chinese","m":60,"p":"egg","ing":["蛋挞皮 品牌不限","鸡蛋","牛奶","淡奶油","白砂糖","烤箱 大小不限","克数称","筛网 网孔约为 1 毫米"],"tp":"hot","d":4,"k":169,"i":"烤蛋挞是一款经典的中式甜品，外皮酥脆、内馅嫩滑，奶香浓郁。富含蛋白质、钙质和多种维生素，能提供丰富能量。制作过程十分简单，新手也能轻松上手，而且半成品可冷冻保存，随吃随取。从准备到出炉，大约需要 1 小时。","q":["该配方为整包蛋挞皮所需量 填充后可直接冷冻保存","蛋挞皮 品牌不限 整包蛋挞皮约为 30 只","鸡蛋 8 个 普通鸡蛋即可","牛奶 200 毫升 普通袋装牛奶即可","淡奶油 450 毫升 烘焙店或超市即有售","白砂糖 80 克 普通砂糖即可 细砂糖更优 易于融化"],"s":["将碗置于克数称上 称量 450 克 淡奶油（淡奶油密度在此处记为 1 ）","加入 80 克白砂糖 （甜度中等 可按个人口味增减 建议范围 60-100 克）","加入 200 克牛奶 （牛奶密度在此处记为 1 ）","取 8 个蛋黄加入 蛋清可留作他用。","均匀搅拌所有材料直至白砂糖全部融化。","使用网筛对搅拌完成的食材进行过滤 滤除鸡蛋黏膜 鸡蛋壳 未融化的白砂糖 结块的淡奶油。","此时请将烤箱设置 220 摄氏度开始预热（约 10 分钟） 记得拿出烤盘。","将蛋挞皮以 0.5 厘米的间隔均匀放置于烤盘中。","将过滤完成的食材倒入蛋挞皮中 液面距离蛋挞皮上沿 0.5 厘米即可不宜过多。","截止此步骤 半成品蛋挞的制作已经完成 可直接放入冰箱速冻 12 小时以上保存。","将半成品蛋挞放入烤箱中进行烤制 温度为 200 摄氏度 时间为 25 分钟。","烤制结束后即可食用。"],"x":["操作时 请务必小心烤箱高温 防止烫伤。"]},{"t":"玛格丽特饼干","c":"dessert","cu":"Chinese","m":45,"p":"egg","ing":["熟蛋黄","黄油","白砂糖","盐","低筋面粉","玉米淀粉","烤箱"],"tp":"cool","d":3,"k":863,"i":"玛格丽特饼干口感酥松，黄油香气浓郁，是一款经典的西式小甜点。它主要由蛋黄、黄油和面粉制成，含有丰富的碳水化合物与脂肪，能快速补充能量。制作难度适中，从准备到出炉大约需要 45 分钟，新手也能轻松上手。","q":["熟蛋黄 1 个","黄油 50 克","白砂糖 20 克","盐 1 克","低筋面粉 50 克","玉米淀粉 50 克"],"s":["黄油隔热水融化、将蛋黄磨碎备用。","在融化的黄油中添加糖、盐、以及碾碎的鸡蛋黄，搅拌均匀。","加入低筋面粉与玉米淀粉，揉成面团。","将面团均匀分割成大约 8 克重的小面团，然后将它们搓成球状。","使用大拇指轻压在每个小面团上，以形成裂纹。","预热烤箱至 150℃，将小面团放入烤箱中，烘烤 20 分钟。","微微放凉即可食用。"],"x":["鉴于这种小甜点的高热量，每次制作前需要确定计划做几份。一份正好够一个人食用。","可根据个人口味微调盐与糖的比例，如果喜欢其他风味可以把每份的 3 克玉米淀粉换成可可粉或抹茶粉。","如果条件允许可以把蛋黄、低筋面粉等食材过筛，口感会更好。","介于材料获取难度选择了白砂糖，如果条件允许可以换成糖粉 30 克。"]},{"t":"红柚蛋糕","c":"dessert","cu":"Chinese","m":35,"p":"egg","ing":["空气炸锅","鸡蛋","红柚果肉","面粉","锡纸盘","油","糖","水"],"tp":"cool","d":3,"k":622,"i":"红柚蛋糕是一道用空气炸锅就能轻松完成的清新甜点，融合了红柚果粒的微酸果香与蛋糕的松软口感，适合作为单人份下午茶。鸡蛋和面粉提供蛋白质与碳水，红柚富含维生素 C，带来简单的基础营养。制作难度中等，关键在于分次搅拌成无颗粒的淡黄色面糊，新手只要耐心按步骤操作就能成功。从备料到出锅大约","q":["鸡蛋 2 个","面粉 80g","红柚果肉 20g","油 15ml","水 80ml","糖 15g"],"s":["锡纸盘里打入鸡蛋 2 个， 加入红柚果肉 20g。","锡纸盘中倒入 15ml 油并摇晃锡纸盘时期均匀覆盖盘底。","锡纸盘中放入 10g 糖， 以及 40g 面粉和 40ml 水。","用筷子顺时针方向搅拌至淡黄色糊状。","锡纸盘中放入 5g 糖， 以及 40g 面粉和 40ml 水。","继续用筷子搅拌至淡黄色糊状。","锡纸盘放入空气炸锅的烤篮上，用 180 摄氏度烤 15 分钟。","打开空气炸锅，小心取出锡纸盘，用筷子或勺子将蛋糕翻面。","继续 180 摄氏度烤 8 分钟。","取出即可食用。"],"x":["一份为一人餐，多人餐请等比例增加，本例中锡纸盘直径 18 厘米，若使用更大锡纸盘也请等比例增加材料用量。","如果喜欢较甜的口感可以增加 10g 糖。","红柚果肉可以酌情添加，但每份最好不超过 40g 以免影响成品观感。","糊状指没有面粉疙瘩且整体颜色均匀。"]},{"t":"胡萝卜甜糕","c":"dessert","cu":"Chinese","m":44,"p":"none","ing":["胡萝卜","全脂牛奶","糖","酥油— 可用黄油替代","小豆蔻粉","腰果","杏仁","葡萄干","刨丝器","厚底锅"],"tp":"cool","d":3,"k":374,"i":"胡萝卜甜糕是印度家喻户晓的冬季甜品，胡萝卜丝与牛奶慢炖浓缩，融入酥油和坚果，口感绵密香甜、色泽金红。富含胡萝卜素、钙质和优质脂肪，暖身滋养。制作过程简单，但对新手需要些耐心，全程约需 45 分钟即可完成。","q":["胡萝卜 500g（约 5-6 根中等大小）","全脂牛奶 500ml","糖 80g（可根据个人口味调整至 60g-100g）","酥油 40g","小豆蔻粉 3g","腰果 15g","杏仁 15g","葡萄干 15g"],"s":["将胡萝卜去皮，用刨丝器刨成细丝。","在厚底锅中倒入酥油 20g（一半量），中火加热融化。","放入胡萝卜丝，翻炒 3-5 分钟，直至胡萝卜丝变软且散发香味。","倒入全脂牛奶 500ml，搅拌均匀。","大火煮沸后转中小火，保持缓慢沸腾状态。","持续翻搅 25-30 分钟，直至牛奶几乎完全被胡萝卜吸收蒸发（这是最关键的步骤，需要耐心且不断搅拌防止糊底）","当锅中几乎没有液体时，加入糖 80g，搅拌均匀。","加糖后会重新出水，继续中小火翻炒 5-8 分钟，直至水分再次蒸发。","加入剩余的酥油 20g 和小豆蔻粉 3g，翻炒 2 分钟。","在另一个小锅中，用少量酥油将腰果、杏仁片和葡萄干分别炸至金黄（约 1 分钟），注意葡萄干会膨胀。","将炸好的坚果和葡萄干的一半拌入胡萝卜甜糕中。","盛盘，将剩余坚果和葡萄干撒在表面作为装饰。"],"x":["胡萝卜甜糕可以热吃也可以冷吃，两种风味各有特色。","使用红色胡萝卜比橙色胡萝卜做出来的色泽更好看。","如果想要更浓郁的口感，可以用淡奶油替代部分牛奶。","密封冷藏可保存 4-5 天。食用前可用微波炉加热 1 分钟。"]},{"t":"芋泥雪媚娘","c":"dessert","cu":"Chinese","m":68,"p":"none","ing":["荔浦芋头","紫薯粉","牛奶","糯米粉","玉米淀粉","黄油","淡奶油","白砂糖","料理搅拌机","筛网"],"tp":"cool","d":5,"k":160,"i":"芋泥雪媚娘外皮软糯 Q 弹，内馅是细腻香甜的芋泥与轻盈奶油，口感层次丰富，是一道源自家常创意的中式甜品。芋头和紫薯提供膳食纤维与花青素，牛奶和淡奶油补充钙质，营养均衡。制作无需烤箱，步骤简单，对新手很友好，即使不擅烘焙也能轻松完成。从头到尾大约需要两小时，就能做出让孩子爱不释口的","q":["荔浦芋头 200g","紫薯粉 3g","牛奶 165g","糯米粉 a 50g","糯米粉 b 75g","玉米淀粉 22g","黄油 30g","淡奶油（推荐安佳） 145g","白砂糖 26g"],"s":["芋头切块，大火煮熟至软（40 分钟即可），全部放入料理机。","向内加入 30g 牛奶，25g 淡奶油，将其打成泥状。","再向内加入 3g 紫薯粉，18g 白砂糖，继续搅拌打成细腻芋泥。","取出另一个碗，加入全部糯米粉 b，22g 玉米淀粉，135g 牛奶，50g 白砂糖，混匀并过筛一遍，保鲜膜盖上并扎小洞，中火蒸半个小时。","在蒸的过程中，将糯米粉 a 放入平底锅小火翻炒至微微发黄（即炒熟），作为手粉备用。","将中火蒸完半小时的糯米牛奶混合物（果冻状）趁热加入黄油 30g，将黄油揉至面团完全吸收，然后放冰箱冷藏一小时。","取出另一只碗，加入 120g 淡奶油，8g 白砂糖，打发至有纹路，装进裱花袋备用。","取出冷藏后的面团，搓揉 5 分钟，分成 30g 一个，均匀撒上 2g 手粉防粘，擀成圆形，先挤上 5g 裱花奶油，然后放上 30g 芋泥，最后将面饼像包包子一样包起来（可以减去多余的皮）","包好后再均匀撒 2g 手粉防粘。","重复以上两步直至原材料用光。"],"x":["制作时最好佩戴不粘手套。","制作完即可食用，不用再加热。"]},{"t":"英式司康","c":"dessert","cu":"Chinese","m":44,"p":"egg","ing":["无盐黄油","低筋面粉","糖","盐","泡打粉","鸡蛋","淡奶油","奶油奶酪"],"tp":"cool","d":3,"k":1197,"i":"英式司康是一款经典英式下午茶点心，外酥内软，蛋奶香气浓郁，搭配果酱或奶油食用风味更佳。它主要由面粉、黄油、鸡蛋和淡奶油制成，富含碳水化合物和蛋白质，能快速补充能量。制作过程较为简单，只要掌握基本揉面手法，新手也能胜任，从准备到出炉大约需要一小时。","q":["无盐黄油 40g","低筋面粉 180g","糖 30g","盐 1g","泡打粉 5g","鸡蛋 1 个（约 50g）","淡奶油 45g","奶油奶酪 50g"],"s":["鸡蛋打散，称量出 30g 蛋液放入干净容器中，放入全量淡奶油和奶油奶酪混合均匀。如果奶酪太硬可以水浴加热至大约 40 度再混合。","将低筋面粉，盐，糖，泡打粉放入干净容器中混合均匀。","黄油切成小块，放入上一步的混合物中，用手将黄油捏入混合物中，呈粗玉米粉质地。","将第一步的蛋奶混合液倒入上一步得到的粉油混合物种，搅拌均接近。叠压成均匀面团。","面团放到案板上，擀成 1.5cm 厚的面片，用刀或者模具分切成合适的形状。","用刷子蘸取剩余的 20g 鸡蛋液，刷在司康表面。","烤箱预热 180 度，烤制 27 分钟。"],"x":["最简单的分切方案是擀成圆形面皮，用刀切成 6 个扇形。"]},{"t":"草莓冰淇淋","c":"dessert","cu":"Chinese","m":32,"p":"none","ing":["加糖炼乳","草莓","重奶油","香草精","冰淇淋模具"],"tp":"cool","d":2,"k":1653,"i":"这是一道不需要搅拌机就能轻松制作的家常草莓冰淇淋，果香浓郁、口感绵密。草莓富含维生素 C，搭配奶香四溢的炼乳和奶油，能提供能量和钙质。做法简单不考验厨艺，新手也能一次成功。全程制作耗时约八小时，其中大部分是冷冻时间，实际动手只需短短几十分钟。","q":["草莓 500 克","白砂糖 45 克","香草精 1 克","食盐 1 克","香草精 5 克","食盐 1 克","重奶油 6 克","加糖炼乳 400 克"],"s":["先做草莓糖浆。把草莓洗干净，去掉顶部叶子。将草莓切成 5mm 的小块。保留一半切碎的草莓，稍后折叠成冰淇淋。","将另一半切碎的草莓和糖一起放入酱汁锅中。用中火搅拌和烹饪，直到草莓释放液体并在锅中形成糖浆。","让草莓在糖浆中加热，不时搅拌，直到它们分解并变形，糖浆稍微变稠。","当糖浆保持分开 3秒钟 时，就已经准备好了。把糖浆从火上移开，加入香草和盐搅拌。将草莓糖浆放在一边冷却。","当糖浆冷却时，准备冰淇淋基料。在碗中加入甜炼乳、浓奶油、香草精和盐。使用手动搅拌器搅打混合物，直到它变得轻盈蓬松，并形成柔软的尖峰。","将保留的切碎的新鲜草莓折叠到冰淇淋底座中。将生过的冰淇淋底座转移到冷冻安全容器中。将冷却的草莓糖浆淋在冰淇淋上，然后轻轻地将其旋入混合物中。","盖上冰淇淋并冷冻 八小时 ，然后舀取和食用。"],"x":["制作过程中注意安全，避免割/烫到手。"]},{"t":"酸奶意式奶冻","c":"dessert","cu":"Chinese","m":300,"p":"none","ing":["淡奶油","糖","原味酸奶","吉利丁片","筛网"],"tp":"cool","d":4,"k":1034,"i":"一道改良自意大利经典的甜品，融入原味酸奶后口感更为清爽顺滑，甜而不腻，适合作为餐后小点搭配水果或果酱。奶制品带来丰富的钙质和蛋白质，营养温和。制作步骤简单，只需加热搅拌和冷藏定型，新手也能顺利上手，从准备到冷藏完成大约需要 5 小时。","q":["淡奶油 200g","糖 40g","原味酸奶 250g","吉利丁片 6g"],"s":["吉利丁片剪成小片，泡入冷水中。","淡奶油和糖放入锅中，加热至 60 度。","关火，吉利丁从水中取出，控干水份，加入热淡奶油中，搅拌均匀。","淡奶油降温至 40 度，加入原味酸奶，搅拌均匀。","将上述步骤得到的混合物过两遍筛网。","分装入合适的容器，放入冰箱冷藏 4 小时以上。"],"x":["传统版本的意式奶冻只用淡奶油，且糖量更大，比较甜腻。此版本做了改良，吃起来负担更小。"]},{"t":"雪花酥","c":"dessert","cu":"Chinese","m":30,"p":"beef","ing":["不粘平底锅","烘焙刮刀","一次性塑料手套","雪花酥/牛轧糖模具","擀面杖"],"tp":"cool","d":3,"k":1313,"i":"雪花酥是一道口感酥脆香甜、奶香浓郁的小甜点，属于简单快手的家常烘焙，也很适合装盒送礼。由于含有黄油、奶粉和混合坚果，能提供丰富的能量和蛋白质，不过热量较高，适合偶尔享用。制作难度适中，对新手有一定挑战，但只要注意火候和搅拌手法，一般只需 30 分钟就能完成。","q":["无盐黄油 20g","棉花糖 75g","全脂奶粉 40g","混合坚果 60g","饼干 75g"],"s":["饼干超过一元硬币大小先切成小块。","无盐黄油加入锅中，小火加热至无盐黄油完全融化。","棉花糖加入锅中，使用刮刀搅拌，直至棉花糖融化并与无盐黄油均匀融合。","20g 奶粉加入锅中，使用刮刀搅拌，奶粉与黄油棉花糖混合物搅拌均匀后立即关火。","准备好的所有混合坚果与饼干趁热加入锅中，使用刮刀搅拌。","搅拌到温度下降到手可以接触的温度后，戴上一次塑料手套，在锅中搓揉或者双手拿起拉扯，让饼干混合坚果与棉花糖黄油奶粉混合物分散均匀。","将上述步骤混合物压入模具中，边角压实，擀面杖擀平，未满的一边用手尽量压成直边。","室温放凉，完全冷却后脱模，按照模具纹路切块，或切成自己喜欢的大小，撒上剩余奶粉，尽量使雪花酥每面都沾上奶粉。"],"x":["棉花糖加热时间越长，最后成品越硬。","参考资料：【一口小锅 十分钟搞定的网红草莓“雪花酥”-哔哩哔哩】。"]},{"t":"魔芋蛋糕","c":"dessert","cu":"Chinese","m":56,"p":"egg","ing":["烤箱","电动打蛋器","金属蛋糕模具","烘焙纸","餐刀","隔热手套","[可选] 分蛋器"],"tp":"cool","d":4,"k":234,"i":"魔芋蛋糕是一款低热量、无麸质的甜点，用赤藓糖醇代替白砂糖，口感轻盈湿润，带有可可香气，尤其适合减脂人群。它富含膳食纤维和蛋白质，饱腹感强。制作有一定难度，需要打发蛋白并注意翻拌手法，但整体耗时仅约半小时，算是快手健康的烘焙选择。","q":["3 个鸡蛋","赤藓糖醇 50g","可可粉 10g","魔芋粉 10g","塔塔粉 1g"],"s":["在准备蛋糕糊之前，可以开始预热烤箱至 350 ℉( 150 ℃)以节省时间。"],"x":["本食谱主要参考视频Keto Konjac Chocolate Cake｜生酮蛋糕。","打发蛋白等部分大幅借鉴戚风蛋糕制作流程。"]},{"t":"龟苓膏","c":"dessert","cu":"Chinese","m":32,"p":"none","ing":["龟苓膏粉 25 克","冷水 120 毫升","开水 500 毫升","白砂糖 100 克","小锅","搅拌工具","模具或碗","---"],"tp":"cool","d":2,"k":129,"i":"龟苓膏是一道广式传统甜品，口感嫩滑微苦回甘，常作为夏日消暑小食。龟苓膏能清热祛湿、滋阴养颜，是营养健康的一款点心。做法简单，新手也能轻松掌握，全程只需备料、搅拌和加热，冷藏等待约两小时后即可享用。","q":[],"s":["在锅中倒入龟苓膏粉 25 克与冷水 120 毫升，充分搅拌至无颗粒感。","在另一个容器中加入白砂糖 100 克，倒入沸水 500 毫升，搅拌至糖完全溶解。","将糖水缓慢倒入龟苓膏粉液中，立即搅拌均匀，避免结块。","将混合液体放入锅中，加热时保持中小火，并持续搅拌以防粘锅。","加热至液体变粘稠并开始冒小泡，即可关火。","快速将液体倒入模具中，自然冷却凝固。建议冷藏 1~2 小时后食用，口感更佳。","--。"],"x":["每次制作约可获得 3-4 小碗成品，适合 2-4 人食用。","龟苓膏冷却过程中不可随意移动容器，否则可能影响成型。","加热时应避免使用大火，防止结块或糊底。","可根据个人口味添加蜂蜜、炼乳或水果食用。"]},{"t":"B52轰炸机","c":"drink","cu":"American","m":5,"p":"none","ing":["甘露咖啡酒","爱尔兰百利甜酒","蓝天原味伏特加","吧勺","利口酒杯","打火机"],"tp":"hot","d":3,"k":80,"i":"这款鸡尾酒口感层次分明，入口先是伏特加的烈，紧接着是咖啡奶油的回甘，点燃后饮用有独特的冰火体验，属于经典创意鸡尾酒。咖啡酒与百利甜酒提供了少量咖啡因和奶脂，但整体营养以酒精为主。制作需要练习分层倒酒和点火技巧，对新手稍有难度，整个过程大约只需 5 分钟。","q":["甘露咖啡酒 10ml","爱尔兰百利甜酒 10ml","蓝天原味伏特加 10ml"],"s":["在利口酒杯的最底层倒入甘露咖啡酒到 1/3 处。(10ml)","顺着吧勺缓缓倒入爱尔兰百利甜酒，也是 1/3 处 (10ml)。注意要慢，保证层次分明。（太快甜酒会和咖啡混合）","最后在上层倒入蓝天原味伏特加 （10ml)","用打火机热一下杯口。","最后一步点火： 看到淡蓝色的小火苗了吗？"],"x":["喝的时候，现在酒吧常用的方法是提供一个吸管，在火还燃烧的时候插入，然后快速全部吸入。","由于吸管太细，其中氧气不足，所以火苗会灭掉，不必担心。这时候，会感到一股热辣顺着喉咙一直烈到胃，之后就是久久的咖啡奶油回甘。非常刺激又好喝。"]},{"t":"Mojito莫吉托","c":"drink","cu":"American","m":44,"p":"none","ing":["打碎的冰块","冰镇苏打水","压汁器","海波杯","研杵"],"tp":"cool","d":3,"k":187,"i":"这款鸡尾酒口感清爽酸甜，带有薄荷的清凉和朗姆酒的微醺，是经典的夏季饮品。酒精含量较低，佐以富含维生素 C 的青柠，能生津解渴、提神醒脑。制作十分简单，对新手友好，从备料到完成只需大约十 分钟。","q":["一块青柠（切成两个半块）","糖浆 20ml","金色朗姆酒 45ml","蓝天原味伏特加 10ml"],"s":["将切成半块的青柠之一切成小块，放入海波杯，随后用研杵将其捣出汁。","用 3-4 珠薄荷叶沿着杯口涂抹，随后将其放入杯中。","加入 糖浆 20ml。","加入 金色朗姆酒 45ml。","将剩下的半块青柠压出汁水放入杯中。","轻轻搅拌，使砂糖/糖浆处于半融合状态。","将打碎的冰块放入杯中，直到占杯中 3/4。","加入冰镇苏打水直到刚好淹没碎冰。","旋转搅拌半分钟。","使用碎冰将海波杯补满。","将剩下的一株薄荷叶拍醒，插入碎冰，作装饰。"],"x":["参考资料：【哔哩哔哩】莫吉托(Mojito)世界上最著名的经典鸡尾酒之一。"]},{"t":"冬瓜茶","c":"drink","cu":"Chinese","m":240,"p":"none","ing":["冬瓜","冰糖","保鲜膜","过滤网","大锅"],"tp":"cool","d":2,"k":296,"i":"冬瓜茶是一款清爽解暑的传统饮品，口感甘甜柔和，带有冬瓜特有的清香，冰镇后风味更佳。冬瓜本身低热量、富含水分，搭配冰糖熬制，能补充能量、生津止渴。制作不复杂，但对新手而言需要一些耐心，全程大约需要 4 到 5 小时。","q":["冬瓜 1000g","冰糖 300g"],"s":["准备冬瓜：将冬瓜去皮，去籽，切成小块（每块不超过 4cm）。","加入冰糖：冬瓜加入冰糖，搅拌均匀，盖上保鲜膜放冰箱冷藏 2 小时以上。","煮冬瓜： 此时冬瓜出了很多水, 倒入锅中 大火煮开，然后转中小火慢慢熬制 1~2 个小时，中途多搅拌防止糊锅。","过滤冬瓜茶：使用过滤网将煮好的冬瓜茶液过滤，取出冬瓜块，只保留茶液。","冷却：将冬瓜茶液放凉后，倒入干净的容器中，放入冰箱冷藏即可。","享用: 熬好的冬瓜茶液是浓缩汁，根据个人喜好添加水或其他饮品，冷热皆宜。"],"x":["口感调整：冰糖的用量可以调整，以达到个人喜好的甜度。","保存方法：冷藏保存，建议 1 周内喝完。"]},{"t":"冰粉","c":"drink","cu":"Chinese","m":32,"p":"none","ing":["冰粉籽 200g","过滤豆浆渣的纱布一块","凉白开 2000g","一次性透明塑料杯","遇水发光冰块"],"tp":"cool","d":2,"k":110,"i":"成品1.jpg) 成品2.jpg)","q":["冰粉籽 200g","凉白开 2000g","薄荷汁 10ml / 薄荷粉 10g"],"s":["将凉白开倒入盆中。","将冰粉籽全部用纱布包起来，开口处打结。","将包好的冰粉籽放入凉白开中，在凉白开中用力揉搓 6 分钟。","然后将凉白开放置 2.5 小时，即可成型。","随后将石凉粉用勺子装进准备好的一次性透明塑料杯中，加入 10ml 薄荷汁或者 10g 薄荷粉（柠檬汁、山楂汁、桑椹汁也可），再放入遇水发光冰块，用勺子慢慢搅拌均匀。"],"x":["操作时，需要注意观察凉白开的颜色和粘度变化，如颜色过浅或者水不黏，则说明冰粉籽量不足，或者是揉搓力度和时间没有到位。"]},{"t":"印度奶茶","c":"drink","cu":"Indian","m":10,"p":"none","ing":["红茶","全脂牛奶","生姜","小豆蔻","肉桂棒","丁香","黑胡椒粒","糖","小奶锅"],"tp":"hot","d":2,"k":135,"i":"印度奶茶是一道充满异域风情的家常饮品，以红茶、牛奶和多种香料现煮而成，口感浓郁顺滑，带有生姜、豆蔻、肉桂交织的辛香暖意。牛奶提供优质蛋白和钙质，香料则有助于暖身驱寒、促进消化。制作过程简单直观，对新手友好，从备料到入口只需大约 10 分钟。","q":["水 120ml","全脂牛奶 120ml","红茶 8g（约 2 茶匙）","生姜 5g（约 1cm 一块），拍碎","绿色小豆蔻 2 颗，拍开","肉桂棒 1 小段（约 2cm）","丁香 2 颗","黑胡椒粒 2 颗，拍碎","糖 10-15g（根据个人口味调整）"],"s":["将生姜拍碎（不用切太碎，拍开即可释放姜汁）","将小豆蔻用刀背拍开，露出里面的籽。","将黑胡椒粒拍碎。","在小奶锅中倒入 120ml 水。","放入拍碎的生姜、小豆蔻、肉桂棒、丁香、黑胡椒粒。","大火煮沸后转小火，煮 2 分钟，让香料的味道充分释出。","加入红茶 8g，继续小火煮 2 分钟，直至茶汤颜色变深。","倒入全脂牛奶 120ml。","中火加热，注意观察，当奶茶开始冒泡上升时立即转小火（牛奶极易溢出）","小火煮 2-3 分钟，期间可以将锅提起倒回（反复提拉 3-4 次），使茶汤与牛奶充分融合。","加入糖，搅拌溶解。","关火。","用滤网过滤到茶盏中，去除茶叶和香料残渣。","趁热饮用。"],"x":["CTC 红茶（Crush, Tear, Curl 工艺制成）是印度奶茶的最佳选择，因为其颗粒细碎，能在短时间内释放浓厚的茶味。中国的祁门红茶或滇红也可以替代。","牛奶和水的比例可以根据个人喜好调整。更浓的奶茶用牛奶多水少，更清爽的用水多牛奶少。","生姜是印度奶茶的灵魂，不建议省略。","印度人喜欢将奶茶煮得很甜，如果不习惯可以减少糖量。"]},{"t":"可乐桶","c":"drink","cu":"American","m":5,"p":"none","ing":["原料","波旁威士忌","可口可乐","冰块","柠檬","工具","手动压汁器"],"tp":"cool","d":2,"k":450,"i":"可乐桶是一款简单易调的休闲鸡尾酒，口感清爽甜润，可乐的气泡和柠檬汁很好地中和了威士忌的烈感，适合聚会场合。主要提供能量，柠檬补充维生素 C。整个调配过程只需 5 分钟即可完成，新手也能轻松上手。","q":["一杯分量，约 900 毫升（含冰）","威士忌 100 毫升","可口可乐 500 毫升","柠檬 1 个","冰块 300 克"],"s":["柠檬的处理。","将柠檬对半切（刀方向垂直于柠檬的头尾连线），并从其中的一半中切取一片柠檬备用。","再次将柠檬对半切，将得到的 4 角柠檬用压汁器压出柠檬汁置于容器中备用。","将挤压过的柠檬置于容器中备用。","正式调配。","选择一个杯子，建议使用容量在大约 1 升的大型玻璃杯或铁皮酒桶。","将冰块和挤压过的柠檬入杯中（可根据个人喜好设计柠檬与冰块的摆放）","倒入 15 毫升柠檬汁（如果喜酸可以加多点或全加）","沿杯壁缓慢倒入可口可乐至距离杯口 3/4 处（控制可乐和威士忌的比例约在 5:1 ）","倒入威士忌直至满杯。"],"x":["可乐桶因冰块和可乐的口感掩盖了威士忌的酒味，因此不善酒力的人也容易在不知不觉中过量饮酒，请在保证个人与饮酒者的安全下调配。"]},{"t":"奇异果菠菜特调","c":"drink","cu":"Chinese","m":10,"p":"none","ing":["奇异果","苹果","菠菜叶","水","白砂糖","工具","榨汁机"],"tp":"hot","d":1,"k":184,"i":"这是一道清爽健康的果蔬特饮，口感酸甜细腻，带有奇异果与苹果的天然果香，菠菜味清淡不抢。富含维生素 C 和膳食纤维，有助于促进消化。制作非常简单，新手也能一次成功，全程预计只需 10 分钟。","q":["饮用水 700ml","奇异果 2 个","苹果 1/2 个","菠菜叶 4 叶","白砂糖 12 克"],"s":["将猕猴桃切成两半，每半再分四份小块。","将苹果切丁。","将菠菜叶去梗，只留叶子部分。","将菠菜切碎。","一起倒入榨汁机搅拌杯。","注水。","加入白砂糖。","启动搅拌机，搅拌约 4 个 15 秒（每 15 秒停下看状态）"],"x":["关于白砂糖的量：全糖为 12g，可根据个人情况在 0-12g 中调整。","本品是仿照宜家的奇异果菠菜汁自己研制的，没有宜家的好喝，但也不错。","欢迎改进！"]},{"t":"奶茶","c":"drink","cu":"Chinese","m":32,"p":"none","ing":["袋泡红茶","全脂奶粉或淡奶"],"tp":"hot","d":2,"k":81,"i":"这是一道用红茶和奶粉轻松调制的家常饮品，茶香与奶香交融，口感顺滑温暖。红茶中的茶多酚搭配牛奶的蛋白质和钙质，既能提神又补充日常营养。做法非常简单，新手也能一次成功，仅需大约半 小时就能喝上自制奶茶。","q":["袋泡红茶 2 包（约 4g）","奶粉 11-12g","砂糖 5-7g"],"s":["取袋泡红茶 2 包放入杯中，加入 180-200mL 沸水。","等待 20 - 30 分钟。","称取 11-12g 奶粉和 5-7g 砂糖，分别加入前一步骤得到的液体中。","搅拌均匀即可饮用。"],"x":["加入沸水后，尽量保持杯子内部温暖，例如使用开口较小的杯子或盖上盖子。如果气温较低时，使用量杯量取可能导致沸水在冲入红茶前冷却，则可以不使用量杯量取而直接估计其体积。","等待时间结束后可提起或搅动茶包以使冲泡更加均匀。"]},{"t":"杨枝甘露","c":"drink","cu":"Chinese","m":20,"p":"none","ing":["杯子","水果刀","牛奶","冰块","调理机/果汁机"],"tp":"cool","d":2,"k":661,"i":"这是一道改良版的经典港式甜品，用奇亚籽代替西谷米，口感滑嫩又带有籽粒的细微嚼劲，芒果的香甜与葡萄柚的微酸交织，椰奶增添浓郁。富含膳食纤维、维生素 C 和优质脂肪，清爽解暑。制作非常简单，新手也能轻松完成，从备料到享用只需约 20 分钟。","q":["奇亚籽 24g","牛奶 50ml","冰块 2 小块","芒果 1 粒","葡萄柚 1/2 粒","椰奶 150ml","切丝芒果干 （可选）","切丝柳橙干 （可选）"],"s":["奇亚籽泡牛奶 10 分钟。","泡籽之时，把半粒芒果、葡萄柚去皮切丁，放入杯中。","半粒芒果切小块放入调理机加冰块、椰奶打成泥。","倒入杯中，放上点缀材料（如有）。","一边享用一边写代码！！"],"x":[]},{"t":"柠檬水","c":"drink","cu":"Chinese","m":20,"p":"none","ing":["原料","柠檬","果蜜","冰","工具","雪克杯"],"tp":"cool","d":1,"k":141,"i":"这道饮品以新鲜柠檬为主角，搭配果蜜调和，酸甜平衡，冰镇后更感清凉解暑。柠檬富含维生素 C，经常饮用有助于补充营养、提神美白。制作步骤极简，只需捶打、加料、摇晃，新手也能在三五分钟内完成。","q":["一杯分量，约 500 毫升","柠檬 40~45 克","果蜜 40~45 克","冰几块（可选）"],"s":["称 40~45 克柠檬，放入雪克杯中。","雪克杯盖盖子锤大约 10 次。","加入果蜜 40~45 克。","补水。","摇晃均匀。","最后根据喜好加冰。"],"x":["参考资料：柠檬水教程。"]},{"t":"泰国手标红茶","c":"drink","cu":"Thai","m":240,"p":"none","ing":["水","茶粉","炼乳","白糖","牛奶","克称","带刻度容器","港式奶茶过滤袋"],"tp":"cool","d":3,"k":185,"i":"这是一道源自泰国街头的经典奶茶，茶香浓郁，口感绵密顺滑，炼乳与牛奶带来香甜奶味。茶奶结合可提供少量蛋白质和钙，但含糖量较高，适宜作为消暑解渴的饮品。制作步骤简单，但需反复过滤茶汤并等待长时间冷藏，整体耗时约 4 小时 20 分钟，对新手稍有耐心即可完成。","q":["水(600cc)","茶粉(20g)","白糖(24g)","牛奶(18ml)","炼乳(24g)"],"s":["600cc 水大火烧开。","在过滤袋中装入 20g 茶粉，开水倒入过滤袋中，过滤 20 遍。","使用克称量取 24g 炼乳、24g 白糖和 18ml 牛奶放入 1000ml 以上的水壶中。","将过滤好的茶水倒入水壶中搅拌，直到白糖融化。","将水壶放到冰箱 4 小时以上。","喝前可以加 6-8 颗冰块。"],"x":[]},{"t":"海边落日","c":"drink","cu":"American","m":44,"p":"none","ing":["原料","红石榴糖浆","NFC 橙汁","苏打水","白朗姆","蓝橙力娇酒","柠檬汁","冰块","柠檬","工具"],"tp":"cool","d":3,"k":173,"i":"这款鸡尾酒色彩层次分明，底部红石榴糖浆似晚霞，中间橙汁透亮，上层蓝橙酒液如海水，整体呈现海边落日的意境，喝起来酸甜清爽，带朗姆酒香。橙汁和柠檬汁含少量维生素 C，酒精能帮助放松。调酒步骤不复杂，但倒液沿搅拌棒做出分层需要一点耐心，新手跟着做也能成功，准备加调制大约一刻钟搞定。","q":["一杯分量（含冰）","红石榴糖浆 15ml","橙汁 35~50ml","苏打水 50ml","白朗姆 30ml","蓝橙力娇酒 15ml","柠檬汁 15ml","大冰块差不多就行","柠檬 1 片"],"s":["柠檬的处理。","柠檬洗净切出一片。","正式调配。","选择一个杯子，建议使用容量在 350~400 毫升的透明玻璃杯。","放入大冰块，用搅拌棒搅拌冰杯。","加入红石榴糖浆。","让橙汁沿搅拌棒导入酒杯，到就被一半就行。","轻轻搅拌半圈。","倒入苏打水。","拿出调酒杯，加入白朗姆 + 蓝橙力娇酒 + 柠檬汁 + 冰块。然后 shake，shake。","轻轻倒入酒杯中。","插上柠檬和吸管。"],"x":[]},{"t":"牛油果拉西","c":"drink","cu":"Indian","m":5,"p":"none","ing":["原味酸奶","熟透的牛油果","蜂蜜","冷牛奶","小豆蔻粉","薄荷叶或坚果碎","搅拌机"],"tp":"cool","d":1,"k":392,"i":"这是一款融合了印度传统酸奶饮品“拉西”的创新饮品，口感绵密顺滑、清甜不腻，特别适合作为早餐或午后提神饮品。牛油果富含单不饱和脂肪酸与膳食纤维，搭配酸奶的优质蛋白和益生菌，一杯便能提供持久饱腹感。制作极为简单，新手也能零失败，从备料到享用只需 大约 5 分钟。","q":["原味酸奶 120 ml","熟透的牛油果 1 个","蜂蜜 1 汤匙（可根据口味增减）","冷牛奶 60 ml","小豆蔻粉 1 撮（可选）"],"s":["将牛油果对半切开，去核，剥去外皮，将果肉切成小块备用。","在搅拌机中加入 120ml 原味酸奶、切好的牛油果块、1 汤匙蜂蜜以及 60ml 冷牛奶。","（可选）加入一小撮小豆蔻粉以增加独特风味。","启动搅拌机，搅拌大约 1 分钟直至液体变得完全顺滑和浓郁。","将打好的饮品倒入杯中。","（可选）在表面放上几片薄荷叶或撒上 5g 切碎的坚果作为装饰。"],"x":["牛油果必须选择熟透的，这样才能保证饮品的绵密口感和颜色。","如果喜欢更冰凉的口感，可以适当减少一点牛奶，加入几块冰块一起搅拌。"]},{"t":"百香果橙子特调","c":"drink","cu":"Chinese","m":1440,"p":"none","ing":["百香果","橙子","白砂糖","冰块","蜂蜜","薄荷叶或其他绿叶","工具","手动压汁器"],"tp":"cool","d":3,"k":173,"i":"这是一道酸甜清爽的夏日饮品，融合了百香果的热带果香与橙子的鲜甜，搭配茉莉绿茶或苏打气泡水，口感层次分明，冰爽解腻。富含维生素 C，有助增强免疫力和滋润肌肤。包含腌制、泡茶、榨汁等步骤，操作略多但难度适中，新手也能尝试。需提前一天腌制百香果，总耗时约 24 小时，实际动手时间仅 大","q":["基于茉莉绿茶版本准备，一杯分量，约 380 毫升","橙子 1 个（约 200 克，拳头大小）","茉莉绿茶茶叶 3~6 克","开水 150 毫升","冰块 160 克以上","腌制百香果部分（因为量小不好配置，这里是两次的分量）","百香果 3 个","白砂糖 30 克","蜂蜜 10 克（如果没有可以用 5 克白砂糖代替）"],"s":["百香果腌制（因为量小不好配置，这里是两次的分量）","将三个百香果的果肉取出来（里面的汁也不能放过），置于容器中。","称量 30 克白砂糖放入。","称量 10 克蜂蜜放入（如果没有可以用 5 克白砂糖代替）","搅拌均匀。","容器保鲜膜封口，放入冰箱中进行 12~24 小时的腌制。","茉莉绿茶调配（推荐比例=>茶 : 水 : 冰 = 1~2 : 50 : 30）","称量 3~6 克茶叶置于容器，加入 150 毫升开水，泡 6 分钟。","往泡好的绿茶中放入 90 克冰块冷却，可搅拌加速冷却。","待冰块消失后，将茶叶过滤得到茉莉绿茶茶水约 240 毫升。","橙子的处理（可在泡茶期间处理）","将橙子对半切（刀方向垂直于橙子的头尾连线），并从其中的一半中切取一片橙子备用。","再次将橙子对半切，将得到的 4 角橙子用压汁器压出橙汁置于容器中备用。","正式调配。","选择一个杯子，建议使用容量在 350~400 毫升的透明玻璃杯。","将 70 克冰块放置在杯底，并将所有橙汁倒入。","将之前准备的一片橙子贴杯内壁放置。","将一次分量的腌制百香果浇在冰上。","缓慢注入茉莉绿茶直至满杯，便于分层。","在液面放置好装饰用的绿叶（可选）"],"x":["如果缺少或不喜欢茉莉绿茶，可以使用苏打气泡水代替，免去茉莉绿茶的调配流程。"]},{"t":"砂糖椰子冰沙","c":"drink","cu":"Chinese","m":20,"p":"none","ing":["瓶装椰汁","咖啡调糖"],"tp":"cool","d":1,"k":231,"i":"砂糖椰子冰沙是一道极具热带风情的快手冷饮，清甜的椰香融合粗粒黄糖的焦香，口感绵密冰爽。椰子水富含天然电解质与矿物质，能快速补充水分，咖啡调糖增添碳水能量。制作门槛极低，只要提前将椰汁冻硬，敲打成沙即可，对新手毫无压力。从冷冻到出品需提前准备 10 小时以上，但动手操作仅需几分钟，","q":["冰沙最佳份量通常与融化速度有关，300g 在零下 18 度制成的冰沙在室温下通常可维持 30 分钟。","瓶装椰子汁 500ml","咖啡调糖 10g（两包太古咖啡调糖）","坚果碎（可选）"],"s":["500ml 瓶装椰汁倒掉 200ml，立刻拧紧瓶盖。","将这瓶椰汁放入冰箱冷冻区并冷冻 10 小时以上。","将这瓶椰汁取出，若确认瓶中椰汁已彻底冻结，则在墙角、椅背、桌角等坚硬表面上用力抽打。（请务必确认表面不会因此受到损伤）","当抽打到冻结椰汁变成冰沙状态，打开瓶盖倒出冰沙。","在冰沙表面均匀撒上咖啡调糖或坚果碎。","完成。"],"x":["在以上步骤中，瓶装椰汁可以提前冰冻，但是不宜超过 7 天，否则有变质风险。"]},{"t":"耙耙柑茶","c":"drink","cu":"Chinese","m":15,"p":"none","ing":["耙耙柑","茉莉绿茶","冰块","蔗糖糖浆","工具","搅拌机"],"tp":"cool","d":2,"k":81,"i":"耙耙柑茶是一款融合了柑橘清甜与茉莉花香的果茶饮品，口感清爽回甘，属于创意调饮，不限于特定菜系。耙耙柑富含维生素 C 与膳食纤维，搭配绿茶饮用能带来清新提神的体验。做法非常简单，新手友好，从泡茶到搅拌全程仅需约 15 分钟即可完成。","q":["一杯分量，约 300 毫升","耙耙柑 1~2 个（200 克以上）","茉莉绿茶 2~4 克","冰块 60 克","1 : 1 蔗糖糖浆 10 克（可选）"],"s":["茉莉绿茶调配（推荐比例=>茶 : 水 : 冰 = 1~2 : 50 : 30）","称量 2~4 克茶叶置于容器，加入 100 毫升开水，泡 6 分钟。","往泡好的绿茶中放入 60 克冰块冷却，可搅拌加速冷却。","待冰块消失后，将茶叶过滤得到茉莉绿茶茶水约 160 毫升。","正式调配。","选择一个杯子，建议使用容量在大约 300 毫升的透明玻璃杯。","取出耙耙柑的肉瓣，并将外皮剥去，取得果肉。","取 130 克果肉和 130 毫升茉莉绿茶放入搅拌机中。","倒入 10 克蔗糖糖浆（可选，如果喜甜可放）","封盖启动搅拌机，搅拌 20 秒后将搅拌产物倒入杯中。","取一点果肉撕碎撒在液面上。","开始享受。"],"x":["耙耙柑可以用其他容易分离果肉的柑橘替代，比如丑橘。","果肉和茶水比例为 1 : 1，如果需要配置更大的分量，可按比例提升用量。"]},{"t":"菠萝咖啡特调","c":"drink","cu":"Chinese","m":10,"p":"none","ing":["咖啡液","菠萝汁","冰块","苏打水","奶油","牛奶","糖","海盐","朗姆酒"],"tp":"cool","d":3,"k":180,"i":"这道特调饮品融合了咖啡的醇香与菠萝的酸甜，气泡清爽、奶盖绵密，口感层次丰富。菠萝富含维生素 C 和膳食纤维，搭配咖啡能提神醒脑。制作难度中等，只需打发奶油并混合液体，全程约 10 分钟即可完成。","q":["咖啡液 30ml","菠萝汁 60ml","冰块 50g","苏打水 30ml","奶油 30ml","牛奶 10ml","糖 8g","海盐 0.5g","朗姆酒 5ml"],"s":["杯子里依次加入冰块，咖啡液，菠萝汁和苏打水。","奶油加糖打发至湿性发泡，加入朗姆酒和牛奶均匀只有流动性。","在第一部混合液上方倒入奶油。","奶油顶面撒上海盐。"],"x":["咖啡液建议选用花果风味，浓缩可以用中烘豆，冷萃可以用普通水洗或者日晒。","倒入奶油时，高度尽量放低，让奶油能均匀漂浮在饮料表面形成奶盖。","用新鲜的咖啡液和菠萝汁能大大提升整体风味口感。"]},{"t":"酒酿醪糟","c":"drink","cu":"Chinese","m":60,"p":"none","ing":["糯米 800g","安琪甜酒曲一包","清水 720g + 600g","蒸锅","温度计"],"tp":"cool","d":4,"k":420,"i":"这是一道传统中式发酵甜品，口感清甜微醺，带着淡淡的酒香。具有健脾开胃、促进消化的作用。制作过程简单有趣，虽然需要等待发酵，但动手操作并不复杂，非常适合作为发酵入门。预计制作总时长约 2 天，其中实际动手时间仅需 大约 1 小时。","q":["本菜谱为 1 份，可供 6～8 人食用。"],"s":["将 800g 糯米淘洗干净放入电饭煲，加入 720g 清水选择蒸饭模式。","蒸熟后将米饭倒出摊凉，使用干净的工具将其摊至 30°C （用温度计测量为宜，体感温热但不烫手）","将 8g 安琪甜酒曲用 20ml 温水（约 30°C）化开，均匀撒在糯米饭中，同时翻拌均匀。","向糯米饭中加入 600g 清水帮助酒曲翻拌均匀。静置 2-3 分钟后发现糯米饭吸饱水分。这次加水可以让酒酿首次发酵便汤汁丰富。","用擀面杖在糯米饭中央挖一个小洞（便于出酒）","将混合好的米饭装入干净容器中，轻轻压平表面，盖上盖子或保鲜膜密封好。","放置于 28 ～ 32°C 环境下发酵 24 ～ 48 小时。发酵期间不可剧烈摇晃或移动。","发酵成功标准为：中间凹槽有透明酒液渗出，整体略带酒香，无异味、不酸败。","发酵结束后可立即冷藏保存（过程中可以加入桂花），每次食用用干净工具取出，可冷藏保存 7 ～ 10 天。","可以继续二次发酵，加入 500ml 清水增加酒酿产量（800g 水以内即可）","酒酿会一直持续发酵。如果想停止发酵，可以上锅蒸 10 分钟杀菌，或放入冰箱冷藏。","将 800g 糯米淘洗干净，倒入清水中浸泡 6 ～ 8 小时（冬季建议泡 8 ～ 10 小时），泡至米粒饱满。","沥干糯米，放入蒸布中，隔水蒸 40 ～ 60 分钟。每 20 分钟打开锅盖翻动一次确保蒸熟均匀。","蒸熟后将米饭倒出摊凉，加入酒曲，后续步骤同上。"],"x":["发酵温度至关重要，低温会发酵缓慢或失败，高温会杀死酒曲。","发酵失败常见原因：温度过高、米饭太热时拌入酒曲、容器未清洁干净或进水进油。","可搭配汤圆、蛋花、枸杞等加热食用，但注意不要煮沸时间过长以免酒香散失。","酒酿汁可用于制作酒酿米糕、酒酿饼等，还可以用作调料为肥牛饭、照烧汁增添风味。"]},{"t":"酸梅汤","c":"drink","cu":"Chinese","m":360,"p":"none","ing":["水","乌枣","乌梅","山楂片","黄冰糖","甘草","陈皮","红豆蔻","干桂花"],"tp":"cool","d":2,"k":359,"i":"酸梅汤是一道酸甜可口、清凉解暑的传统饮品，冰镇后饮用尤为沁人心脾。配方中的乌梅、山楂、甘草等原料有助于生津止渴、消食开胃。做法简单，新手友好，只需浸泡、熬煮和冷藏即可。制作全程包括浸泡、两次煎煮和冷藏，大约需要 6 小时以上，建议提前准备。","q":["乌枣 25 克","乌梅 25g","黄冰糖 100 克","山楂片 30 克","甘草 2 克","陈皮 4 克","红豆蔻 1 克","干桂花 3 克"],"s":["冲洗材料（干桂花和冰糖除外）， 1.5 升水常温浸泡两小时以上（干桂花和冰糖除外）","开中大火煮沸，盖盖，转小火煮 40 分钟，为头煎。","将冰糖放入盆内，再将沥好用材的头汤趁热倒入，搅拌至冰糖融化。","药材重新装回锅内再 600 毫升的水，开大火煮沸，盖盖，转中火，再煮 20 分钟为二煎。","最后将二煎和冰糖水趁热混合为成品。在成品 60-70℃加入干桂花（不要超过 80℃）加盖晾凉再放入冰箱冷藏 3 小时以上。","饮用时记得将干桂花沥出。如饮茶般细啜，冰凉振齿，酸醒人、甜适度，滋味丰满而悠长。"],"x":["放入冰箱冷藏后再饮用效果更佳。"]},{"t":"金汤力","c":"drink","cu":"American","m":5,"p":"none","ing":["原料","金酒","汤力水气泡水","柠檬","冰块","新鲜绿叶","工具","手动压汁器"],"tp":"cool","d":2,"k":205,"i":"这是一款经典的金酒鸡尾酒，口感清爽微苦，带有柠檬的明亮酸香与汤力水的细腻气泡，入口轻盈畅快。虽然主要提供水分和少量酒精带来的热量，新鲜柠檬汁能补充维生素 C，帮助提神。做法非常简单，新手也能轻松掌握，预计只需 5 分钟即可完成。","q":["一杯分量，约 350 毫升（含冰）","金酒 30~40 毫升","汤力水气泡水 1 罐","柠檬 1 个","冰块 100 克"],"s":["柠檬的处理。","将柠檬对半切（刀方向垂直于柠檬的头尾连线），并从其中的一半中切取一片柠檬备用。","再次将柠檬对半切，将得到的 4 角柠檬用压汁器压出柠檬汁置于容器中备用。","正式调配。","选择一个杯子，建议使用容量在 350~400 毫升的透明玻璃杯。","将 100 克冰块放置在杯底。","倒入 30~40 毫升金酒。","倒入 15 毫升柠檬汁（如果喜酸可以加多点或全加）","用勺子搅拌均匀。","将之前准备的一片柠檬放置好。","缓慢沿杯壁注入汤力水直至满杯（不要倒在冰上，避免起泡流失）","用勺子轻轻上下提拉将液体搅拌均匀（不要旋转搅拌，避免起泡流失）","在液面放置好装饰用的绿叶（可选）"],"x":[]},{"t":"金菲士","c":"drink","cu":"American","m":5,"p":"none","ing":["原料","金酒","苏打气泡水","柠檬","蔗糖糖浆","冰块","新鲜绿叶","工具","手动压汁器","雪克瓶"],"tp":"cool","d":2,"k":150,"i":"经典金酒鸡尾酒，酸甜适口，气泡激爽。柠檬提供丰富维 C，搭配蔗糖糖浆平衡酸度。制作非常简单，新手只需 5 分钟即可调制完成，适合在家轻松享用。注意饮酒有害健康，请勿过量。","q":["一杯分量，约 350 毫升（含冰）","金酒 30~40 毫升","苏打气泡水 1 罐","柠檬 1 个","1 : 1 蔗糖糖浆 30~40 克","冰块 100 克"],"s":["柠檬的处理。","将柠檬对半切（刀方向垂直于柠檬的头尾连线），并从其中的一半中切取一片柠檬备用。","再次将柠檬对半切，将得到的 4 角柠檬用压汁器压出柠檬汁置于容器中备用。","正式调配（无雪克瓶）","选择一个杯子，建议使用容量在 350~400 毫升的透明玻璃杯。","将 100 克冰块放置在杯底。","倒入 30~40 毫升金酒。","倒入 20 毫升柠檬汁（如果喜酸可以加多点或全加）","倒入 30~40 克蔗糖糖浆。","用勺子搅拌均匀。","将之前准备的一片柠檬放置好。","缓慢沿杯壁注入苏打气泡水直至满杯（不要倒在冰上，避免起泡流失）","用勺子轻轻上下提拉将液体搅拌均匀（不要旋转搅拌，避免起泡流失）","在液面放置好装饰用的绿叶（可选）","如果有雪克瓶，可以将以上步骤 2~6 替换为以下步骤。","将冰块、金酒、柠檬汁、蔗糖糖浆倒入雪克瓶，雪克均匀。","将充分雪克的产物倒到杯子中（如果里面的冰太碎了，可以选择过滤其中的冰，重新往杯中补充冰块）"],"x":[]},{"t":"长岛冰茶","c":"drink","cu":"American","m":5,"p":"none","ing":["金酒","龙舌兰酒","伏特加","白朗姆酒","橙味甜酒","柠檬","枫糖浆","可乐","冰块","高球杯"],"tp":"cool","d":2,"k":281,"i":"长岛冰茶是一款口感酷似冰茶、入口柔和但酒精度颇高的经典鸡尾酒。它本身营养价值不高，偶尔小酌可放松身心，但切勿过量。做法非常简单，只需按比例混合四种基酒、甜酒和果汁，新手也能轻松调制。从准备到完成仅需 大约 5 分钟。","q":["金酒 15ml","龙舌兰酒 15ml","伏特加 15ml","白朗姆酒 15ml","橙味甜酒 15ml","柠檬汁 30ml","枫糖浆 20ml","可乐 75ml","柠檬 1 个","冰块 100 克"],"s":["柠檬对半切，挤出 30ml 柠檬汁至杯中。","15ml 金酒。","15ml 龙舌兰酒。","15ml 伏特加。","15ml 白朗姆酒。","15ml 橙味甜酒。","向杯中缓慢倒入 20ml 枫糖浆，边倒边搅拌。","向杯中加入 75ml 可乐。","向杯中加入冰块直至满杯。","轻轻搅拌 20 秒。","开始享用.。"],"x":["长岛冰茶，不含茶却有着冰茶的口感，是一种有着较高酒精度（约 15%），但口感柔和易于接受的鸡尾酒。","参考资料：国际调酒师协会：长岛冰茶。"]}];

/* Ingredient matching: English by whole word, Chinese by substring */
function termRegex(raw){
  const t = raw.toLowerCase().trim();
  const bad = /[.*+?^${}()|[\]\\]/g;
  if (/[^\x00-\x7f]/.test(t)) return new RegExp(t.replace(bad,"\\$&"), "i");
  const bases = new Set([t]);
  if (t.length > 3 && t.endsWith("es")) bases.add(t.slice(0,-2));
  if (t.length > 3 && t.endsWith("s")) bases.add(t.slice(0,-1));
  const alt = [...bases].map(b => b.replace(bad,"\\$&")).join("|");
  return new RegExp("\\b(?:" + alt + ")(?:e?s)?\\b", "i");
}
const parseTerms = v => v.split(/[,;，；、\n]/).map(s => s.trim()).filter(Boolean).map(termRegex);
const hay = d => d.name + " " + d.zh + " " + d.ing.map(i => i + " " + iz(i)).join(" ") + " " + (PROTEIN_EN[d.protein] || "") + " " + (PROTEIN_LABEL[d.protein] || "");

const SEASON_ING = /^(盐|糖|食用油|油|生抽|老抽|酱油|蚝油|料酒|淀粉|鸡精|味精|胡椒粉|白胡椒粉|黑胡椒粉|香油|醋|水|冰糖|salt|sugar|oil|soy sauce|water|pepper|black pepper|cornstarch|vinegar|sesame oil|葱|姜|蒜|scallion|garlic|ginger|花椒|sichuan peppercorn|干辣椒|dried chili|chili oil|辣椒油|white pepper|star anise|八角|rice vinegar|shaoxing wine|豆瓣酱|doubanjiang)$/i;
const isSpicy = d => /辣|麻婆|麻辣|水煮|剁椒|豆瓣|花椒|chili|spicy|gochu|jalape|sriracha|vindaloo|curry paste|kimchi/i.test(d.name + " " + d.zh + " " + d.ing.join(" "));
const isFried = d => /炸|酥|fried|tempura|katsu|karaage|crispy|churro|pakora|fritter|schnitzel/i.test(d.name + " " + d.zh);
const isRich = d => /红烧|扣肉|五花|肥|焖|cream|奶油|cheese|芝士|carbonara|alfredo|belly|braised|butter chicken|mac and/i.test(d.name + " " + d.zh);
const coreIng = d => d.ing.map(x => String(x).toLowerCase().trim()).filter(x => x && !SEASON_ING.test(x));
function tableOthers(course){ return pickedList().filter(([c]) => c.id !== course && c.id !== "drink" && c.id !== "dessert").map(([, d]) => d); }
function fitScore(d, others){
  if (!others.length || d.course === "drink" || d.course === "dessert") return 0;
  let s = 0;
  const sp = others.filter(isSpicy).length, fr = others.filter(isFried).length, ri = others.filter(isRich).length;
  if (isSpicy(d) && sp) s -= sp >= 2 ? 2 : 1;
  if (isFried(d) && fr) s -= 1;
  if (isRich(d) && ri) s -= 1;
  if (d.protein && d.protein !== "none" && others.some(o => o.protein === d.protein)) s -= 1;
  const mine = coreIng(d), shared = new Set(others.flatMap(coreIng).filter(x => mine.includes(x)));
  if (shared.size) s += shared.size >= 2 ? 1 : .5;
  if ((d.course === "soup" || d.course === "veg") && ri + fr + sp >= 2 && !isSpicy(d) && !isFried(d) && !isRich(d)) s += 1;
  return Math.round(s);
}
function tableBalance(){
  const ds = pickedList().filter(([c]) => c.id !== "drink" && c.id !== "dessert").map(([, d]) => d);
  if (ds.length < 2) return "";
  const notes = [], sp = ds.filter(isSpicy).length, fr = ds.filter(isFried).length, ri = ds.filter(isRich).length;
  if (sp >= 2) notes.push(sp + " 道偏辣"); if (fr >= 2) notes.push(fr + " 道油炸"); if (ri >= 2) notes.push(ri + " 道偏油腻");
  const cnt = {}, show = {}; ds.forEach(d => new Set(d.ing.filter(x => !SEASON_ING.test(String(x).toLowerCase().trim()))).forEach(x => { const k = String(x).toLowerCase().trim(); cnt[k] = (cnt[k] || 0) + 1; show[k] = iz(String(x).trim()); }));
  const share = Object.keys(cnt).filter(x => cnt[x] >= 2).slice(0, 3).map(x => show[x]);
  const bits = [];
  if (notes.length) bits.push('<span class="bal-w">'+notes.join("、")+'，可以换一道清淡的</span>');
  else bits.push('<span class="bal-ok">口味搭配均衡</span>');
  if (share.length) bits.push('<span class="bal-s">共用食材：'+share.map(esc).join("、")+'</span>');
  return '<div class="balance">'+bits.join("")+'</div>';
}
function candidates(course){
  const want = wantTerms();
  const q = state.q.trim().toLowerCase();
  const allowed = new Set();
  state.proteins.forEach(i => PROTEIN_GROUPS[i][1].forEach(p => allowed.add(p)));
  const big = course === "soup" || course === "main";
  const useProtein = (big && allowed.size > 0) || want.length > 0;
  const useCuisine = state.cuisines.size > 0;
  const useOther = state.times.size > 0;
  const setCount = (useCuisine?1:0) + (useProtein?1:0) + (useOther?1:0);
  const nc = nodeCrit(course), nf = nc ? nodeFull(course) : 0, useTemp = course === "dessert" && state.temp !== "either";
  const need = nc ? 0 : Math.min((course === "soup" || course === "main") ? 2 : 1, setCount);
  const out = [], sq = (state.sq || "").trim().toLowerCase(), others = tableOthers(course);
  LIB.forEach((d, idx) => {
    if (d.course !== course) return;
    if (BLACK.has(keyOf(d))) return;
    if (q && !(d.name + " " + d.zh).toLowerCase().includes(q)) return;
    const hh = sq ? ((d.name + " " + d.zh).toLowerCase().includes(sq) ? 2 : (d.ing.join(" ") + " " + d.ing.map(iz).join(" ")).toLowerCase().includes(sq) ? 1 : 0) : 0;
    const ns = nc ? nc.reduce((n, f) => n + (f(d) ? 1 : 0), 0) : 0;
    if (course === "drink" && ((state.caf === "yes" && !d.caf) || (state.caf === "no" && d.caf) || (state.alc === "yes" && !d.alc) || (state.alc === "no" && d.alc))) return;
    const h = hay(d);
    const got = [];
    if (useCuisine && state.cuisines.has(d.cuisine)) got.push("cuisine");
    const ws = want.reduce((n,re) => n + (re.test(h) ? 1 : 0), 0);
    if (useProtein && ((big && allowed.has(d.protein)) || ws > 0)) got.push("protein");
    if (useOther && (state.maxMin ? d.min <= state.maxMin : [...state.times].some(i => d.min >= TIME_RANGES[i][1] && d.min <= TIME_RANGES[i][2]))) got.push("other");
    if (useTemp && d.temp === state.temp) got.push("temp");
    const fresh = state.fresh.has(keyOf(d)) || state.force.has(keyOf(d)), heart = (HEART_SNAP || HEARTS).has(keyOf(d)), recent = RECENT.has(keyOf(d));
    const matched = got.length + Math.min(ns, nf), total = setCount + (useTemp ? 1 : 0) + nf;
    const tier = !total || matched >= total ? 2 : matched > 0 ? 1 : 0, cu = got.includes("cuisine") ? 1 : 0;
    const gk = [d.cuisine, nc ? nc.map(f => f(d) ? 1 : 0).join("") : "", big ? d.protein : "", useTemp ? "" : d.temp || ""];
    const fit = fitScore(d, others);
    out.push({d, idx, got, setCount, ws, fresh, heart, ns, hh, recent, matched, total, tier, cu, gk, fit});
  });
  out.sort((a,b) => b.hh - a.hh || b.tier - a.tier || b.matched - a.matched || b.cu - a.cu || (b.fresh?1:0) - (a.fresh?1:0) || (b.heart?1:0) - (a.heart?1:0) || (a.recent?1:0) - (b.recent?1:0) || b.fit - a.fit || b.ws - a.ws || a.idx - b.idx);
  const same = (a, b) => a.hh === b.hh && a.tier === b.tier && a.matched === b.matched && a.cu === b.cu && !!a.fresh === !!b.fresh && !!a.heart === !!b.heart && !!a.recent === !!b.recent && a.fit === b.fit && a.ws === b.ws;
  const res = [];
  for (let i = 0; i < out.length;) {
    let j = i + 1; while (j < out.length && same(out[i], out[j])) j++;
    const mix = (arr, lv) => { if (lv >= 4 || arr.length < 2) return arr; const G = new Map(); arr.forEach(x => { const g = x.gk[lv]; if (!G.has(g)) G.set(g, []); G.get(g).push(x); });
      const gs = [...G.values()].map(a => mix(a, lv + 1)), o = []; for (let r = 0, any = true; any; r++) { any = false; gs.forEach(a => { if (a[r]) { o.push(a[r]); any = true; } }); } return o; };
    mix(out.slice(i, j), 0).forEach(x => res.push(x));
    i = j;
  }
  return res;
}

function lev(a, b){ const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; let p = Array.from({length:n + 1}, (_, j) => j);

/* ramen-bowl mascot, side view */
function mascotRows(){
  const W = 34, H = 28, g = Array.from({length:H}, () => Array(W).fill("."));
  const p = (x,y,c) => { if (x >= 0 && y >= 0 && x < W && y < H) g[y][x] = c; };
  for (let k = 0; k < 14; k++) { p(28-k,k,"t"); p(29-k,k,"T"); p(31-k,k+1,"t"); p(32-k,k+1,"T"); }
  for (let y = 3; y < 14; y++) for (let x = 5; x < 10; x++) if (!(y === 3 && x < 7)) p(x,y, x === 9 || y === 3 ? "Q" : "X");
  for (let y = 7; y < 15; y++) for (let x = 9; x < 17; x++) { const d = Math.hypot(x + .5 - 13, y + .5 - 11); if (d < 4) p(x,y, d > 3.1 ? "m" : d > 2.2 && d < 2.9 ? "W" : "M"); }
  for (let y = 8; y < 15; y++) for (let x = 18; x < 29; x++) { const d = ((x + .5 - 23.5)/4.6)**2 + ((y + .5 - 11.5)/3)**2; if (d < 1) p(x,y,"W"); if (Math.hypot(x + .5 - 23.5, y + .5 - 11.5) < 1.9) p(x,y,"Y"); }
  for (let y = 11; y < 14; y++) for (let x = 3; x < 31; x++) if (g[y][x] === "." || y === 13) p(x,y, (x + y*2) % 5 === 0 ? "y" : "N");
  [[8,11],[17,10],[18,12],[27,13],[15,13],[4,12],[30,12],[11,13]].forEach(([x,y],i) => p(x,y, i % 2 ? "G" : "L"));
  for (let x = 1; x < 33; x++) p(x,14,"K");
  p(1,15,"K"); p(32,15,"K"); for (let x = 2; x < 32; x++) p(x,15,"H");
  for (let y = 16; y < 27; y++) {
    const hw = 16 - Math.pow((y - 15)/12, 2) * 8, l = Math.round(16.5 - hw), r = Math.round(16.5 + hw) - 1;
    p(l,y,"K"); p(r,y,"K");
    for (let x = l + 1; x < r; x++) p(x,y, x >= r - 3 ? "Z" : x === l + 1 ? "H" : "R");
    if (y === 17) for (let x = l + 2; x < r - 1; x++) if (x % 4 === 0) p(x,y,"W");
  }
  for (let x = 10; x < 24; x++) p(x,27,"K");
  [[12,20],[21,20]].forEach(([x,y]) => { p(x,y,"K"); p(x+1,y,"K"); p(x,y+1,"K"); p(x+1,y+1,"K"); p(x,y+2,"K"); p(x+1,y+2,"K"); p(x,y,"W"); });
  [[9,23],[10,23],[23,23],[24,23]].forEach(([x,y]) => p(x,y,"P"));
  p(15,23,"K"); p(16,24,"K"); p(17,24,"K"); p(18,23,"K"); p(16,23,"P"); p(17,23,"P");
  return g.map(r => r.join(""));
}

(function(){

  try { kick(); } catch(e){}
  const once = () => { kick(); ["pointerdown","keydown","touchstart"].forEach(ev => document.removeEventListener(ev, once, true)); };
  ["pointerdown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, once, true));
})();
cover.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); const r = cover.getBoundingClientRect(); startFromCover(r.width/2, r.height/2); } });
window.addEventListener("pageshow", e => { if (e.persisted) startOver(); });
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 30*60*1000) startOver();
});
document.body.style.overflow = "hidden";
</script>
</body>
</html>
