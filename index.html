<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天吃什么？</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{
  --sky:#8fd0ee; --ink:#3b2314; --soft:#7a5a3c; --paper:#f8e8b8; --paper2:#efd89a; --wood:#a9692b; --wood2:#7e4a1c;
  --seal:#c8452e; --yolk:#f2c94c; --shrimp:#f29aa0; --pea:#8cc152; --taro:#b79ae0; --apricot:#f0a05a; --ice:#7ec8e3;
  --grass:#6bb34f; --grass2:#4f9a3f;
  --disp:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --en:"Pixelify Sans","Courier New",monospace;
  --pxb:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  --pxs:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --bev:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(59,35,20,.16);
  --drop:0 8px 0 0 rgba(59,35,20,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.6;line-break:strict;word-break:normal;overflow-wrap:break-word;
  background:linear-gradient(#7cc8ee 0 25%,#98d6f3 25% 50%,#b7e3f7 50% 75%,#d5f0f9 75%) fixed}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:0}
:focus-visible{outline:4px dashed var(--seal);outline-offset:4px}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:16px 14px 150px}

/* backdrop */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:-200px;top:var(--t);opacity:.95;animation:cloud var(--d) steps(120) var(--l) infinite}
.cloud svg{display:block}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 400px))}}
.star{position:absolute;width:var(--s);height:var(--s);background:var(--c);clip-path:polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%);opacity:0;animation:twinkle var(--d) steps(1) var(--l) infinite}
@keyframes twinkle{0%,100%{opacity:0}40%{opacity:.9}70%{opacity:.35}}

/* masthead */
.mast{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
#mascot svg{display:block}
.brand{font-family:var(--disp);font-weight:900;font-size:21px;line-height:1.1;background:var(--wood);color:#ffeaa3;padding:9px 14px 8px;margin:4px;box-shadow:var(--pxb),inset 0 4px 0 rgba(255,255,255,.22),inset 0 -5px 0 rgba(0,0,0,.2);text-shadow:2px 2px 0 var(--ink)}
.rs{margin:4px 4px 4px auto;font-weight:700;font-size:14px;background:var(--paper);padding:5px 12px;box-shadow:var(--pxb),var(--bev);flex:none}
.rs:active{transform:translateY(4px)}

/* progress */
.ticks{list-style:none;display:flex;align-items:center;margin:0 4px 24px;padding:0}
.tick{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--soft)}
.tick:not(:last-child){flex:1}
.tick:not(:last-child)::after{content:"";flex:1;height:4px;margin:0 6px;background:repeating-linear-gradient(90deg,rgba(59,35,20,.5) 0 4px,transparent 4px 8px)}
.tick .box{width:24px;height:24px;margin:4px;background:var(--paper);box-shadow:var(--pxb);display:grid;place-items:center;flex:none}
.tick.done,.tick.now{color:var(--ink)}
.tick.done .box{background:var(--pea)} .tick.now .box{background:var(--yolk)}

/* type */
.h1{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1.25;margin:0 0 16px;color:#fff3c4;text-shadow:3px 3px 0 var(--ink)}
.h1.pxd{font-size:0;line-height:0;color:transparent;text-shadow:none;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;margin-left:0}
.h2{font-family:var(--disp);font-weight:900;font-size:20px;line-height:1.3;margin:0 0 10px}
.hint{margin:6px 4px 10px;color:var(--soft);font-size:13px}

/* search */
.search{display:flex;align-items:center;gap:10px;background:#fffaf0;margin:4px 4px 22px;padding:2px 12px;box-shadow:var(--pxb),inset 0 4px 0 rgba(59,35,20,.12)}
.search svg{flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:10px 0}
.search:focus-within{outline:4px dashed var(--seal);outline-offset:6px}

/* cuisine tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 16px;margin:0 4px 30px}
.tile{position:relative;text-align:left;font-family:var(--disp);font-weight:900;font-size:21px;line-height:1.2;background:var(--paper);padding:14px 12px 18px;box-shadow:var(--pxb),inset 0 -8px 0 var(--c),inset 0 4px 0 rgba(255,255,255,.5)}
.tile.on{background:var(--c);transform:translateY(4px);box-shadow:var(--pxb),inset 0 4px 0 rgba(0,0,0,.15)}
.tile .ok{position:absolute;top:-12px;right:-10px;width:26px;height:26px;background:var(--seal);box-shadow:var(--pxb);display:none;place-items:center}
.tile.on .ok{display:grid}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:14px 12px;margin:6px 4px 10px}
.pill-btn{font-size:15px;font-weight:700;background:var(--paper);padding:5px 14px;box-shadow:var(--pxb),inset 0 -4px 0 rgba(59,35,20,.14),inset 0 3px 0 rgba(255,255,255,.45)}
.pill-btn b{font-family:var(--disp);font-weight:900;font-size:18px;margin-right:1px}
.pill-btn.on{background:var(--c);transform:translateY(3px);box-shadow:var(--pxb),inset 0 4px 0 rgba(0,0,0,.18)}
.pill-btn.on::before{content:"✓ "}

/* cards */
.card{position:relative;background:var(--paper);margin:18px 4px 30px;padding:24px 16px 14px;box-shadow:var(--pxb),var(--drop),var(--bev)}
.card::before{content:"";position:absolute;left:16px;top:-16px;width:56px;height:16px;background:var(--c,var(--yolk));box-shadow:var(--pxs)}
.txt{width:calc(100% - 8px);margin:4px 4px 10px;font-size:16px;padding:10px 12px;background:#fffaf0;border:0;border-radius:0;box-shadow:var(--pxb),inset 0 4px 0 rgba(59,35,20,.12)}
.txt::placeholder{color:#a68a66}
.sep{height:4px;border:0;margin:18px 0;background:repeating-linear-gradient(90deg,rgba(59,35,20,.3) 0 4px,transparent 4px 8px)}

/* course panels */
.course{background:var(--c);margin:0 4px 34px;padding:14px 8px 16px;box-shadow:var(--pxb),var(--drop),inset 0 4px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.12)}
.ch{display:flex;align-items:center;gap:12px;margin:0 6px 16px}
.ch .ico{width:52px;height:52px;margin:4px;background:var(--paper);box-shadow:var(--pxb);display:grid;place-items:center;flex:none}
.ch h2{font-family:var(--disp);font-weight:900;font-size:24px;line-height:1.2;margin:0;flex:1;text-shadow:2px 2px 0 rgba(255,255,255,.45)}

.dish{position:relative;background:#fff6dc;margin:10px 10px;padding:12px 12px 12px 14px;box-shadow:var(--pxb),inset 0 -4px 0 rgba(59,35,20,.1)}
.dish+.dish{margin-top:22px}
.dish.picked{background:#e6f7cc;box-shadow:var(--pxb),0 -8px 0 0 var(--seal),0 8px 0 0 var(--seal),-8px 0 0 0 var(--seal),8px 0 0 0 var(--seal)}
.flag{position:absolute;top:-24px;left:14px;background:var(--seal);color:#fff;font-size:12.5px;font-weight:700;padding:1px 9px;box-shadow:var(--pxs);text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.dish-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dish-title{min-width:0;flex:1}
.zh{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.3;margin:0}
.en{font-family:var(--en);font-size:15px;line-height:1.3;color:var(--soft);margin:2px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:8px 8px;margin-top:10px}
.t{font-size:12px;font-weight:700;margin:2px;padding:0 8px;background:#fff;line-height:1.55;box-shadow:var(--pxs)}
.t.cui{background:var(--taro)} .t.time{background:var(--yolk)} .t.veg{background:var(--pea)} .t.hot{background:var(--shrimp)} .t.cool{background:var(--ice)}
.tg{font-size:14px;font-weight:700;background:var(--paper);padding:3px 12px;margin:4px;flex:none;white-space:nowrap;box-shadow:var(--pxb),var(--bev)}
.tg.open{background:var(--ink);color:#ffeaa3;box-shadow:var(--pxb)}
.body{margin-top:14px;padding-top:12px;border-top:4px dashed rgba(59,35,20,.25)}
.ings{display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:6px}
.ing{font-size:13px;background:#ecdba8;padding:1px 9px}
.ing.hit{background:var(--yolk);font-weight:700;box-shadow:var(--pxs);margin:2px}
.lg{margin-top:16px}
.lg-t{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:8px}
.lks{display:flex;flex-wrap:wrap;gap:10px 8px}
.lk{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;padding:3px 10px;margin:2px;background:var(--paper);box-shadow:var(--pxs)}
.lk.map{background:var(--ice)} .lk.mine{background:var(--pea)}
.lk:active{transform:translateY(2px)}
.mylink{display:flex;gap:10px;margin-top:14px;align-items:center}
.mylink input{flex:1;min-width:0;font-size:14px;border:0;padding:6px 10px;margin:2px;background:#fffaf0;box-shadow:var(--pxs)}
.mylink button{flex:none;font-size:13px;font-weight:700;background:var(--paper);padding:4px 12px;margin:2px;box-shadow:var(--pxs)}
.pickbtn{display:block;width:calc(100% - 8px);margin:18px 4px 4px;font-family:var(--disp);font-weight:900;font-size:19px;padding:10px;background:var(--seal);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:var(--pxb),inset 0 4px 0 rgba(255,255,255,.3),inset 0 -6px 0 rgba(0,0,0,.25)}
.pickbtn:active{transform:translateY(4px)}
.pickbtn.undo{background:var(--paper);color:var(--ink);text-shadow:none;box-shadow:var(--pxb),var(--bev)}
.more{display:block;width:calc(100% - 20px);margin:20px 10px 0;font-size:14px;font-weight:700;background:rgba(255,255,255,.45);padding:8px;box-shadow:var(--pxs)}
.empty{background:#fff6dc;margin:10px;padding:16px;text-align:center;font-weight:700;box-shadow:var(--pxs)}

/* order slip */
.slip{position:relative;background:var(--paper);margin:8px 4px 44px;padding:18px 14px 8px;box-shadow:var(--pxb),var(--drop),inset 0 4px 0 rgba(255,255,255,.5)}
.slip::after{content:"";position:absolute;left:-4px;right:-4px;top:100%;height:16px;margin-top:4px;
  background:linear-gradient(135deg,var(--paper) 8px,transparent 0) 0 0/16px 16px,linear-gradient(225deg,var(--paper) 8px,transparent 0) 0 0/16px 16px;filter:drop-shadow(0 4px 0 var(--ink))}
.slip-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.slip-k{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--soft)}
.slip-title{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1.25;margin:2px 0 10px;color:var(--ink)}
.slip-title::after{display:none}
.seal{flex:none;width:86px;height:86px;margin:8px 8px 0 0;background:rgba(200,69,46,.1);color:var(--seal);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:21px;line-height:1.1;text-align:center;transform:rotate(-8deg);box-shadow:0 -4px 0 0 var(--seal),0 4px 0 0 var(--seal),-4px 0 0 0 var(--seal),4px 0 0 0 var(--seal),inset 0 0 0 4px var(--paper),inset 0 0 0 6px var(--seal)}
.seal.slam{animation:slam .5s steps(6) .2s both}
@keyframes slam{0%{transform:rotate(-8deg) scale(2.6);opacity:0}50%{opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.srow{display:flex;gap:12px;padding:16px 0;border-top:4px dashed rgba(59,35,20,.25)}
.cb{flex:none;width:28px;height:28px;margin:6px 4px 0 4px;background:var(--c);box-shadow:var(--pxb);display:grid;place-items:center}
.srow-main{flex:1;min-width:0}
.ckind{display:inline-block;font-size:12.5px;font-weight:700;background:var(--c);padding:0 8px;margin:3px 3px 8px;box-shadow:var(--pxs)}
.srow .zh{font-size:22px}
.skipped{color:var(--soft);font-weight:700}
.modes{display:flex;gap:12px;margin-top:14px}
.mode{font-size:14px;font-weight:700;background:var(--paper);padding:3px 14px;margin:4px;box-shadow:var(--pxb),var(--bev)}
.mode.on{background:var(--ink);color:#ffeaa3;box-shadow:var(--pxb)}
.slip-foot{border-top:4px dashed rgba(59,35,20,.25);padding:14px 0 12px}
.final-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.final-actions .big{grid-column:1/-1}

/* buttons */
.btn{font-family:var(--disp);font-weight:900;font-size:18px;line-height:1.2;padding:12px 16px;margin:4px;background:var(--seal);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:var(--pxb),inset 0 4px 0 rgba(255,255,255,.3),inset 0 -6px 0 rgba(0,0,0,.25);flex:1;white-space:nowrap}
.btn:active{transform:translateY(4px)}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none;flex:0 0 auto;box-shadow:var(--pxb),var(--bev)}
.btn.alt{background:var(--yolk);color:var(--ink);text-shadow:none;box-shadow:var(--pxb),var(--bev)}
.btn.plain{background:var(--paper);color:var(--ink);text-shadow:none;font-size:16px;box-shadow:var(--pxb),var(--bev)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:22px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(var(--grass2) 0 4px,var(--grass) 4px 12px,var(--wood) 12px 16px,#9a5e24 16px)}
.nav-in{max-width:620px;margin:0 auto;display:flex;gap:12px}

details.add{margin:6px 4px 0}
details.add summary{cursor:pointer;font-weight:700;list-style:none;text-align:center;background:var(--paper);padding:12px;box-shadow:var(--pxb),var(--bev)}
details.add[open] summary{margin-bottom:16px}
form.add{display:grid;gap:12px;background:var(--paper);padding:16px;box-shadow:var(--pxb),var(--drop)}
form.add input,form.add select{font-size:15px;border:0;border-radius:0;padding:9px 11px;background:#fffaf0;width:calc(100% - 4px);margin:2px;box-shadow:var(--pxs)}
form.add .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add .btn{flex:none;font-size:17px}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#ffeaa3;padding:8px 18px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s steps(3);pointer-events:none;z-index:6;box-shadow:0 0 0 4px var(--paper)}
.toast.show{opacity:1}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}

/* motion (stepped, like sprite frames) */
#app.enter>*{animation:rise .3s steps(6) both}
#app.back>*{animation-name:riseBack}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(n+6){animation-delay:.2s}
#app.enter .tile{animation:tilePop .28s steps(4) both}
#app.enter .tile:nth-child(2){animation-delay:.03s}#app.enter .tile:nth-child(3){animation-delay:.06s}#app.enter .tile:nth-child(4){animation-delay:.09s}#app.enter .tile:nth-child(5){animation-delay:.12s}#app.enter .tile:nth-child(6){animation-delay:.15s}#app.enter .tile:nth-child(n+7){animation-delay:.18s}
#app.enter .srow{animation:rise .3s steps(6) both}
#app.enter .srow:nth-of-type(2){animation-delay:.1s}#app.enter .srow:nth-of-type(3){animation-delay:.18s}#app.enter .srow:nth-of-type(4){animation-delay:.26s}#app.enter .srow:nth-of-type(5){animation-delay:.34s}
#app.enter .cb svg{animation:tick .3s steps(3) .3s both}
@keyframes rise{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes riseBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes tilePop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.pop{animation:pop .24s steps(4)}
@keyframes pop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.tile.pop .ok{animation:tick .24s steps(3)}
.dish.opening .body{animation:grow .22s steps(4);transform-origin:top}
@keyframes grow{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dish.snap{animation:snap .3s steps(4)}
.dish.snap .flag{animation:flag .3s steps(4)}
@keyframes snap{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:none}}
@keyframes flag{from{opacity:0;transform:scale(2)}to{opacity:1;transform:none}}
.course.swap .dish{animation:tilePop .26s steps(4) both}
.course.swap .dish:nth-of-type(2){animation-delay:.05s}.course.swap .dish:nth-of-type(3){animation-delay:.1s}
.tick.now .box{animation:pop .3s steps(4)}
.spark{position:fixed;width:var(--s);height:var(--s);background:var(--c);pointer-events:none;z-index:200;animation:sparkOut .6s steps(6) forwards}
@keyframes sparkOut{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

/* cover */
#cover{position:fixed;inset:0;z-index:100;background:linear-gradient(#7cc8ee 0 22%,#98d6f3 22% 44%,#b7e3f7 44% 66%,#d5f0f9 66%);cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:transform .5s steps(8);-webkit-tap-highlight-color:transparent}
#cover.leaving{transform:translateY(-102%);pointer-events:none}
#cover.leaving .cv-tap{transform:translateY(4px);box-shadow:var(--pxb)}
#cover.gone{display:none}
#cvClouds,#cvStars{position:absolute;inset:0;pointer-events:none}
.cv-grass{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(var(--grass2) 0 8px,var(--grass) 8px 52%,#a8743a 52% 56%,#8b5a2b 56%)}
.cv-grass::before,.cv-grass::after{content:"";position:absolute;left:0;right:0;height:8px}
.cv-grass::before{top:-8px;background:repeating-linear-gradient(90deg,var(--grass2) 0 8px,transparent 8px 40px)}
.cv-grass::after{top:-16px;background:repeating-linear-gradient(90deg,transparent 0 16px,var(--grass2) 16px 24px,transparent 24px 72px)}
.cv-flower{position:absolute}
.cv-flower.swap{animation:flSwap .35s steps(4) both;animation-delay:calc(var(--i) * .06s)!important}
@keyframes flSwap{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cv-center{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-6vh;padding:0 16px}
.cv-sign{position:relative;background:var(--wood);padding:16px 14px 12px;margin:4px;box-shadow:var(--pxb),inset 0 4px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.25),0 10px 0 0 rgba(59,35,20,.3)}
.cv-sign::before,.cv-sign::after{content:"";position:absolute;top:-100vh;height:100vh;width:4px;background:#6b4a2a;box-shadow:0 0 0 0 #000}
.cv-sign::before{left:18%}.cv-sign::after{right:18%}
.cv-nail{position:absolute;top:6px;width:6px;height:6px;background:var(--ink)}
.cv-nail.l{left:8px}.cv-nail.r{right:8px}
.cv-title{display:flex;justify-content:center;margin:0;line-height:0}
.pxc{display:block;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated}
.cv-bowl>svg{display:block}
.cv-steam{position:absolute;left:0;top:-36px}
.cv-steam.b{visibility:hidden}
.cv-item{position:absolute}
.cv-item.a{left:0;bottom:0}.cv-item.b{right:0;bottom:0}.cv-item.c{left:8%;top:0}.cv-item.d{right:6%;top:12px}
.cv-tap{margin:30px 0 0;font-weight:900;font-size:17px;background:var(--paper);padding:7px 22px;box-shadow:var(--pxb),var(--bev)}
#cover.play .cv-sign{animation:signDrop .9s steps(10) .6s both}
#cover.play .pxc{animation:charIn .36s steps(3) both;animation-delay:calc(1.5s + var(--i) * .14s)}
#cover.play .cv-bowl{animation:drop .7s steps(8) 2.5s both,tapHop .9s steps(1) 4s infinite}
#cover.play .cv-steam.a{animation:steamA 1.2s steps(1) 3.3s infinite}
#cover.play .cv-steam.b{animation:steamB 1.2s steps(1) 3.3s infinite}

    </details>

    const nm = (d.name + " " + d.zh + " " + d.ing.join(" ")).toLowerCase();
    const has = re => re.test(nm);
    const hot = d.temp === "hot";
    const vessel =
      has(/baijiu|白酒|limoncello|柠檬甜酒/) ? "shot" :
      has(/beer|啤酒|somaek|烧啤|michelada|米切拉达/) ? "beer" :

const HTC = [{"t":"乡村啤酒鸭","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸭肉","啤酒","青椒","红椒","大蒜","生姜","小米椒","蒜苗","大葱","草果"],"tp":"","d":4,"k":1324,"i":"鸭肉与啤酒同炖，汤汁浓郁，肉质鲜香软烂，还带有一股淡淡的啤酒清香，是一道风味独特的家常菜。鸭肉本身滋补，富含蛋白质、B 族维生素和多种矿物质，搭配啤酒炖煮后更易入味。这道菜步骤虽稍多，但操作并不复杂，一般初学者只需 大约 1 小时即可完成。","q":["鸭肉（半只,1 kg,让市场老板剁成小块）","啤酒 1000 ml （可以买 500 ml 的罐装啤酒两瓶）","大蒜 4 颗 ,拍散备用","生姜 3 厘米长，拍散备用","小米辣 3 颗，切两段即可(不吃辣的可以不用","蒜苗 2 根 切段备用","大葱 2 根 1 根切段,1 根备用"],"s":["鸭肉清洗一遍放进锅中。","加清水淹没鸭肉。","加 20 ml 料酒。","加备用的 1 根 大葱。","加生姜 ,拍散的 2 厘米。","开火烧滚。","捞出浮沫。","鸭肉捞出，清水洗干净备用。"],"x":["青椒 2 条，红椒 1 条 （ 长度 10 厘米到 15 厘米 之间都可以）（切段 或者切片都可以， 2 厘米一段）","操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水或者加啤酒。","厨师长：用土灶烧“乡村啤酒鸭”，味道安逸得不摆了。"]},{"t":"农家一碗香","c":"main","cu":"Chinese","m":17,"p":"pork","ing":["猪肉","青椒","蒜片","豆瓣酱","酱油","小米椒","白糖","姜片"],"tp":"","d":3,"k":1638,"i":"这是一道咸香下饭的湖南家常小炒，五花肉的油润、鸡蛋的嫩滑与青椒的清香彼此融合，口感层次丰富。猪肉与鸡蛋提供优质蛋白质，搭配青椒补充维生素 C，营养均衡。中等难度，需要注意煸炒火候和调味顺序，新手稍加练习也能做好。预计备菜 7 分钟，烹饪 10 分钟，总共约 17 分钟就能出锅。","q":["猪肉 250g","青椒 3 个","蒜片 2 片","豆瓣酱 10g","小米椒 1 个","白糖 5g","酱油 15ml","姜 2 片"],"s":["备菜阶段：将猪肉切片，最好把肥瘦分开放。同时要把青椒和小米辣切成段，蒜片用刀背拍成末，姜切成丝。鸡蛋打到小碗中，用筷子打散。","备好菜，就可正式煮菜了。先将油倒入锅中，锅中开小火，油热后将蛋液倒入锅中，将鸡蛋炒散，炒至断生即可，放回小碗中备用。","将锅中继续加一点油，开小火，锅热后将之前切的肥猪肉倒入锅中逼出猪油。","肥肉出现金黄色的时候，加大火力到中火，将瘦肉一起放入锅中翻炒。","瘦肉全部炒至变色的时候加入备好的姜丝、蒜末和豆瓣酱翻炒均匀给猪肉上色。","放入青红椒、炒至断生的鸡蛋后加入酱油和白糖，继续将它们翻炒到青椒微微断生，保持青椒清脆口感。","出锅上菜！"],"x":["如果第一次炒鸡蛋的时候放的油太多，炒猪肉的时候可以视情况不加油。","参考资料下厨房。"]},{"t":"冬瓜桑拿鸡","c":"main","cu":"Chinese","m":35,"p":"chicken","ing":["鸡肉","姜丝","生抽","蚝油","盐","食用油","冬瓜","虫草花"],"tp":"","d":2,"k":680,"i":"冬瓜桑拿鸡是一道清爽的蒸菜，冬瓜垫底吸饱鸡汁，虫草花提鲜，鸡肉嫩滑，上汽一蒸即成。热量低、蛋白足，做法简单，从备菜到出锅大约需要 35 分钟，适合日常家常制作。","q":["鸡肉 400 g（切块）","冬瓜 300 g（切薄片）","虫草花 30 g（提前冲洗泡软）","姜丝 10 g","生抽 15 ml","蚝油 10 g","盐 3 g","食用油 10 ml"],"s":["鸡切块，加姜丝、生抽、蚝油、盐、食用油，揉搓均匀后腌制 20 分钟。","冬瓜切薄片铺在盘子底部。","再铺一层泡好的虫草花。","把腌好的鸡肉铺在虫草花上面。","水烧开后放入蒸锅，上汽后蒸 15 分钟，出锅即可。"],"x":["冬瓜切薄片铺底更容易蒸熟入味，垫在底下还能吸满鸡汤的鲜味。","虫草花提前冲洗泡软，铺在冬瓜和鸡肉之间，让鲜味上下渗透。"]},{"t":"冬瓜酿肉","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["冬瓜","猪肉末","鸡蛋","葱","葱姜末","胡椒粉","生抽","淀粉"],"tp":"","d":4,"k":578,"i":"冬瓜酿肉是一道荤素搭配的家常蒸菜，口感鲜嫩爽滑，肉馅的咸香与冬瓜的清甜相互融合，清爽不腻。猪肉末提供优质蛋白质和必需氨基酸，冬瓜则有助于清热利尿、补充水分。做法简单，即使是新手也能轻松上手，只需稍加练习卷肉技巧即可。从备料到出锅，大约需要 30 分钟。","q":["猪肉末 300g","鸡蛋 1 个（可选,不习惯的人可能会有点腥）","冬瓜 200g","葱花（一根,约 20g）","胡椒粉 5g","生抽 10ml","淀粉 5g","水淀粉 25g（淀粉 25g,水 50ml）","葱姜末（姜 3-4 片约 30g, 取上面一根葱花中的葱白部分即可）","盐 20g"],"s":["冬瓜去皮，切成 25cm 长 3cm 厚的片。","将切好的冬瓜放入碗中，放入 15g 盐，将冬瓜抹匀，放置 10 分钟。","放置冬瓜的同时，换个碗放入肉末，葱姜末， 5g 盐，淀粉 5g，胡椒粉，生抽，胡椒粉。","使用筷子在肉末中进行顺时针搅拌，搅拌到食材颜色没有明显对比（约 2 分钟）","将腌制好的冬瓜（会变软）使用清水洗三遍。","拿出 1 片冬瓜片卷起来，并把肉塞进去。","放入碟子中摆到碟子的边缘。","打入 1 个鸡蛋到中间圆圈处。","放入普通铁锅中水烧开后，蒸 15 分钟，盖上锅盖。","开盖，取出蒸好的冬瓜酿肉。","将冬瓜酿肉碟子的水倒入锅中，放入水淀粉，加入 50ml 清水倒入锅中烧开。","淋到冬瓜酿肉上。"],"x":["操作时，拿出冬瓜酿肉时注意碟子很烫，小心操作。","参考资料：b站视频。"]},{"t":"冷吃兔","c":"main","cu":"Chinese","m":56,"p":"fish","ing":["兔肉","盐","味精","蚝油","料酒","蒜","姜","小葱/大葱/洋葱","干辣椒","青花椒"],"tp":"","d":4,"k":590,"i":"这是一道经典的四川自贡盐帮菜，麻辣干香，兔肉紧实有嚼劲，入口先辣后鲜，回味悠长。兔肉高蛋白低脂肪，富含卵磷脂和多种氨基酸，营养丰富且易于消化。制作过程需处理多种香料并严格控制火候，对新手有一定挑战。从备料到炒制完成约需 1.5 小时，但放置一夜后风味更佳，值得提前准备。","q":["盐量 每斤兔肉 2 克","味精量 每斤兔肉 1 克","蚝油量 每斤兔肉 5 克","料酒量 每斤兔肉 10 克","油量 每斤兔肉 0.9 ～ 1 升","蒜量 每斤兔肉 二分之一头蒜","姜量 蒜量","小葱/大葱/洋葱总量 每斤兔肉 15 克","干辣椒量 辣椒段的总体积等于兔肉的总体积","青花椒量 3 斤兔肉对应吃饭用的小碗，一整碗花椒","八角量 每斤兔肉 1 粒","桂皮量 每斤兔肉 大拇指长短的一块","香叶量 每斤兔肉 5 片","山奈量 每斤兔肉 黄豆大小的一块","白蔻量 每斤兔肉 2 颗","小茴香量 每斤兔肉 15 克","白芝麻量 每斤兔肉 25 克"],"s":["蒜、姜扒皮并剁碎备用，八角、桂皮、香叶、山奈、白蔻、小茴香洗净备用。","干辣椒剪成 2 厘米的小段，洗净备用。","小葱/大葱/洋葱洗净，洋葱切成小块。","兔肉剁成 2 厘米的小块，加入盐、料酒、味精调味，腌制 15 分钟。","锅中倒油，油温 4 成热下小葱/大葱/洋葱，中小火煸炒出香味，待到小葱/大葱/洋葱微焦，将其捞出。","开大火升高油温，油温 8 成热时下入兔肉，炸制过程转中小火，炸至兔肉微微焦黄时捞出兔肉。","升高油温，倒入干辣椒、青花椒、八角、桂皮、香叶、山奈、白蔻、小茴香；转小火将辣椒段炸脆。","重新倒入兔肉，加入蚝油、翻炒几分钟。","关火，加入蒜、姜、白芝麻，翻炒均匀。","放置一夜更加入味。"],"x":["在操作的第 6 步骤中要注意：油量应该淹没兔肉，若未淹没需要及时补充。","在操作的第 7 步骤中要注意：辣椒极容易炸糊，炸糊会变成黑色，这个过程非常快，所以一定要小火，基本等到没太多水气蒸发时，就可以下兔肉了。"]},{"t":"凉拌鸡丝","c":"main","cu":"Chinese","m":30,"p":"chicken","ing":["鸡胸肉","麻油","生抽","香醋","白糖","盐","料酒","姜","凉白开水"],"tp":"","d":3,"k":293,"i":"一道少油低卡的家常凉菜，鸡丝嫩滑入味，麻油与香醋调和出微麻微酸的清爽口感，适合夏日解腻。鸡胸肉富含优质蛋白且脂肪含量低。做法简单，新手也能轻松上手，从备料到完成大约只需 30 分钟。","q":["鸡胸肉 200 克","麻油 5 毫升","生抽 4 毫升","香醋 4 毫升","白糖 3 克","盐 2 克","姜 20 克"],"s":["姜切片，备用。","锅中倒入 4 升水。","加入鸡胸肉、姜片。","倒入 20 毫升料酒。","开大火不盖盖将水烧开。","水开后转中火，用勺子将浮沫捞出。","继续煮 5-7 分钟，如果是非冷冻肉煮 5 分钟，冷冻肉煮 7 分钟。","鸡胸肉大小会影响成熟时间，用筷子插入鸡胸肉，如果能轻松插入，代表鸡肉熟了。如果不熟需延长煮制时间。","用凉白开水冲泡鸡胸肉，使鸡胸肉降至室温。","顺着鸡胸肉纹理将鸡胸肉撕成细丝。","准备一个碗。","碗中加入准备好的麻油、生抽、香醋、白糖、盐。","搅拌料汁，使糖和盐尽量溶化。","将料汁倒入鸡丝中，搅拌均匀。"],"x":["这道菜是隔离期间用现有材料做的，有条件可以加入香菜、小葱等进行调味，喜欢吃辣的可以加入辣椒油。"]},{"t":"卤菜","c":"main","cu":"Chinese","m":44,"p":"beef","ing":["卤料包","黄豆酱","豆瓣酱","蚝油","南腐乳","洋葱","生姜","大蒜","干辣椒","生抽"],"tp":"","d":3,"k":467,"i":"这是一道经典中式卤味，肉质鲜嫩入味，香气浓郁，卤汁可反复使用、越陈越香，适合做凉菜、下酒或搭配主食。菜品富含优质蛋白和多种维生素，营养均衡。制作需要一点耐心，但步骤清晰，对新手比较友好。提前浸泡去血水、熬糖色和高压卤制约需 1 小时，再浸泡过夜让风味充分渗入，第二天取出切片即可享","q":["卤料包 1 包（约 10g）","黄豆酱 15ml","豆瓣酱 15ml","蚝油 15ml","南腐乳 15ml","洋葱 半个（约 100g）","生姜 30g","大蒜 40g","干辣椒 10g","生抽 120ml","老抽 60ml","盐 10-15g","白糖 30g（用于熬糖色）","啤酒 1 罐(330ml)","牛腱子 500g","清水 足量（需要没过所有肉类）"],"s":["建议在此之前查看炒糖色教程。","牛腱子提前浸泡在冷水中 3 小时以上，去除血水。","准备糖色：锅中加入 30g 白糖，小火加热至糖完全融化并呈现棕褐色，加入 150ml 热水，搅拌均匀备用。","将洋葱切块，生姜和大蒜拍碎，干辣椒掰断备用。","在锅中加入足量的水，放入卤料包、洋葱、生姜、大蒜、干辣椒，大火烧开。","加入黄豆酱、豆瓣酱、蚝油和南腐乳各 15ml，搅拌均匀。","倒入准备好的糖色，混合均匀。","加入生抽 120ml 和老抽 60ml，搅拌均匀。","加入 10-15g 盐调味。","倒入 1 罐啤酒(330ml)，再次烧开。"],"x":["卤水可另取一部分做牛肉面，作为白水面条的汤底，再加上自己喜欢的蔬菜，味道极佳。"]},{"t":"口水鸡","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["半只鸡","辣椒粉","花椒","花生","葱姜蒜","花椒","白糖","生抽","醋","味精"],"tp":"","d":3,"k":1392,"i":"口水鸡是一道经典的四川凉菜，红油包裹的鸡肉冰爽 Q 弹、麻辣鲜香，夏季食用开胃解腻。鸡肉富含优质蛋白，搭配花生碎和香料，提供能量与风味。制作难度中等，需注意煮鸡火候和红油调味，适合有一定下厨经验的烹饪者。从备料、煮鸡、冷却到淋汁完成，预计耗时约 1.5 小时。","q":["食用油 20ml","鸡 半只(500g)","辣椒粉 20g","花椒 30 颗(20g)","花生 10 颗(30g)","小葱 2 颗(50g)","姜 1 小块(20g)","蒜 2 个 (10g)","白糖 5g","生抽 5ml","醋 5ml","味精 5g","花椒粉 5g","香菜 5g"],"s":["姜切片，1 颗小葱，15 颗花椒备用。","鸡肉洗干净，放入锅中，清水没过鸡肉，放入姜片、小葱和花椒，开大火烧开。","大火烧开后，转中小火 20 分钟关火。","取出鸡肉，放入冰水中，直至冰凉。","取出鸡肉，切块摆盘子中，备用。","小火把锅烧热，导入花生，烘烤至表皮爆裂。（注意随时翻动，不要糊了）","一颗葱切成段，蒜拍成末，花椒 15 颗，花生去皮切碎。","锅内导入油烧热后，放入葱段，花椒和一半蒜末，炒香。","炒至油温 8 成热，关火，滤出热油。","将热油倒入放辣椒粉的碗中，搅拌，并滤出红油。","红油中放入剩余蒜末、生抽、醋、盐、味精、糖、香油、花椒粉。拌匀放凉。","在鸡肉上撒上花生碎，把红油淋到切好的鸡肉上，撒上香菜。成盘。"],"x":["口水鸡第二种做法待更。"]},{"t":"可乐鸡翅","c":"main","cu":"Chinese","m":40,"p":"chicken","ing":["鸡翅中","可乐","白糖","生抽","盐","生姜","料酒或啤酒","小葱"],"tp":"","d":3,"k":960,"i":"可乐鸡翅色泽红亮、口感嫩滑，味道咸甜适口，是一道流行于家庭餐桌的创意菜肴。鸡翅富含优质蛋白质与脂肪，搭配可乐烹煮后肉质更为软烂。制作过程需要掌握煎制与收汁的火候，对新手有一定挑战，但跟随步骤仍可成功。从备料到完成大约耗时 40 分钟。","q":["鸡翅 10 ～ 12 只","可乐 500ml","白糖 10 克","生抽 15 克","老抽 3 克","盐 2 克","生姜 2 片","料酒 20 毫升"],"s":["鸡翅入锅，倒入冷水淹没。放生姜 1 片和料酒 10 ～ 20 毫升。大火煮开（ 大约 2 分钟 ）后，撇去浮沫，沥出水分。","这一步针对冰鲜鸡翅，刚买来的鸡翅直接改刀用生抽进行腌制即可。","捞出鸡翅，可用刀将两边各划上两口改刀。生抽约 10 克腌制鸡翅 10 分钟（生抽能完全包裹鸡翅表面入味就行）","锅重新小火起油，先将剩余姜片爆香，然后下入腌好的鸡翅。将鸡翅煎至金黄翻面（直到两面金黄），用炒菜勺子翻动一下鸡翅，与姜片一起翻炒 4～5 下（目的是防止鸡翅和姜片粘黏）。","鸡翅金黄，倒入可乐没过鸡翅，开大火将锅中可乐煮沸，然后撇去漂浮的黑色浮沫（包含血水）。此时加入葱结。","调味：加入食用盐 2 克，白糖 10 克，生抽 3 克调味（可以适当用老抽调底色，3 克）。","等到葱结变黄，和姜片一起捞出，转中火继续慢煮可乐鸡翅。","等到可乐呈现挂丝状态，关小火让汁牢牢挂在鸡翅上。出锅，装盘。"],"x":["加入生姜爆香的同时能防止鸡翅粘锅。","最后收汁时勿开过大火，防止味道偏苦。","本菜品偏甜。"]},{"t":"台式卤肉饭","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["红葱头","带皮五花肉","鸡蛋","食用油","生抽酱油","米酒","大蒜","香叶","八角","冰糖"],"tp":"","d":3,"k":1495,"i":"台式卤肉饭是一道浓香四溢的台湾家常料理，肉条软糯入味，酱汁琥珀般油亮，浇在热米饭上满口脂香。富含优质蛋白、胶原蛋白和碳水，能快速补充能量。做法对新手非常友好，只需备好食材、掌握火候，全程约 1.5 小时即可完成，其中动手操作仅需半小时，剩下的交给小火慢炖。","q":["红葱头 25 g","带皮五花肉 500g","鸡蛋 4 个（可任意修改鸡蛋个数）","食用油 15 ml","生抽酱油 75 ml","米酒 10 + 25 ml","大蒜 25 g","香叶 2 片","八角 1 颗","冰糖 20 g","白胡椒粉 6 g","五香粉 6 g","米饭 （根据个人食量决定）"],"s":["带皮五花肉切成 0.7cm（长）× 0.7cm（宽） × 2.5cm（高） 的细长条。","红葱头、大蒜切末备用。","鸡蛋煮熟剥壳，并用刀划破蛋白（便于入味），备用。","大火热锅，锅内放入 15 ml 食用油，让油滑满锅底即可。","放油的目的是防止五花肉刚下锅时粘锅。等待 5s 使油温稍微升高。","放入五花肉条，翻炒至肉色稍微变白，沿锅边淋入米酒 10ml 。继续翻炒至五花肉不再出油。","将切好的红葱头加入锅中，翻炒 1 分钟爆出油葱香味。","将切好的红葱头加入锅中，翻炒 30 秒。","把猪肉推到旁边，放入冰糖加热到融化冒泡变成焦糖，再把猪肉一起翻拌，让焦糖均匀附着。","加入生抽炒出香气。","呛入米酒 25 ml ，水加到淹过猪肉，加入白胡椒粉、五香粉、八角、香叶、水煮蛋，沸腾后转小火卤 1 小时。","注意: 不同酱油的咸淡不一，卤的时候务必试味道，太甜加酱油，太咸加点糖或水调整。","小火炖煮过程中，每隔 15 分钟 搅拌检查一次，防止粘锅。","如发现过干，则可加入 100ml 清水继续炖煮。","1 小时后，开大火收汁直到酱汁浓稠，呈现有光泽的琥珀色，即完成。","炖煮结束后，乘一碗米饭，将软烂的卤肉浇在米饭上，并加上卤蛋，开始享用。"],"x":["对于五花肉切条步骤，定义：五花肉带皮面向上摆在桌上，此时肉皮所在平面为长宽形成的平面，垂直此平面的为高。肉条最终效果是肥瘦相间的细长条。（注意：此处肉条一定要细，即长宽较小。细肉条更易于炖煮软糯）。","若五花肉是未冷冻的，可以放入冰箱冷冻室 30 分钟 再取出切条。","若是冷冻五花肉，可以在常温下放置 30 分钟 后再切条。"]},{"t":"咕噜肉","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["梅头猪肉","青椒","罐头菠萝片","盐","茄汁","白醋","蒜蓉","生抽","生粉","白砂糖"],"tp":"","d":4,"k":673,"i":"咕噜肉是一道经典粤式家常菜，酸甜开胃、外酥里嫩，菠萝的果香让肉块吃起来格外清爽解腻。猪肉提供优质蛋白质，青椒和菠萝则补充维生素与膳食纤维。这道菜的难点在于掌握炸肉的火候，对新手略有挑战，但只要按步骤操作便能成功。从腌制到出锅，全程大约需要 40 分钟，很适合为家人做一道下饭快菜。","q":["1 汤匙 15ml","1 茶匙 5ml","梅头猪肉 100g","青椒 25g","罐头菠萝片 75g","盐 1/4 茶匙","茄汁 4 汤匙","白醋 2 茶匙","蒜蓉 1 汤匙","生抽 1/2 茶匙","生粉 2 1/2 茶匙","白砂糖 2 汤匙","水 200 毫升"],"s":["将梅头猪肉（100 克）洗净，然后用厨房纸抹干水份，将猪肉切成比想要的成品小一圈的大小。","用盐（1/2 茶匙）腌制梅头猪肉 20 分钟。","将青椒（25 克）切碎。","将菠萝片（75 克）切件。","在碗中加入茄汁（4 汤匙）﹑白醋（2 茶匙）﹑蒜蓉（1 汤匙）﹑生抽（½ 茶匙）﹑生粉（2½ 茶匙）﹑白砂糖（2 汤匙）﹑盐（¼ 茶匙）和水（200 毫升），拌匀成酱汁。","将梅头猪肉粒沾上生粉（6 汤匙）。","加入油（500 毫升）中火加热。","将梅头猪肉粒放至锅里中火炸 5 分钟，然后盛起。","加入梅头猪肉粒，再大火翻炸 1 分钟。","加入油（1 茶匙）和酱汁，中火加热 3 分钟。","加入青椒和菠萝，大火加热 2 分钟。","将已炸好的梅头猪肉粒与酱汁拌匀即可。"],"x":["想让肉更有层次可以在生粉中加鸡蛋，炸出来会更香脆。"]},{"t":"咖喱肥牛","c":"main","cu":"Chinese","m":40,"p":"beef","ing":["香叶","纯牛奶","洋葱","胡萝卜","土豆","肥牛卷","咖喱块"],"tp":"","d":4,"k":1821,"i":"咖喱肥牛是一道浓郁下饭的家常菜，咖喱的辛香与肥牛的脂香融合，搭配土豆、胡萝卜等蔬菜，口感绵软醇厚。富含蛋白质、维生素和钙质，荤素搭配均衡。做法简单，对新手友好，一般只需 40 分钟就能端上餐桌，很适合作为便当菜。","q":["香叶 1 片","纯牛奶 50ml","洋葱 100g","胡萝卜 150g","土豆 200g （挺饱腹的，酌情添加）","肥牛卷 300g （喜欢吃肉就多来点）","咖喱块 2 块 （大约 100g）"],"s":["洋葱切成条状、胡萝卜以及土豆切成块状，备用。","烧一锅开水，水沸时将肥牛卷下锅，捞出血沫后放在一边沥水，备用。","热锅，锅内放入 10ml - 15ml 食用油，等待 10 秒让油温升高。","放入洋葱，翻炒至洋葱变软变透明。","放入土豆以及胡萝卜翻炒 2 分钟。","加入冷水至淹没所有食材即可。","将香叶、咖喱块投入锅中，盖上锅盖，待水沸腾后将火调小然后等待直至土豆块以及胡萝卜块炖至软烂（可用筷子确认）","加入肥牛卷以及牛奶，盖上锅盖再小火煮 2-3 分钟即可出锅（用勺子搅拌食材，注意力度，避免肥牛卷破碎）"],"x":["咖喱块不用捣碎，直接整块投入即可。","操作时，需要注意搅拌食材，避免食材调味料不均匀。"]},{"t":"商芝肉","c":"main","cu":"Chinese","m":68,"p":"pork","ing":["带皮猪五花肉","商芝","葱","姜","八角","蜂蜜","醋","料酒","味精","酱油"],"tp":"","d":5,"k":1621,"i":"商芝肉是陕西商县的传统风味菜，色泽红润，质地软嫩，肥而不腻，带有商芝独特的清香。猪肉提供优质蛋白和脂肪，蕨类蔬菜商芝则增添了膳食纤维和多种微量元素。这道菜工序繁琐，对刀工和火候均有要求，适合有一定烹饪基础的人挑战。从备料到成菜，全程大约需要 2.5 小时。","q":["带皮猪五花肉: 500 克","商芝: 50 克","葱: 10 克","姜: 2 克","八角: 3 个","蜂蜜: 15 克","醋: 5 克","料酒: 15 克","味精: 1.5 克","酱油: 10 克","摊鸡蛋皮:一张约 15 克","精盐: 1 克","鸡汤: 200 克","芝麻油: 10 克","熟猪油: 2000 克（消耗约 60 克）"],"s":["将肉刮洗干净，入煮锅煮至六成熟（变色为白），捞出趁热用蜂蜜、醋涂抹肉皮。","炒锅内放入熟猪油，用旺火烧至八成熟（约 200 度，油表有大量青烟，油状平静），将肉块皮朝下投入，炸至呈金红色时，捞入凉肉煮锅（之前煮完的煮锅）中泡软，放在案板上，切成三寸(10 cm)长、两分(0.6 cm)厚的片，仍然皮朝下，整齐装入蒸碗内。","将 5 克大葱切成 2.4 cm 长的段，5 克切成 2.4 cm 长的斜形片。姜去皮洗净，1.5 克切成片，5 克切成末，摊的鸡蛋皮切成 2.4 cm 长的等腰三角形片。","商芝入沸水锅中煮软捞出，去除老茎、杂质，淘洗干净，切成 3 cm 长的段，放入碗中,加酱油（5 克）、精盐（1 克）、熟猪油（10 克）拌匀，盖在肉片上，另将鸡汤（100 克）放入一小碗中，加酱油（5 克）、精盐（0.5 克）、料酒（15 克）搅匀，浇入蒸碗，再放入姜片、葱段、八角上笼用旺火蒸约半小时后，转用小火继续蒸约一小时三十分钟，熟烂后取出，拣去姜、葱、八角，倒、过滤原汁，将肉扣入汤盘。","炒锅内，放入鸡汤（100 克），加入原汁，用旺火烧沸，下入姜末、葱片、味精后搅匀，投入摊鸡蛋皮，淋芝麻油，浇入汤盘即成。"],"x":["商芝属于小地方不特别有名的特产，至少本人在其他地方没有见到过，在制作时可换成其他蕨类蔬菜。"]},{"t":"啤酒鸭","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸭肉","啤酒","生抽酱油","老抽酱油","姜","蒜","冰糖","干辣椒","料酒","盐"],"tp":"","d":4,"k":170,"i":"这是一道风味独特的家常菜肴，鸭肉鲜香软烂，透着淡淡啤酒清香，热而不浮、香而不腻。鸭肉富含蛋白质，啤酒去腥增香，搭配食用更有滋味。做法对新手友好，从备料到出锅大约需要 1 小时。","q":["鸭肉半只（约 1kg）","啤酒 800ml","生抽酱油 10-15ml","老抽酱油 5-10ml","姜 5 片","蒜头 12 瓣","冰糖 10g","干辣椒 5 个","料酒 30ml","盐 8g","鸡精 5g","丁香 4 颗","八角 3 个","香叶 3 片","豆瓣酱 20g"],"s":["把鸭子切成 3 cm 小块，鸭肉冷水下锅，加姜片、料酒，焯一遍水，盛出沥干水分，备用。","炒锅烧热，放入约 100ml 食用油，大火待油烧开，鸭肉入锅翻炒至上色。","待鸭肉完全变色（肉眼可见泛白），将鸭肉拨到锅的一边，倒入豆瓣酱和糖，小火翻炒出香味和糖色。","加入丁香、八角、香叶、干辣椒、生抽、老抽、蒜，翻炒出香味。","倒入啤酒，没过鸭肉，加入盐、鸡精，然后中火将鸭子烧 30 分钟（牙口不好的话可以再多烧 5 分钟）。","出锅盛盘，上桌食用。"],"x":["啤酒的量一定要足够把所有鸭肉没过，啤酒最好选择清香型的。"]},{"t":"回锅肉","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["五花肉","小葱","生姜","青红椒","蒜苗","料酒","豆瓣酱","生抽酱油","味精"],"tp":"","d":4,"k":997,"i":"回锅肉是四川传统名菜，以二刀肉或五花肉为主料，成菜色泽红亮，肥肉透明微卷、瘦肉干香不柴，口感肥而不腻，咸鲜微辣，带有蒜苗与豆瓣酱的复合香气。猪肉富含优质蛋白和必需脂肪酸，搭配青红椒、蒜苗可补充维生素。这道菜步骤稍多，包含煮、切、煸炒，对火候和刀工有一定要求，但按流程操作新手也能成","q":["五花肉的用量为 0.5 斤/男人 0.3 斤/女人 （正宗回锅肉使用二刀肉[俗称：臀尖]制作，肉质坚实，肥瘦合适）","小葱 2 棵","生姜 10-40g","青红椒（根据受辣程度选择, 0-30g）注：不建议使用肉厚的菜椒","蒜苗 1 把","料酒 5ml","豆瓣酱 10ml","味精 5g","生抽 5ml"],"s":["锅烧热，用手将五花肉紧紧压在锅上炙皮。","这一步是为了处理猪皮上的汗腺（或者买肉的时候让师傅烧一下皮，喜欢汗腺的可以无视）","用钢丝球把皮刷干净，至黑色部分碳化部分被完全去除，不刷干净会有苦味。","将五花肉放入锅中，放入能淹没五花肉的冷水，放入生姜片、料酒和小葱（取 2 棵小葱打结）","开大火煮，水开后撇去浮沫，继续煮 15 分钟，煮至瘦肉部分可以用筷子轻松刺穿。"],"x":["不喜欢蒜苗可以换成洋葱或者其他蔬菜，但是要注意蔬菜的易熟程度将蔬菜提前炒至，不然会出现蔬菜半生不熟的情况。","如果回锅肉比较大块可以切成 5 厘米见方的块，五花肉煮至筷子稍微用力即可插入猪皮即可。","回锅肉过冷水晾凉后肉质会更紧致。","回锅肉擦干水是为了避免炒至的时候爆油溅伤。"]},{"t":"土豆炖排骨","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["肋排","土豆","姜","小葱","料酒","白糖","干辣椒","八角","花椒","桂皮"],"tp":"","d":3,"k":991,"i":"排骨软烂脱骨，土豆绵软入味，酱香浓郁微甜微辣，是一道典型的北方家常炖菜。富含蛋白质、钙质和碳水化合物，营养均衡。制作略有难度，需掌握炒糖色与火候，但步骤清晰，新手也能尝试，全程大约 1.5 小时。","q":["注意：以下参数为标准 2-3 人份的精确配置。","肋排 750g","土豆 300g","姜 30g （分为两份：15g 焯水用，15g 炒制用）","小葱 25g （分为两份：15g 打成葱结，10g 切葱花）","料酒 25ml （分为两份：15ml 焯水用，10ml 炒制用）","白糖 10g","干辣椒 5g","八角 1g （约 1-2 颗）","花椒 1g （约 10 粒）","桂皮 1g （一小块）","生抽 10ml","老抽 5ml","蚝油 5ml","黄豆酱 5g","盐 3g （最后收汁调味用）","开水 700ml","食用油 20ml"],"s":["处理土豆： 将 300g 土豆去皮，切成不规则的滚刀块 。切好后立刻泡入一盆清水中，隔绝氧气防止表面氧化发黑，备用。","处理葱姜： 将 30g 姜全部切成薄片（分成两份 15g）。将 25g 小葱处理好：15g 挽成一个葱结，剩余 10g 切成细小葱花备用。"],"x":[]},{"t":"奥尔良风味烤鸡腿","c":"main","cu":"Chinese","m":180,"p":"chicken","ing":["烤箱","烤盘","铝箔纸","手枪腿鸡腿","新奥尔良烤翅调料","豉油调味汁"],"tp":"","d":5,"k":955,"i":"奥尔良风味烤鸡腿是一道简单易做的菜，富含蛋白质和铁。总共花费约 3 小时，其中手动操作时间约 20 分钟。","q":["一份正好够 1 个人吃。","手枪腿鸡腿 2 只（每个手枪腿大约重 200g，共约 400g）","新奥尔良烤翅调料 15 - 20 g","水 ≥30 mL"],"s":["解冻手枪腿鸡腿并洗净。","手枪腿鸡腿改花刀：在每只手枪腿鸡腿的\"枪管\"处，平行于\"枪管\"用小刀切 4-6 刀，下刀尽可能深。","拿一个锅，加入 15 - 20 g 新奥尔良烤翅调料粉、5 g 盐，≥30 mL 水。","将改完花刀的手枪腿鸡腿放入锅内，搅匀。","将整个锅放入冰箱冷藏层冷藏 2 - 4 小时，时间越长越入味。","在烤盘上放一张铝箔纸，将鸡腿取出，皮面向下放上去（不要弄破铝箔纸）。丢弃锅内剩余的液体。","_上层 230 ℃, 下层 230 ℃, 上下层烘烤, 20 分钟定时_。","取出，将烤盘中的油脂倒到大碗里备用。（不要弄破铝箔纸）","对所有手枪腿鸡腿翻面。","_上层 150 ℃, 下层 230 ℃, 上下层烘烤, 20 分钟定时_。","取出，将烤盘中的油脂倒到大碗里备用。（不要弄破铝箔纸）","_上层 60 ℃, 下层 60 ℃, 上下层烘烤, 15-20 分钟定时_。","取出，将烤盘中的油脂倒到大碗里备用。（不要弄破铝箔纸）","取一个小碗，按照 10:1 - 2:1 体积比，加入大碗中的油脂和豉油调味汁。调味汁越多越咸，具体加入量取决于个人口味。","抓住手枪腿鸡腿根部，蘸取小碗中的液体，可使用餐巾纸或手套隔油。现在可以直接从烤盘铝箔纸上享用奥尔良风味烤鸡腿了。","若小碗中的液体中途用尽，重复上一步。"],"x":["冷藏中途可以拿出搅匀。冷藏时间切勿过长。","该指南基于的烤箱参数为_容积 25 L，功率 1400 W_。","若烤箱功率低于/高于此值，可以适当延长/缩短烤箱定时，但请确保鸡腿是熟的。"]},{"t":"奶酪培根通心粉","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["通心粉","奶酪","肉类","洋葱","黄油","面粉","牛奶","大蒜"],"tp":"","d":3,"k":728,"i":"奶酪培根通心粉是经典美式家常菜，口感浓郁绵密，奶酪包裹弹牙通心粉，搭配香脆培根，咸香满足。富含蛋白质与钙质，但热量和脂肪较高，建议偶尔享用。制作需要一定耐心，掌握基础白酱和火候对新手略有挑战，整体难度中等。不烘烤时约 30 分钟即可上桌，若选择烘烤需额外预热和烤制，总时长约 1 ","q":["通心粉 100-125g","奶酪 40-55g，若要烘烤额外准备 25g， 条状","培根或其他肉类 100-125g","洋葱 25g-40g 切成碎","黄油 15g","面粉 10g","牛奶 125ml","大蒜半瓣，切碎"],"s":["奶酪要磨成碎末。","洋葱切成条状。","通心粉用微咸的水煮 6 分钟。","中火。","锅中放入黄油，等待融化。","加入洋葱。","洋葱软化后加入大蒜。","大蒜香味出来后，加入肉类，等待 5 秒。","小火。","分四次加入牛奶，每次搅拌 5 秒后再加下一次。","加入面粉并充分搅拌。","加入奶酪并搅拌均匀。","将通心粉和奶酪搅拌。","如果不打算烘烤，可以直接吃了。","预热烤箱至 180°C。","将额外的 50g 芝士铺在通心粉之上。","等待烤箱预热至 180°C 后，将通心粉放入。","烤至表面金黄,约 24 分钟。"],"x":["本料理及其不健康，有大约 1300 大卡，80g 脂肪，不建议常吃。"]},{"t":"姜炒鸡","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸡","生姜","啤酒","生抽","老抽","盐","小米椒","美人辣","泡椒","大蒜"],"tp":"","d":3,"k":1539,"i":"姜炒鸡是湖南风味的下饭菜肴，鸡肉干香入味，姜香浓郁，辣而不燥。鸡肉富含优质蛋白，生姜有助于驱寒暖胃、促进食欲。做法简单，新手也能轻松掌握。从腌制到出锅大约需要 1 小时。","q":["鸡 半只（土鸡最好，预计 650g）","食用油 50ml（茶油最好，没有就用菜籽油）","生姜 半斤 (250g)","啤酒 半瓶 250ml","生抽 20ml","老抽 10ml","盐 3g","小米椒 0-5 个 (0-50g)（根据辣口味调整）","美人辣 0-5 个 (0-50g)（没有可以用小米椒代替）","泡椒 5 个 (50g)","大蒜 3 头 (50g)"],"s":["鸡尽量剁成 1cm 的小块，洗净后滤干，再放生抽腌和料酒腌制 30 分钟。","大先热锅到微微冒烟，放入食用油，等 5 秒。","下入姜片后转中火炒 30 秒。","下入鸡块翻炒 3 分钟，炒干水分，炒出鸡油。","放入各种剁碎的辣椒和大蒜子，加盐和老抽继续翻炒 30 秒。","倒入啤酒，中小火焖 2 分钟。","大火收汁盛盘。"],"x":[]},{"t":"姜葱捞鸡","c":"main","cu":"Chinese","m":40,"p":"chicken","ing":["鸡腿肉","盐焗鸡粉","葱，姜"],"tp":"","d":3,"k":549,"i":"姜葱捞鸡是一道粤式经典家常菜，鸡肉嫩滑多汁，葱姜香气浓郁，咸鲜适口，十分下饭。鸡腿肉提供优质蛋白质，搭配姜葱能温中散寒、促进食欲。整体操作以蒸制和手撕为主，步骤清晰，对新手来说比较容易上手。从备料到完成大约需要 40 分钟。","q":["鸡腿 4 个， 约 400g","盐焗鸡粉 5g","姜 50g","葱 1 根","盐 5g","糖 5g","油 35ml"],"s":["四个鸡腿清洗干净，放入碗中。","碗中加入盐焗鸡粉和 5ml 油，搅拌均匀。","让鸡腿静置腌制 15 分钟， 同时准备蒸锅并把水煮开。","鸡腿腌制完成后， 放入水开后的蒸锅中，蒸制 20 分钟。","将姜根据个人口味切成 1）姜蓉或 2）姜丝或 3）姜粒。","将葱切成 0.5cm 小段。","将葱姜放入蘸料碗，并加入盐和糖。","将剩余的油倒入另一个锅中加热至六至七层热。","将热油淋入葱姜碗中。","鸡腿蒸好后将其撕碎成鸡丝，不需要特别细，大概 1cm 粗就可以。","姜葱姜油淋在鸡丝上，搅拌均匀即可。"],"x":["参考: 白饭杀手来啦 #姜葱捞鸡-哔哩哔哩。"]},{"t":"孜然牛肉","c":"main","cu":"Chinese","m":45,"p":"beef","ing":["牛柳或牛肩肉","青椒","孜然","小米椒","生抽酱油","淀粉","油","盐","葱","捣药罐"],"tp":"","d":3,"k":612,"i":"孜然牛肉是一道香辣鲜嫩的家常小炒，浓郁的孜然风味与牛肉的软滑、青椒的清脆融合得恰到好处。牛肉富含优质蛋白和铁，搭配青椒还能补充维生素，营养均衡。制作需要一些刀工和火候把控，适合有一定下厨基础的爱好者尝试。算上腌肉和备菜，全程大约 45 分钟就能端上餐桌。","q":["牛肉用量为 250 g/人","青椒用量为 2 颗/人, 每颗 100g","孜然用量为 20 g/人","小米椒用量为 3 颗/人, 每颗 5g","生抽酱油用量为 20 ml/人","淀粉用量为 10g/人","油用量为 15ml/人","盐量用量为 3 g/人","葱用量为 1 根/人, 每颗 20g"],"s":["首先将小米椒切碎，和孜然粒一起放入捣药罐捣碎成颗粒，这样更入味。如果时间紧张可跳过捣碎步骤。","青椒切头去籽（喜欢辣的可不去），切成丝。葱切段。","牛肉提前解冻，过一边水洗干净，晾干或用厨用纸吸干，将牛肉顺着纹理切成片。","然后进行腌肉，加入生抽，淀粉，油，均匀搅拌，静止 30 分钟。腌肉方法也可参考学习腌。","热锅下油，放入葱，爆出香味后放入腌好的牛肉煸炒。","牛肉变色后均匀放入孜然辣椒颗粒并炒熟。","然后下入青椒丝，断生后放盐。","大🔥炒 1 分钟后关火再翻炒 30 秒保证受热均匀即可出锅。"],"x":[]},{"t":"宫保鸡丁","c":"main","cu":"Chinese","m":56,"p":"chicken","ing":["手枪腿","大葱","干辣椒","熟花生","生抽酱油","香醋","白糖","料酒","盐","鸡精"],"tp":"","d":4,"k":1790,"i":"这道川味名菜以糊辣荔枝味见长，小酸甜中透着干辣椒与花椒的香气，鸡丁嫩滑、花生酥脆，口感层次丰富。富含优质蛋白和不饱和脂肪酸，开胃下饭。做法分成简易和进阶两版，对新手比较友好，提前规划好腌制时间即可。从备料到出锅大约需要 1.5 小时。","q":["手枪腿（或者鸡胸脯肉） 1 支（约 350g）","大葱 1 根（约 180g）","熟花生 150g","姜片 10g","干辣椒（或者二荆条） 10g（若选择二荆条，则需要大约 4 支）","生抽酱油 10g","白糖 2g","盐 2g","植物油 20g","淀粉 15g","料酒 15g","老抽酱油 5g","花椒 5g","香醋 5g","鸡精 2g","芝麻油 10g","淀粉（用以勾芡） 10g","豆瓣酱 10g","莴笋 约 250g","油泼辣子 5g"],"s":["手枪腿用剪刀去骨，鸡肉面用刀背拍打一遍，切条后切至 1.5cm 见方肉丁；泡于清水 10 分钟，捞出控干备用（若是鸡胸脯肉，则可以直接进行切丁以及之后的动作）","取大葱葱绿与姜片 5g 于碗中，倒入 50g 开水备用；葱白切 1.5cm 圆粒备用；取花生放入微波炉高火 5 分钟焙干备用。","鸡丁中加入盐 2g，老抽酱油 5g，料酒 15g，淀粉 15g 搅拌均匀，至微微发干；缓慢加入部分葱姜水，搅拌鸡丁至粘手；保鲜膜密封，放入冰箱腌制 1 小时。","干辣椒切段；起锅，大火烧热转小火；放入干辣椒焙干至微微发糊，捞起备用；花椒焙干至有香味，捞起备用。","转大火，倒入 20g 植物油，7 成热（竹筷子起泡）下入鸡丁，煎至上面开始发白，用锅铲翻面，煎 30s 后翻炒均匀。","下入葱粒翻炒，加入余下葱姜水不够 100g 再加一点清水（务必是热水）；盖上锅盖，转中小火焖 2 分钟。","转大火，下入熟花生，干辣椒和花椒；加入鸡精 2g，香醋 5g，白糖 2g，翻炒均匀。","淀粉 10g 加 50g 清水调成水淀粉，加入锅中，翻炒均匀，收汁到自己想要的浓度。","关火，淋入芝麻油 10g，即可出锅。"],"x":["辣椒依据个人口味酌量添加，怕辣可去籽。"]},{"t":"小炒肉","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["五花肉","朝天椒","小米椒","豆豉","豆瓣酱","老抽","淀粉","盐","葱","蒜"],"tp":"","d":3,"k":2873,"i":"小炒肉是一道香辣下饭的经典湘式家常菜，五花肉片焦香不腻，搭配鲜辣椒与豆豉、豆瓣酱炒出浓郁酱香。富含优质蛋白质和脂肪，辣椒能提供丰富的维生素 C，有助开胃暖身。制作难度中等，适合有一定基础的新手尝试，需注意肉片腌制和火候把控。从备料到出锅大约需要 1 小时，其中腌制 30 分钟，炒","q":["五花肉 500g","朝天椒 4 条","小米椒 4 颗","豆豉 10g，根据个人口味加减 ±5g","豆瓣酱 10g，根据个人口味加减 ±5g","老抽 10ml","淀粉 10g","盐 1-2g","葱 0.5-1 根","蒜 2 瓣","食用油 15ml"],"s":["五花肉切片。","把肉放入器皿内，加入淀粉、老抽、盐搅拌腌制半小时。","葱切段。","小米椒、朝天椒斜刀切好。","热锅、倒油。","油热后加入五花肉煸炒。炒至变色后盛出来。","向锅中加蒜，煸出香味，加入豆豉，翻炒均匀。","加入豆瓣酱翻炒均匀。","加入炒好的五花肉继续的翻炒均匀。","加入小米椒、朝天椒、葱段翻炒 40 秒。","出锅。"],"x":[]},{"t":"小炒鸡肝","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["生鸡肝","蒜苗","大葱、姜、料酒","食用盐、鸡精、五香粉、胡椒粉","烧烤料或孜然粉","芝麻","食用油"],"tp":"","d":3,"k":760,"i":"这道鸡肝小炒蒜香浓郁，口感嫩滑带点孜然的焦香，是一道家常风味小炒。鸡肝富含铁、维生素 A 和优质蛋白，有助补血明目。制作时需掌握焯水去腥的技巧，对新手略有挑战，从备料到出锅大约需要四十分钟。","q":["一份正好够 2 个人吃。","生鸡肝 5 个（约 800g）","蒜苗（约 200g，喜欢吃的可以多放）","大葱 150g（分成两份，一份切段 100g，一份切片 50g）","姜 120g（分成两份，一份切片 70g，一份切丁 50g）","料酒 30ml","食用盐 5g","鸡精 5g（也可以是味精）","五香粉 5g（十三香）","胡椒粉 5g","烧烤料或孜然粉 10g（可选）","芝麻 5g （可选）","食用油 30ml"],"s":["鸡肝清洗，备用。","蒜苗清洗，切段，备用。","大葱清洗，取 100g 切段，取 50g 切片，备用。","姜清晰，取 70g 切片， 取 50g 切丁，备用。","第一步：焯水。","清洗后的鸡肝放入锅内，加入凉水淹没鸡肝，并放入 100g 切段的大葱、70g 切片的姜和 30ml 料酒。","开大火，待水沸腾调至中火并撇去浮沫后等待5-10分钟。","关火，捞出过凉水并清洗干净。","清洗干净后切片，备用。","第二步：炒制。","开中火。锅内加入 30ml 食用油，等待 10 秒使油升温。","加入 50g 切片的大葱和 50g 切丁的姜，翻炒爆香。","爆香后加入切片的鸡肝，翻炒至微微发黄。","加入蒜苗，翻炒 30 秒，断生后调至为小火。","加入调味料。","食用盐 5g。","鸡精（味精） 5g。","五香粉（十三香） 5g。","胡椒粉 5g。","烧烤料或 10g （可选）"],"x":["焯水时，需要注意观察沸腾的水位线，不要让水溢出避免发生危险。","焯完水的鸡肝建议用凉水冲洗，更推荐冰水，可以让口感更好。"]},{"t":"小炒黄牛肉","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["牛里脊","芹菜","小米椒","野山椒","香菜"],"tp":"","d":4,"k":619,"i":"这道湘味小炒以大火爆炒逼出牛肉的嫩滑与椒香，口感鲜辣劲爽、芹菜脆嫩，极具湖南风味。牛里脊提供优质蛋白和易吸收的铁质，搭配芹菜增添膳食纤维，营养均衡。备料与烹饪步骤简单明了，全程旺火快炒，对新手十分友好，从切配到出锅大约一小时即可完成。","q":["牛里脊 400g","芹菜 200g","小米椒 30g","野山椒 30g","香菜 30g","食用油 15ml","酱油 6ml"],"s":["牛里脊切成不超过 3cm 宽，3mm 厚的薄片，倒入 6ml 酱油，用手抓匀备用。","芹菜切成不超过 5cm 的小段，备用。","小米椒切成丝状，备用。","野山椒切成颗粒，备用。","香菜切成成不超过 3cm 的小段，备用。","热锅，锅内放入 15ml 食用油，大火等待 30 秒让油温升高。","放入小米椒和野山椒爆香。","放入牛里脊和芹菜，然后大火翻炒 1 分钟。","关火，撒上香菜，盛盘。"],"x":["操作时，全程需要开大火。"]},{"t":"小米辣炒肉","c":"main","cu":"Chinese","m":25,"p":"pork","ing":["小米辣","花生油","五花肉/瘦肉","盐","生抽","蚝油","大蒜","姜","豆瓣酱","鸡精"],"tp":"","d":3,"k":620,"i":"小米辣炒肉香辣过瘾，是一道典型的西南风味下饭菜，猪肉的鲜嫩搭配小米辣的爽辣，令人食欲大开。猪肉富含蛋白质和脂肪，辣椒提供丰富的维生素 C，能够促进食欲。虽然需要掌握爆香和翻炒的火候，但步骤清晰，新手也能轻松上手，预计制作时长约 25 分钟。注意，这道菜辣味突出，不建议清淡饮食者尝","q":["小米椒 20 个，根据个人口味加减","花生油 20ml","五花肉/瘦肉 200g","盐 1-2g","生抽 10ml","蚝油 10ml","姜蒜 50g","豆瓣酱 10g，根据个人口味加减","鸡精 10g","白糖 5g"],"s":["将小米辣洗净，斜刀切大一点。","肉的话，想切丝切丝，想切片切片，倒入调料（生抽、蚝油、盐）腌制 5 分钟。","热锅倒油，先把肉炒好盛起。","姜蒜爆香，倒入豆瓣酱翻炒，到入切好的小米辣，再倒入瘦肉，翻炒一下，放点生抽、鸡精、盐、糖翻炒。"],"x":["调料可以根据自己的喜好放，也可以加老抽，老抽更香！"]},{"t":"小酥肉","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["去皮猪肉","植物油","老姜","小葱","料酒","盐","十三香","胡椒粉","味精","鸡精"],"tp":"","d":3,"k":1939,"i":"小酥肉外酥里嫩，咸香中带着花椒的微麻，是川渝地区家家户户都会做的家常炸物。猪肉富含蛋白质和脂肪，油炸后热量较高，适合偶尔解馋。这道菜步骤稍多，需掌握初炸定型与复炸上色的火候，对新手略有挑战，预计从头到尾约 1 小时 30 分钟完成。","q":["猪肉 500 克"],"s":["老姜切丝，小葱不用切。","按用量倒入料酒、清水。","用手捏揉 5 分钟，使姜葱的味道充分溶解在水中。"],"x":["裹粉一定要把红薯粉揉散，不要有干的颗粒裹在里面，否则会炸！！！","如果肉太多吃不完，可以只炸一遍然后放冰箱。后面再吃的时候拿出来复炸，口感基本没影响。"]},{"t":"尖叫牛蛙","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["牛蛙肉","泡姜","泡椒","野山椒","青红辣椒","大蒜","豆瓣酱","盐巴","胡椒粉","生粉"],"tp":"","d":4,"k":1643,"i":"这道菜鲜辣开胃，蛙肉滑嫩弹牙，是一道典型的川味家常菜。牛蛙本身高蛋白、低脂肪，搭配泡姜泡椒等发酵食材，有助于促进食欲。做法相对直接，但油温控制和调味比例需要稍加留意，一般初学者也能在 1 到 2 小时内完成。","q":["1 份","牛蛙肉块 800g （买 3 斤活蛙，建议挑小个头的，肉质鲜嫩）","泡姜 20-30 克 （看个人口味，喜欢重口一点可以多放）","泡椒 5-10 克 （看个人吃辣的承受能力，不能吃辣的建议减半为 2.5 克，微微辣）","野山椒 10 克","青红辣椒 20 克","大蒜 30-50 克 （可以根据口味偏好调整，最好不低于 30 克）","豆瓣酱 20-30 克 （重口选 30，想吃清淡点 20 克。PS 这菜不可能太清淡，哈哈）","盐巴 15 克","胡椒粉 10 克","啤酒 400-500ml","料酒 10ml","藤椒油 5-10ml","生粉 30 克 （干淀粉可以平替）","猪油 20ml（没有猪油也可，用食用油替代）","食用油 200ml","葱花 5 克"],"s":["牛蛙肉洗净后控干水分，加入 10 克以上的盐巴和 50ml 以上的啤酒，用手抓 5 分钟，去除牛蛙肉的腥味。","然后对着清水冲洗，直至不再流出血水和杂质，控干水分，放到合适的器皿中，准备腌制。","加入 5 克盐，30 克生粉，10ml 料酒，5 克胡椒粉，用手抓均匀，腌制 5-10 分钟。","将泡姜 泡椒 野山椒 切丝或者片（根据自己刀工选择），青红辣椒切成圈圈 大蒜拨开即可。","起锅烧热，加入 200ml 食用油（锅底比较平的可以再加 100ml）,烧至 6 成油温（有小气泡出现），将腌制好的牛蛙倒入，快速过油炸制，10 秒钟后捞出（不能超时太多，否则会导致蛙肉老柴）","捞出蛙肉后，控油，并将锅中的热油倒出到碗中，保留 30ml,加入 20ml 猪油（如果没有，则在锅中保留总共 50ml 食用油）","待油温 6 成热，加入泡姜、泡椒、野山椒、大蒜，超出香味，加入豆瓣酱 20 克，中火翻炒至出红油（时间控制在 30 秒），倒入 400ml 啤酒。","然后倒入炸过的牛蛙肉，用勺子推着翻，不要用力搅拌，加入 5 克胡椒粉，加入 5ml 藤椒油，中火慢焖 3 分钟。","加大火力，大火收汁半分钟，加入青红辣椒圈，再煮 10 秒准备起锅。","盛到盆里，撒上葱花，可以开动了！"],"x":["控干水分的时候可以选择漏勺按压。","生粉抓揉的时候要均匀覆盖蛙肉。"]},{"t":"尖椒炒牛肉","c":"main","cu":"Chinese","m":60,"p":"beef","ing":["牛肉","葱、姜、蒜","尖椒","酱油","盐","糖"],"tp":"","d":3,"k":449,"i":"一道家常小炒，咸香微辣，牛肉滑嫩入味，尖椒清脆爽口。牛肉提供优质蛋白和铁，尖椒富含维生素 C，搭配起来营养均衡。虽然腌制需要一些耐心，但操作步骤明确，新手也能上手，难度适中。从备料到出锅大约需要 1 小时。","q":["牛肉用量为 250 g/人","葱的用量为 0.5 根/人","姜的用量为 1 个/人","盐的用量为 3 g/人","糖的用量为 1.5 g/人","酱油的用量为 9 ml/人"],"s":["蒜剁成蒜泥。","葱切段。","姜切成姜片。","尖椒切成段。"],"x":["腌制可以加入小苏打使牛肉变嫩，牛肉苏打比例为 500g：3g。","腌制的时候姜片可用料酒代替，料酒的用量为 3 g/人。"]},{"t":"山西过油肉","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["猪里脊","蒜苔","盐","酱油","葱姜蒜","鸡蛋","淀粉","食用油","木耳","葱头"],"tp":"","d":4,"k":679,"i":"过油肉是山西传统名菜，肉片滑嫩、蒜苔爽脆，咸鲜微酸，带着陈醋的醇香，属于典型的地方家常风味。猪里脊提供优质蛋白，搭配木耳、蒜苔和葱头，营养均衡。这道菜对火候和上浆技巧有一定要求，更适合有一定下厨基础的爱好者尝试。从备料到出锅，大约需要 40 分钟。","q":["本人饭量较大，这是本人一人量","猪里脊 150 g","蒜苔 6 根","食用油 300ml","葱姜蒜 50g","生抽 20ml","食盐 10g","鸡蛋 1 个","淀粉 10g","木耳 20g","葱头 100g","其他调料 20g"],"s":["木耳提前泡发好，如果着急可以用热水泡发。","猪里脊切片放入碗中，加 20ml 生抽、料酒、花椒粉，打入一个鸡蛋，拿自己的小手搅拌均匀，加入淀粉（建议红薯淀粉）拌匀，倒入 300ml 食用油封浆，腌制 15 分钟。","蒜苔切段大约 3cm，葱头切菱形块备用。","起锅烧油油要多一点，油温五成热，下入腌制好的肉片，将肉片打散，捞出控油备用。","将锅中多余油倒出，留 10ml 油炒菜，油温七成热。","下入葱姜蒜爆香，先下蒜苔炒至断生，再下入木耳葱头，加入生抽，花椒粉，翻炒几下将之前炸好的肉片下入翻炒。","加 10g 的盐，起锅前加 10ml 的醋和鸡精，起锅装盘。"],"x":["炸肉片时，表面微焦即可，注意控制火候。","起锅前也可以打个薄薄的水淀粉，口感更佳。"]},{"t":"巴基斯坦牛肉咖喱","c":"main","cu":"Chinese","m":68,"p":"beef","ing":["普通的炒锅","电饭煲/电炖锅","Masala 粉","牛肉","番茄","螺丝椒","原味酸奶","蒜粉","姜粉"],"tp":"","d":5,"k":602,"i":"这道巴基斯坦风味咖喱牛肉香浓软糯，酸辣开胃，带着浓郁的香料气息。牛肉提供优质蛋白，搭配番茄和酸奶，营养均衡。做法不算繁琐，但慢炖需要一点耐心，很适合在闲暇的周末从容准备。从头到尾大约两个半小时，就能端出一锅温暖的异国美味。","q":["这里以 1kg 牛肉的所需要的配菜量作为标的，其他分量按比例增减。1kg 牛肉做出的咖喱大概够 5 个人吃。","番茄🍅 4 个","螺丝椒 2 个（大个的）","原味酸奶 1 盒","Masala 粉一包 50g","蒜粉 5g","姜粉 5g"],"s":["全部螺丝椒切成段状，备用。","全部番茄打成番茄蓉，备用。","牛肉切成 2cm 的小块，洗净备用。","炒锅中倒入一层油（用来防止番茄蓉沸腾蒸发）","倒入番茄蓉，持续搅拌 2-3 分钟，等待它越变越红。","加入 5g 蒜粉，5g 姜粉和 1 包 50g 的 Masala 粉，搅拌均匀。","加入牛肉和螺丝椒段，搅拌均匀。","加入 1 盒酸奶（为了让整个酱汁变得粘稠），搅拌均匀。","将整锅材料转移到电饭煲/电炖锅，并加入 250 ml 的水，开启炖肉/慢炖档，设定时间 2-3 个小时。","等待完成，开锅检查牛肉软糯，就可以吃了。"],"x":["这道菜是从一个巴基斯坦的朋友那里偷师而来，特地整理了笔记，绝对正宗。","通常配以 烙饼(roti)、馕(naan) 或 米饭 食用。","如果想做 Chicken karahi 流程几乎是一样的，除了是先用油和各种花椒胡椒煎鸡肉变黄。"]},{"t":"带把肘子","c":"main","cu":"Chinese","m":68,"p":"pork","ing":["带脚、爪猪前肘","红豆腐乳","甜面酱","精盐","红酱油","白酱油","料酒","蒜片","姜末","八角"],"tp":"","d":5,"k":1037,"i":"带把肘子是陕西大荔的传统名菜，因脚爪形似把柄而得名。成菜肘皮胶粘软糯，肉质酥烂不腻，蘸甜面酱佐葱段食用，咸香醇厚。富含胶原蛋白和优质蛋白质，滋补养颜。制作需去骨、定形、长时间蒸制，对新手有一定挑战，预计整个制作过程约需 3.5 小时。","q":["带脚、爪猪前肘: 一个（大约二斤五两 1250 克）","红豆腐乳: 1 块 10 克","甜面酱: 150 克","精盐: 15 克","红酱油: 35 克","白酱油: 25 克","料酒: 25 克","蒜片: 50 克","姜末: 10 克","八角: 3 个","桂皮: 5 克","葱: 200 克"],"s":["将肘子刮洗干净，肘头朝外、肘把（脚爪）朝里、肘皮朝下放在案板上。","用刀在正中由肘头向肘把沿着腿骨将皮剖开，剔去腿骨两边的肉（三面离肉），底部骨与肉相连，使骨头露出，然后将两节腿骨由中间用刀背（还是用斧头吧）砸断。","肘子放入煮锅煮至七成熟捞出（外观正常，内部淡红色），用干净抹布擦干水，趁热用红酱油涂抹肉皮。","取蒸锅一个，锅底放入八角、桂皮，先将肘把的关节处用手掰断，不伤外皮，再将肘皮朝下装进蒸锅内，装锅时根据肘子体型，将肘把贴住锅边窝着装进锅内，成为圆形。","撒入精盐，用消过毒的干净纱布盖在肉上，再将甜面酱（50 克）、葱（75 克）、红豆腐乳、红酱油、白酱油、姜、蒜等在纱布上抹开，用旺火蒸大约三小时（以蒸烂为准）。","蒸完取出，揭去纱布，扣入盘中，拣去八角，上桌时另带葱段和甜面酱小碟（或将甜面酱抹到肘面上，另带葱段小碟亦可）。"],"x":["肘子七成熟要根据实际情况判断，有条件可询问家中长辈。","蒸锅下半放水，上半放肘子，蒸时及时加水防止蒸干。"]},{"t":"干煸仔鸡","c":"main","cu":"Chinese","m":56,"p":"chicken","ing":["鸡腿","土豆","青椒","大蒜","盐","胡椒粉","生抽","老抽","料酒","淀粉"],"tp":"","d":4,"k":1300,"i":"这是一道源自北大食堂、甜辣风味的创新川菜，鸡肉先腌后炸，外酥里嫩，土豆香糯，青椒脆爽，裹满红亮的甜辣酱汁，咸甜微辣十分开胃。富含蛋白质、碳水化合物及维生素。制作涉及油炸和酱汁熬制，对新手稍有挑战，但按步骤操作即可成功，全程约需 1 小时。","q":["鸡腿肉 400g","土豆 200g","青椒 60g","蒜瓣 10g","盐 3g","鸡精 3g （可选）","胡椒粉 2g","生抽 5g","老抽 2g","料酒 5g","淀粉 20g","郫县红油豆瓣酱 40g","白糖 30g","花椒碎 2g"],"s":["鸡腿去骨（如使用鸡腿排可忽略此步骤），鸡腿肉用刀背砸一砸，切成 2cm 的块。","鸡腿肉中加入盐、鸡精（可选）、胡椒粉、生抽、老抽、料酒，抓拌至粘手时加入淀粉拌匀，加入食用油防止粘连，腌制 30 分钟。","土豆去皮，切成 2cm 的块，沸水煮 5 分钟后捞出，控干水分，防止油炸时爆锅。","青椒去籽，切成 2cm 小片，放在笊篱中备用。","锅中加入宽油（根据锅的形状，能没过食材即可），油温烧至 180℃ 时，下入土豆块炸 3 分钟后捞出。","待油温再次升高到 180℃时，下入鸡块炸 2 分钟后捞出。","待油温再次升高到 180℃时，下入鸡块复炸 1 分钟后捞出。","待油温再次升高到 180℃时，下入土豆块复炸 1 分钟后，将锅中的油和土豆块经过笊篱过滤倒出，让笊篱上的青椒片断生。","锅中加入 5ml 食用油，小火煸炒蒜瓣至发黄，下入红油豆瓣酱煸炒出香，下入白糖炒融化，下入花椒碎，加 40ml 清水，不停搅拌至酱汁粘稠。","下入炸好的鸡块、土豆块、青椒片，搅拌均匀后出锅。"],"x":["不舍得使用宽油油炸的话，可改用更少的油煎鸡块和土豆块。会增长用时，部分影响口感，但不会影响总体味道。","参考资料：北大餐饮中心官方资讯。"]},{"t":"广式萝卜牛腩","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["牛腩","白萝卜","姜片","蒜瓣","葱","八角","桂皮","干辣椒","香叶","南乳"],"tp":"","d":4,"k":483,"i":"这是一道广式家常炖菜，牛腩软烂入味，萝卜吸饱汤汁后清甜浓郁，整体酱香回甘。富含优质蛋白和膳食纤维，开胃助消化。制作步骤稍多但难度适中，新手按部就班也能成功。预计从头到尾大约需要 2.5 小时完成。","q":["一份正好够 3-4 人吃。","牛腩 500g","白萝卜 1 根","姜片 8 片","蒜瓣 5 片","八角 2 片","桂皮 1 小块","干辣椒 2 个","香叶 2 片","南乳 1 块","柱侯酱 30g","蚝油 15g","酱油 15g","冰糖 10g","盐 5g","老抽 15g"],"s":["萝卜滚到切块备用。","牛腩整块焯水，加入 2 片姜和一把葱结，等水开之后煮 5-10 分钟，然后捞出切件。","将牛腩切块，切成自己喜欢的大小（牛腩焯过水，待会儿焖的时候基本不会缩水了，大块的会焖相对就一点的时间）","准备焖牛腩的酱料，将南乳、柱侯酱、酱油、蚝油、糖、盐按上面的量调和（冰糖刚刚没了换成了白糖）","热锅下油，将姜蒜爆香，放入牛腩，炒至干身，加入调好的酱料，炒香，如果喜欢色泽浓一点的可以加一点老抽润色一下。","调料充分混合之后倒入热水。","将牛腩换到汤锅中，放入桂皮、八角、香叶和干辣椒，焖大概 2 个小时。","牛腩焖到半软之后加入白萝卜继续焖 30 分钟。","等到萝卜焖软之后就完成，一锅浓香的萝卜牛腩就完成了。"],"x":[]},{"t":"徽派红烧肉","c":"main","cu":"Chinese","m":45,"p":"pork","ing":["五花肉","白砂糖","食用油","生抽","蚝油","老抽","姜片","蒜头","料酒","葱"],"tp":"","d":4,"k":3847,"i":"徽派红烧肉是一道色泽红亮、肥而不腻的经典徽式家常菜，口感软糯 Q 弹，咸甜交融。以五花肉为主料，富含优质蛋白质和脂肪，能提供充沛能量。烹制需掌握炒糖色与火候，稍有挑战，预估制作时长约 45 分钟。","q":["五花肉 300 g","白砂糖 100 g","食用油 200 g","生抽 10 ml","蚝油 5 ml","老抽 5 ml","姜片 2 片","蒜头 3 颗","料酒 100 ml","葱 1 根","五香粉 10 g","盐 10 g"],"s":["五花肉切块，每块 2-3 cm 大小。","锅中加入 150 ml 食用油，倒入五花肉，煎炸 2 分钟 后，加入盐，翻炒五花肉，2 分钟 后出锅。","锅中加入 50 ml 食用油，倒入白砂糖，翻炒到咖啡色。","倒入五花肉，翻炒 30 S ，加入姜片、蒜头后翻炒 30 S。","加入料酒，五香粉、葱，加入水没过五花肉，盖上锅盖煮 10 分钟。","加入生抽、老抽、蚝油，中火煮 20 分钟。","开锅，大火烧汁，端盘。"],"x":["葱是整根，不需要切碎。","步骤二加盐的目的是锁住五花肉的油脂。","制作过程，用部分五花肉做了水煮处理，跟未处理的一起做后续制作，发现未水煮的肉质更 Q 弹。"]},{"t":"意式烤鸡","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["鸡腿肉","盐","黑胡椒","橄榄油","蒜","柠檬汁","欧芹"],"tp":"","d":3,"k":315,"i":"意式烤鸡是一道带有地中海风味的家常烤箱菜。鸡腿肉经过蒜香橄榄油腌制，烤后外皮微焦、内里鲜嫩多汁，搭配柠檬汁和欧芹，口感清爽不腻。鸡肉富含优质蛋白质，橄榄油提供不饱和脂肪酸，营养均衡。制作难度适中，需要提前预热烤箱，新手跟着步骤也能顺利完成，从腌制到出炉总计约五十分钟。","q":["鸡腿肉用量通常来说为 1-2 个/人","盐用量为 2 g/人","黑胡椒用量为 0.5 g/人","橄榄油用量为 5 ml/人","蒜用量为 1 瓣/人","柠檬汁用量为 5ml/人","欧芹用量为 1 根/人"],"s":["鸡腿肉涂上盐、黑胡椒、橄榄油和蒜末。","放入预热至 180 度的烤箱中，烤 30-40 分钟或至熟。"],"x":["烤制时可以将鸡肉淋上蜂蜜或其他烤肉酱提升口感。","烤箱预热至 180 度，烤制时间根据鸡肉的大小和厚度而定，需确保鸡肉熟透。","鸡肉必须全熟才能吃，吃未全熟的鸡肉可能会导致食物中毒和感染细菌，如沙门氏菌和福氏杆菌等。"]},{"t":"新疆大盘鸡","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸡肉，土豆，菜椒和甜椒"],"tp":"","d":4,"k":1108,"i":"新疆大盘鸡是一道风味浓郁、色彩鲜艳的新疆家常菜，鸡肉鲜嫩不柴，土豆软糯吸汁，麻辣中带着微甜回甘。富含优质蛋白质和碳水化合物，搭配彩椒还能补充维生素 C。制作过程需要炒糖色和掌握收汁火候，对新手有一定挑战，但跟随步骤细心操作并不难，整体大约 1 小时可以完成。","q":["2 人食用","两个火枪腿的鸡肉（这大约是 1kg ）","土豆 2 个适中大小：750g","大葱 100g","菜椒甜椒各一个，各 50g","白糖 20g","干线椒 5 个","大蒜 4 瓣","油 50g"],"s":["肉先剁好，块状，用清水+盐浸泡 5 分钟，去除血水，去腥，然后空干水。","葱蒜辣椒土豆等洗干净，土豆削皮。","葱白切长段，长度 4cm 一段，菜椒和线椒切块状。","土豆切成滚刀土豆，即切一刀动滚动一下，一块土豆大概有 4cm×4cm 大小即可。","炒糖色：先将油加入锅中，然后将白砂糖放入，用锅铲来回搅拌，将糖炒化，然后炒出焦黄色，此时将空干水的鸡肉倒入锅中翻炒，进行上色。","放入花椒，香叶，香果，干线椒等进行翻炒。","放入 5g 盐，生抽 7ml，蚝油 10g ，料酒 100g，倒入 1 升清水，料酒可以用啤酒代替。","调至中火，将水烧开，调制中小火慢炖入味。","当水收至鸡肉即将露出时，将土豆放在锅表面：注意不要翻动土豆，就盖在表面，不然翻到下面容易粘锅，继续盖锅盖炖，炖一会后将大葱，菜椒和甜椒放入，继续炖。","炖到汁收的差不多时可以进行翻面，将土豆与汤汁相吸，最后关火盛出。","另：此做法可以吃面，买粗面剂子，将粗面剂子压扁，然后用手拉成宽面，一定要是宽面，下好后可以放入到大盘鸡中，与汤汁搅拌味道极佳！"],"x":[]},{"t":"无骨鸡爪","c":"main","cu":"Chinese","m":480,"p":"chicken","ing":["鸡爪","姜","料酒","大葱","大蒜","小米辣","洋葱","生抽","蚝油","黑醋"],"tp":"","d":5,"k":815,"i":"酸辣开胃、口感 Q 弹，是一道家常凉拌小吃。鸡爪富含胶原蛋白，对皮肤有益。去骨步骤繁琐费力，制作难度较高，不太适合新手尝试。全程耗时约 8 小时 15 分钟。","q":["一份正好够 2-3 个人吃。","鸡爪 1kg","姜 4 片","料酒 65g","大葱 3 段（5cm 一段）","大蒜 10 瓣","小米辣 4 个少辣，6 个中辣，12 个大辣（推荐大辣）","洋葱 （半个）","生抽 75g 15g × 5","蚝油 30g 15g × 2","黑醋（推荐陈醋） 50g","白糖 10g","盐 3g","花椒油 10ml","香菜 3 颗","柠檬 2 颗（以 1 颗为单位来调整酸度）"],"s":["用剪刀 / 刀 把鸡爪上的指甲的部分全部剪掉 包括指甲下面的肉和骨头，让它一点指甲都不剩。","用水把他们洗干净，放一边。","把鸡爪放入大锅中，准备去腥味。","大葱，料酒，姜 全放进去。","加水没过鸡爪。","大火煮开 中途可以把浮末捞起来。","水开100度，沸腾后等 10 分钟。","关火，捞出来，把水沥干，洗干净，放入盆里。"],"x":["操作时，需要注意观察沸腾的水位线，如发现低于 3/4 的食材应加热水至没过食材。","鸡爪去骨教程 ：bili_89324373958。"]},{"t":"杀猪菜","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["血肠","酸菜","排骨","料酒","辣椒","香叶","八角","葱结","香油","菜籽油"],"tp":"","d":4,"k":1657,"i":"这是一道源自东北的经典炖菜，酸爽鲜香、暖心暖胃。酸菜富含乳酸菌和膳食纤维，排骨提供优质蛋白与钙质，血肠则能补充铁元素。制作时需要耐心处理血肠以防煮爆，对厨房新手有一定挑战。从备料到出锅，预计耗时约一小时。","q":["血肠 200 克","酸菜 500 克","排骨 400 克","料酒 10 克","蒜瓣 5 个","姜粉 5 克","干辣椒 5 个","香叶 2 片","八角 1 个","葱结 1 个","香油 10 克","菜籽油 10 克","盐 5 克","蘸料：辣椒油 5 克、生抽 10 克、蒜蓉 5 克、香油 2 克。"],"s":["血肠用牙签多扎一些小孔，然后放水中小火煮十分钟，不要让水烧开，保持 80 度，否则血肠非常容易爆开。","煮好的血肠切块备用。","排骨放料酒焯水，控干水分备用。","锅内放入菜籽油，放蒜瓣，干辣椒，姜粉炒香。","放入排骨翻炒至表面金黄。","酸菜洗净拧干水分，放入锅中，加入香油翻炒，香油可以更好的去除酸味而且让酸菜更香，大火翻炒二分钟。","加入 600 毫升热水。","转入电压力锅，加香叶，八角，葱结，盐。","浓香模式压 40 分钟。","到时间后放气开盖。加入血肠和枸杞，盖上锅盖焖二分钟即可，血肠是熟的，不需再加热。","倒入盆中，按照上表调制蘸料，即可开吃。"],"x":[]},{"t":"枝竹羊腩煲","c":"main","cu":"Chinese","m":68,"p":"lamb","ing":["羊腩","腐竹","柱侯酱","腐乳","南乳","老抽","料酒","蚝油","清水","冰糖"],"tp":"","d":5,"k":2391,"i":"这是一道源自广东的传统煲仔菜，羊肉与腐竹在柱侯酱和腐乳的调和下，酱香浓郁，口感肥美而不腻口，暖身暖心，尤其适合寒冬食用。羊肉富含蛋白质和铁质，能温补气血，腐竹则提供优质植物蛋白，搭配起来营养均衡。虽然备料和炖煮步骤较多，但全程火候控制并不复杂，新手只需按部就班也能成功。预计从准备","q":["羊腩 500g","炸腐竹 30g-50g","柱侯酱 30g","腐乳 40g","南乳 35g","老抽 5ml","辣椒油 5ml","清水 500ml","冰糖 20g","砂糖 10g","小葱 5 根","姜片 6-8 片","香菇 7-8 个","洋葱 1 个或红葱头 4 - 5 个","蒜瓣 7-8 瓣","香叶 1 片","八角 4-5 个","桂皮 10g"],"s":["准备工作: 香菇提前浸泡 2 - 3 小时至变软。腐竹提前浸泡 30 分钟至变软。","准备酱汁 1: 南乳、柱侯酱、20g 腐乳、老抽放入同个小碗中搅拌均匀。","准备酱汁 2: 20g 腐乳、砂糖、辣椒油放入同个小碗搅拌均匀。","泡好的香菇去除根部。","泡好的腐竹切成 5cm 的小段，挤干水分。","洋葱去皮切丝。也可以用去皮红葱头进行替代，口味更佳。","小葱切成大约 5cm 的葱段。","羊腩冷水下锅，放入 2 - 3 片姜片，倒入凉水，大火煮至水滚后关火。","捞出羊腩，放入准备好的冷水盆中放凉，使其更有嚼劲。","锅烧热后放入冷油，放入 4 - 5 片姜片、洋葱/红葱头、葱白段、7 - 8 瓣蒜瓣进行爆香。","放入冷却好的羊腩，用筷子搅拌大约 2 - 5 分钟直至出现金黄色。","放入调好的酱汁 1 ，翻炒大约 2 分钟至颜色均匀。","倒入清水至刚好没过食材。","放入香菇、冰糖、香叶、八角、桂皮。","加盖转小火炖 90 分钟。","开盖加入腐竹，加盖转中火煮 20 分钟。","开盖加入酱汁 2 搅拌均匀。","关火，出锅前加入葱绿段或香菜。"],"x":["此菜属于粤菜，正宗做法多会添加马蹄。考虑到萝卜青菜各有所爱，也可根据个人口味替换成土豆、萝卜等其他食材。","参考资料：[枝竹羊腩煲 Lamb Stew with Bean Curd Sheet [by 點Cook Guide]](https://www.youtube.com/watch?v=ThVDpVoToDQ)"]},{"t":"柱候牛腩","c":"main","cu":"Chinese","m":60,"p":"beef","ing":["炖煮锅，高压锅","牛腩","花雕酒，白酒"],"tp":"","d":4,"k":980,"i":"这是一道经典广式风味菜肴，肉香浓郁，色泽红亮，带筋牛腩软烂入味，口感丰富。富含优质蛋白质和胶原蛋白，滋补暖身。虽需一定耐心，但使用高压锅能大幅缩短时间，对新手也较友好。普通炖煮约需 3 小时，用高压锅则约 1 小时即可完成。","q":["牛腩 500-600g","姜 30g","小米辣 1 条（可根据口味调整用量）","香叶 2 片","花椒 0.5g","八角 2 个","干辣椒 3 个（可根据口味调整用量）","丁香 3 个","甘草 2 片","南腐乳 2 块","郫县豆瓣酱 15g","冰糖 10g","花雕酒 10g","白酒 20g","柱候酱 50g","蚝油 20g","老抽 5g","生抽 60g","叉烧酱 20g"],"s":["碗 1：姜切成 1.5cm×1.5cm 的小块，半头蒜剥好皮，如果有小米辣切成 1cm 小段。","碗 2：放入 2 片香叶，0.5g 花椒，2 个八角，3 个干辣椒，3 个丁香， 2 片甘草。","碗 3: 放入 2 块南乳。","碗 4: 放入 15g 豆瓣酱。","碗 5: 放入 10g 冰糖。","碗 6：倒入花雕酒 10g 和白酒 10g。","碗 7：加入 50g 柱候酱，20g 蚝油，20g 叉烧酱，5g 老抽，60g 生抽。","牛肉不用切，直接冷水下锅，开大火焯水，水沸腾时将牛肉捞出。","冲洗牛肉表面的杂质后，切成 4cm×4cm×4cm 的大块，控干水后放入碗中备用。","大火，热锅下油，把碗 1（姜、蒜、小米辣）倒入锅中，炒香。","中小火，倒入碗 2（香料），翻炒均匀，大概 30 秒。","中小火，放入碗 3（南乳），用锅铲把南乳压碎。","中小火，放入碗 4（豆瓣酱），翻炒均匀，大概 30 秒。","中小火，放入碗 5（冰糖），炒至融化。","中小火，下入牛腩，炒至牛肉上色。","大火，沿锅边淋入碗 6（酒），快速翻炒，炒至牛肉表面略微焦褐。","倒入碗 7（酱料），快速翻炒，留意底层汁水，炒至不停冒小气泡，汤汁略微浓稠。","将锅内全部食材转移至另一个炖煮锅或高压锅，加水淹过食材。","a. 普通炖煮锅：小火炖煮 3 个小时。","b. 高压锅：压 40 分钟。"],"x":["参考: 柱候牛腩+茅根马蹄竹蔗水教程。","操作高压锅要注意安全哦！"]},{"t":"桂林十八酿","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["原则：万物皆可酿","猪肉馅","虾滑馅","鱼肉馅","混合馅"],"tp":"","d":3,"k":468,"i":"桂林传统酿菜系列，将调好味的猪肉、虾滑等馅料酿入青椒、苦瓜、田螺、茄子等十多种中空食材中，煎焖成菜，一菜一味，鲜香多汁，口感软嫩或弹牙，属于浓郁的地方家常风味。馅料提供优质蛋白质，搭配多种蔬菜，富含维生素与膳食纤维，营养较为均衡。制作步骤需要逐一填馅和掌控火候，稍需耐心，但操作逻","q":["核心公式：管状物 + 肉馅 + 煎/焖 酿"],"s":["所谓\"酿\"，就是找一个中空的管状食材作为容器，把调好味的肉馅塞进去，再煎或焖熟。","青椒酿：青椒去籽挖空 → 塞入猪肉馅或虾滑 → 煎至虎皮色 → 酱汁焖煮。","田螺酿：田螺焯水取肉 → 螺肉与猪肉剁碎混合 → 塞回螺壳 → 紫苏薄荷焖煮。","换成其他管状食材，同样的工序再来一遍，就是一道新菜。苦瓜酿、茄子酿、豆腐酿……皆是如此。","猪肉馅：最基础通用的选择，肥瘦 3:7 口感最佳。","虾滑馅：鲜甜弹牙，青椒酿里常用。","螺肉猪肉混合馅：田螺酿的灵魂，螺肉与猪肉 1:1，加紫苏薄荷。","混合馅：猪肉 + 虾滑混搭，鲜甜与油脂香兼得。","一个容器配一种馅，换一个就是一道新酿。当地有\"万物皆可酿\"的说法，正是这个道理。"],"x":["18 种容器 × 4 种馅料 = 72 种组合，实际常用组合约 20 余种。","青椒酿 — 青椒酿肉 / 虾滑酿青椒（fork 版本）","田螺酿 — 螺肉猪肉 1:1，配紫苏薄荷。"]},{"t":"梅菜扣肉","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["五花肉","梅菜","五香粉","食用油","白砂糖","老抽","生抽","小米椒","蒜末","食用盐"],"tp":"","d":4,"k":3756,"i":"这是一道客家传统名菜，成菜酱红油亮、汤汁黏稠，扣肉肥而不腻、软烂醇香。五花肉富含优质蛋白和脂肪酸，搭配梅干菜能提供膳食纤维。整体工序稍多，需要掌握煮、炸、蒸的火候，对新手有一定挑战。从备料到出锅，连同浸泡梅菜的时间在内，大约需要 2.5 小时。","q":["五花肉 200 g","梅菜 30 g","五香粉 2 g","食用油 300 ml","白砂糖 5 g","老抽 30 ml","生抽 20 ml","小米椒 1 个","蒜末 10 g","食用盐 2 g","鸡精 2 g"],"s":["梅菜放到清水中，浸泡 1 小时。","锅中倒入 50 ml 食用油，将整个五花肉猪皮朝下，放到锅中 1 分钟 ，取出挂掉猪皮 【可选】。","锅中加入开水，放入五花肉，大火煮 20 分钟 （筷子可以插进五花肉），取出五花肉。","在五花肉表面涂抹均匀老抽、五香粉、白砂糖，放置 15 分钟。","起锅烧油，加入五花肉，中火油炸直至两面金黄色（3-5 分钟）","起锅烧油，倒入梅菜，加上小米椒、蒜蓉、鸡精、食用盐后翻炒，直至炒干梅干菜水分。","五花肉切片（后端 0.5-1 cm）,放在大碗中，散上梅干菜。","中火蒸 45 分钟。","拿个盘子倒盖在五花肉大碗中，将五花肉倒在盘子中。"],"x":["制作过程中发现，脆皮五花肉真香 Orz~。","不喜欢吃甜的可以去掉白砂糖，不影响主流程。","倒数第二个步骤，可以根据个人喜好调整时间。","炒干梅干菜的作用是为了后续吸油（盲猜）"]},{"t":"椒盐排条","c":"main","cu":"Chinese","m":40,"p":"egg","ing":["大排","鸡蛋","盐","椒盐粉","葱姜水","面粉","淀粉","吉士粉","水","油"],"tp":"","d":4,"k":1290,"i":"椒盐排条是上海本帮菜里的经典家常菜，外酥里嫩，咸香适口。猪大排提供优质蛋白质和必需氨基酸，能补充体力。这道菜虽然步骤稍多，但跟着流程走并不难，新手也可以大胆尝试。从备料到出锅，大约需要 40 分钟。","q":["大排 4 块（大约 360 克）","鸡蛋 1 个 50 g","盐 1 g","椒盐粉 10 g","葱姜水 100 ml","面粉 80 g","淀粉 80 g","吉士粉 2-3 g（增色增香，没有可以不放）","水 10 g","油 10 g"],"s":["大排洗干净，剔骨，用刀面拍松，切成厚片，再改成粗条。","加入椒盐粉，搅匀，待到出胶质了分次加入葱姜水，放入冰箱腌制 20 分钟。","制作炸糊。放入 80 g 面粉，20 g 淀粉（注意是 20 g 淀粉，剩下 60 g 备用），2 - 3 g 吉士粉，盐 1 g。","打入一个鸡蛋，搅拌，再分次加入水 100 g ，再加 10 g 油，反复搅拌。直到炸糊完全调开，略粘稠即可。","取出剩余的 60 g 淀粉，取出排条，裹上一层淀粉，再裹上面糊。","锅中加入油，能没过食材即可，加热到大约 150 ℃ - 160 ℃ 。下入排条炸成浅金黄色后捞出。刚下入排条时可能会有粘连，不要动。待排条定型后可用筷子翻动，即可分开。","待油温再次升高到 150 ℃ - 160 ℃ 时，下入排条复炸至金黄色后捞出。","撒上椒盐粉，搅拌均匀后出锅。"],"x":["也可以用面包糠代替炸糊，但口感差距很大。","炸糊也可以用来炸鸡腿、炸鱼等。","参考：椒盐排条的做法。"]},{"t":"水煮牛肉","c":"main","cu":"Chinese","m":44,"p":"beef","ing":["牛肉","豆芽","鸡蛋","香菜","豆瓣酱","料酒","淀粉","干辣椒粉","姜","蒜"],"tp":"","d":3,"k":431,"i":"水煮牛肉是川菜中的经典麻辣味型，口感滑嫩、汤汁红亮、香辣烫鲜。牛肉富含优质蛋白质和铁，搭配豆芽可补充膳食纤维。这道菜对新手来说不算太难，但需注意火候和泼油安全，整体制作约需四十分钟。","q":["牛肉 300g","豆芽 100g","鸡蛋 1 个","香菜 5 根","豆瓣酱 10g","料酒 10ml","淀粉 15g","干辣椒粉 5g","姜 20g","蒜 3 瓣","红辣椒 1 根","蚝油 8g"],"s":["牛肉洗干净切片。","加入 15g 姜丝，1 个鸡蛋，15g 淀粉，8g 蚝油，10ml 料酒搅拌均匀，腌制 15 分钟。","香菜洗干净切好。","锅里倒油，加入豆瓣酱，5g 姜丝，蒜片。","倒入开水，煮成红汤。","豆芽洗干净去掉尾须，放进开水里焯熟。","将豆芽铺入碗底。","将牛肉片一片一片的放进红汤中，煮熟以后捞出。","将牛肉铺在豆芽上，撒上香菜梗。","撒上香菜叶，辣椒粉，辣椒圈。","另起锅烧热油，将热油淋在菜上面，就完成了。"],"x":["参考: 水煮牛肉的详细步骤。"]},{"t":"水煮肉片","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["猪里脊肉","食用盐","胡椒粉","生抽酱油","料酒","鸡蛋清","土豆淀粉","植物油","豆芽","凤尾"],"tp":"","d":5,"k":361,"i":"水煮肉片是一道麻辣鲜香、肉片滑嫩、配菜爽脆的经典川菜，极其适合下饭。猪里脊提供优质蛋白质，搭配豆芽等蔬菜，营养均衡。做法稍显繁琐，尤其需要耐心腌制肉片和制作刀口辣椒，新手大约需要 1 至 2 小时完成。","q":["里脊肉的用量为 300g","小葱 2 根","生姜 10g","大蒜 20g","红泡椒 20g（根据受辣程度选择 0-40 g）","蒜苗 2 根","芹菜 3 根","红油瓣酱 5ml","鸡精 1.5g","生抽酱油 5g","食用盐 5g","胡椒粉 2g","料酒 3g","鸡蛋清 1 个","土豆淀粉 7g","植物油 280g（根据情况选择，想吃重油就多加 100g）","菜籽油 200g（根据情况选择，想吃重油就多加 100g）","绿豆芽 100g","凤尾 1 根","白砂糖 1g","小米辣干辣椒 20g（根据受辣程度选择 0-40g）","青花椒 5g（根据情况选择，想吃麻就多 5g）"],"s":["里脊肉改刀成小块，再切成 2 毫米薄片（可根据自己的口感改进），放入碗中，加入清水清洗两遍来去除血水和杂质，捞出挤干水分备用。","碗中加入食用盐 1.5g，胡椒粉 1g，生抽酱油 5g，料酒 3g，然后朝着一个方向搅拌 2 分钟，使其入味。","另外准备一个碗，加入一个鸡蛋清，加入 7g 土豆淀粉，一个方向搅拌均匀，倒入肉中。","再次一个方向搅拌均匀（肉表面就形成了润滑膜，这样会使肉更加鲜嫩）","最后再加入 30g 植物油轻轻搅拌（防止肉片粘连）。","绿豆芽 100g，凤尾 1 根（改刀成小条），芹菜 3 根切成小段，蒜苗 2 根拍散切成小段。","大蒜 20g 剁碎，生姜小块剁碎，红泡椒 20g 剁碎。","小米辣干辣椒 15g，青花椒 3g，锅内加入油滑锅，油稍许热了将多余的倒出备用留 50g 底油，下入干辣椒、花椒，开小火炒香，切记不要炒糊（颜色要变黑即可），倒出在菜板上剁细。","锅烧热，放入 100g 植物油烧至 6 成热，加入 2g 青花椒、干辣椒爆香，配菜下锅，加入 1g 食用盐，炒至断生，盛入碗中垫底备用。","锅洗干净，加入 150g 植物油烧至 6 成热，加入制作好的姜蒜红泡椒，爆香后加入豆瓣 10g，开小火把豆瓣爆香炒出红油即可。","加入 800 毫升清水（根据实际情况选择），大火烧开，转小火调味，加入食用盐 2.5g，鸡精 1.5g，1g 白砂糖提鲜，1g 胡椒粉，5g 水淀粉（根据实际情况选择）将汤汁收浓稠一点。","汤汁开后，开小火将腌制好的肉片分开依次下锅，然后开中火将肉片烫熟，用锅铲轻轻推动一下避免粘连，待汤汁烧开，肉片熟后捞出放入碗中配菜上，再将原汤倒入（不超过菜品）。","碗中均匀撒上刀口辣椒、蒜蓉和葱花。","锅洗干净，加入 200g 菜籽油，烧至 7 成热，然后一次性均匀泼在碗中肉片上（注意安全），美味完成。"],"x":["垫底的蔬菜根据自己口味选择（蘑菇、白菜、油麦菜等）。","刀口辣椒制作嫌麻烦也可以直接用干辣椒段和青花椒代替。","特别注意肉的腌制（搅拌的时候朝着一个方向、血水处理干净），保证肉滑嫩（鸡蛋清、淀粉搅拌均匀）。","水煮牛肉也可以按照这个做法。"]},{"t":"洋葱炒猪肉","c":"main","cu":"Chinese","m":15,"p":"pork","ing":["洋葱","猪肉片","蕃茄酱","麻油"],"tp":"","d":3,"k":979,"i":"这是一道家常风味小炒，咸中带甜，酱香浓郁，洋葱炒软后滋味温和，搭配嫩滑猪肉片非常下饭。猪肉提供优质蛋白质和 B 族维生素，洋葱含膳食纤维和多种抗氧化物，开胃助消化。操作简单，新手也能轻松上手，预计制作时长仅需 15 分钟。","q":["洋葱 一颗 （是主角，喜欢吃洋葱可以多半颗～一颗）","猪肉 (250g)","蒜头 （3 瓣）","食用油 (15ml)","黑胡椒 (1.25g)","酱油 (30ml)","糖 (15g)","麻油 (5ml)","番茄酱 (15ml)","料酒 (15ml)","备注：可以考虑购买茶匙，大匙来精准确定用料的量。"],"s":["洋葱切片，猪肉，蒜头拍碎，以及混合上述调味料备用。","炒锅内倒入 1 大匙食用油（等待 10 秒让油温升高），倒入猪肉。","炒至变色后下蒜头炒香盛起备用。","原锅下洋葱翻炒 3~4 分钟后加入调味料炒匀。","下刚盛起备用的猪肉翻炒至猪肉熟后。","待猪肉熟后再翻炒 1、2 分钟即可起锅。"],"x":["猪肉可选猪肩肉片或是切好的肉丝看个人喜好。","爱料理。"]},{"t":"淄博烧烤","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["猪五花肉","小薄饼","大葱","芝麻酱","甜面酱","芝麻盐","烧烤炉","烤网","炭火或燃气"],"tp":"","d":4,"k":650,"i":"这是一道山东淄博特色烧烤，小饼卷肉配大葱的吃法风味独特，肉香、酱香与葱香交融，口感层次丰富。五花肉富含优质蛋白质和脂肪，大葱提供膳食纤维，搭配小饼能快速补充能量。制作需要控制炭火火候和翻烤技巧，对新手稍具挑战，全程约 40 分钟即可完成。","q":["每份为 1 个人吃的量，多人按比例加量即可。","猪五花肉 200g","小薄饼 5 张","大葱 1 根（约 100g）","芝麻酱 20g","甜面酱 15g"],"s":["五花肉切成厚度不超过 2cm 长的块，并串成串。（五花肉可以预先腌制一下，味道更佳）","大葱切成 5cm 长的葱段，备用。","芝麻酱加 10ml 温水调稀，与甜面酱混合均匀，备用（可以换成\"芝麻盐\"）","点燃炭火，等待炭火烧至通红无明火状态（约 15 分钟）","将五花肉串均匀摆在在烤网上，烤至底面焦黄出油后翻面。","继续烤制约 2 - 3 分钟，至两面焦黄、边缘微焦后取下。","取一张小薄面饼平铺，抹上 3 - 4g 混合酱料。","放上烤好的肉片和 1 - 2 段大葱，卷起即可食用。"],"x":["五花肉切片时建议放入冰箱冷冻 30 分钟后再切，更易切块。","炭火烤制风味优于燃气，有条件建议使用木炭。","酱料可根据个人口味调整芝麻酱与甜面酱的比例，也可以换成芝麻盐。"]},{"t":"清蒸鳜鱼","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["鳜鱼","大葱","小葱","生抽","红辣椒","姜片","食用油"],"tp":"","d":3,"k":359,"i":"清蒸鳜鱼肉质细嫩，鲜甜本味突出，是讲究原汁原味的家常河鲜做法。鳜鱼富含优质蛋白和多种微量元素，易于消化吸收。处理时需小心鱼鳍，但整体步骤不复杂，新手稍加注意也能胜任。从备料到出锅，大约只需半小时。","q":["鳜鱼 500g","大葱 1 节","小葱 2 根","生抽 30g","红辣椒 1 颗","姜片 3 片","食用油 20ml"],"s":["鳜鱼从腹部切开，去除鱼鳃和内脏，打去鱼鳞，用到在表皮上刮去粘液（这一步也可让热心摊主处理）","鳜鱼身上打上花刀，放姜片，有条件的可以放点猪油，装盘在下面垫一个筷子，便于蒸制时受热均匀。","大葱划开后去除中间的芯，只保留外面两层。","小葱划开备用。","红椒去除辣椒籽和里层辣椒肉备用。","将准备好的大葱、小葱、辣椒码在一起，切成丝泡在水里备用。","锅里加水，水量大一些，水热后放入鳜鱼，盖上锅盖，大火蒸制 8 - 10 分钟，蒸鱼四字窍门：汽大火足。","蒸鱼过程，另起一个过热油，油需要烧到冒烟。","蒸制结束后，倒掉蒸鱼的水，去除姜片，放上葱丝，浇上热油。","在倒入生抽或蒸鱼豉油即可上桌。"],"x":["鳜鱼背部鱼鳍容易伤人，处理时候需要注意，最好用剪刀剪掉。","蒸制时间需要根据鱼的大小调整，蒸鱼的关键在于水多汽大火足。"]},{"t":"湖南家常红烧肉","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["带皮五花肉","干小米椒🌶","姜","生抽","老抽","香叶","桂皮","八角","冰糖","料酒"],"tp":"","d":3,"k":1348,"i":"湖南家常红烧肉是一道湘味浓郁的家常菜，五花肉经慢炖后肥而不腻、入口软糯，咸香中带着微辣回甘。富含优质蛋白和脂肪，能为身体提供充足能量。制作需要一些耐心，对新手有一定挑战，但按步骤操作不难掌握，预计全程约 1 小时。","q":["一份正好够 2 人吃。","五花肉：500g","食用油：10g","香叶 5 片","姜 3 片","桂皮 1 小块","冰糖 6 颗","料酒 20 克","生抽 5 克","老抽 2 克","盐 2 克","八角 3 颗"],"s":["带皮五花肉洗净冷水下锅，加入姜片 2~3 片去腥味，煮到沸腾捞出冷水冲净白沫。","五花肉切块，尺寸 1.5cm×1.5cm 块状大小。","热锅加入油，加入冰糖小火搅拌至焦糖色即可，加入切好的五花肉，中火翻炒上色。","加入备好的姜片、八角、桂皮、生抽、老抽、料酒、干小米椒、盐，小火翻炒 1 分钟，加开水没过肉。","加盖中火煮沸，转小火慢顿 30 分钟，慢炖期间，间隔 10 分钟搅拌一次防止粘锅。","小火慢炖汤汁剩三分之一的时，调成中火收汁出锅。"],"x":[]},{"t":"湘祁米夫鸭","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸭子","糯米粉","粘米粉","蒸肉粉","细辣椒粉","白胡椒粉","五花肉","姜蒜","盐","食用油"],"tp":"","d":4,"k":1332,"i":"湖南两祁地区传统特色菜，鸭肉煸炒后裹上混合米粉蒸制，口感软糯，咸香入味，回味悠长。鸭肉富含优质蛋白质和 B 族维生素，搭配米粉提供能量，营养均衡。制作需先煸炒再高压蒸制，稍有难度，适合有一定烹饪基础的朋友。从备料到出锅大约需要 1 小时，若选用老鸭需延长蒸制时间。","q":["正常 3-4 人吃","鸭子：1000g","糯米粉：100g","粘米粉: 300g","蒸肉粉: 50g","细辣椒粉: 50g","白胡椒粉：5g","五花肉：50g","姜蒜：20g","盐：10g","食用油：10g","开水：100g"],"s":["将糯米粉、粘米粉、蒸肉粉、细辣椒粉、5 克盐、白胡椒粉倒一起搅匀。","鸭子让热心摊主剁成蒸煮块，姜切片，蒜子剥皮，五花肉切片即可。","热锅凉油煸炒五花肉出油，再加食用油烧热，下入鸭子煸炒。","鸭子煸炒到表皮焦变色，下入姜蒜和盐继续煸炒香味。","关小火倒入米粉翻炒，鸭肉均匀裹满米粉子，加入开水，少量多次的加，边加边翻炒。","翻炒鸭肉和米粉有湿感，铲出入碗中，高压锅放水蒸 20-25 分钟。","出锅前撒点葱花即可享用了。"],"x":["这是一道家乡菜。","鸭子品种不限，这里买的是水鸭，价格 24。","蒸 20 分钟，是老鸭的话，蒸一个小时以上。","第一步中粘米粉是主要的粉子，糯米粉是加软糯口感，蒸肉粉是加五香味道，辣椒粉和胡椒粉是加复合香味。"]},{"t":"澳门湿版免治牛肉饭","c":"main","cu":"Chinese","m":30,"p":"beef","ing":["牛肉末","洋葱","鸡蛋","黄油","小葱","生抽","老抽","番茄酱","白糖","料酒"],"tp":"","d":2,"k":1011,"i":"这是一道经典的澳门葡式风味快餐，牛肉碎嫩滑咸香，裹着浓郁酱汁和半熟蛋液，拌入米饭后口感油润诱人。牛肉末提供优质蛋白质，搭配鸡蛋和洋葱，营养均衡管饱。操作步骤简单易上手，特别适合新手尝试，从备料到出锅大约只需 30 分钟。","q":["牛肉末 200g","鸡蛋 1 个（用于制作水波蛋或半熟煎蛋）","生抽 3 汤匙（1 汤匙用于腌制，2 汤匙用于料汁）","番茄酱 2 汤匙","料酒 1 汤匙","淀粉 1 汤匙","清水 50ml"],"s":["将 200g 牛肉末放入碗中，加入 1 汤匙生抽、半汤匙白糖和 2g 黑胡椒，搅拌均匀，等待腌制 10 分钟。","将半个洋葱切成小丁，备用。","调制料汁：在碗中加入 2 汤匙生抽、2 汤匙番茄酱、1 汤匙料酒、1 汤匙淀粉、半汤匙老抽和 50ml 清水，搅拌均匀备用。","另起一锅，制作一个水波蛋或半熟煎蛋，备用。","热锅，放入 10g 黄油。待黄油融化后，放入洋葱丁，小火煎熟至散发香味。","加入腌制好的牛肉末，与洋葱一起翻炒至牛肉变色。","倒入调好的料汁，撒上 2g 黑胡椒，继续炒制直至汤汁变粘稠后关火。","将炒好的免治牛肉浇在热米饭上，放上提前准备好的水波蛋或半熟煎蛋。","（可选）表面撒上 5g 切好的小葱花作装饰。"],"x":["如果没有黄油，使用普通食用油也可以，但黄油会增加独特的奶香味。","吃的时候将半熟的蛋黄戳破，与牛肉和米饭拌匀食用，口感最佳。"]},{"t":"烤鸡翅","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸡翅中","盐","黑胡椒粉","酱油","料酒","烤箱"],"tp":"","d":3,"k":187,"i":"腌制入味的鸡中翅经高温烘烤，外皮微焦、内里鲜嫩多汁，带有黑胡椒和酱油的咸香。富含优质蛋白质和胶原蛋白。难度适中，新手也能轻松上手，从准备到出炉大约需要 1 小时。还可按喜好添加蜂蜜或五香粉增添风味。","q":["鸡翅用量为 3-4 个/人","盐的用量为 2 g/人","黑胡椒粉的用量为 1 g/人","酱油的用量为 3 ml/人","料酒的用量为 3 ml/人"],"s":["鸡翅放入碗中。","加盐、黑胡椒粉、酱油、料酒进行腌制 30-40 分钟。"],"x":["可以在腌制鸡翅时加入蜂蜜、酱油、姜蒜粉、五香粉等作为调味料，提升口感和香气。","烤鸡翅时，建议将烤盘底部垫上一层锡纸，便于清洁烤盘。"]},{"t":"煎烤羊排","c":"main","cu":"Chinese","m":60,"p":"lamb","ing":["羊排","桂皮","花椒","八角","白芷","香叶","盐","料酒","辣椒粉","孜然粒"],"tp":"","d":4,"k":1850,"i":"一道外酥里嫩、香气浓郁的料理，先以香料炖煮再煎出金黄脆壳，风味浓郁不腻，是家常宴客两相宜的硬菜。羊肉富含优质蛋白和铁、锌等矿物质，有助于温补气血。做法步骤稍多，但只要按流程走，新手也能拿下；使用高压锅全程约 1 小时，普通锅约 1.5 小时。","q":["羊排 750g（建议选择带一些肥肉的）","桂皮 2g","花椒 5g","八角 1 颗","白芷 6g","香叶 5 片","盐 25g（注：若计划喝煮羊排的汤，则此处的盐在炖煮步骤中省略，在最后的煎烤步骤中加入）","料酒 10ml","辣椒粉 5g","孜然粒 2g","烧烤撒料 2g","孜然粉 2g","白芝麻 2g","糖 1g"],"s":["将羊排按照骨头分布，切成块状。","炒锅中加入冷水，放入全部羊排块，水沸腾后继续焯水 2 - 3 分钟，捞出备用。","将焯好水的羊排、桂皮、花椒、八角、白芷、香叶、料酒放入锅中（高压锅或普通锅）。","加入饮用水没过所有食材。如果使用高压锅，上汽后压 30 分钟。如果使用普通锅，炖煮 80 分钟。","将炖煮完成的羊排捞出，沥干水分，放入无油无水的炒锅 / 煎锅中。","中大火煎 6 - 7 分钟，直至羊排中的油脂被煎出，表面呈金黄酥脆状态。","锅中保留煎出的羊油，加入辣椒粉、孜然粒、烧烤撒料、孜然粉、白芝麻，翻炒均匀。","加入糖和盐（如果在炖煮步骤中未添加），翻炒均匀。","翻炒均匀后即可关火，盛盘。"],"x":["花椒和白芷是这道菜的关键调料，不可缺少。","炖煮时间不宜过长，羊排过于软烂则在煎制时容易碎裂。","煎制时利用羊排自身煎出的油脂来炒香调料，风味更佳。","焯水、炖煮、煎制过程中会产生较多羊油，处理时请注意不要直接倒入下水道，以防堵塞。"]},{"t":"牛排","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["平底锅","锡箔纸","厨房纸","汤匙","橄榄油","黄油","盐","黑胡椒粉","大蒜","香料"],"tp":"","d":4,"k":1605,"i":"这是一道经典的西式煎牛排，焦香外壳包裹着鲜嫩多汁的肉心，搭配黄油、大蒜和香草，风味浓郁。富含优质蛋白质、油脂及铁、锌等矿物质。烹饪流程对新手较为友好，但掌握火候仍需一些练习，全程 15-30 分钟即可完成。","q":["牛排 450-500g（两片牛排）","黑胡椒粉 2g","盐 5g","大蒜 1 个（约 25-30g，实际用量约为 5-10g）","橄榄油 10-15ml","黄油 20-25g","口蘑 5-10 个","小土豆 5-10 个（每个约 20g）","小番茄 5-10 个（每个约 15g）","百里香 2g（若使用新鲜百里香枝条，取 3-6 根，每根约 10cm 长即可）"],"s":["从冰箱中取出牛排解冻。","如果牛排处于冰冻状态，需提前一晚转移至冷藏室，并在烹饪前半小时放置在常温中。","请勿将牛排置于水中或加热解冻。","将小番茄，小土豆和口蘑洗净，对半切开备用。","将大蒜剥皮，留 5-8 个较大的蒜瓣，用刀背压扁备用。","牛排的预处理。","对于肉眼牛排（见如何选择不同种类的牛排），使用厨房剪刀竖直插入到肉眼牛排中心的结缔组织，剪 1-2 刀。这是因为肉眼牛排的“肉眼”（即这块结缔组织）在高温下会剧烈收缩导致牛排变形，使得牛排无法均匀受热。","对于西冷牛排，如果您不喜欢西冷牛排边上的油脂，可以用刀慢慢将其剔除。","随后，使用厨房纸包裹牛排，将牛排上附着的水全部吸干，直至牛排放在案板上拿起后不留下明显水渍即可。"],"x":["煎制牛排是控制火候的艺术。限于篇幅，这里简单给出一些定量评估火力的方法和本文中用到的与火候相关的术语。更多内容参见油温判断技巧。","高火：功率 1.8Kw - 2.2kw。","中火：功率 800w - 1.4kw。","小火：功率 200w - 600w。"]},{"t":"猪皮冻","c":"main","cu":"Chinese","m":1440,"p":"pork","ing":["猪皮"],"tp":"","d":3,"k":1630,"i":"猪皮冻是北方年夜饭常见的传统凉菜，晶莹剔透，口感滑嫩 Q 弹，特别适合下酒。猪皮富含胶原蛋白，有美容养颜的作用。这道菜难度稍高，需要耐心处理猪皮去腥和长时间熬煮，预计制作时长约 24 小时。","q":["主料:猪皮 1kg、水 4kg","调料：盐 13g、味精 10g、鸡精 15g、生抽 50ml、老抽 20ml、葱 10g、葱 10g、姜片 20g","香料包：八角 10g、花椒 5g"],"s":["将猪皮，剁成不超过 10cm 小块，用清水浸泡 12 小时，然后冷水下锅，加入姜 10g、料酒 50ml 后，汆烫 5-10 分钟，捞出放入冷水中。","将焯过水的猪皮，放到案板上，将里面的白肉部分全部剔除，然后再切成成不超过 3mm 的长条，放入盆中。","加入白醋 20g，盐 5g，用力搓洗 3 分钟，再用清水洗净，这时的猪皮已经基本没什么腥味。","锅内加入 4kg 水，放入猪皮，葱 10g，姜片 10g，八角 10g，花椒 5g，大火烧开后，小火煲煮 90 分钟至猪皮软烂。","再加入盐 8g、味精 10g、鸡精 15g、生抽 50ml、老抽 20ml 调味后，倒入盘中，将葱姜，八角拣出，晾凉至果冻状。","放冰箱冷藏即可，食用时，切成小块或者厚片。"],"x":["操作时，需要注意，做猪皮冻，直接下锅煮就“废”了，也是最忌讳的，一定要用白醋和盐不断搓洗猪皮，这样保证煮好的猪皮晶莹剔透，而且还没腥味。","参考资料：铭哥说美食。"]},{"t":"猪肉烩酸菜","c":"main","cu":"Chinese","m":180,"p":"pork","ing":["猪五花肉或猪肉排骨","东北酸菜","大葱","姜","蒜","盐","生抽酱油","五香粉","料酒","大料"],"tp":"","d":5,"k":1817,"i":"猪肉烩酸菜是一道北方家常炖菜，酸香浓郁，五花肉软烂，排骨入味。主要提供蛋白质，酸菜也带来乳酸菌等有益成分。做法步骤清晰，新手也能按部就班完成，但需耐心慢炖，从头到尾大约需要 3 小时。","q":["猪排骨或者五花肉（总共） 1500 克","东北酸菜 1000 克","大葱 1 根","姜 100 克","蒜 4 瓣","盐 10 克","生抽酱油 15 克","五香粉 10 克","料酒 20 毫升","大料 2 颗"],"s":["大葱切段；生姜 50 克切段， 50 克切末；大蒜切末，备用。","全部酸菜切丝，用水冲洗 2 ～ 3 遍备用。","冲洗次数取决于个人口味，喜欢酸味，可以冲洗 2 遍。害怕酸味，可以冲洗 3 ～ 4 遍。不能不冲洗，否则会过酸。","排骨和五花肉入锅，倒入冷水淹没。放入全部葱段， 50 克生姜段和料酒 20 毫升。大火煮开后，等待 5 分钟。关火，将排骨和五花肉捞出，冷水冲洗掉浮沫，备用。","煮好的五花肉切片或者切块，备用。","将之前的锅洗干净，并且擦干（不然加入油会崩出来）。","锅中加入油，开中火，放入姜蒜末爆香，放入五花肉和排骨。将五花肉和排骨煎至金黄，倒入 10 克五香粉和 15 克 生抽酱油，用铲子翻动 1 ～ 2 分钟。","将冲洗好的酸菜丝加入锅中，翻炒 3 分钟。","倒入纯净水至刚好没过食材，加入 2 颗大料，转大火，直到锅中水沸腾。转中火，盖锅盖焖煮。","等待 1.5 ～ 2 小时，直至五花肉软烂 （可以用筷子轻松扎穿）","掀开锅盖，开大火收汤，翻动锅中食材直至锅中剩余水分只覆盖锅底，转小火，准备调味。","调味：加入食用盐 10 克，搅拌均匀。","关火，出锅。"],"x":["大火收汤时，注意不要糊锅，可以适当翻动来检查水位。","调味的技巧，最后加盐时，可以一点一点加入，搅拌后品尝味道，直到可以接受的口味。","本菜品有酸菜的特殊风味。"]},{"t":"甜辣烤全翅","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["空气炸锅","鸡全翅","生抽","老抽","蒜粉","胡椒粉","糖","甜椒粉","辣椒粉","蚝油"],"tp":"","d":3,"k":775,"i":"这道甜辣烤全翅利用空气炸锅烹制，外皮微焦、内里多汁，甜中带辣的风味很受欢迎。鸡肉富含优质蛋白质，用空气炸代替油炸大幅减少了油脂，吃起来负担更轻。制作流程清晰明了，只需提前腌制并中途翻面一次，对新手也比较友好。从处理食材到出锅大约需要 3 个小时，大部分是静置腌制的时间，实际操作并","q":["一份为一人餐，多人餐请等比例增加。","鸡全翅 4 个","生抽 45ml","老抽 15ml","蒜粉 10g","胡椒粉 5g","糖 10g","甜椒粉 10g","辣椒粉 5g","蚝油 15ml","水 20ml","油 10ml"],"s":["将 4 个新鲜鸡全翅取出，在翅中两根骨头之间用刀划开表皮，正反面各一刀。","将 4 个鸡全翅放入碗中，加入生抽 45ml ， 老抽 15ml ， 蒜粉 10g ， 胡椒粉 5g ， 糖 10g ， 甜椒粉 10g ，辣椒粉 5g ， 蚝油 15ml ， 水 20ml 以及油 10ml。","用勺子将酱汁均匀的抹在鸡全翅上，尤其是翅中的刀口处，大约花费 3 分钟。","用保鲜膜盖住防油腌制中鸡全翅的碗，放入冰箱冷藏格静置 120 分钟。","取出鸡全翅，锡纸盘中放入鸡全翅 4 个，将碗中残余酱料均匀倒在鸡全翅上。","锡纸盘放入空气炸锅的烤篮上，用 200 摄氏度烤 25 分钟。","打开空气炸锅，小心取出锡纸盘，将鸡全翅翻面。","继续 200 摄氏度烤 25 分钟。","取出即可食用。"],"x":["本例中鸡全翅口感为微辣，需增加辣度请增加辣椒粉用量，但不宜超过 30g。","鸡全翅指包含翅尖，翅中和翅根的鸡翅。","本品效果微焦，如不喜欢焦褐色外观可 不向锡纸盘中倒入残余酱汁并 每面只烤制 20 分钟。","实际烤制效果请根据自己空气炸锅的功率判断。"]},{"t":"田螺酿","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["大田螺","猪肉","新鲜薄荷叶","紫苏叶","生姜","葱","桂林三花酒","生抽","食盐","食用油"],"tp":"","d":4,"k":533,"i":"田螺酿是阳朔“十八酿”之首，螺肉韧而紧致、猪肉嫩滑，紫苏薄荷清香扑鼻，曾登上《舌尖上的中国 2》。富含蛋白质和多种微量元素，螺肉与猪肉搭配营养互补。这道菜步骤稍多，对新手有一定挑战，需提前半天让田螺吐沙，正式制作约 40 分钟，适合节假日全家一起动手。","q":["大田螺 20 个（约 1000g）","猪肉 250g","新鲜薄荷叶 10g","紫苏叶 10g","生姜 1 小块（约 15g）","葱 2 根（约 30g）","桂林三花酒 15ml","生抽 30ml（其中 15ml 调馅、15ml 调味汤汁）","食盐 5g","食用油 30ml","酸笋 50g（可选）","大蒜 5 瓣（可选，约 20g）","干辣椒 4 个（可选）","蚝油 10ml（可选）","淀粉 10g（可选）","白胡椒粉 2g（可选）"],"s":["上午买回田螺，放入清水盆中，静置一下午吐沙。","可在水中滴几滴香油（或者芥末~）加速吐沙。"],"x":["食用方法：先吮吸壳内汤汁，再用牙签挑出或用嘴猛吸出肉馅——\"嗦螺贴唇猛吸气\"。","螺肉和猪肉最佳比例为 1:1。","薄荷是这道菜的精华，紫苏配田螺是绝配，两者至少要有其一。","没有三花酒可用料酒代替，但风味会打折扣。"]},{"t":"番茄红酱","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["碎牛肉","蒜瓣","胡萝卜","芹菜","洋葱","橄榄油","糖","食盐","胡椒粉","番茄酱"],"tp":"","d":4,"k":1955,"i":"这款意式风味酱料香浓可口，蔬菜与牛肉的搭配带来丰富口感。它富含蛋白质和多种维生素，营养均衡。制作过程稍有繁琐，需要一些烹饪基础，例如炒出颗粒感的牛肉和控火慢煮。从备料到完成约需一小时，一次可多做一些冷冻保存，随取随用十分方便。","q":["碎牛肉 500g","蒜瓣 2 个","糖 2g","食盐 10g","黑胡椒粉 5g","番茄酱 300g","牛奶 300ml"],"s":["将胡萝卜、芹菜、洋葱切碎，蒜瓣切片。","加入 10ml 橄榄油，热油下锅蔬菜，大火翻炒开始略微变色后盛出。","锅内加油 10ml，加蒜翻炒 10 秒，加入碎牛肉、糖、盐、胡椒粉和香料将牛肉炒脆（有颗粒感）。","加入炒好的蔬菜们和番茄酱继续翻炒，搅拌均匀。","分多次缓缓倒入牛奶，中小火煮 30 分钟，完成。"],"x":["考虑各个品牌的番茄酱内含盐量不同，建议在炒牛肉时少放盐，煮的时候尝一下再调味。","煮酱料期间请搅动，以免粘锅。如果酱料变粘稠就可以出锅啦！","可根据个人口味，将碎牛肉替换成一半碎猪肉一半碎牛肉，牛奶替换成鸡汤或饮用水。"]},{"t":"瘦肉土豆片","c":"main","cu":"Chinese","m":60,"p":"none","ing":["纯瘦肉","土豆","蒜苗","生粉","生抽","老抽","食用盐"],"tp":"","d":3,"k":585,"i":"一道快手家常小炒，肉片滑嫩，土豆片软韧入味，带有蒜苗清香，属于典型的家常菜风格。瘦肉富含优质蛋白质和铁质，土豆提供碳水化合物和膳食纤维，搭配均衡。制作流程简单明了，需注意刀工和火候，适合有一定基础的新手尝试。从备料到出锅，预计 大约 1 小时即可完成。","q":["1 人食用版本","纯瘦肉 200g","土豆 200g","蒜苗 2 根（约 20 g）","生粉 5g","生抽 10g","老抽 3g","食用盐 2g"],"s":["土豆去皮、对半切开，再切成约 2mm 的薄片，备用。","蒜苗洗净，切成约 1cm 的段，备用。","瘦肉洗净切成约 2mm 的薄片，放入碗中，加入 5g 生粉、5g 生抽、3g 老抽腌制十分钟，备用。","瘦肉腌制时，烧一锅开水，将土豆片放入锅中，焯水，约 5 分钟。","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高。","放入瘦肉，翻炒至变色，倒入蒜苗一起炒，蒜苗炒约 20 秒。","放入土豆，保持翻炒，加入 2g 食用盐、5g 生抽。","炒约 3 分钟，盛盘。"],"x":["土豆片焯水注意不宜太久，防止土豆片变软。","腌制瘦肉要搅拌均匀。"]},{"t":"白菜猪肉炖粉条","c":"main","cu":"Chinese","m":45,"p":"pork","ing":["五花肉","白菜","土豆干粉条","十三香","鸡精","食用盐","老抽","生抽"],"tp":"","d":3,"k":1880,"i":"猪肉白菜炖粉条是东北地区经典的家常炖菜，汤汁浓郁咸鲜，五花肉软烂、粉条吸饱肉香后滑韧入味，白菜清甜解腻。整道菜荤素搭配均衡，能提供蛋白质、维生素和碳水化合物，营养饱腹。制作过程需要一些耐心，特别是粉条处理和炖煮火候，对新手有一定挑战，但按步骤操作不易失败，从头到尾大约需要 45 ","q":["五花肉 300g","大白菜 500g","土豆干粉条 50g","十三香 10g","鸡精 5g","食用盐 15g","老抽 5ml","生抽 5ml"],"s":["锅内烧水，水开后放入干粉条，煮 5 分钟后同水一起倒出容器中，盖上盖子继续浸泡泡 备用（第一步先做这个，期间可以进行以下步骤）","五花肉切 3mm 的肉片，备用。","大白菜嫩叶与白菜帮子分开切成 2 份菜片，备用。","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高。","放入五花肉，保持翻炒至肉变色。","加入老抽，炒 1 分钟，给肉上色。","加入白菜帮子，加入食用盐、生抽，炒一分钟（如果粘锅，烹入 10ml 水）","加水没过所有食材，加入鸡精 ，十三香，沸腾后，将火调小然后等待 20 分钟。","粉条滤水切成小段放入碗中 备用。","加入白菜嫩叶，炒匀后将粉条放在菜上方，加盖再煮 5 分钟。","尝味、关火，收汁。"],"x":["土豆干粉条煮制时间长，可以放在第一步，期间进行其他步骤。","最后一步尝味，如果发现有味道淡、未熟，继续加盖煮一段时间。"]},{"t":"空气炸锅脆皮现腌炸鸡","c":"main","cu":"Chinese","m":55,"p":"chicken","ing":["新鲜鸡翅中","生抽","蒜粉","paprika","洋葱粉","黑胡椒粉","中筋面粉","淀粉","食用油","空气炸锅"],"tp":"","d":4,"k":700,"i":"空气炸锅炸鸡是一道先腌后炸的家常肉菜，外壳酥脆、内里多汁，调味可以按口味灵活切换。鸡翅富含优质蛋白和脂肪，适合作为正餐主菜或加餐。实操约 55-70 分钟（含一次裹粉；若选二次裹粉时约 70-90 分钟），如追求最佳效果，可冷藏腌制过夜（提前一天准备，第二天再炸）。","q":["鸡翅中 6 个（约 300g）","生抽 15ml","酸奶或牛奶 5ml（可选）","鸡蛋 1 个（可选，用于裹浆）","蒜粉 13g","paprika 10g（红甜椒粉）","洋葱粉 5g","黑胡椒粉 5g","中筋面粉 60g","淀粉 30g","泡打粉 1g","食用油 5ml"],"s":["鸡翅中清洗后擦干水分，每个鸡翅两面各划 2 刀，方便入味。","调制腌料：生抽 15ml、蒜粉 8g、红甜椒粉 5g、洋葱粉 3g、黑胡椒粉 3g，牛奶或希腊酸奶 5ml（可选，让鸡肉更滑嫩）搅拌均匀。","将腌料和鸡翅中一起放到大 zip 保鲜袋里充分搅拌按摩，在冰箱里静置一晚。"],"x":["本菜谱也可以用来炸带骨鸡腿，只需相应调整配料的用量和炸制的时间。","蒜粉、红甜椒粉和洋葱粉可以根据个人口味调整用量。","想做辣味：在裹粉中加入辣椒粉 3g，或在出锅后撒辣椒面 2g。","想做孜然味：在出锅后撒孜然粉 2g 和白芝麻 2g。"]},{"t":"粉蒸肉","c":"main","cu":"Chinese","m":90,"p":"pork","ing":["五花肉 500g","蒸肉米粉 100g","生抽 15ml","老抽 10ml","料酒 15ml","郫县豆瓣酱 10g","姜末 10g","蒜末 10g","白砂糖 5g","土豆 300g"],"tp":"","d":4,"k":1606,"i":"粉蒸肉是一道经典中式蒸菜，香味浓郁，口感软糯，属于广泛流传的家常风味。五花肉提供优质蛋白质和脂肪，搭配土豆等根茎蔬菜，营养均衡。此菜适合有一定烹饪经验的人士制作，从准备到完成大约需要 90 分钟。","q":["五花肉 250g","蒸肉米粉 50g","生抽 7.5ml","老抽 5ml","料酒 7.5ml","郫县豆瓣酱 5g（可选）","姜末 5g","蒜末 5g","白砂糖 2.5g","土豆或南瓜 150g","蒸锅用水 1000ml"],"s":["将五花肉洗净，切成长约 5cm、宽约 3cm、厚度约 0.5cm 的肉片。","将姜、蒜切成颗粒直径不大于 1mm 的细末。","取一大碗，放入切好的五花肉、15ml 生抽、10ml 老抽、15ml 料酒、10g 郫县豆瓣酱、10g 姜末、10g 蒜末、5g 白砂糖。","用筷子搅拌均匀后，盖上保鲜膜，室温(20°C - 25°C)静置腌制 30 分钟。","腌制完成后，加入 100g 蒸肉米粉，继续翻拌 2 分钟，确保每片肉都均匀裹粉。","土豆去皮，切片厚度控制在 0.8cm，片面积约为 5cm×5cm，重量控制在 300g。","在直径 20cm 的深碗底部铺满土豆片，尽量无重叠。","将拌好粉的五花肉均匀铺在土豆片上，压实。","蒸锅中加入 2000ml 清水，开火加热至水面持续冒泡(100°C)","将装好食材的碗放入蒸锅内，盖好锅盖。","保持中火蒸 60 分钟（火力保持在可持续沸腾的程度，约 600W 热功率）","时间结束后，用筷子插入肉块中央，若能轻松穿透并无明显阻力，则表明蒸熟。","若未达到此状态，则继续加热 10 - 15 分钟，直至肉质软烂，油脂渗出。","取出盛盘，即可食用。"],"x":["如需自制米粉，可将大米 150g 放入锅中，中小火炒至微黄色（约 8 分钟），再加入干辣椒 1g、花椒 1g、八角 0.5g，炒香后用料理机打碎，过筛备用。","蒸制期间如水量低于锅底高度 1cm，应立即补充 500ml 热水（90°C 以上），以维持蒸汽充足。"]},{"t":"糖醋排骨","c":"main","cu":"Chinese","m":45,"p":"pork","ing":["排骨","白砂糖","食用油","生抽","蚝油","老抽","鸡精","姜片","芝麻","番茄酱"],"tp":"","d":4,"k":1022,"i":"糖醋排骨是一道酸甜可口、外酥里嫩的传统名菜，广受欢迎。排骨富含优质蛋白和钙质，有较好的滋补效果。这道菜涉及焯水、油炸、炒糖色和收汁等多个步骤，对火候和调味有一定要求，不算特别适合新手，但按照优化后的流程操作成功率较高。预计制作时长为 大约 45 分钟。","q":["排骨 300 g","白砂糖 30 g","食用油 300–350 ml （油量需根据锅具大小调整，如用于深炸则以足以覆盖排骨 2/3 为准）","生抽 5 ml","蚝油 5 ml","老抽 5 ml","鸡精 2 g","姜片 2 片","芝麻 2 g","番茄酱 10 g","香醋 5 ml","五香粉 0.5 g"],"s":["排骨与姜片放入冷水中，大火加热至水沸腾、出现大量泡沫后转中火，待水持续沸腾时再转小火焯水 2–3 分钟，捞出备用。","用开水反复清洗排骨 2–3 遍，确保彻底去除血沫。","在锅中倒入足够量的食用油进行深炸（油量依据锅具大小而定，建议约 300 ml 供一般家庭使用），待油温升至约 170°C 后，下排骨炸制 3–5 分钟，直至表面略呈金黄色，捞出控油。","另取干净锅，置于小火上加热 50 ml 热水，加入白砂糖 30 g，轻轻搅拌直至糖完全溶解，并略呈淡黄色。此步骤的重点在于观察糖溶解情况，无需过分依赖颜色变化。","将炸好的排骨倒入炒制糖水的锅中，迅速翻炒 30 秒后，依次加入香醋 5 ml、生抽 5 ml、蚝油 5 ml、鸡精 2 g、番茄酱 10 g、五香粉 0.5 g，再次翻炒 30 秒，使调料均匀裹覆排骨，然后加入开水至刚好没过排骨。","用大火将锅中液体煮沸后，加入老抽 5 ml 进行上色，并快速收汁；若排骨块较大，可转小火焖煮 5–10 分钟以便更好地入味，切勿采用中火长时间炖煮 20 分钟，以免损伤口感。","起锅装盘，撒上芝麻 2 g，即可享用。"],"x":["炸排骨时可根据实际情况轻撒少量干淀粉于排骨表面，以提升酥脆口感。","焯水时注意火力变化：冷水下锅后先用大火至水沸腾、泡沫丰富，再转中火，最后转小火焯水；焯水后应使用开水清洗，避免因温差过大导致肉质变柴。","步骤四的关键在于确保白糖完全溶解，无须过分依赖颜色变化判断。","收汁时应快速翻炒，使排骨均匀裹上调料，避免长时间煮炖造成口感损失。"]},{"t":"糖醋里脊","c":"main","cu":"Chinese","m":45,"p":"pork","ing":["里脊肉","醋","白糖","淀粉","鸡蛋","生抽","料酒","蚝油","番茄酱","白胡椒粉"],"tp":"","d":4,"k":1573,"i":"糖醋里脊酸甜浓郁、外酥里嫩，是广受欢迎的家常风味，在多地域菜系中都很常见。猪里脊提供优质蛋白，但裹粉油炸和糖醋汁使整体热量偏高。制作时需要掌握腌制、复炸和调汁火候，对新手稍有挑战，建议提前备好料并一气呵成。从备料到出锅大约需要 45 分钟到 1 小时。","q":["里脊肉 500g","醋 10g","白糖 30g","淀粉 50g","鸡蛋 50g","生抽 10ml","料酒 20g","蚝油 10g","番茄酱 30ml","白胡椒粉 5g","食盐 10g"],"s":["腌肉：将猪里脊肉先切厚片，用刀背拍一拍，把肉拍松一点。切成一个手指头粗的条，加料酒，生抽，蚝油，食盐，白胡椒粉，一个鸡蛋，将肉用手抓匀，腌制 20 分钟以上。","调酱：番茄酱+10g 醋+30g 白糖+150ml 清水，搅拌至糖融化，备用。","裹粉：先把粉全部裹好再来炸，这样在炸的时候就不会手忙脚乱。准备一个大碗，里面放淀粉，把每一根肉条都满满裹上淀粉。","炸制：油温 160 摄氏度下里脊，可以拿一个干筷子放在油里面试一下，周围冒小泡就可以下锅。","炸到表面微黄可以捞出，全程中火。然后等油温升高到 200 摄氏度，把里脊倒进去重新炸一次，只需 40 秒，表皮就会很脆，马上捞出。","裹酱：另外拿一个锅，锅里放底油，把调好的酱汁倒进去，煮到冒泡，把炸好的里脊放进去，翻炒，让每一根都裹上酱汁。","下炸好的里脊肉翻炒，关火盛出。"],"x":["里脊要多炸几遍，注意火候，否则达不到外焦里嫩的效果！","下厨房。","百度百科。"]},{"t":"红烧猪蹄","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["猪蹄","香叶","姜","葱","老抽","桂皮","冰糖","料酒","生抽","盐"],"tp":"","d":4,"k":639,"i":"红烧猪蹄是一道汤汁浓郁、肉质软糯的经典家常菜，咸香甜美，极为下饭。猪蹄富含胶原蛋白和蛋白质，营养丰富。这道菜对新手有一定挑战，但借助高压锅可以简化流程，有一定烹饪基础更易上手。从备料到完成大约需要 1 小时。","q":["一份正好够 3-4 人吃。","猪蹄：2~3 根","食用油：30ml","香叶 2 片","姜 5 片","桂皮 1 块","冰糖 7-8 粒","料酒 30 ml","生抽 20 ml","老抽 20 ml","盐 8 克","八角 4 个"],"s":["冷水锅中放入热心摊主剁好的猪蹄，加入 20 ml 料酒与葱姜，煮 15 分钟去掉血腥。","热锅冷油，倒入 30ml 食用油，放入 7-8 粒冰糖，开小火，熬成糖色，期间用锅铲把冰糖压碎，大概熬 2 分钟。","熬成糖色后，放入焯过水的猪蹄，继续小火，翻炒猪蹄，直至所有猪蹄两面微黄。","加入香叶 2 片、桂皮 1 块、八角 4 个、生抽 20 ml、老抽 20 ml、料酒 10 ml、姜 3 片、盐 8 克，转中火、继续翻炒 1 分钟。","加入开水或者冷水，水需要没过猪蹄，盖上锅盖，大火烧开，烧开之后关火。","把锅内的食材全部倒入高压锅中，高压锅中需要 15 分钟（如果同学没有高压锅，可放在锅中大火转小火熬制即可）","15 分钟之后，把高压锅的食材倒入炒锅中，开大火收汁，此时可用筷子尝下味道、淡的话可以加 2~3g 盐。","大火收汁时长根据锅中的水来算，一般 30 秒即可，多留点也无碍、红烧猪蹄汤也是很下饭的。"],"x":[]},{"t":"南派红烧肉","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["工具：锅","主料：五花肉"],"tp":"","d":4,"k":3248,"i":"这道红烧肉成菜色泽红亮，肥肉入口即化、瘦肉酥烂不柴，咸中带甜，是典型的南方甜口风味。五花肉提供优质蛋白和丰富的胶原蛋白，香辛料还能去腥暖胃。制作虽需熬糖色与慢炖，但每一步都拆解得清晰易懂，新手跟着操作也能成功，全程约 1.5 小时即可端上桌。","q":["猪五花肉：1000g（约 2 斤）。注：生肉烹饪后缩水脱脂严重，此分量最终出肉量约满足 2-3 人正常饭量。如仅 1 人食用，建议所有食材剂量减半。","油：100-150ml，色拉油、猪油、花生油都可以","姜： 6 片","小葱：约 30g（3-4 根），葱白切段备用","大蒜：约 25g（5-6 瓣），中间切开备用","冰糖：50g（约大拇指甲盖大小的碎单晶冰糖 15 块）。如果上一步炒糖色已经使用了 50g，此处的 50g 为炖煮时二次调味使用，可根据对\"南派甜口\"的接受度调整至 30g。","白砂糖：30g","老抽：15ml","料酒：总量 30ml（其中 20ml 用于前期焯水去腥，10ml 用于后期炖煮提鲜）","凉水：没过食材的量即可，看锅大小准备","开水：没过食材的量即可，看锅大小准备","香叶：4 片","八角：3 个","盐：2-3g","花椒：10g"],"s":["建议在此之前查看炒糖色教程。","猪五花肉先不切小块，切成能放入锅中的大块（约 5–6cm 宽）即可。","生姜切片（每片厚度约 3mm ）","开水烧开。","凉水自来水即可。","小葱小葱白色的部分葱白切成小段（小葱最佳，大葱也可以）","蒜中间切开，不要拍扁，否则难以捞出以至最后收汁时影响味道。","A包（去腥用）：2 片姜、2 段葱段。","B包（炖煮用）：剩下的 4 片姜、葱白、蒜瓣、花椒、八角、香叶，统一放入一个小碗中备用。","凉水锅中放入五花肉大块，加入 20ml 料酒 与 A包（2 片姜、2 段葱段），煮 15 分钟去掉血腥，捞出来后洗干净。","将焯过水的五花肉捞出，稍微放凉（不烫手即可），切成边长约 3cm×3cm×3cm 的正方体块（焯水后肉质收紧，此时切块比生肉时更容易且成品大小更均匀。3cm 切块最终成品约为 2.5cm，是最适宜入口且容易烧透的尺寸）","另起锅炒糖色，注意：在此菜谱中，请采用其中提到的\"操作 2\"来制作，即在糖液起密集小泡时，迅速将 B包（生姜、葱白、蒜、花椒、八角、香叶）倒入锅中爆香。","爆出香味后（约 5-10 秒内），先不要加开水，而是立刻将焯过水的五花肉倒入锅中大火翻炒，让肉块均匀裹上糖色并煸炒出油脂。待闻到肉香后，再倒入开水至没过全部肉，盖上锅盖，转中小火炖煮 50 分钟-60 分钟（高压锅则为 40 分钟）","加入 10ml 料酒。","盖上锅盖煮至沸腾后，每隔 25 分钟打开盖子将浮在表面的油和沫捞出。","当水的高度减至肉最高的高度与锅底高度的 3/5 时，转中火，并捞出除肉和水以外的所有辅料，开始收汁。","打开锅盖，待汤汁快没有的时粘稠状出锅（切记不可收干）"],"x":["一份正好够 2-3 人吃（1 人食用建议所有剂量减半）。"]},{"t":"简易红烧肉","c":"main","cu":"Chinese","m":44,"p":"egg","ing":["主料：大肉、鸡蛋、豆皮"],"tp":"","d":3,"k":2775,"i":"这道家常美味色泽红润油亮，口感软糯，肥而不腻，酱香浓郁，搭配米饭特别过瘾。五花肉提供优质蛋白质和必需脂肪酸，加上鹌鹑蛋或豆皮，营养更全面。做法对新手相当友好，从备料到出锅大约需要 1.5 小时。","q":["如果只有 1 人食用，可以考虑食材减半。","猪五花肉：约 3~4 斤","姜： 6 片","冰糖：15 克（约 7 块）","生抽：10ml","老抽：15ml","料酒：5ml","开水：没过食材的量，需要 600ml-900ml","香叶：3 片","八角：2 个","鹌鹑蛋（可选，没有鹌鹑蛋，可以用同等重量的鸡蛋代替）：0-2 个","豆皮（可选）：0-80g","盐：2-3g"],"s":["猪五花肉切大块（约 4.5cm ，冷冻半小时至一小时更好切）","豆皮切 2cm 的宽度。","生姜切片（每片厚度约 3mm ）","水烧开。","鹌鹑蛋煮熟并用叉子/牙签扎孔（尽量多些好入味）","大葱大葱白色的部分葱白。"],"x":[]},{"t":"红烧鸡翅","c":"main","cu":"Chinese","m":40,"p":"chicken","ing":["新鲜鸡翅","姜片","葱段","大蒜","香叶","八角","干辣椒","冰糖","黄酒或料酒","生抽"],"tp":"","d":3,"k":1016,"i":"红烧鸡翅是一道家常下饭菜，咸鲜带甜、色泽红亮，肉质嫩滑易脱骨。鸡翅富含优质蛋白质与胶原蛋白，营养好吸收。制作难度适中，新手按步骤操作也能顺利掌握，从备料到出锅大约需要 40 分钟。","q":["每次制作前需确定计划做几份，一份够 3-4 人食用。","新鲜鸡翅 500g（约 8-10 个，单个鸡翅约 50-60g）","姜片 4-5 片（约 10g，切片厚度约 2mm）","葱段 2-3 段（约 15g，每段长度约 3cm）","大蒜 3-4 瓣（约 15g）","香叶 1 片","八角 1 个","干辣椒 2 个（可选，约 5g，不吃辣可省略）","冰糖 15g（颗粒状冰糖）","黄酒或料酒 35ml","生抽 15ml","老抽 5ml","盐 3g","白糖 2g","胡椒粉 1g","白芝麻 3g","小葱花 5g","食用油 10-15ml"],"s":["将鸡翅洗净。用刀在鸡翅厚处划三刀，背面扎一刀，便于入味。","如果鸡翅不新鲜，可在打完花刀之后用姜水泡 10-20 分钟。","将 10g 姜片（3-4 片）、15g 葱段（2-3 段）备好；3-4 瓣大蒜（约 15g）用刀拍散（无需剁碎）；1 片香叶、1 个八角、2 个干辣椒（可选）整理好备用。","起锅开火，锅中加入清水没过所有鸡翅，冷水下锅放入处理好的鸡翅，加入 20ml 黄酒或料酒、2 片姜片（约 5g），开大火烧至沸腾，沸腾后保持大火继续煮 2-3 分钟，撇去浮沫。","煮好后将鸡翅捞出，用温水清洗 2 遍，彻底去除血沫，控干水分备用。","另起锅，开火烧热后放入 10-15ml 食用油。","待油温至 5 成热，加入 15g 冰糖，开大火将冰糖熬至完全融化，冰糖融化变色后转小火，继续炒至冰糖呈枣红色，立即放入控干水分的鸡翅，快速翻炒 1-2 分钟，使每只鸡翅均匀裹上糖色。","加入准备好的 1 片香叶、1 个八角、2 个干辣椒（可选）、剩下的 2 片姜片（约 5g）、15g 葱段、拍散的大蒜，继续煸炒 30 秒至香料香味完全释放。","沿锅边淋入 15ml 料酒或黄酒，15ml 生抽，快速翻炒 10 秒。","加入温水（水温约 50-60℃），水量以稍微没过所有鸡翅为准。","加入 5ml 老抽、3g 盐、2g 白糖、1g 胡椒粉，用炒勺轻轻搅拌均匀。","盖上锅盖，开中火烧煮 7-8 分钟。","打开锅盖，用筷子将锅中的香叶、八角、姜片、葱段、大蒜捡出丢弃。","转大火，保持不断翻炒，将汤汁烧至粘稠状态（约 1-2 分钟）。","关火，将鸡翅盛入盘中，淋上锅中剩余的粘稠汤汁。","最后撒上 3g 白芝麻和 5g 小葱花，完成制作。"],"x":["如果闻着有腥味，可以增加一倍香料用量。"]},{"t":"羊排焖面","c":"main","cu":"Chinese","m":56,"p":"lamb","ing":["带皮羊排肉","青椒","甜椒","青椒","大葱","花椒","干辣椒","生姜","白砂糖","老抽"],"tp":"","d":4,"k":1616,"i":"羊排焖面是一道肉香浓郁、面条筋道的北方家常硬菜，羊排软烂，宽面吸足汤汁，每一口都满足。这道菜有肉有面有菜，一顿饭就能补齐人体所需的蛋白质、碳水和脂肪，营养全面。制作时需要先炖羊排再和面焖面，步骤稍多，更适合有一定下厨经验的朋友尝试，预计全程大约花费一个半小时。","q":["1 人份 × 2 顿 2 人份","带皮羊排 500g","青椒，甜椒 各 2 个"],"s":["羊肉冷水下锅焯水，水开了之后把血沫撇掉，捞出羊肉。","切好生姜（ 4 片)，放入干辣椒与花椒在碗里备用。","在炒锅加入油。（多一点也没关系）","油热之后，放入白砂糖，给羊肉炒出焦糖色。","羊肉水份炒干之后，放入盐、老抽，以及备好的调味料。","加入清水没过羊肉，大火煮沸之后，让其继续煮 10 分钟，之后小火炖煮 30 分钟。","在此期间，可以和面。和面的量以及操作方法在附加内容里讲解 （注 1）。","放入青椒，甜椒，大葱，以及面皮进行翻炒。","翻炒均匀之后，即可出锅。","注 1：可以用超市的面条代替，但是尽量选择宽面。"],"x":["(和面小指南 之 材料）","中筋面粉 300 g。","盐 3 g。","水 180 ml。"]},{"t":"老妈蹄花","c":"main","cu":"Chinese","m":120,"p":"pork","ing":["猪蹄","葱","姜","料酒","生抽","白芷","当归","鸡精","盐","蒜"],"tp":"","d":4,"k":1425,"i":"老妈蹄花汤色奶白，猪蹄软烂脱骨，口感细腻，配上酸辣蘸汁十分开胃，是经典的川式家常菜。猪蹄富含胶原蛋白，白芸豆增添绵密口感，营养丰富。操作需要高压锅和提前浸泡，对新手有一定挑战，但按步骤来做不难掌握。含浸泡和压煮，全程大约需要 2 小时（不含提前一晚浸泡白芸豆的时间）。","q":["猪蹄：3 根","白芸豆：200g","当归：2g","白胡椒粉：5g","姜片：30g","当归：2g","蒜末：8g","鸡精：2g","生抽：25g","葱花：10g"],"s":["200g 白芸豆提前一晚清水浸泡备用。","准备猪前蹄，买菜的时候让师傅从中间劈开，用喷火枪去除毛囊，拿回家清洗。","冷水锅中加入猪蹄、大葱段、姜片、料酒，焯水十分钟，撇去浮沫，捞出洗干净备用。","高压锅中放入猪蹄、当归、白芷、白胡椒粉、姜片，上汽后压三十分钟，放入白芸豆，再压十分钟，这个时候如果汤底是奶白色，那么恭喜是正确的（如果中途需要加水，只能加热水）","揭盖后加入盐、鸡精、葱花调味。","调制灵魂汁子：放入葱、蒜、小米椒，白胡椒粉、生抽、香醋、油泼辣子、花椒油、猪蹄原汤。","灵魂汁子，浇给。"],"x":[]},{"t":"老式锅包肉","c":"main","cu":"Chinese","m":90,"p":"pork","ing":["猪通脊肉","大葱","姜","蒜","胡萝卜","香菜","白醋","白糖","料酒","盐"],"tp":"","d":4,"k":882,"i":"锅包肉是东北经典名菜，起源于哈尔滨道台府，以白醋调出鲜明酸香，外壳酥脆、肉片滑嫩，酸甜爽口。猪肉提供优质蛋白质，搭配葱姜等蔬菜开胃解腻。这道菜需要掌握挂浆、油温和复炸技巧，烹饪难度中等偏上，新手需要耐心练习。从腌肉、调糊到炸制出锅，预计制作时长约 90 分钟。","q":["猪通脊肉 300g","料酒 5ml","大葱 50g","姜 30g","蒜 3-4 瓣","胡萝卜 10g（可无）","香菜 10g","小苏打 5g（可无）","盐 5g","生抽 4g","白醋 55g","白糖 65g","玉米淀粉 1.5g（可用土豆淀粉代替）","方法一：土豆淀粉 170g","方法二：土豆淀粉 210g 和 中筋面粉 70g","食用油 1000ml（用于炸制）","白熟芝麻 5g（可无）"],"s":["将猪通脊肉切成厚度 8mm 的均匀肉片，去除白色筋膜。","用清水冲洗肉片，去除血水。","可选：加入小苏打 5g，抓匀，静置 5 分钟。","用清水冲洗 1-2 次，去除多余小苏打。","在肉片中加入盐 3g、料酒 5ml，拌匀，腌制 15 分钟。","将土豆淀粉 170g 加入过量清水，搅匀，静置 60 分钟，等待淀粉沉降分层。","倒出上层全部的的清水，保留底部淀粉浆（形如非牛顿流体）。","放入肉片，放入 5ml 清水，放入 3ml 食用油，搅拌均匀。","将土豆淀粉 210g 和中筋面粉 70g 混合。","少量多次加入清水，搅拌至酸奶状，提起可拉丝，浆糊能在盆中堆积。","加入食用油 10ml，小苏打 1g，搅拌均匀。","将腌制好的肉片放入浆糊中，拌匀，使每片肉均匀裹上浆。","混合白糖 65g、白醋 55g、生抽 4g、盐 2g，搅拌均匀，备用。","可选：水 4g、玉米淀粉 1.5g，用于糖醋汁更加粘稠。","大葱、姜、胡萝卜切丝，香菜切段，蒜切片。","锅中加入食用油，加热至 170℃（六成热）。","将肉片逐片放入油中，炸至表面定型，表面挂浆不粘筷子，肉上浮，颜色浅黄，约 30 秒（取决于肉片大小），捞出备用。","油温升至 200℃（七成热）。","将所有肉片放入油中，炸至外壳金黄酥脆，约 30 秒，捞出备用。","油温升至 220℃（八成热）。"],"x":["肉片厚度应为 8mm，过厚过薄都会影响口感。","炸制时控制油温，避免外壳过深或不酥脆，这点非常重要。","熬糖醋汁时，注意熬至粘稠但不结块，避免变成糖浆。","老饭骨版本。"]},{"t":"肉饼炖蛋","c":"main","cu":"Chinese","m":20,"p":"pork","ing":["猪肉末","鸡蛋","料酒","生抽","白胡椒粉","芝麻香油"],"tp":"","d":3,"k":1124,"i":"肉饼炖蛋是一道咸鲜滑嫩的传统家常菜，肉饼吸饱了酱汁，鸡蛋卧在其中，口感软嫩又下饭。它富含优质蛋白质和多种氨基酸，能很好地补充体力。做法十分简单，对厨房新手非常友好，从备料到出锅大约只需要 20 分钟。","q":["猪肉末 300g","鸡蛋 2 个","料酒 10ml","生抽 20ml","白胡椒粉 5g","芝麻香油 10-15ml"],"s":["在碗中加入猪肉末、料酒、生抽、白胡椒粉、鸡蛋和芝麻香油，搅拌均匀。","将调好味的猪肉末铺在盘子里，肉末中间用勺子挖一个洞，往洞中打入 1 个鸡蛋。","锅中加水至 1/4 高度，水烧开后，将盘子放入锅中，盖上锅盖，蒸 15 分钟。"],"x":["在取出肉饼炖蛋时，注意盘子很烫，请小心操作。"]},{"t":"腐乳肉","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["带皮五花肉","红腐乳","冰糖","老抽","料酒","香葱","生姜","清水","食用油"],"tp":"","d":5,"k":1190,"i":"这是一道经典的江南家常菜，五花肉与红腐乳同炖，色泽红亮如琥珀，肉质酥烂到入口即化，咸甜交织的酒香与豆香在舌尖层层展开。富含优质蛋白质和 B 族维生素，经慢火煨煮后更易消化。制作流程需要耐心把控火候和收汁，对新手来说有一定挑战，预计制作时长约 1 小时。","q":["带皮五花肉 400 g","红腐乳 30 g（约 2 块）","腐乳汁 15 ml","冰糖 25 g","老抽 5 ml","料酒 15 ml","葱白 15 g","葱花 5 g","生姜 10 g","清水 500 ml","食用油 10 ml"],"s":["五花肉切成长宽 2.5 cm 的小块。","冷水放料酒姜片，五花肉放入开火慢慢加入到水沸腾后捞出。","玫瑰腐乳块和腐乳汁碾成泥，加冰糖、老抽调成酱汁。","热锅冷油爆香葱姜，下肉块煸到金黄。","倒入腐乳酱炒匀加热水焖煮。","小火慢炖 40 分钟。","大火收汁，看到汤汁冒浓稠鱼眼泡时关火。"],"x":["建议用单晶冰糖。","腐乳自带咸鲜，不用额外放盐。","大火收汁时要不断晃动锅体避免粘底。","参考资料：【步骤图】腐乳肉的做法_腐乳肉的做法步骤_菜谱_下厨房。"]},{"t":"芥末罗氏虾","c":"main","cu":"Chinese","m":44,"p":"shrimp","ing":["罗氏虾","蒜","青芥末","生抽","生粉","胡椒粉","白糖","蚝油","盐","小米辣"],"tp":"","d":3,"k":579,"i":"这道菜鲜香微辣，芥末风味浓郁，虾肉紧实弹嫩，是一道快手家常海鲜菜。虾本身富含优质蛋白和钙，脂肪含量低，搭配芥末开胃解腻。中等难度，只要按步骤调制碗汁、控制火候，新手也能较快上手，全程约需 30 分钟。","q":["罗氏虾 250g","蒜 1-2 个","青芥末 20g，用于碗汁","生
