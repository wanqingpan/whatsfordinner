粉 10g，用于碗汁","生抽 30g，用于碗汁","胡椒粉 5g，用于碗汁","白糖 3g，用于碗汁","蚝油 15g，用于碗汁","盐 3g，用于碗汁","小米辣 1-2 个","黄油 20g","食用油 80ml"],"s":["将虾从背部切开，去除虾线和沙袋，也可从腹部切开，炸出来会胀开，成菜比较漂亮。","用清水洗干净，控干水分后可拍上生粉，也可不拍。","将 2 颗大蒜切成蒜末。","准备碗汁，放入生抽、蚝油、白糖、胡椒粉、盐，依据个人口味挤入芥末，加清水稀释后加入生粉化开。","锅热倒入食用油，大概能覆盖锅底。","放入控干水分的罗氏虾，慢慢煎制。","虾油煎出来后（表现为锅中出现大量气泡），加入准备好的蒜蓉及小米辣。","闻到蒜蓉的香味后，加入黄油。","黄油融化后翻拌均匀，加入准备好的碗汁。","盖锅盖焖煮 2 分钟汤汁浓稠后出锅。"],"x":["黄油入锅后不宜炸制太久，融化翻拌均匀即可烹入碗汁。"]},{"t":"茭白炒肉","c":"main","cu":"Chinese","m":20,"p":"none","ing":["茭白","瘦肉","淀粉","食用油","鸡精","姜","蒜","料酒","盐"],"tp":"","d":3,"k":515,"i":"茭白炒肉是一道家常快手菜，口感鲜嫩爽脆，咸鲜适口，属于典型的江南家常风味。茭白富含膳食纤维和多种维生素，搭配瘦肉提供优质蛋白，荤素搭配均衡营养。烹饪难度中等，新手稍加练习即可掌握，预计制作时长约 20 分钟。","q":["茭白 2 根","瘦肉 100 g","淀粉 15 g","食用油 30 ml","鸡精 5 g","姜 1 片","蒜 1 个","料酒 5 ml","盐 2 g"],"s":["茭白切片，每片厚度 0.5 cm。","瘦肉切条，厚度 0.3-0.5 cm，加入料酒、生粉、盐、水搅拌。","姜切片、蒜头剁碎。"],"x":["最后一个步骤，可以考虑加蚝油、生抽代替盐上色。"]},{"t":"荔枝肉","c":"main","cu":"Chinese","m":45,"p":"egg","ing":["瘦肉","凤梨","鸡蛋","食用油","白砂糖","淀粉","生抽","鸡精","姜末","芝麻"],"tp":"","d":4,"k":681,"i":"荔枝肉是一道酸甜酥香的福州传统闽菜，外焦里嫩的肉块裹着红亮的酱汁，搭配水果添入清爽果香。猪瘦肉富含优质蛋白质，凤梨含有膳食纤维和维生素，能帮助开胃解腻。制作过程需要切肉、挂糊和两次油炸，略有挑战但步骤明确，适合有一定下厨基础的美食爱好者尝试，大约 45 分钟就能端上餐桌。","q":["鲜香菇 2 朵","蟹味菇 30 g","瘦肉 150 g","凤梨 100 g","鸡蛋 1 个","食用油 500 ml","白砂糖 5 g","淀粉 100 g","生抽 5 ml","鸡精 5 g","姜末 5 g","芝麻 2 g","番茄酱 20 g","香醋 2 ml"],"s":["瘦肉切块（每块 2-3 cm ），放入大碗中，加入鸡蛋 1 个 、生粉 50 g 、生抽 3 ml 、鸡精 2 g。","充分搅拌，直至生粉包裹住瘦肉块（太稀则继续加生粉，太干则加水），然后加入 5 ml 油，在充分搅拌后备用。","在准备一个碗，加入番茄酱、鸡精 3 g 、生抽 2 ml 、姜末、白砂糖、生粉 10 g、香醋、凉水 200 ml ,充分搅拌后备用。","切一个凤梨, 准备 6 个 （每个 1.5-2 cm）凤梨块。","起锅烧油，倒入 500 ml 油，一直烧油直到听到油炸声。","将瘦肉一个一个放入锅中（切记不可以整碗倒入），保证每个肉不要粘在一起。","全部放入瘦肉后，每 30 S 用勺子来回两面翻转瘦肉块，直至瘦肉块表面金黄。","取出瘦肉，一分钟后倒入油锅中继续炸，直至瘦肉块表面出现焦黄后，取出放入大碗备用。","起锅，倒入汤汁，30 S 后倒入瘦肉块、凤梨块，充分翻炒后 出锅。","摆上芝麻。"],"x":["更多情况下，福州当地会选用马蹄（解腻）和马铃薯（洗油），因为疫情期间买不到，所以选用了凤梨。","闽菜以甜为主，如果吃不惯的可以放弃白糖。","可以通过勺子敲打瘦肉块，听到声响来判断是否炸透瘦肉。"]},{"t":"荷兰豆炒腊肠","c":"main","cu":"Chinese","m":15,"p":"none","ing":["荷兰豆","腊肠","生抽","食用油"],"tp":"","d":2,"k":606,"i":"荷兰豆炒腊肠是一道清爽咸香的家常小炒，腊肠的油脂润着翠绿的荷兰豆，口感脆嫩不腻。荷兰豆富含优质蛋白质和多种维生素，有助于增强机体抗病能力。做法简单，几乎不需要刀工，初学者也能快速上手，从备料到出锅大约只需 15 分钟。","q":["下面是一人份。","荷兰豆大约 50 个","腊肠约 100 g","食用油 10ml","生抽 10ml"],"s":["把荷兰豆去掉蒂，有时间的也可以同时把尾部去掉。","买腊肠之前可以问老板是生的还是熟的，如果是生的，需要提前蒸一下，如果是熟的可以直接使用。","把荷兰豆清洗一下，然后焯一下水，大概 45s，荷兰豆焯至变色即可，捞出过凉水备用。","热锅，锅内放入大约 10ml 食用油。等待 10 秒让油温升高。","放入腊肠，保持翻炒至腊肠微微卷边，注意这里一定要保持小火，小到不能小的那种，不然容易糊。","放入荷兰豆，转为中大火，翻炒 30s 放入生抽，接着再翻炒 20-30s 即可。"],"x":["在制作过程中没有放盐，是因为腊肠本身会有一些味道，同时生抽也会有一些咸味。","腊肠虽然味道不错，但属于不太健康的食物，建议少放。"]},{"t":"萝卜炖羊排","c":"main","cu":"Chinese","m":56,"p":"lamb","ing":["羊排","白萝卜","大葱","花椒","白芷","姜","料酒或者黄酒","食用盐","冰糖","水"],"tp":"","d":4,"k":1259,"i":"这道汤菜清鲜不腻，羊肉软烂入味，萝卜饱吸汤汁后甘甜绵糯，是北方冬季常见的家常暖身菜。羊肉富含优质蛋白和铁，萝卜含有维生素与膳食纤维，两者搭配温补脾胃、驱寒助消化。虽然需经焯水去腥和两次炖煮，但步骤清晰易循，新手也能顺利上手。整体制作大约需要两小时，若用高压锅可缩短至大约一 小时。","q":["羊排 400g","花椒 10 粒","姜 10g ，一般买一头姜，从中切大约 4 片即可","料酒或者黄酒 30ml-40ml","食用盐 10g","冰糖 2-4 粒","水：没过食材的量，需要 1000ml"],"s":["萝卜去皮、滚刀切成 3-5cm 的大块，备用。","羊排在购买时可以让卖家切好，因为家用刀一般难以切动，备用。","羊肉冷水下锅，加入一半的料酒，一半的葱姜，煮 10 分钟去掉血腥，（可选）把焯的过程中出现的血沫子可以用勺子盛出来。","另起一锅冷水，放入切好的白萝卜，放入一半的冰糖，等水开后煮 5 分钟去掉白萝卜的辣味。","盛出来焯好的羊排，放入高压锅中，加水没过所有食材后再增加大约 300ml 的水。","将剩余的葱姜料酒，花椒，冰糖，白芷（可选），盐放入锅中，盖锅等待上汽后计时，中火炖大约 15 分钟。","如没有高压锅，则放入普通锅中，炖大约 40 分钟到 1 小时。","关火，等待高压锅放气完毕，开盖，加入之前焯好的萝卜，调味，加入 3-10g 的食盐或者水，品尝汤的咸淡。","再开火，中火，高压锅上汽再炖 10 分钟，普通锅盖盖再炖 20 分钟。","关火，盛盘。"],"x":["操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材。"]},{"t":"葱烧鸡腿","c":"main","cu":"Chinese","m":32,"p":"chicken","ing":["鸡腿 2 个","大葱 1 根","小葱 3-4 根","生抽","老抽","蚝油","白砂糖","料酒或花雕酒","盐","白胡椒粉"],"tp":"","d":2,"k":850,"i":"葱烧鸡腿是一道只靠鸡腿和大葱两种核心食材就能完成的下饭家常菜。鸡腿肉外焦里嫩，葱香浓郁，做法简单，全程一口锅，新手也能一次成功。蛋白质丰富，搭配米饭尤其合适，适合工作日快手晚餐。","q":["鸡腿 2 个（去骨后净肉约 350g）","大葱 1 根（约 100g）","小葱 3-4 根（约 30g）","生抽 15ml","老抽 5ml（上色用，没有可以全用生抽）","蚝油 10ml（可选，没有就多放 5ml 生抽）","白砂糖 5g","料酒 10ml","盐 2-3g","白胡椒粉 1g","食用油 15-20ml"],"s":["鸡腿去骨：用剪刀从鸡腿大的那头伸进去，贴着骨头把肉剪开，再沿骨剪两下把骨肉分离，最后把骨头整根抽出。比用刀去骨更安全。","去骨后的鸡腿肉切成 2-3cm 的丁。","大葱切厚片（约 0.5cm 厚），小葱切 1cm 长的小段。","鸡腿丁加入 10ml 料酒、5ml 生抽、2g 盐、1g 白胡椒粉抓匀，腌制 10 分钟。","取一个小碗调好料汁：10ml 生抽 + 5ml 老抽 + 10ml 蚝油 + 5g 糖，搅匀备用。","热锅，锅内放入 15-20ml 食用油。","放入姜片和花椒，保持小火炸到姜片微微焦黄、花椒颜色变深。","用漏勺把姜片和花椒捞出丢弃，留底油。","保持中大火，将腌好的鸡腿丁平铺下锅，不要急着翻动。","等待 2-3 分钟让鸡腿丁底部煎出焦壳，再翻炒到所有面都变色、鸡肉完全断生。","下入大葱片，保持中大火翻炒 1 分钟炒出葱香。","倒入调好的料汁，翻炒均匀后盖上锅盖。","等待 2 分钟让料汁和葱香完全融合到鸡肉里。","开盖，下入小葱段和 2g 熟白芝麻（可选），翻炒 5-10 秒即可关火出锅。"],"x":["把鸡腿洗干净，用厨房纸吸干表面水分。","从鸡腿较粗的一头找到骨头的末端。","用剪刀尖贴着骨头剪开外层的皮和肉，沿着骨头一侧剪到底。","把鸡腿翻个面，沿骨头的另一侧继续剪。"]},{"t":"蒜苔炒肉末","c":"main","cu":"Chinese","m":10,"p":"pork","ing":["五花肉薄片","蒜苔","食用盐","生抽","食用油","蒜瓣"],"tp":"","d":2,"k":258,"i":"蒜苔炒肉末是北方家常菜，咸鲜脆嫩，蒜香浓郁。蒜苔富含膳食纤维和维生素，五花肉提供蛋白质，荤素搭配均衡。做法简单，备料轻松，新手也能快速上手。从切配到出锅大约只需 10 分钟。","q":["1 人食用版本","蒜苔 1 扎（每扎蒜苔约 190g）","五花肉薄片 4 片（约 20g）","食用油 10ml","蒜瓣 2 瓣","生抽 15ml","食盐 2g"],"s":["蒜苔切成 5cm 小段，备用。","五花肉切成 5mm×5cm 丝状，备用。","蒜瓣拍碎切成末，备用。","热锅，锅内放入 10ml 食用油。等待 10 秒让油温升高。","放入蒜末，中火翻炒 10 秒 将蒜末炒出香味。","放入五花肉和 5ml 生抽，中火翻炒 30 秒 将肉炒熟并上色。","将蒜苔放入锅内并加入 10ml 生抽，翻炒 30 秒。","锅内加入 20g 水，中火翻炒 5 分钟 将蒜苔炒至稍稍变软。","最后加入 2g 食盐，中火翻炒 30 秒，即可出锅装盘。"],"x":["加入食盐前可尝一下咸淡，自行决定是否增减盐量。","选用五花肉薄片是因为切肉简单且不用腌制即可入味。"]},{"t":"虎皮肘子","c":"main","cu":"Chinese","m":68,"p":"pork","ing":["猪前肘","食用植物油","冰糖","盐","老抽","生抽","白醋","香叶","肉桂皮","豆蔻"],"tp":"","d":5,"k":1018,"i":"这道菜成品色泽红亮，肘皮呈现诱人的虎皮纹路，口感软烂入味，肥而不腻，瘦肉松软，属于传统中式宴客大菜。猪肘富含胶原蛋白和优质蛋白，经过长时间炖煮后更易吸收，对皮肤和关节有一定滋养效果。制作过程包含烧皮、油炸、炒糖色和高压炖煮等多个步骤，对新手来说挑战较大，建议有一定烹饪基础再尝试。","q":["1 汤匙 15ml","1 茶匙 5ml","|原料|数量|单位|","|:---:|:---:|:---:|","|猪前肘|1|个|","|冰糖|200|ml|","|盐|1-2|茶匙|","|老抽|1|茶匙|","|生抽|1|汤匙|","|白醋|1|汤匙|","|香叶|3|片|","|肉桂皮|2-3|克|","|豆蔻|3|个|","|花椒|8-12|个|","|大料|2-4|个|","|淀粉|1|汤匙|","|葱|2|棵|","|姜|6|克|","|蒜|6|粒|","|料酒|2|汤匙|"],"s":["猪肘解冻后水泡 1 小时去除血水。","如有火焰喷枪，则使用火焰喷枪灼烧猪肘皮表面至棕黑色以去除猪毛，破坏汗腺。注意不要长时间炙烤同一个位置以避免烧焦，当猪肘皮几乎完全呈现棕黑色时则停止灼烧。","如无火焰喷枪，将铁锅烧至 200 以上，将猪肘直接放入锅内，用锅铲或筷子使猪肘皮充分接触铁锅表面，当猪肘皮与铁锅接触位置呈现出棕色时，更换位置继续烫猪肘皮，直到整个猪肘被充分烫过。注意再次过程中注意铁锅温度，不要使铁锅红热。","使用清洁球在水中刷洗猪肘，将其表面烧焦的部分去除。刷洗结束后，猪肘再次呈现出未被灼烧前的状态。","将猪肘置于铁锅中，加尽量多的冷水，具体视铁锅深度与猪肘大小而定，在保证可以拿得动铁锅及其内容物的情况下，能浸没猪肘 3/4 以上为最佳。"],"x":["|食用植物油|能浸没猪肘 3/5 以上|以猪肘高度计|。","参考资料：Bilibili老饭骨的视频教程。"]},{"t":"蚂蚁上树","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["红薯粉丝","猪肉末","郫县豆瓣酱","生抽","老抽","食用油","蒜末、姜末","小葱"],"tp":"","d":3,"k":791,"i":"蚂蚁上树是一道经典的川味家常菜，咸香微辣，粉丝软滑吸汁，肉末细嫩鲜香。以红薯粉丝和肉末为主料，富含碳水化合物与蛋白质，能快速补充能量。制作难度中等，步骤清晰，对新手比较友好，全程约需 20 分钟即可完成。","q":["红薯粉丝 80g（干重）","猪肉末 150g","郫县豆瓣酱 15g","生抽 10ml","老抽 5ml","食用油 10ml","蒜末 10g","姜末 5g","清水 300ml（用于煮粉丝）"],"s":["红薯粉丝提前泡软，泡水时间为 20 分钟，备用。","将蒜、姜分别剁碎，备用。","锅烧热，加入 10ml 食用油，加入蒜末、姜末炒香。","加入猪肉末翻炒至肉色发白且微微出油。","加入郫县豆瓣酱，炒至红油析出。","加入生抽和老抽，翻炒均匀。","倒入 300ml 清水，煮沸。","放入泡软沥干的粉丝，用筷子轻轻拨动防止粘连。","中小火煮约 5 分钟，直至粉丝完全吸收汤汁、呈现微微收干状态。","依据口味可撒入小葱末，关火装盘。"],"x":["粉丝不建议煮太久，易断且口感变差；若时间过长汤汁应适当减少。","郫县豆瓣酱含盐量较高，可根据口味酌情减少生抽用量。","可加入 0.5g 白胡椒粉调味，风味更佳。"]},{"t":"血浆鸭","c":"main","cu":"Chinese","m":68,"p":"chicken","ing":["鲜仔鸭肉","鲜鸭血","姜","蒜仔","葱","辣椒","酒","生抽","料酒","盐"],"tp":"","d":5,"k":2482,"i":".jpg)","q":["鲜仔鸭肉 2000g","鲜鸭血 250ml","姜 6 片 （根据个人吃辣喜好程度可多放 1-3 片姜）","蒜仔 6 瓣","香葱 2 根，切好备用","辣椒 1000g（根据个人吃辣喜好程度可选青椒，线椒，美人椒等，喜欢吃辣可增加 5-8 个小米辣或朝天椒，切好备用）","高度白酒 50ml + 水 150ml","啤酒 200ml","米酒 200ml","生抽 10ml","料酒 30ml","盐 8g","鸡精 5g"],"s":["鲜仔鸭肉切成约 3cm 小块，加料酒、姜片，去除血水。","炒锅烧热，放入约 100ml 食用油，大火待油烧开，放入腌制好的鲜鸭肉，不断翻炒。","待鸭肉完全变色（肉眼可见泛白），放入酒，再加入 200ml 开水，刚好淹没鸭肉即可，盖上锅盖中火煮 15 分钟。","水开之后，打开锅盖放入姜蒜，翻炒一遍，盖上锅盖持续加热 10 分钟。","打开锅盖放入辣椒，不断翻炒，待至肉眼可见辣椒炒软，放入鲜鸭血，此时需要不断翻炒，确保每块鸭肉和每片辣椒都有鸭血的浸润（此乃血浆鸭的精髓）。","翻炒至肉眼可见鸭血均为黑色，加入盐，鸡精，香葱，（喜欢食用山胡椒油的朋友也可以在此时放入 3-6 滴山胡椒油）再次翻炒一到二次即可。","出锅盛盘，上桌食用。"],"x":["操作时，需要注意观察水位线，调整炉火大小，以防水烧干粘锅。","放入鲜鸭血时，需要不断翻炒搅拌，防止鸭血抱团凝固成块。"]},{"t":"西红柿土豆炖牛肉","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["牛肉","小料","葱","姜","料酒","花椒","八角","香叶","白糖 or 冰糖","酱油"],"tp":"","d":4,"k":827,"i":"一道家常炖菜，酸甜开胃，汤汁浓郁，牛肉软烂，土豆绵密。牛肉提供优质蛋白，西红柿富含番茄红素，搭配土豆和洋葱，营养均衡。操作简单，无需复杂技巧，新手也能轻松上手。从备菜到出锅大约需要 1 至 1.5 小时。","q":["牛肉 500-700g","葱一根，姜四片，料酒","花椒 3g","八角一个（半）","油 15ml （若用牛腩可根据喜好减少为 10ml）","白糖 or 冰糖","酱油（千禾酿造生抽无添加），老抽","黑胡椒粉（白的也行）2g","土豆两三个（看喜好，锅能盛了为准）","西红柿拳头大小中等个头两三个","比拳头大一点的洋葱一个"],"s":["土豆去皮、切成 5cm 大块，备用。","西红柿切十字花刀，开水烫后去皮，把中间的芯去掉，切 3cm 小块备用。","葱切 4g 的葱花出来，剩下的掰成 5-8cm 大段。","牛肉泡凉水半小时去血水，或凉水下锅煮至表面变白捞出，期间撇去浮末。","洋葱切 0.5-1cm 小粒。","制作。","全程中火。","凉水没过牛肉，放入高压锅，放入葱段，姜片，放入 20g 料酒，上汽压 20 分钟。","取出牛肉后，切 5cm 大块，挑出姜，汤盛到一个大碗里一会炖煮用。","倒油，油四到五成热以后下花椒八角香叶，出香味之后糊之前挑出不用。","下入牛肉，葱姜，炒香，炒多久都无所谓，看着有点要糊可以舀 10ml 汤，此下同理。","炒香后加入生抽 15ml，料酒 15ml，胡椒粉，5-10g 番茄膏番茄酱或一个番茄罐头，加入洋葱炒至透明。","（可选）可以加一点点盐使洋葱出水不容易糊，不要加太多，后面再调味。","加入西红柿炒至西红柿化开软烂，倒入剩下的汤。","炖煮。","中火开锅后，全程小火。","出锅前 30-40 分钟 加土豆并调味。","依据个人口味边尝边加糖盐，合适为止。","筷子戳牛肉软烂后出锅！"],"x":["炖煮时保证汤加入的时候是温热的。","炖煮时不要扣盖否则土豆会烂。","炖煮时时不时翻动避免糊底。","砂锅炖煮会更好吃，可以在炒锅里炒完倒到煮锅里炖，如果用砂锅开锅之前不要用大火避免裂开。"]},{"t":"西红柿牛腩","c":"main","cu":"Chinese","m":90,"p":"beef","ing":["西红柿","牛腩","燃气灶","高压锅/砂锅/普通铝锅","牛腩"],"tp":"","d":5,"k":1569,"i":"西红柿牛腩汤汁浓厚酸甜可口，牛肉软绵醇香，是道开胃下饭的家常菜。富含蛋白质、维生素和番茄红素，营养均衡。对新手有一定挑战，需要掌握炖肉火候和番茄炒汁的技巧。一般初学者大约需要 90 分钟完成。","q":["西红柿 3-4 个（每个约 200g）","牛腩 500g","食用油 20-30ml"],"s":["牛腩切条、切块成长宽高均 2cm ，冷水下锅，开锅煮制 2 分钟去除血水，捞出冲洗干净。","另起锅 2L 水烧开，加入 2cm 两段葱段、两片姜片、八角、料/黄酒 5-10ml，放入焯好的牛肉，盖盖炖制（砂锅 1 小时，高压锅炖肉模式 45 分钟），筷子能轻松插透就证明炖好了。","西红柿去皮：西红柿头部滑十字至腰线，筷子/刀叉从果蒂捅入，煤气灶小火，一边转动一边烤，及时拿下来查看，起皮后撕下来，切块。越小越好。","撕皮小心烫，去皮后的西红柿特别滑，慢切注意安全。","起锅烧油，油温 7 成热，葱、姜各 10g，番茄下锅，炒透炒出番茄红色，加入煮好的牛腩和原汤，原汤刚刚没过牛肉即可。","根据个人口味放入盐、糖、生抽调味盖盖。","开锅后大火继续炒制 3-5 分钟。","待番茄汁呈中等粘稠程度后关火，散入葱花，盛盘。"],"x":["用火注意安全、用火注意安全、用火注意安全。","用砂锅/铝锅炖肉时，水开后转中小火/小火，使用高压锅见学习使用压力锅。","教程中的番茄去皮方式是目前为止本人实践最快的方式。","绝对不用番茄酱和少加佐料，尽可能还原食材的原味。"]},{"t":"豆豉鲮鱼油麦菜","c":"main","cu":"Chinese","m":32,"p":"fish","ing":["油麦菜","甘竹牌鲮鱼罐头","蒜","生抽","白糖","食用油"],"tp":"","d":2,"k":416,"i":"豆豉鲮鱼油麦菜是一道咸香下饭的快手家常小炒，源于粤式罐头菜肴，油麦菜清脆、鲮鱼酥香。荤素搭配，富含蛋白质和膳食纤维。做法简单，对新手十分友好，一般十五分钟即可完成。","q":["油麦菜 500g","鲮鱼罐头 1 罐（250g 上下）","蒜 4 瓣","生抽 20g","白糖 3g","食用油 15ml"],"s":["油麦菜洗净后切段。","鲮鱼罐头打开后，把鲮鱼主刺去除，切成小段后备用。","大蒜切成末。","锅热倒入食用油，油热后加入洗净的油麦菜，炒到萎蔫出水后盛出备用，倒掉炒制出的水分。","重新热锅后，加入鲮鱼罐头中的油，放入蒜末煸香。","蒜末煸香后加入鲮鱼罐头中的豆豉，翻拌后加入切碎的鲮鱼块，再次翻拌。","翻拌均匀后加入油麦菜，加入生抽和糖调味。","调味加入后简单翻拌即可出锅装盘。"],"x":["鲮鱼罐头本身带味道，加入生抽后够味，无需下盐。"]},{"t":"豉汁排骨","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["肋排","阳江豆豉","蒜蓉","姜末","生抽","老抽","蚝油","白砂糖","生粉","食用油"],"tp":"","d":4,"k":1513,"i":"这是一道粤式茶楼里的人气蒸点，豉香醇厚，排骨滑嫩脱骨。排骨提供优质蛋白和钙质，发酵豆豉增添风味也更利吸收。做法需经过泡洗、腌制和控火蒸制，对新手稍有考验，但步骤清晰易上手，从备料到出锅大约只需 1 小时。剩余的汤汁用来拌饭或拌面格外鲜美。","q":["肋排 500 g","阳江豆豉 15 g","蒜蓉 10 g","姜末 5 g","生抽 15 ml","老抽 3 ml","蚝油 10 g","白砂糖 5 g","生粉 8 g","食用油 20 ml（不打算淋热油为 10 ml）","清水 30 ml"],"s":["将排骨用冷水浸泡 10 分钟泡去血水，换水重复 2 次，用厨房纸吸干。","将豆豉放入水中浸泡 5 分钟。","将所有食材混合（食用油放 10 ml），腌制 8-30 分钟。","水开后上锅蒸 18 分钟。","焖 2 分钟。","锅中倒入 10 ml 热油，加热到 180-200 ℃。","均匀撒上葱花和白芝麻，热油浇在撒料上。"],"x":["豆豉浸泡后稍微剁碎会更入味。","蒸制时间随排骨大小调整，以筷子能轻松插入软骨处为准。","传统的豉汁排骨不放撒料和淋热油。","吃剩的汤汁可以用来拌饭或者拌面。"]},{"t":"豉汁蒸白鱔","c":"main","cu":"Chinese","m":30,"p":"none","ing":["白鱔","豆豉","蒜头","姜","葱","生抽","老抽","糖","麻油","生粉"],"tp":"","d":3,"k":472,"i":"豉汁蒸白鱔是一道粤式经典蒸菜，豆豉蒜蓉的酱香渗透进鱼肉，口感嫩滑鲜美。白鱔富含优质蛋白和多种不饱和脂肪酸，对身体有滋补作用。操作步骤清晰，但处理生鱼和掌握火候稍有挑战，适合有一定基础的厨友。从备料到上桌大约需要 30 分钟。","q":["白鱔 250g （约一条小白鱔，已去内脏并切成段）","豆豉 1 汤匙","蒜头 2 瓣 （剁碎）","姜 3 片 （切丝）","葱 1 根 （切段或丝）","生抽 1.5 汤匙","老抽 0.5 茶匙","糖 0.5 茶匙","麻油 0.5 茶匙","生粉 1 茶匙 （可选，用于腌制）","水 1 汤匙 （调酱汁）","红椒 10g （切丝，装饰用）"],"s":["购买时已请鱼贩去内脏、刮去黏液并切成约 5 厘米长的段。","回家后检查白鱔，冲洗干净，确保无残留黏液或杂质。","可选：用 3g 盐和 1 茶匙生粉轻搓白鱔段，腌制 5 分钟后冲洗干净，去腥并增加嫩滑口感。","在小碗中混合 1 汤匙豆豉、2 瓣蒜末、1.5 汤匙生抽、0.5 茶匙老抽、0.5 茶匙糖、0.5 茶匙麻油和 1 汤匙水，搅拌均匀。","若喜欢更浓郁的豉汁，可多加 0.5 汤匙豆豉。","将已切好的白鱔段平铺在耐热盘中，尽量不重叠。","将姜丝均匀撒在白鱔上。","将调好的豉汁均匀淋在白鱔上。","在蒸锅或电蒸炉中加入水 (500ml)，烧开。","将装有白鱔的盘子放入蒸锅，盖上锅盖。","用中大火蒸约 8-10 分钟 （视白鱔段大小调整时间），至白鱔熟透但不过老 （肉质变白，无血水）。","蒸好后取出，撒上葱丝和红椒丝 （可选） 作装饰。","可再淋热麻油提升香气。","趁热上桌，搭配白饭享用。"],"x":["确保白鱔新鲜，购买时选择活鱼，肉质更鲜嫩。","鱼贩切段时可指定长度 （约 5 厘米为宜），方便蒸制和食用。","蒸制时间不宜过长，以免白鱔肉质变韧。","可加入辣椒或 XO 酱，增加辣味和层次感。"]},{"t":"贵州辣子鸡","c":"main","cu":"Chinese","m":300,"p":"chicken","ing":["农村玉米鸡","土豆","大蒜","香叶","姜","老抽","花椒 or 麻椒","糍粑辣椒","豆瓣酱","啤酒"],"tp":"","d":4,"k":1441,"i":"贵州辣子鸡是贵州地区的经典家常菜，以糍粑辣椒和多种香料烹制而成，鸡肉香糯软烂，土豆绵密入味，整体风味香辣浓郁。鸡肉富含优质蛋白质，搭配土豆等配菜，营养均衡。这道菜步骤较多，对新手有一定挑战，但按部就班也能成功。从备料到出锅，预计需要 1.大约 5 小时。","q":["鸡三到四个人的量是四斤，人多可以依次累加","姜手指头大小两个","糍粑辣椒 500g，会是拳头大小两坨","香叶 2 片","菜籽油两斤，开始炸鸡会用很多","老抽 20 ml"],"s":["在锅中加入和锅一半高度的油，将切成长条的土豆先炸至表面金黄然后捞出备用，等油温上至烤手时候将切好的鸡块放入锅中炸，并放入切好的生姜片和花椒。","刚开始炸鸡的时候，油是浑浊的，因为鸡块里面有水的原因，等到油炸至清澈，鸡块就炸好了，然后捞出备用。","现在锅里面的油可以捞三分之一出来，现在用不到这么多的油。","将锅中剩余的油加热，加入糍粑辣椒，豆瓣酱，生姜片，炒出红油状，将炸好的鸡块翻炒均匀。","等到鸡块都上色，加入老抽，倒入啤酒，啤酒一定要盖过鸡块，加上香叶盖上盖，闷十分钟，期间间隔翻炒。","然后加入土豆条，大蒜（不用切，一颗一颗的最好），然后再闷 20 分钟。","最后加入酒糟翻炒均匀再加入切好的蒜苗，就可以出锅了。"],"x":["操作时，需要注意翻炒，因为糍粑辣椒会糊掉。"]},{"t":"辣椒炒肉","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["青椒","猪瘦肉","盐","生抽","蚝油","大蒜","姜","酱油","豆豉"],"tp":"","d":3,"k":425,"i":"辣椒炒肉是一道湘味浓郁的家常菜，辣椒干香微焦，肉片滑嫩入味，咸鲜微辣十分下饭。猪肉富含优质蛋白质和 B 族维生素，青椒则提供丰富的维生素 C。这道菜需要掌握干煸和快炒的火候，适合有一定烹饪基础的朋友尝试。从备料到出锅，大约需要 30 分钟。","q":["青椒的数量 3 个。","肉量 200g。","盐量 3g。","生抽 3ml。","蚝油 3ml。","大蒜 5g。","生姜 5g。","酱油 2ml。","豆豉 3g。"],"s":["将青椒洗净，去除青椒把以及青椒籽，再用滚刀手法切好备用。","大蒜用刀拍一下，再横切成蒜瓣，生姜切碎成姜末。","将猪瘦肉切成肉片（顺着猪肉的纹理切，即刀和肉的纹理呈水平线，出来的肉片，纹路呈“川”字）。","将切好的猪肉洗净，放入空碗，再加入备好的生抽、蚝油、盐搅拌均匀，腌制 10 分钟。","热锅，不用倒油，把切好的青椒放入锅中，大火干煸至虎皮状后，再加 2g盐继续翻炒 1 分钟 后捞起。","不用洗锅，大火热锅，加入8ml油，等待 30s，加入蒜瓣、姜末翻炒 15s。","加入腌制好的猪肉倒入锅内翻炒 2 分钟，再加入干煸过的青椒翻炒 1 分钟。","根据个人口味喜好加入豆豉，最后加入酱油，继续翻炒 30s。","出锅，盛盘。"],"x":["辣椒只能选择青椒，螺丝椒为最优解，切勿选择其他品种辣椒！"]},{"t":"酱排骨","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["排骨","五香粉","料酒","食用油","白砂糖","老抽","生抽","蚝油","小米椒","蒜"],"tp":"","d":4,"k":1351,"i":"酱排骨色泽酱红，肉质酥烂，骨香浓郁，汁浓味鲜，咸中带甜，是一道经典的家常菜。排骨富含优质蛋白质和钙质，营养均衡。制作涉及炒糖色和较长时间炖煮，对新手有一定挑战，但只要按步骤操作，也能顺利掌握。预计从备料到出锅约需 1 小时。","q":["排骨 300 g","五香粉 20 g","料酒 10 ml","食用油 30 ml","白砂糖 15 g","老抽 10 ml","生抽 10 ml","蚝油 5 ml","小米椒 1 个","蒜 2 粒","姜 2 片"],"s":["起锅烧热水，放入排骨、姜片、料酒，煮开后用勺子舀去白色油沫，2-3 分钟后出锅。","冷水清洗排骨，清洗 2-3 遍。","小火起锅，加入食用油，加入白砂糖 ，轻轻搅拌到糖水变成黄色。","倒入排骨翻炒 30 S 后，加入生抽、蚝油、五香粉、蒜、小米椒后翻炒 30 S 后，加入清水没过排骨。","大火煮 30 分钟，加入老抽上色，再煮 10 分钟。","起锅摆盘。"],"x":["增加味道的可以考虑加入豆瓣酱、番茄酱等。","大火煮时间可以根据每个人情况做调整。","煮排骨期间，可以顺道放入 2-3 个 鸡蛋一起煮，做成简易版卤蛋。"]},{"t":"酱牛肉","c":"main","cu":"Chinese","m":600,"p":"beef","ing":["牛腱子肉","香叶","姜","葱","老抽","桂皮","冰糖","花椒","料酒","生抽"],"tp":"","d":5,"k":2265,"i":"酱牛肉是一道北派家常冷荤，酱香浓郁，口感紧实不散，嚼劲十足。牛腱子肉富含优质蛋白和多种氨基酸，慢炖后更易消化吸收。制作过程不算复杂，但包含腌制、慢炖和长时间冷藏，对新手来说需要些耐心，从头到尾大约需要 10 小时。","q":["牛腱子肉 2000 克","香叶 1 片","姜 3 片","老抽 15ml","桂皮 1 块","冰糖 7-8 粒","花椒 15 粒","料酒 30ml","生抽 15ml","盐 8 克","八角 4 个","黄豆酱 15ml"],"s":["牛腱子肉清洗干净，用清水浸泡 1 小时，去除血水。","用牙签或者叉子在牛腱子肉表面扎孔，加料酒、花椒、姜片后，用保鲜膜紧密包裹容器，腌制 4-6 小时。","牛腱子肉切成 8cm，不超过 10cm 的肉块。","牛腱子肉放入锅中，加入冷水至水面没过牛肉，开锅至水沸腾开始计时，同时捞出浮沫。3 分钟后停火，捞出牛肉，用温水洗净。","将洗净后的牛腱子肉放入砂锅或炖锅，加水没过牛腱子肉，开大火，放入除盐之外其他未使用的配料。","水开之后，大火转为小火，持续加热 90 分钟，加盐。","加盐后，继续小火 90 分钟（注：每 30 分钟确认水位线，要求至少达到牛肉面高度的 80%）","加热 180 分钟后，捞出牛腱子肉，捞出牛腱子肉，用保鲜膜紧密包裹，放入冰箱冷藏数小时。","取出后沿牛肉纹路切片，上桌食用，其他牛腱子肉建议不切片冷藏。"],"x":["操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材（约每 30 分钟确认一次）。","用保鲜膜紧密包裹牛肉，放入冰箱冷藏数小时，可以使得切片肉质紧实不散。","用牙签或者叉子在牛肉表面扎孔可以破坏筋膜，便于入味。","下厨房app中的食谱。"]},{"t":"醉排骨","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["排骨","白砂糖","食用油","鱼露","芝麻","番茄酱","香醋","蒜头","葱","地瓜粉"],"tp":"","d":4,"k":934,"i":"醉排骨是福州传统名菜，口感外酥里嫩，酸甜开胃，带着独特的鱼露鲜香。排骨富含蛋白质和钙质，营养解馋。这道菜需要掌握挂糊和复炸的技巧，更适合有一定下厨经验的朋友尝试，全程大约需要 40 分钟完成。","q":["排骨 200 g","白砂糖 10 g","食用油 500 ml","鱼露 5 ml","芝麻 5 g","番茄酱 5 g","香醋 5 ml","蒜头 2 粒","葱 1 根","地瓜粉 30 g","鸡蛋黄 1 个"],"s":["排骨中加入 5 g 地瓜粉和水进行搅拌，清洗 2-3 遍后放入大碗备用。","排骨中加入鱼露、地瓜粉、鸡蛋黄 充分搅拌。","将排骨一个一个放入锅中（切记不可以整碗倒入），保证每个不要粘在一起。","全部放入后，每 30 S 用勺子来回两面翻转瘦肉块，直至排骨表面金黄。","取出排骨，一分钟后倒入油锅中继续炸，直至瘦肉块表面出现焦黄后，取出放入大碗备用。","准备一个小碗，加入蒜末、香醋、白砂糖、鱼露、番茄酱、葱花、芝麻搅拌均匀，倒入 5 ml 热油。","将汤汁浇灌入排骨，在充分搅拌后倒入盘中。"],"x":["鱼露，又称鱼酱油，是一种广东，福建等地常见的调味品。效果类似于生抽。","本次制作过程中，由于疫情原因没有雨露，只能用老抽代替，所以排骨颜色偏黑，正常是金黄色。"]},{"t":"青椒土豆炒肉","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["青椒","土豆","猪肉","葱","姜","蒜","盐","酱油","土豆淀粉"],"tp":"","d":3,"k":1288,"i":"青椒土豆炒肉是一道荤素搭配的家常小炒，口感鲜香脆嫩，酱香浓郁，特别下饭。土豆富含碳水化合物和维生素 C，青椒提供丰富的维生素 C 和膳食纤维，搭配猪肉的优质蛋白质，营养均衡。这道菜做法不复杂，对新手比较友好，从备料到出锅大约只需 1 小时。","q":["青椒 2 个（共约 200g）","土豆 2 个（共约 300g）","猪肉 200g","葱 1 根（约 10g）","姜 1 块（约 5g）","蒜 3 瓣（约 12g）","盐 7g","酱油 6-10ml","食用油 10-15ml","土豆淀粉 5g","水 15g"],"s":["青椒去除根蒂切小块，土豆去皮切 2mm 薄片，猪肉切 4mm 薄片，葱横纵切 3mm 小段，姜蒜去皮拍散剁碎末；土豆淀粉加入约 15g 水搅拌均匀至水淀粉。","起锅烧油，加热至 7 成热放入猪肉片，缓缓翻滚炒至去肉红色，加入约 3ml 酱油，翻炒肉片均匀上色，放入约 2g 盐。","转 5 成油温，加入葱姜蒜炒 5 秒，然后加入土豆片，转 7 成油温均匀翻炒，加入约 5ml 酱油和 2g 盐，炒至土豆断生，表面轻微焦黄。","转 8 成油温加入青椒，大火煸炒出锅气（有白烟冒出），反复均匀翻炒 1 分钟上色，最后在锅周围倒入水淀粉转 4 成火勾芡。","在外观呈粘稠状态后关火，盛盘。"],"x":[]},{"t":"青椒酿","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["青椒","猪肉","葱","生姜","生抽","老抽","食盐","食用油","淀粉","大蒜"],"tp":"","d":3,"k":1403,"i":"这道广西经典家常菜以青椒包裹调好味的肉馅或虾滑，煎至表皮起皱呈虎皮色后焖煮入味，青椒清香与馅料鲜美交融，咸香微辣，十分下饭。猪肉和虾仁提供优质蛋白质，青椒富含维生素 C，营养均衡。制作需要一点耐心酿馅，但整体流程清晰，跟着步骤操作一般 30 分钟就能完成。","q":["青椒 8 个（约 400g，选笔直肉厚的尖椒）","猪肉馅 250g（肥瘦比例 3:7）","葱 2 根（约 30g）","生姜 1 小块（约 10g）","生抽 30ml（其中 15ml 调馅，15ml 调酱汁）","老抽 5ml","食盐 3g","食用油 30ml","淀粉 10g（可选，其中 5g 涂青椒内壁、5g 水淀粉勾芡）","大蒜 4 瓣（可选，约 15g）","蚝油 10ml（可选）","料酒 10ml（可选）","鸡蛋 1 个（可选）","白胡椒粉 2g（可选）","白糖 5g（可选）"],"s":["猪肉洗净剁成肉馅（或用绞肉机），姜切末，葱切葱花。","肉馅中加入姜末、葱花、生抽 15ml、老抽 5ml、食盐 3g，搅拌均匀。","可选加入：料酒 10ml、蚝油 10ml、鸡蛋 1 个、淀粉 5g、白胡椒粉 2g、白糖 5g。","朝一个方向搅拌肉馅至粘稠上劲，腌制 10 分钟。"],"x":["青椒选笔直的比弯的好塞馅料，肉厚的尖椒比薄皮的口感更好。","馅料朝一个方向搅拌才能上劲，口感更 Q 弹。","青椒内壁涂干淀粉是防粘的关键，煎时肉馅不会脱落。","煎至虎皮色是风味来源，不要跳过。"]},{"t":"香干肉丝","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["猪里脊","香干","盐","生抽","淀粉","大蒜","青椒","鸡精"],"tp":"","d":3,"k":472,"i":"香干肉丝是一道咸香下饭的家常小炒，肉丝嫩滑，香干柔韧，青椒爽脆。富含动物性与植物性双重蛋白质，搭配青椒补充维生素。难度适中，新手稍加练习即可掌握，预计制作时长约 30 分钟。","q":["香干 75g","青椒的数量 5 个","肉量 100g","盐量 3g","生抽 5ml","淀粉 5g","大蒜 5g（大约 3 个蒜瓣）","鸡精 2g"],"s":["肉丝（没有肉丝，自己切）用生抽(3ml)，生粉混合均匀待用。","将青椒洗净，再用滚刀手法切好备用。","大蒜横切成片，香干切丝。","淀粉与水(10ml)混合，搅拌均匀。"],"x":["辣椒选择青椒，螺丝椒为最优解，喜欢辣的可以加入小米椒切细碎，同青椒一起加入！"]},{"t":"香干芹菜炒肉","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["豆干","香芹/芹菜","猪肉","大蒜","辣椒：青椒或者红椒都可以","花椒：可选","盐","鸡精：可选","老抽","蚝油"],"tp":"","d":3,"k":741,"i":"香干芹菜炒肉是一道家常小炒，豆干柔韧、芹菜爽脆、猪肉嫩滑，咸鲜微辣。芹菜富含膳食纤维，豆干和猪肉提供优质植物蛋白与动物蛋白。做法简单，对新手友好，从备料到出锅大约只需 30 分钟。","q":["注意，此数值大约是 2 个人的量。","豆干：150g","香芹：4 根","猪肉：200g","蒜头：2 瓣","辣椒：4 个","花椒：6 粒（不喜欢可以不放，或者放花椒水）","盐：5g","鸡精：3g","老抽：8ml","蚝油：5ml","食用油：10-15ml"],"s":["芹菜去叶切段、切成不超过 4cm 的条状，备用。","香干切条，宽约小拇指，备用。","蒜头切片或者剁成蒜泥都行，备用。","辣椒切圈或者斜切成条都行，备用。","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高。","放入花椒、大蒜爆香（可以吃姜的也可以额外放入一些姜片/姜丝）","加入猪肉炒至变色，再加入 8ml 老抽上色翻炒均匀（有豆瓣酱的，可以放入 3ml 豆瓣酱一起翻炒）","加入香干翻炒均匀（大约 2 分钟）","加入辣椒翻炒均匀（大约 1-2 分钟）","加入芹菜，放入 5g 盐翻炒 1 分钟。","加入 3g 鸡精、5ml 蚝油翻炒均匀，即可出锅。"],"x":["如果没有买到香芹，或者用的芹菜比较粗，可以考虑焯水，放入滚水中 1 分钟捞出，冷水冲洗（保持爽脆）","如果买到的豆干比较硬、紧实，也可以切条后再焯水。","香干芹菜炒肉教程。"]},{"t":"香煎五花肉","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["五花肉条","生菜"],"tp":"","d":3,"k":2985,"i":"香煎五花肉是一道家常风味的快手荤菜，五花肉片煎得焦香微脆、肥而不腻，搭配脆爽的生菜叶和咸鲜豆瓣酱，入口酱香浓郁又解腻。猪肉富含优质蛋白质和脂肪，能快速补充能量，生菜则提供膳食纤维和维生素，营养更均衡。这道菜适合有一定下厨基础的朋友，新手只要注意火候和防溅油也能轻松上手，从备料到出","q":["食用油 5ml"],"s":["将五花肉条沿长边切片，每片厚 1mm-1.5mm，备用。","将切好的五花肉放置碗中，依次加入 8g 酱油，1g 盐，1g 味精，10g 料酒，两片姜，两朵拍扁的大蒜腌制 10 分钟。","将生菜叶直接用手扒下来，洗干净，备用。","热锅，倒入 5ml 食用油。油轻微冒烟后下入五花肉。单面煎制焦黄色后翻面，另一边同理。","五花肉出锅后，装盘。","将豆瓣酱抹到菜叶上，卷着五花肉即可食用。"],"x":["五花肉条（推荐长宽高为 20cm×6cm×5cm）","操作时，小心被溅出的油烫到。"]},{"t":"香菇滑鸡","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["大鸡腿","干香菇","姜","葱","蒜"],"tp":"","d":3,"k":608,"i":"香菇滑鸡是一道以鸡腿肉和香菇为主料的家常菜，鸡腿肉经过煸炒和焖煮后口感滑嫩，搭配香菇独特的菌香，汤汁浓郁鲜美，属于老少皆宜的粤式风味。鸡肉富含优质蛋白质和多种氨基酸，香菇含有香菇多糖和膳食纤维，有助于增强免疫力和促进消化。这道菜需要一些刀工和火候控制，对新手有一定挑战，整体制作约","q":["大鸡腿 2 个","干香菇 5 粒","姜 2 片","葱 2 颗","蒜 2 瓣","温水(30-40 ℃) 150ml","料酒 15ml","生抽 30ml","盐 1.5g","老抽 15ml","糖 15ml","香油 5ml"],"s":["温水泡发干香菇。","姜切小块，葱切段，蒜对半切小粒。","鸡腿去骨（不去骨也可，只是略影响程序员吃饭的效率而已），切成小块。","泡发的香菇一分为四，香菇水留着备用。","鸡腿肉焯水 1 分钟，去除血沫和杂质。","鸡腿肉中加料酒 15ml、生抽 15ml、盐 1.5g、老抽 15ml，抓匀。","油温 3 成，下入鸡腿肉煸炒，等鸡腿肉金黄后盛出备用。","锅留底油，下入葱、姜、蒜炒香，香菇入锅，大火翻匀。","等待 20 秒会有香菇香味从锅中飘出，此时下入煸炒过的鸡腿肉，下入香菇水（全部，本程序员认为的灵魂操作）、糖 15ml、生抽 30ml。","转中火不盖盖，咕嘟 2 分钟收浓汤汁，淋入香油 5ml，撒上葱花后即可关火、装盘。"],"x":["鸡腿于案板摆正，骨头正对程序员，从头部划一刀至最底部，刀口要深，确保有碰到骨头。","用手扒拉肉到两边。","用刀尖隔开骨头上沾着的肉。","鸡腿翻面，刀紧贴骨头插入，挑断骨头与肉的连接点。"]},{"t":"香辣鸡爪煲","c":"main","cu":"Chinese","m":56,"p":"chicken","ing":["鸡爪","葱","姜","料酒","香叶","八角","生抽","老抽","蒜","小米椒"],"tp":"","d":4,"k":986,"i":"香辣浓郁、口感 Q 弹，是一道常见的家常下饭菜。鸡爪富含胶原蛋白，有助滋润皮肤、强健筋骨。制作需要先去趾甲，若用整只鸡爪还需去骨，对新手略有挑战，但耐心按步骤操作也能成功。从焯水到小火慢煮再翻炒入味，全程约需 45 分钟。","q":["香叶 3 片","小米椒 6 个","姜末 10g","蒜末 10g","小葱 2 根","蚝油 3g"],"s":["给鸡爪剪去指甲。如果买的鸡爪只有脚掌部分，对半切开即可。 如果是整只鸡爪，需要去骨。清水洗干净。","鸡爪冷水下锅，葱姜料酒焯水，水开，撇去浮沫。","加入香叶、八角、生抽、老抽，盖盖小火慢煮三十分钟。","捞出鸡爪，留一碗鸡汤备用。","起锅烧油，用小火炒香姜末、蒜末、小米椒，能吃辣再放点辣椒面。加入生抽、老抽、蚝油、五香粉、盐，炒出酱香味。","放入鸡爪，放一点盐调味，翻炒一两分钟，再倒入鸡汤，边炒边搅动。","放入鸡精提鲜，撒入葱段搅拌均匀即可出锅。","注：如果需要加入配菜，请在放入鸡爪之前，底料炒香之后执行。"],"x":[]},{"t":"鱼香肉丝","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["里脊肉 200g","胡萝卜 100g","青椒 100g","木耳 5g","生抽 10ml","料酒 5ml","蛋清 1 个","淀粉 10g","醋 15ml","白糖 10g"],"tp":"","d":4,"k":421,"i":"鱼香肉丝是一道经典川菜，口味酸甜微辣，肉丝滑嫩，配以胡萝卜、青椒和木耳，口感丰富。富含蛋白质和多种维生素，荤素搭配，营养均衡。制作有一定难度，需要调好鱼香汁并掌握翻炒火候，新手建议严格按步骤操作。预计制作时长约 40 分钟（不含木耳泡发时间）。","q":["注意，这道菜仅有足够 1-2 人食用的版本。"],"s":["生抽 5ml。","料酒 5ml。","淀粉 5g。","水 20ml。","蛋清 1 个。","生抽 5ml。","醋 15ml。","白糖 10 克。","盐 1 克。","淀粉 5g。","水 20ml。"],"x":[]},{"t":"鱼香茄子","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["茄子","肉末","盐","糖","味精","生抽","老抽","醋","水淀粉","豆瓣酱"],"tp":"","d":3,"k":579,"i":"鱼香茄子是一道经典的川味家常菜，酸甜微辣，茄子软糯吸汁，非常下饭。茄子富含膳食纤维和多种维生素，搭配肉末能补充蛋白质。制作难度中等，需要掌握炸茄子和调味技巧，新手稍加练习也能成功。从备料到出锅大约需要 30 分钟。","q":["茄子 2 根","肉末 20g","盐 3-5g","糖 5-10g","味精 5g","生抽 10ml","老抽 5ml","醋 10ml","水淀粉 100ml","豆瓣酱 20-30g","小葱、姜、蒜、小米辣 （根据自己口味）"],"s":["将茄子切成条。","将肉切成肉沫，葱姜蒜切碎、小米椒切丁。","调鱼香汁：碗中放入盐、味精、糖、生抽、老抽、醋、水淀粉搅拌均匀。","锅中倒入 300ml 油，开小火（小火容易掌控），等油温七成热（小火大约 40 秒，有烟冒出）放入茄子炸两分钟，当茄子边缘微黄就捞出。多出的油可以盛出以后炒菜用。","锅中留 15-30ml 油，倒入肉沫炒至颜色变白就盛出来。","锅中倒入 15-30ml 油，放入豆瓣酱、葱白、姜、蒜炒香，然后倒入肉沫翻炒均匀。","加入 80-150ml 清水（水面预计茄子八成高度为准），倒入茄子、倒入料汁，爆炒入味收汁。最后放入葱翻炒均匀，就可以起锅了。"],"x":["茄子看个人喜好，可以去皮，肉沫也可以多放一点。","参考: 鱼香茄子详细步骤。"]},{"t":"麻婆豆腐","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["内脂豆腐","水果刀","咸鸭蛋","五花肉","大蒜","生姜","小米椒","香辣酱","花椒","食盐"],"tp":"","d":3,"k":476,"i":"这道香辣滑嫩的豆腐菜以咸鸭蛋替代传统豆瓣酱，咸鲜中带着微麻微辣，格外开胃下饭。富含优质蛋白和钙、铁等多种微量元素。制作难度适中，对新手友好，全程约需 40 分钟。","q":["1 盒内脂豆腐","1 枚咸鸭蛋","20-30g 五花肉","2 片生姜","5 根小米辣","5g 蒜蓉辣酱","20 颗花椒","3g 食盐","10g 酱油"],"s":["大蒜和生姜切碎，备用。","小米辣切成辣椒圈，备用。","五花肉切成肉糜。","肉糜中加入一半的食盐和味极鲜酱油，搅拌均匀，备用。","鸭蛋用菜刀竖着对半切开（注意安全），去除蛋黄（一定要去除，不然会腥），剩下的蛋白捣碎成大约 2mm×2 mm 大小，不用太碎，备用。","打开豆腐包装，用水果刀将在盒子中的豆腐划成大约 2.5cm×3 cm 大小，备用。","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高。","调成小火，放入大蒜、生姜、辣椒圈、花椒、咸鸭蛋、蒜蓉辣酱翻炒 20 秒，炒出香味。","调成中火，放入肉糜，翻炒大约 1 分钟，肉炒变色。","调成小火，放入豆腐，将剩下的食盐、味极鲜酱油酱油均匀的洒在豆腐上。","从锅边倒入开水（不然豆腐容易破），没过豆腐即可。","开大火，水沸腾后立马转入中火，等待大约 10 分钟。","等到水只剩 1/5 并且豆腐表面已经入色，关火，盛盘。"],"x":["期间一定要注意观察，防止糊锅。"]},{"t":"麻辣香锅","c":"main","cu":"Chinese","m":30,"p":"tofu","ing":["青菜","无骨肉","干豆腐","北京麻辣方便面","干辣椒"],"tp":"","d":3,"k":1050,"i":"一道麻辣浓郁的川味家常菜，汇集蔬菜、肉类和豆制品，口感香辣过瘾、层次丰富。荤素搭配提供了优质蛋白质和多种维生素，营养全面。操作步骤清晰，需要掌握焯水和翻炒火候，对新手有一定挑战，总制作时间约 30 分钟。","q":["此数值大约是 3 个人的量。","青菜共需 455 克，其中油菜、油麦菜、菠菜的比例按自己喜好分配即可","无骨肉共需 430 克，其中猪肉、牛肉、鸡肉、鱼丸、火腿肠的比例按自己喜好分配即可","干豆腐 152 克","北京麻辣方便面 1 袋","干辣椒 5 克","麻辣香锅调料 110 克"],"s":["烧开一锅水（水量能没过第 2-4 步中的食材即可）。","在开水中放入青菜，焯 5 分钟后盛出备用。","在开水中放入无骨肉，焯 4 分钟后盛出备用。","在开水中放入北京麻辣方便面，煮 2 分钟后盛出备用。","倒出开水，擦干锅具，放入 105 克食用油，大火加热 30 秒。","放入麻辣香锅调料，翻炒 20 秒。","放入干辣椒，翻炒 10 秒。","放入焯过的青菜，改中火，翻炒 3 分钟。","放入焯过的无骨肉，翻炒 3 分钟。","放入煮过的北京麻辣方便面，用筷子翻动 1 分钟。","关火，出锅。"],"x":["以上内容中，青菜、无骨肉、干豆腐、北京麻辣方便面的配比为推荐配比，如果有自己喜欢的食材，可以按喜好重新分配比例。","大火通常温度在 240 摄氏度，以电磁炉为例，输入功率大约 2 千瓦。","中火通常温度在 120 摄氏度，以电磁炉为例，输入功率大约 1.4 千瓦。"]},{"t":"黄油鸡","c":"main","cu":"Chinese","m":60,"p":"chicken","ing":["鸡腿肉","酸奶","黄油","淡奶油","番茄","洋葱","生姜","大蒜","腰果","姜黄粉"],"tp":"","d":4,"k":641,"i":"这是一道源自印度的经典咖喱菜肴，以烤制后再炖煮的鸡腿肉搭配番茄、黄油和奶油制成的酱汁，口感醇厚丝滑，酸甜微辣，带有独特的香料复合香气。鸡肉、酸奶和腰果提供了丰富的蛋白质与健康脂肪，番茄和香料也带来一定的维生素与抗氧化物。制作有一定挑战，需要掌握火候和香料的平衡，加上腌制时间共约 ","q":["鸡腿肉 500g（去骨，切大块）","酸奶 80ml","生姜 10g，磨碎","大蒜 4 瓣（约 12g），磨碎","红辣椒粉 5g","姜黄粉 3g","盐 3g","柠檬汁 15ml","食用油 15ml","番茄 5 个（约 500g），切块","洋葱 1 个（约 100g），切块","腰果 30g","生姜 10g","大蒜 4 瓣","黄油 50g","淡奶油 100ml","红辣椒粉 5g（Kashmiri 红辣椒粉最佳）","香菜粉 5g","孜然粉 3g","印度综合香料粉 3g","小豆蔻粉 2g","干葫芦巴叶 3g（用手搓碎）","糖 10g"],"s":["在大碗中混合酸奶、生姜泥、大蒜泥、红辣椒粉、姜黄粉、盐、柠檬汁。","放入鸡肉块，充分裹上腌料。","盖保鲜膜，冷藏腌制至少 1 小时。"],"x":["干葫芦巴叶(Kasuri Methi)是这道菜独特风味的关键配料，能赋予一种特殊的草本香气。在印度食品店或电商平台可以购买到。","使用 Kashmiri 红辣椒粉可以使颜色更鲜红但辣度较低。如果买不到，可以用普通红辣椒粉减半并加入 3g 红甜椒粉。","腰果的作用是使酱汁更加浓稠丝滑。如果对坚果过敏，可以用等量的淡奶油替代。","此菜通常搭配印度烤饼(Naan)或巴斯马蒂米饭食用。"]},{"t":"黄焖鸡","c":"main","cu":"Chinese","m":40,"p":"chicken","ing":["鸡腿","香菇","青椒","生姜片","干辣椒","盐","料酒","白胡椒粉","白糖","酱油"],"tp":"","d":3,"k":766,"i":"黄焖鸡是一道以鸡腿、香菇、青椒为主料的家常菜，汤汁浓郁，鸡肉滑嫩，咸鲜微甜，十分下饭。富含优质蛋白质和菌菇多糖等营养。炒糖色环节稍有挑战，但可用老抽替代，整体难度不高，新手也能顺利掌握。从备菜到出锅，大约需要 40 分钟。","q":["鸡腿 两只","香菇（干香菇最佳） 5 朵","青椒 两个","生姜片 两片","干辣椒 5，6 个","盐 10g","料酒 10ml","白胡椒粉 5g","白糖 5g","酱油 5ml","土豆 一个（可选，可使汤汁更粘稠）"],"s":["鸡腿洗净，剁成4cm大小的块。","生姜切片、干辣椒切成小圈。","香菇切片，青椒切成细长的马蹄状，若为干香菇，洗净灰尘后泡一晚上并留香菇水备用。","若有土豆，切为与鸡肉大小类似的滚刀块。"],"x":[]},{"t":"黄瓜炒肉","c":"main","cu":"Chinese","m":25,"p":"pork","ing":["黄瓜","猪瘦肉","食用油","生抽","盐","蒜","小米辣"],"tp":"","d":3,"k":550,"i":"这是一道清爽脆嫩的家常快手菜，咸鲜适口，带有蒜香与微辣。富含蛋白质和多种维生素，有助于清热补水。对新手比较友好，只要注意火候就能成功，预计制作时长约 25 分钟。","q":["黄瓜 100 克","猪肉 50 克","油量 50 克","盐量 10 克","酱油 5 克","蒜瓣 2 瓣","小米辣 1 根"],"s":["将猪瘦肉切片，放入碗中，倒入食用油 10 克，生抽，搅拌均匀，腌制 10 分钟。","将黄瓜切去 5 厘米的头尾，剩余部分斜着切成 0.5 厘米的薄片。","将黄瓜倒入碗中，撒上盐 8 克，搅拌均匀，腌制 5 分钟。","将蒜瓣去皮，压扁，切成蒜末备用。","将小米辣去丁切分成均匀 0.5 厘米的段状。","热锅，倒油 40 克，等油温到冒烟，放入蒜蓉小米辣翻炒 5 次。","放入腌制好的猪瘦肉，翻炒至肉熟变色。","放入黄瓜，加入盐 2 克，大火翻炒均匀半分钟，出锅。","如果无法保证大火，可能会有点生。可以考虑增加到 50 秒。"],"x":[]},{"t":"黑椒牛柳","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["牛肉","洋葱","菜椒","淀粉","黑胡椒","黑椒","盐","花生油","建议使用不粘锅。"],"tp":"","d":4,"k":216,"i":"黑椒牛柳是一道广受欢迎的家常小炒，黑椒风味浓郁，牛柳嫩滑，搭配甜脆的洋葱和彩椒，荤素均衡，口味老少咸宜。牛肉富含优质蛋白和铁，彩椒和洋葱能补充多种维生素。这道菜对新手十分友好，从备料到出锅，通常一小时以内就能完成。","q":["牛肉量 100 克 （视就餐者胃容量和锅容量酌情增减）","洋葱量 1/12 个（即 3 人时约切 1/4 ）","菜椒量 1/12 个（即 3 人时约切 1/4 ）","盐量 1 克","淀粉 3 克","黑椒腌料 参照所购商品的说明按比例腌制","黑胡椒粉 1 克（实际上是随便撒）","花生油 10ml （实际上油量是依据菜量变动的，如对牛肉的量有增减请按对应比例变动）"],"s":["将牛肉切条，长度最好控制在 8 厘米以下，厚度约 5-10 毫米，宽度约 1 厘米（要求不严格）","利用腌料腌制牛肉，混合均匀后静置，用量与时间请参照商品说明，可以延长不能缩短。","如果使用液态腌料，可以在腌制结束前三分钟撒一层黑胡椒粉，然后再加入淀粉，再次混合均匀后静置 20 分钟。","开火，热锅，加入花生油。","当能看到锅里的油冒出一丝烟时，放入牛肉，翻炒。","开中火偏大，翻炒 2 分钟至牛肉外表变色（即不出现明显血色，有血色部分说明翻炒不到位）（此处应小心油滴溅射）。","放入洋葱和菜椒，翻炒 2 分钟。","加入盐，再次撒一份黑胡椒粉，翻炒 30 秒，搅拌均匀。","观察洋葱已经变软即可关火，出锅，盛盘。"],"x":[]},{"t":"黔式腊肠娃娃菜","c":"main","cu":"Chinese","m":15,"p":"none","ing":["黔式腊肠","娃娃菜"],"tp":"","d":1,"k":1030,"i":"这道菜咸鲜可口，融合了黔式腊肠的醇香与娃娃菜的清甜，是西南菜系中少见的不辣风味，南北皆宜。娃娃菜富含维生素和膳食纤维，搭配腊肠的蛋白质与脂肪，营养均衡。制作过程极为简单，无需掌握火候和额外调味，从备料到出锅仅需 15 分钟，非常适合新手和忙碌的日常。","q":["黔式腊肠 200g","娃娃菜 300g","水 750ml"],"s":["锅内放入 750ml 水，开火加热至沸腾。","放入腊肠，计时 13 分钟。","放入娃娃菜，计时 2 分钟。","关火，夹出腊肠及娃娃菜。","娃娃菜切段、腊肠切片，装盘。"],"x":["根据锅的大小，建议以水量没过食材为宜，宁多勿少。","如果没有刀具，娃娃菜和腊肠不切也可以。"]},{"t":"咖喱炒蟹","c":"main","cu":"Chinese","m":56,"p":"fish","ing":["青蟹","咖喱块","洋葱","椰浆","鸡蛋","生粉","大蒜"],"tp":"","d":4,"k":815,"i":"这是一道融合泰式风味的家常海鲜菜，浓郁咖喱包裹着爆满的蟹肉，带有蟹黄香气和椰浆的顺滑口感。螃蟹富含优质蛋白和多种微量元素，有助于补充体力。制作工序清晰，只需注意封煎蟹黄和最后关火翻炒酱汁，对有一定下厨经验的人比较友好，一般从备料到出锅约需 30 分钟。","q":["肉蟹 1 只（大约 300g）","咖喱块 15g（一小块）","椰浆 100ml","鸡蛋 1 个","洋葱 200g","大蒜 5 瓣"],"s":["肉蟹掀盖后对半砍开，蟹钳用刀背轻轻拍裂，切口和蟹钳蘸一下生粉，不要太多。撒 5g 生粉到蟹盖中，盖住蟹黄，备用。","洋葱切成洋葱碎，备用。","大蒜切碎，备用。","烧一壶开水，备用。","起锅烧油，倒入约 20ml 食用油，等待 10 秒让油温升高。","将螃蟹切口朝下，轻轻放入锅中，煎 20 秒，这一步主要是封住蟹黄，蟹肉。然后翻面，每面煎 10 秒。煎完将螃蟹取出备用。","将螃蟹盖放入锅中，使用勺子舀起锅中热油泼到蟹盖中，煎封住蟹盖中的蟹黄，煎 20 秒后取出备用。","不用刷锅，再倒入 10ml 食用油，大火让油温升高至轻微冒烟，将大蒜末，洋葱碎倒入，炒 10 秒钟。","将咖喱块放入锅中炒化（10 秒），放入煎好的螃蟹，翻炒均匀。","倒入开水 300ml，焖煮 3 分钟。","焖煮完后，倒入椰浆和蛋清，关火，关火后不断翻炒，一直到酱汁变浓稠。","出锅。"],"x":["做法参考：十几年澳门厨房佬教学挂汁的咖喱蟹怎么做。"]},{"t":"响油鳝丝","c":"main","cu":"Chinese","m":40,"p":"pork","ing":["鳝丝","大蒜","姜末","料酒","生抽","蚝油","老抽","食用盐","白糖","胡椒粉"],"tp":"","d":3,"k":556,"i":"响油鳝丝是一道经典的江浙沪家常菜，鳝丝鲜嫩滑爽，蒜香浓郁，酱汁微甜，淋上热猪油后香气四溢，非常下饭。鳝鱼富含优质蛋白和 DHA，营养丰富。这道菜对刀工和火候有一定要求，难度适中，新手需要稍加练习。从备料到出锅，一般 大约 40 分钟就能端上餐桌。","q":["鳝丝 400 g","大蒜 40 g","姜末 20 g","料酒 13 g","生抽 3 g","蚝油 2 g","老抽 2 g","食用盐 2 g","白糖 6-15 g","胡椒粉 3.5-8 g","淀粉 10 g","水 50 g","蒜末 40 g","葱花 15 g","猪油 20 g"],"s":["将鳝鱼切成三段后切成细丝。","加入 0.5 g 胡椒粉、3 g 料酒搅拌均匀，再加入 5 g 香油腌制。","热油滑锅。","加入植物油，烧到 6 成热。","加入一半蒜末和全部姜末，翻炒几下。","加入鳝丝，中火爆炒 30 秒。","边缘淋入 10 g 料酒，翻炒几下。","加入生抽，炒匀。","加入蚝油、老抽，翻炒几下。","加入食用盐、白糖、3 g 胡椒粉，炒匀。","淀粉和水混合为水淀粉，倒入锅中，收汁至浓稠。","装盘，撒上蒜蓉、葱花。","另起锅烧热，加入猪油，烧至七成热，浇在鳝丝上。"],"x":["不能将鳝鱼的血洗得太干净，否则鳝鱼很容易发黑发臭。","鳝鱼可以让摊主帮忙宰杀。","可以多加一些胡椒粉和白糖，有利于去腥增香。","参考资料：“响油鳝丝”的家常做法，味道很赞，先收藏了 - YouTube。"]},{"t":"小龙虾","c":"main","cu":"Chinese","m":45,"p":"shrimp","ing":["小龙虾","油","香叶","八角","桂皮","青花椒","花椒","子弹头辣椒","葱姜蒜","郫县豆瓣"],"tp":"","d":4,"k":571,"i":"这道菜麻辣鲜香，虾肉细嫩多汁，是经典的川湘风味下酒菜，在家自制干净又实惠。小龙虾富含优质蛋白和多种微量元素，但汤汁含油盐较多，适合偶尔享用。处理活虾和多种香料对新手有一定挑战，不过不去虾线可明显降低难度。从备料到出锅大约需要 45 分钟。","q":["以下是两斤小龙虾的量，按比例调整就好。","小龙虾 2 斤","油 70 毫升（这是平时炒菜 3 倍量）","香叶 两片","八角 一个","桂皮 3 克","青花椒 10 克","花椒 10 克","子弹头辣椒 5 克","葱 一根大葱","姜 30 克","蒜 7 瓣大蒜","郫县豆瓣 30 克","黄豆酱 30 克","啤酒 500 毫升","生抽 30 毫升","盐 10 克"],"s":["小龙虾刷干净去虾线，葱切 2cm 葱段，姜蒜切末。","烧油，油微热, 下香叶、八角、桂皮、青花椒、花椒、子弹头辣椒。","香料出香气之后下锅葱姜蒜。","葱姜蒜爆香后，加入郫县豆瓣、黄豆酱，炒出红油。","下小龙虾，翻炒至变色。","加入啤酒，等啤酒烧开后加入生抽，盐。","将小龙虾完全煮熟后出锅。"],"x":["饭店应该都是油炸一遍，家庭油炸的话，太浪费了，所以在这个菜谱里用油比炒菜油多一些煎一下，实测同样好吃。","去虾线后的虾肉比不去虾线的虾肉口感差一些，并且小龙虾去虾线对新手是一个挑战，能接受虾线的情况下不去虾线也可以。"]},{"t":"干煎阿根廷红虾","c":"main","cu":"Chinese","m":20,"p":"shrimp","ing":["阿根廷红虾","海盐","黑胡椒","白葡萄酒","生抽","香菜","柠檬","洋葱","生姜","大蒜"],"tp":"","d":3,"k":309,"i":"一道鲜美诱人的海鲜快手菜，煎制后的阿根廷红虾肉质白嫩，口感鲜甜浓郁，虾壳酥香。富含碘、磷和虾青素等微量元素，有助于增强免疫力、保护心脏并降低胆固醇。难度适中，需要掌握火候和翻面技巧，但步骤清晰，新手按操作来也能成功。预计 大约 20 分钟即可完成。","q":["阿根廷红虾 2-3 只","海盐 5g","黑胡椒（研磨装）","白葡萄酒 20ml","生抽 1ml","香菜 3 片","柠檬 1 片","洋葱 10g","生姜 10g","大蒜 10g"],"s":["阿根廷红虾解冻，最好是提前 1 天从速冻取出放到冷藏里自然解冻，能更好保持风味和口感。可买已经开背去虾线的，节省了不少时间。","解冻好的红虾洗净擦干备用，注意这里一定要沥干水分，赶时间可以用厨房用纸吸干水分。","生姜切片，洋葱切小方块，香菜洗干净后，叶茎分离，把香菜叶切碎，大蒜压碎切成小块碎末。","大火热锅，热锅后倒入两调羹橄榄油，等油温升高后，放入生姜片，洋葱块和香菜茎煸炒。","约 1 分钟后取出生姜，洋葱和香菜茎，弃用。","调中大火，放入红虾开始煎，注意所有虾需要单面都完整接触平底锅，煎约 2 分钟，同时给每只虾刷上一层油。","待底面虾壳有微微焦黄时翻面，并撒入大蒜碎末，轻微晃动平底锅使得受热均匀。","约 1 分钟后添加 20ml 白葡萄酒。","再煎 1 分钟后调中小火，均匀撒上一层盐和黑胡椒。","给每只虾滴上一滴生抽。","撒上香菜叶，装盘。","切好柠檬片，摆放到盘边即可。"],"x":["柠檬可提升虾的口感，但偏酸，可以根据喜好添加，也可以不用。","趁热吃。"]},{"t":"微波葱姜黑鳕鱼","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["黑鳕鱼，带皮","青葱","姜","料酒","酱油","芝麻油","花生油","密封袋"],"tp":"","d":3,"k":749,"i":"微波做鱼，葱姜提鲜，热油一淋，香气四溢，是一道肉质细嫩、滋味咸鲜的家常蒸鱼菜，属于改良粤式做法。黑鳕鱼富含优质蛋白和欧米伽-3 脂肪酸，对心脑健康有益。操作不算复杂，但需掌握火候和油温，更适合有一定下厨经验的朋友。从备料到上桌大约只需二十分钟。","q":["黑鳕鱼，带皮，2 片，450g（本菜谱主角，所有调料可根据鳕鱼的实际重量进行比例调整）","青葱，葱白，25g。","青葱，葱绿，10g。","姜，13g。","料酒，5mL。","酱油，25mL。","芝麻油，2mL。","花生油，50mL。"],"s":["鱼片分别放入密封袋，鱼皮向下放在盘子中。","取葱白切丝 25g，姜去皮后切丝，10g，混合在一起后分成两半，分别放在袋内鱼片上。","每个袋子倒入 2.5mL 料酒。","封好密封袋，放入微波炉中，中火（800 瓦）微波至不透明且容易散开时（约 3.5-5 分钟），从袋中取出鱼片。","去除青葱和姜。","取酱油 25mL，芝麻油 2mL，混合均匀后平均淋在两片鱼片上。","取葱绿切细丝 10g，姜去皮后切丝 3g，混合后分成两份撒在鱼片上。","取花生油 50mL，在小锅中加热至 190℃。","将热油淋到放油葱绿的鱼片上，立刻上桌。"],"x":["| 鱼类 | 是否切片 | 重量 | 微波时间 |。","|----------|----------|------|-----------|。","| 海鲈鱼 | 整条 | 450g | 6.5 分钟 |。","| 罗非鱼 | 整条 | 800g | 6 分钟 |。"]},{"t":"水煮鱼","c":"main","cu":"Chinese","m":120,"p":"fish","ing":["巴沙鱼","蔬菜","红油豆瓣酱","藤椒油","菜籽油","白胡椒粉","蒜瓣","盐","糖","量杯"],"tp":"","d":4,"k":248,"i":"水煮鱼是一道麻辣鲜香、鱼肉嫩滑的经典川菜。巴沙鱼富含优质蛋白且脂肪含量低，搭配时令蔬菜营养均衡。做法中等难度，对新手有一定挑战，但按步骤操作也能成功。预计制作时长约 2 小时。","q":["以下用量适合 3 至 5 人食用。","巴沙鱼 500g","蔬菜（比如土豆片/豆芽/花菜/生菜/……） 可有不同搭配，推荐合计重量 300g 至 500g","红油豆瓣酱 40g （不怕辣想多加红油就多加 10 至 20g）","豆豉 10g （可选）","藤椒油 10ml","菜籽油 25ml","白胡椒粉 3g","大蒜 2 瓣","盐 5g","糖 2g"],"s":["准备：巴沙鱼若是从冷冻柜里取出，需要放室温自然解冻 5 小时再做切片处理。","切片：巴沙鱼撇成薄片，约 5cm 长，3cm 宽。","腌制：将切好片的巴沙鱼放入大不锈钢碗中。","加入 30g 豆瓣酱，3g 盐，10ml 藤椒油，3g 白胡椒粉。","用手抓匀后加入 5ml 菜籽油收尾封住口味。","常温静置至少 30 分钟入味。","备菜：大蒜切成蒜末。以 300g 花菜，200g 生菜为例，将花菜与生菜洗净。","焯水与炒菜：花菜开水锅焯水备用；将生菜洗净晾干，炒熟备用（不用放油）。","炒豆瓣酱：热锅冷油（菜籽油 20ml），加入 10g 豆瓣酱，10g 豆豉（可选），加入蒜末，中火慢炒。","汆鱼片：加入 150ml 热水，水很快开后加入腌制好的鱼片，轻轻翻动让鱼片在水中散开，加入 2g 盐和 2g 糖调味（此时可根据个人口味调整盐的用量）。水再次沸腾后即可盛盘。","盛盘：先将熟的蔬菜盛至大碗中，然后将热的鱼片盛在蔬菜上面，浇上锅中剩余热汤即可！"],"x":["垫底的蔬菜组合及用量可自由发挥，但需要注意各种蔬菜的特点，比如改成土豆的时候，需要将土豆片/土豆块煮熟（可以用筷子戳一戳确认）。","红油豆瓣酱（辣度）以及盐的用量可根据个人口味调整。","注意切鱼片的时候可以垂直于鱼片长条的方向先剁成 5cm 的鱼块，然后翻转 90 度斜着撇成薄片。","腌制的时候注意不要太用力抓。"]},{"t":"油焖大虾","c":"main","cu":"Chinese","m":40,"p":"shrimp","ing":["黑虎虾 or 明虾、","葱、姜","料酒、盐、冰糖、植物油"],"tp":"","d":4,"k":584,"i":"这道鲁菜经典以咸甜交融的酱汁包裹整虾，成菜红亮油润，虾肉紧实弹嫩。虾本身富含优质蛋白与虾青素，脂肪含量低，是补充营养又不易增加负担的食材。制作时需要炼葱油、剪虾、焖烧、收汁，对火候和调味把握有一定要求，更适合有基础的厨友尝试，全程大约需要 40 分钟。","q":["1 人食用的版本。","虾 10 只","花椒 5g","葱 50g","姜 20g","黄酒 30g","盐 3g","冰糖 10g"],"s":["剪虾枪到根上，虾须虾爪都剪掉，沙包挑掉，开背虾线挑出来，洗净备用。","炸料油。","油温三成热放花椒，油热离火，放葱姜（不要让油变色最好）葱稍微变黄沥油 （葱油弄多了可以留着作为拌面使用）。","下油，虾摆放整齐，两面变色后轻轻摁虾头。","放姜米（姜切成细颗粒）","黄酒 30g。","水两小碗。","盐 3g。","冰糖 10 克。","大火烧开转小火盖盖子闷（中途不能再加汤水，不要开盖）","皮亮虾弯就可以起锅，虾摆盘。","收汁（过滤后倒回锅里收浓，放葱油 ） 汤汁剩余 1/4 时。","浇汁。","完成。","开吃✅。"],"x":["做法参考：B 站老饭骨视频从小吃到大的油焖大虾居然是假的？泰斗级大师还原真·味道。"]},{"t":"烤鱼","c":"main","cu":"Chinese","m":56,"p":"fish","ing":["草鱼","大葱","料酒","白胡椒粉","食用盐","大蒜","桂皮","八角","香叶","青花椒"],"tp":"","d":4,"k":2152,"i":"这道川味烤鱼麻辣鲜香，鱼肉外焦里嫩，配菜吸饱汤汁后格外下饭。草鱼富含优质蛋白，搭配多种蔬菜，营养均衡。做法看似复杂，但跟着步骤走其实不难，适合想挑战硬菜的新手。从备料到上桌大约需要一小时。","q":["草鱼 大约三斤","食用油 20ml","料酒 10-15ml","食用盐 5-10g","白胡椒粉 5g-10g","青花椒 一小把","干辣椒段 10 个","灯笼椒 4 个"],"s":["草鱼（一般 3 斤 ）从背部切开，两面沿着鱼的背部往下划几刀，不要划到鱼肚皮，不然不易定型。","可以用热水浇在鱼身上洗去粘液或者用刷子在流动水龙头下面不停的刷洗，直到摸着没有黏糊糊的手感。","把鱼放到容器中，加入料酒，10g 白胡椒粉，5g 食盐抹匀腌制二十分钟入味。","把半根大葱切成一块一块，大蒜粒中间切开，和八角香叶桂皮放在一个容器中。","干辣椒段中间一分为二切开并和灯笼椒装在一个容器中。","芹菜切小段。","豆芽焯水。","千张焯水切成丝。","洋葱切成丝。","烤制鱼。","家里有烤箱的可以在烤盘刷上底油，鱼皮朝下，直到烤制两面金黄，然后撒上孜然粉。","如果没有烤箱，可以热锅热油，锅的两边撒上 2g 食盐，下入草鱼开始煎，刚下入的时候不要着急翻动，等一面定型后再翻面，煎制两面金黄，撒上孜然粉，出锅装在盘子里准备。","锅中撒上 20ml 食用油，等到油热后，把大葱大蒜八角香叶倒入炒香。","加上一包火锅底料的一半和 15-20g 豆瓣酱，炒出红油。","加入 5g 白糖，10g 食盐，5ml 生抽调味，倒入和食材齐平的清水煮开。","依次下入芹菜段，豆芽，千张丝，不用煮熟，稍微烫一下后铺上洋葱丝，放上烤鱼。","加入干辣椒，灯笼椒，青花椒。","另一个锅烧油，油热后浇在刚加入的辣椒上面激发出香味。","最后撒上熟花生米，葱花，白芝麻，香菜。","煮 5-6 分钟，美味即成。"],"x":["技术总结：上述。","这道菜的食盐，胡椒粉，孜然粉，食用油，生抽，白糖等的使用量，根据个人口味和食材比例做决定，并不需要严格按照上述分量来做。"]},{"t":"清蒸生蚝","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["生蚝","葱","蒜","姜","酱油","刷子"],"tp":"","d":3,"k":184,"i":"清蒸生蚝是一道原汁原味的沿海家常菜，蚝肉鲜嫩多汁，带着淡淡的海水咸香，蒜蓉与姜丝激发出清甜口感。生蚝富含优质蛋白和锌元素，能帮助提升免疫力。操作不算复杂，但掀开滚烫锅盖和处理蚝壳需要稍加小心，新手也能顺利完成。从刷洗到出锅，大约只需二十分钟。","q":["饮用水 1 升","生蚝 6 个","葱 3 颗","蒜 6 瓣","姜 1 小块","酱油 每个生蚝 1 ml"],"s":["将生蚝用刷子刷干净（没有刷子用牙刷）。","蒸锅中放水，将蒸屉放上之后，将 6 个生蚝平铺在蒸屉，使用 50%功率，蒸 3 分钟。","用右手拿着湿抹布掀开烫锅盖，将每个生蚝的外壳掀开一半去掉，生蚝的凸面向下，平面向上，每个放 1 根姜丝,10g 蒜末放到生蚝上。","关上烫锅盖，100%功率蒸 3.5 分钟。","停火，用右手拿着抹布掀开烫锅盖，每个放 5ml 酱油。","盛盘。"],"x":[]},{"t":"清蒸鲈鱼","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["鲈鱼","香葱","姜","食用油","蒸鱼豉油","料酒","食用盐"],"tp":"","d":3,"k":385,"i":"清蒸鲈鱼是一道粤式经典蒸菜，鱼肉细嫩爽滑，味道清淡鲜美，能最大程度保留鲈鱼的原汁原味。鲈鱼富含优质蛋白和 DHA，营养丰富且易于消化。这道菜操作简单，对新手非常友好，从备料到出锅大约只需三十分钟。","q":["食用油 10-15ml","蒸鱼豉油 10-15ml","料酒 10-15ml","食用盐 5-10g"],"s":["姜切片切丝、香葱的葱白切段，葱绿切丝，切丝后放入冷水浸泡备用。","鲈鱼处理好后洗净，用厨房纸擦干，两面分别划几刀，用盐洗掉鱼身的粘液，并用 10g 盐抹遍鱼身的内外，腌制 10 分钟以上。","补充一个鲈鱼改刀和摆盘的方法，改刀后可以让鲈鱼立起来蒸，均匀受热，同时吃起来更加方便，无需翻面。","鱼肚内塞上姜和葱白，鱼身也撒上姜和葱白，量为备用的一半。蒸鱼的碟子用筷子将鱼跟碟子隔开蒸。","水烧热感觉到水温后放进入鱼。","大火清蒸 10 分钟。","蒸好的鱼，用干净的盘子装起来并去除身上姜蒜。","鱼身浇上 15ml 蒸鱼豉油。","鱼身重新撒上姜和葱丝，锅内加上 10ml 食用油并烧热，将食用油淋至鱼身即可出菜。"],"x":["这道菜属于有手就行，关键点在于火候，鱼的大小跟火候都会相关，太久会导致鱼肉太老极度影响口感，太短会导致部分鱼肉没熟。所以大火蒸鱼一般是 10 分钟内较佳。","1、鱼在蒸的过程中会将水滴到盘子，如果鱼直接接触会导致鱼食用时会腥。","2、能够将鱼均匀受热。","这道菜难度系数简单，而且味道非常棒哦。"]},{"t":"白灼虾","c":"main","cu":"Chinese","m":15,"p":"shrimp","ing":["活虾","洋葱","姜","蒜","葱","食用油","酱油","料酒","芝麻","蚝油"],"tp":"","d":2,"k":519,"i":"白灼虾是一道粤式经典快手菜，虾肉鲜甜弹嫩，原汁原味。虾本身富含优质蛋白和多种矿物质，搭配蘸料开胃不油腻。做法简单容错率高，对新手非常友好，从备料到出锅大约只需 15 分钟。","q":["虾 250g（建议 1-2 人份）","蒜 5-8 瓣","食用油 10-15ml","料酒 20 ml","酱油 10-15ml","香醋 10 ml","蚝油 10 ml"],"s":["洋葱切小块，姜切片，平铺平底锅。","活虾冲洗一下（去除虾线、剪刀减掉虾腿虾须子都是可选操作），控水，铺在平底锅的洋葱、姜片之上。","锅内倒入料酒，盖上锅盖，中火 1 分钟，小火 5 分钟，关火 5 分钟。","葱切成葱花、蒜切碎、倒入酱油、芝麻、香醋，搅拌之。","油烧热，淋入蘸料。","虾出锅，用干净的盘子装好。"],"x":["开始不能大火、防止糊底。","如果锅盖有通气口、时间要相应调节一下（考虑增加 30 秒中火）。","蘸料其实也是可选的、也可以是纯的醋，大自然馈赠的鲜虾在没有水带走冲淡鲜甜的情况下口感味道都非常棒的。"]},{"t":"糖醋鲤鱼","c":"main","cu":"Chinese","m":60,"p":"fish","ing":["鲤鱼","番茄酱","白糖","白醋","淀粉","盐","葱","姜","料酒","香菜一颗"],"tp":"","d":4,"k":1011,"i":"糖醋鲤鱼是经典鲁菜，外酥里嫩、酸甜适口，鱼身炸至金黄浇上红亮糖醋汁，十分诱人。鱼肉富含优质蛋白和多种矿物质，易于消化吸收。这道菜对新手不太友好，难度中等偏上，需掌握改刀、挂糊和油炸火候。从备料到成菜大约需要 1 小时。","q":["鲤鱼 约 3 斤","清水 50g","番茄酱 40g","白糖 20g","白醋 10g","淀粉 10g","盐 30g","大葱 30g（约半颗）","姜 30g","料酒 25g"],"s":["将鱼清洗干净，确保无鱼鳞等异物。","将鱼头朝左，鱼肚朝下，右手持刀。刀竖直切下 1cm，按紧鱼身往左片 3-4cm，再将鱼片中间轻轻划一刀。","将鱼放进盆里，然后将大姜切片，大葱切段（随便切切就行了，主要是需要去腥味）","用吃奶的力气将大葱大姜里的汁水挤到盆中。","加入 20g 盐，25g 料酒，然后给鲤鱼搓个澡，涂抹均匀。","（腌鱼时间越长，鱼腥味就越小，推荐腌 30 分钟以上）","找个干净的盆，加入 100g 面粉、200g 淀粉、180g 水、5g 盐，用手将其搅拌均匀，面糊此时粘稠呈可拉丝状态，然后打入一个鸡蛋，再次搅匀。","等待 30 分钟。","将鱼放在案板上，用干毛巾将鱼身上的水擦干（这样可以更好的挂糊）","将盆冲洗干净，用干毛巾擦干。","起锅烧油，加入约 1L 的油，将油温烧至 7 成热，约 200-240 度。","捏起鱼的尾巴，将鱼头沉入锅底，用勺子往鱼的身上淋热油，待面糊成型后，将鱼慢慢放入锅中，拿锅铲轻轻铲起鱼的头部，然后垫上笊篱。防止底部炸糊。","准备一个盛鱼的盘子，放在锅的旁边。","用锅铲从鱼身处轻轻铲入，两个工具配合鱼翻个身。再炸两分钟，还是同样的方式（笊篱托着鱼头，锅铲托着鱼身，将鱼盛入盘中）","将锅中的油倒入擦干的盆中，放置一边，然后将锅刷干净。","将 50g 清水、40g 番茄酱、20g 白糖、10g 白醋放入小碗中，搅拌均匀。","再准备一个小碗加入 10g 淀粉、10g 水，搅拌成水淀粉。","开大火将锅烧热，然后倒入之前准备的料汁，大火烧开，转小火。","加入调好的水淀粉，边倒边搅拌，然后 20 秒后关火。","将熬好的糖醋汁用勺子均匀地浇在鱼身上，可以加点香菜或葱花点缀，糖醋鲤鱼就做好了。"],"x":["注意，该菜只有 3 人以上版本（过大或太小的鱼都是不合适的），特别适合家庭聚餐时食用，如年夜饭。","这道菜难度系数算中等吧，对新手还是不太友好的......。"]},{"t":"红烧鱼","c":"main","cu":"Chinese","m":40,"p":"fish","ing":["姜、蒜瓣、干辣椒","鱼","蚝油","葱","香菜","小米椒","味精"],"tp":"","d":4,"k":570,"i":"红烧鱼是一道家常风味浓郁的经典菜，咸鲜微甜，鱼肉嫩滑入味，属于大众喜爱的中式烧菜。鱼肉富含优质蛋白和不饱和脂肪酸，营养易吸收。制作时需要处理生鱼和油煎，步骤稍多，对新手有一定挑战，但跟着菜谱操作也能成功。从备料到出锅，大约需要 40 分钟。","q":["姜丝，以正常老姜切 2-3 片，然后片丝即可","蒜瓣 3-4 个，拍碎或者切碎或者切片","干辣椒（依照个人口味）2-3 个，切碎","香菜按照个人口味","盐 10g，如果辣椒辣度高，建议多一点","醋 5ml","酱油 5ml","白砂糖 10g","葱 1-2 根，正常就撒葱花","小米椒 1-2，不放也可以，过来人的经验，最多放 2 个，不然辣度过高要菊花残。","味精，看个人口味，不要放多，5g 即可。","蚝油，5g 即可，和味精一个道理"],"s":["姜蒜准备好，切碎。","干辣椒切碎，和姜蒜一起。"],"x":["鱼 建议新手以一条中等大小的鲫鱼上手，提前划好花刀，方便成熟（不然鱼背上容易夹生）"]},{"t":"红烧鱼头","c":"main","cu":"Chinese","m":56,"p":"fish","ing":["大葱、姜、大蒜、香菜、美人椒","八角、干辣椒","鱼头一个"],"tp":"","d":4,"k":333,"i":"红烧鱼头是一道经典的家常烧菜，鱼头胶质丰富，肉质滑嫩，汤汁咸鲜微辣，十分下饭。鱼头富含优质蛋白、卵磷脂和不饱和脂肪酸，对滋养皮肤和大脑有益。由于需要处理生鱼和剁骨，难度稍高，不建议完全零基础的新手独自操作，全程制作（含腌制）约需 2–2.5 小时。","q":["注意，这道菜仅有足够 2 人食用的版本。","大葱 200g","姜 80g","蒜瓣 3-4 个","美人椒 1/4 个","香菜 4 棵","八角两个，干辣椒五个"],"s":["葱、姜、蒜、香菜、美人椒分别清洗干净。","干辣椒与八角稍微冲洗即可。","大葱切两半。后半段大葱（葱白处）切段，每段长度约 4cm。前半段（葱叶处）先切段，再将每段劈为四瓣。","姜切片，每片厚度约 3mm。","大蒜拍碎。","拿出两棵香菜去根，切为 1.5cm 香菜碎。","将美人椒切为厚度为 3mm 的辣椒圈。","干辣椒切四段。"],"x":[]},{"t":"红烧鲤鱼","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["大葱、姜、大蒜、干辣椒","鲤鱼、五花肉"],"tp":"","d":4,"k":1051,"i":"红烧鲤鱼是一道家常鲁菜，鱼肉先炸后炖，外皮微韧，肉质鲜嫩，咸甜酱香中透着五花肉的醇厚，汤汁浓稠下饭。富含优质蛋白和钙、磷等矿物质，有助滋补。处理炸鱼和调味配比稍需耐心，但步骤清晰，新手跟着做也能完成。从备料到出锅预计 大约 1 小时。","q":["2 人食用的版本。","鲤鱼 （大约 2 斤）","五花肉 100g","大葱 200g","姜 80g","蒜瓣 3-4 个","白糖 50g"],"s":["注：下文所述的鱼是购买时卖家简易处理后的，已刮鱼鳞已去内脏。","葱、姜、蒜、干辣椒分别清洗干净。","葱白处切段，每段长度约 4cm，再将每段劈为四瓣。","姜切片，每片厚度约 3mm。","一个大蒜拍碎切末，其余蒜切为二瓣。","干辣椒切四段。","五花肉切片，约 4cm×4cm。","清洗鱼。","鱼背肉厚处拉几道斜口，方便入味。","锅里多倒点油，烧至 7 成热（刚刚开始冒烟），下入鱼炸 1 分钟至鱼皮稍稍变硬捞出备用（注意不要一下锅就拨弄鱼，等炸一会再拨弄、翻面），炸鱼的油倒出，锅里留一点底油。","将锅里底油烧热，下入五花肉，煸出香味。","放入干辣椒、葱、姜、蒜瓣，翻炒 1 分钟。","将炸好的鱼倒入锅中。","沿锅边倒入。","50ml 料酒。","50ml 陈醋。","50ml 味极鲜。","20ml 老抽调色。","5ml 蚝油提鲜。","5g 匙盐。"],"x":["五花肉煸炒的时候会出猪油，相比较于植物油，动物油脂更香。","煸炒至金黄的五花肉炖煮过后吃起来也很香的，相当于配菜。","鱼类本身脂肪含量少，所以香味欠缺，着重的是肉质的口感。所以一般做鱼类菜都建议用猪油，想要一锅奶白香醇的鱼汤。猪油是最好的选择~。"]},{"t":"肉蟹煲","c":"main","cu":"Chinese","m":56,"p":"shrimp","ing":["肉蟹","虾","土豆","年糕","洋葱","大蒜","生姜","干辣椒","青椒","红椒"],"tp":"","d":4,"k":2111,"i":"这道菜酱香浓郁，蟹肉鲜甜微辣，土豆软糯、年糕 Q 弹，汤汁拌饭格外过瘾，属于一道适合聚餐的硬菜。它富含优质蛋白和多种微量元素，营养丰富。制作有一定难度，需处理活蟹、把控火候和调味比例，对新手略具挑战，预计全程约需 1 小时。","q":["肉蟹 500 g","虾 200 g","土豆 450 g","年糕 200 g","洋葱 100 g","大蒜 20 g（如果放了虾，追加 10 g）","生姜 15 g","干辣椒 5 g","青椒 30 g","红椒 30 g","蚝油 20 g","食用油 30-50 ml（如果放了虾，追加 10 ml；油炸另需 500 mL）","海鲜酱 15 g（替代：蚝油 12 g + 白砂糖 3 g）","黄豆酱 15 g（替代：生抽 12 ml + 老抽 2 ml + 白糖 1 g）","甜面酱 10 g（替代：白糖 5.5 g + 生抽 4 ml + 老抽 0.5 ml）","番茄酱 10 g","淀粉 40 g","冰糖 10 g","鸡精 3 g","白胡椒粉 2 g（如果放了虾，追加 1 g）","料酒 15 ml","生抽 20 ml","老抽 5 ml"],"s":["土豆切块为各边均为 3 cm 的立方体，青/红椒切成边长 4 cm 的菱形片，洋葱切成 3 cm 宽的月牙瓣，年糕切成 1 cm 厚片。","螃蟹切成 50-80 g 的块，裹薄淀粉，180 °C 油温炸 1 分钟捞出。","锅中放油，蒜姜干辣椒爆香，放所有酱料 + 冰糖小火炒出红油，注意别糊底。","加螃蟹、土豆、啤酒和清水，烧开转小火炖 12 分钟。","放年糕和青红椒，开大火收汁到汤汁可以附着在物品表面，最后撒白胡椒粉。"],"x":["建议冷冻 20 分钟让螃蟹昏迷（别冻硬！），或用筷子从口器插入破坏神经。","如果使用的是冷冻蟹，完全解冻蟹脚容易掉，并且容易造成肉质流失。建议半解冻后裹粉油炸，并将油炸时间延长至 2 分钟。","如果灶具功率较小，食材下油锅后容易迅速降温，建议油温预热到 200 °C，并且分多批次油炸。","务必去掉蟹胃（三角包）、蟹腮、蟹心（六角形白片）"]},{"t":"芥末黄油罗氏虾","c":"main","cu":"Chinese","m":30,"p":"shrimp","ing":["罗氏虾","黄油","芥末","白糖","生抽","蚝油","盐","料酒、朗姆酒或啤酒","香菜","蒜"],"tp":"","d":3,"k":637,"i":"这道菜以黄油与芥末的奇妙搭配为亮点，虾肉紧实弹嫩，酱汁浓郁辛香，是一道新派海鲜菜肴。虾肉富含优质蛋白和多种微量元素，营养均衡。制作难度适中，只要提前备好料、控制火候，新手也能成功。从处理活虾到出锅，大约需要 30 分钟。","q":["罗氏虾 1 斤多 广东市场价大概 40~45 一斤","黄油 约 20g","芥末 15g","白糖 3g","生抽 30g","蚝油 30g","盐 3g","料酒、朗姆酒或啤酒 15g 到 30g","香菜 5 条 切段","蒜 5 颗 剁成蒜蓉"],"s":["将罗氏虾剪掉头尾尖刺、触须和脚，剪刀把虾身开背，去除虾线。","提前搅拌好芥末酱汁：酱油、蚝油、芥末、盐、糖，搅拌均匀！","洗好香菜，切段备用。","罗氏虾沥干水，锅中加入油，直接放入罗氏虾，中火，外表煎至金黄，捞出。","下入蒜蓉，大火，利用煎虾剩下的油继续煎炒蒜蓉，等到锅中白雾冒出，蒜蓉已经煎出香味，下虾和黄油，让虾充分吸收黄油香味。","下入调好的酱汁，继续大火煮沸，翻炒虾，至酱汁收汁，加入酒（料酒、啤酒可以放 30g，朗姆酒味道浓郁放 15g 即可。）","在等酱汁稍微收汁，加入香菜翻炒两下，即可出锅。"],"x":["酱汁提前调配好，黄油提前备好，防止中间备料耗时。","蒜蓉切记要等虾煎好后捞出再下，防止煎炒过久变黑，发苦。","如果不太能接受芥末就放少点，能接受就放多点，如果放多了，煮久一会儿，芥末味也会散去。"]},{"t":"葱油桂鱼","c":"main","cu":"Chinese","m":45,"p":"fish","ing":["桂鱼","小葱","小米辣","姜","料酒","植物油","盐","蒸鱼豉油","蒸笼","清水"],"tp":"","d":4,"k":311,"i":"葱油桂鱼是一道葱香浓郁、鱼肉鲜嫩的家常蒸菜，属于中式清淡口味，适合各地人群。桂鱼富含优质蛋白和不饱和脂肪酸，经过精细去腥处理，保留了鱼肉的鲜美与营养。做法对新手十分友好，容错性高，只要按步骤操作，基本零失败。从备料到出锅，全程大约需要 45 分钟。","q":["桂鱼 1 斤(500g)","小葱 1 根（长度为 30cm）","小米辣 2 个","姜 50g","料酒 25g","植物油 15g","盐 8g","蒸鱼豉油 10g","清水 5L"],"s":["去菜市场买已经处理好的鱼（自己处理的话最好不要内脏），将鱼身表面的所有鳞片刮干净。","用厨房用纸将鱼肚子里的贴骨血和黑膜擦干净（帖骨血会影响口感，黑膜是鱼腥味的来源）","用菜刀在鱼身表面来回刮几次，将鱼身的黏液刮掉，进一步去除腥味，然后用清水将鱼内外冲洗干净。","将鱼平放在砧板，使用厨房纸将鱼内外的水分擦干，然后鱼头朝左，尾朝右，从鱼鳃边开始，每隔 3cm 纵向划一刀，深度达到鱼的脊椎骨即可，另一面使用同样的处理方式。","将鱼平放在盆中，确保盘中没有多余水分。","取一块 50g 姜（鸡蛋大小），用削皮刀把表面的皮去除并洗干净，然后切成厚度为 3mm 的姜片。","将小米辣洗干净、去蒂，切成厚度为 2mm 的小圆片（或切成 1mm 宽度的丝状）","将小葱洗干净，去除根须，切成 3cm 的小段，稍微粗一点的小葱，可以沿着小葱生长的方向沿中间劈开。","加入 8g 盐，25g 料酒到盆中，带上一次性手套，然后对鱼进行全身按摩 1 分钟，确保鱼身每个部位都均匀涂抹了盐和料酒。","按摩好鱼后，在鱼身的每一个刀口中塞入一片姜片，鱼肚子中放入 3 片姜片，腌制 10 分钟（建议不要腌制太久，否则鱼的鲜度降低）","在鱼腌制期间，在蒸锅中加入 5L 清水，烧开后，在蒸锅上放上蒸笼。","鱼腌制好后，会析出水分，将多余水分和腌制用料酒、姜片倒掉，用清水冲洗干净鱼身和鱼肚，用厨房纸擦干鱼身和鱼肚。","将鱼平放在蒸鱼盘中，重新在鱼身、鱼肚刀口处塞入姜片。","然后将蒸鱼盘放入蒸笼中，盖上盖子，中火蒸 20 分钟。","期间水蒸气会附着整个鱼和盘子上，凝结后形成鱼汤，出锅后千万不要倒掉这个汤，这个汤汁是鲜味精华。","用防烫夹将蒸鱼盘夹出，在鱼身和鱼周围淋上 10g 蒸鱼豉油。","然后在鱼身和周围均匀撒上小葱段和小米辣。","在铁锅中倒入 15g 植物油，用中小火慢熬 5 分钟，不要用大火，否则油会挥发很快。","将出锅后的热油均匀地慢慢地淋在鱼身上，鲜掉眉毛的葱油桂鱼就出炉啦！"],"x":["这里以 2 份 为例进行编排。实际操作过程中，考虑到鱼肉本身的质感和鲜味会随着单条鱼的体积有所变化，建议大家在烹饪的时候尽量选择以 2 份 的量进行操作鲜味最佳。","经过若干次测试，成功率 100%，这道菜容错性很高，无论是什么省份、什么口味的人都能兼容。另外，本套教程虽然叫葱油桂鱼的做法，但原料本身不仅限于桂鱼，可以用鲈鱼、多宝鱼等海鱼代替（淡水鱼本身寄生虫会比海鱼多一点，不建议使用淡水鱼，淡水鱼的做法请参考《红烧鱼》等教程），耦合性低、可扩展性强。"]},{"t":"葱烧海参","c":"main","cu":"Chinese","m":44,"p":"none","ing":["泡发好的海参","大葱葱白"],"tp":"","d":3,"k":299,"i":"这是一道经典的鲁菜家常烧制海味，以浓郁的葱香和软糯入味的海参为特色，汤汁稠亮咸鲜回甜。海参富含胶原蛋白与多种微量元素，对滋养身体很有益处。整体烹饪难度不高，但需提前花时间将干海参充分泡发，实际烧制过程约三十分钟即可完成，新手只要按步骤操作也容易成功。","q":["泡发好的海参（北极参） 4 个","大葱葱白 1 根大葱的葱白即可","食用油 20-25ml","蚝油 20g","生抽 5g","白糖 2g","淀粉 2g"],"s":["葱白切成 1cm 的段，备用。","海参切成 1cm 的段，备用。","准备一个空碗，倒入 20g 蚝油， 10g 生抽， 2g 白糖，搅拌均匀。","另一个空碗倒入淀粉，水，制备水淀粉，勾芡用。","热锅，锅内放入 20ml - 25ml 食用油。等待 10 秒让油温升高。","放入葱白，调小火，注意不要让葱白变焦。大概煎 3-5 分钟即可。","用筷子夹出葱白，放入盘中备用。","倒入调好的料汁，炒香，等待 1 - 2 分钟 。","放入切好的海参，翻炒 1 分钟。","加入 100 ml 的水， 中小火， 等待 5 分钟。","等待锅中汤汁快干的时候，加入水淀粉，加入前面取出的葱白。","在外观呈粘稠状态后关火，盛盘。"],"x":["操作时，需要注意观察锅中的水量，如快见底的时候就直接接入水淀粉即可。"]},{"t":"蒜蓉虾","c":"main","cu":"Chinese","m":32,"p":"shrimp","ing":["海虾","蒜蓉酱","食用油","生抽"],"tp":"","d":2,"k":456,"i":"这道广东传统名菜以鲜香嫩滑著称，虾肉清甜弹牙，蒜香浓郁扑鼻。海虾富含优质蛋白和钙、硒等微量元素，搭配蒜蓉有助杀菌开胃。做法十分简单，处理虾、铺酱、蒸制、淋油几步即成，新手也能轻松驾驭，全程约需 15 分钟。","q":["海虾 8 只","蒜蓉酱 50 g","食用油 20 ml","生抽 5 ml"],"s":["用刀从虾头中间切开，切到距离虾尾 1 cm。","将蒜蓉酱铺在虾身中间，放在盘子中。","锅中倒入热水，将盘子放入锅中，大火蒸 3 分钟。","烧热油，倒入虾盘中，倒入生抽。"],"x":[]},{"t":"蒜香黄油虾","c":"main","cu":"Chinese","m":32,"p":"shrimp","ing":["大虾","无盐黄油","大蒜","白葡萄酒","柠檬","平底煎锅","厨房用夹"],"tp":"","d":2,"k":526,"i":"蒜香黄油虾是一道经典的西式海鲜菜，虾肉鲜嫩弹牙，被浓郁的蒜香和黄油包裹，带有淡淡柠檬清香。虾肉富含优质蛋白，搭配黄油提供能量，适合快速补充营养。做法简单，只需几种常见食材，新手也能轻松上手，从备料到出锅大约二十分钟。","q":["大虾 8-10 只（约 200g）","无盐黄油 30g","大蒜 4 瓣（约 20g）","白葡萄酒 15ml（可选）","柠檬 1/4 个","橄榄油 10ml"],"s":["大虾去头去壳留尾，用牙签挑去虾线，洗净后用厨房纸吸干水分。","大蒜切成蒜末，备用。","中火加热平底锅，放入 10ml 橄榄油。","油热后放入大虾，每面煎 1-1.5 分钟至变色，取出备用。","同一锅中加入黄油，融化后放入蒜末，小火炒香（约 30 秒）","如使用白葡萄酒，此时加入并煮至酒精挥发（约 1 分钟）","将虾放回锅中，与蒜香黄油酱汁翻炒均匀（约 1 分钟）","挤入柠檬汁，翻炒均匀后立即关火。","装盘，淋上锅中剩余酱汁。"],"x":["虾不宜过度烹饪，否则会变硬。"]},{"t":"蛏抱蛋","c":"main","cu":"Chinese","m":30,"p":"fish","ing":["蛏子","鸡蛋","食用油","洋葱","淀粉","生抽","鸡精","料酒"],"tp":"","d":3,"k":1229,"i":"蛏抱蛋是福建福州一带的传统家常菜，蛏肉裹着蛋液煎得外酥里嫩，带着洋葱和生抽的咸鲜香气。蛏子富含优质蛋白和锌、铁等微量元素，与鸡蛋搭配营养均衡。制作难度适中，需掌握煎炸火候但步骤不繁琐，预计 大约 30 分钟就能端上餐桌。","q":["蛏子 200 g","鸡蛋 2 个","食用油 100 ml","洋葱 0.25 个","淀粉 20 g","生抽 5 ml","鸡精 5 ml","料酒 5 ml"],"s":["烧开水，将蛏子放入水中，水煮 2 分钟后，捞上来去壳，放入大碗。","往大碗中加入洋葱、生抽、料酒、鸡精、生粉后，充分搅拌。","往大碗中打入 2 个 鸡蛋，继续搅拌。","起锅烧油，倒入碗中蛏子，煎炸至单面金黄后，翻面继续煎炸。"],"x":["更多情况下，福州当地会选用马蹄（解腻）和马铃薯（洗油），因为疫情期间买不到，所以选用了凤梨。","闽菜以甜为主，如果吃不惯的可以放弃白糖。","可以通过勺子敲打瘦肉块，听到声响来判断是否炸透瘦肉。"]},{"t":"酱炖蟹","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["螃蟹","豆瓣酱","冰糖","老抽","菜油","番茄酱","料酒","老姜","小葱","鸡蛋"],"tp":"","d":3,"k":468,"i":"这道菜是浙江平湖地区的秋日限定咸鲜风味，蟹黄绵润裹着酱香，蟹肉清甜，汤汁拌饭一绝。富含优质蛋白和微量元素。难度适中，适合有基础的新手，从准备到出锅大约 30 分钟。","q":["螃蟹 500 g（约 3-4 只中等河蟹）","豆瓣酱 30-50 g","冰糖 0-15 g","老抽 15 ml","菜油 20 ml","番茄酱 15 ml","料酒 5 ml","老姜 10 g","葱 10 g","鸡蛋 1 个（约 50 g）","猪肉末 50 g","水 500 mL"],"s":["把螃蟹刷洗干净，然后在砧板上对半劈开。","锅里下菜油，放入姜末和豆瓣酱爆香，加入冰糖炒化，直到冒小气泡就盛出。","在盘子里铺上一层酱，然后把切好的螃蟹切开面朝下，整齐排放在酱上。","放点葱段和姜片，建议敲个鸡蛋或在盘底铺肉末。","上锅蒸 10-12 分钟。"],"x":["咸口放 50 g 豆瓣酱，甜口减少豆瓣酱的用量并加入冰糖和番茄酱。","出锅后再撒上一点葱花会更香也更好看。","参考资料：秋风起，平湖这道美味很下饭_潮新闻官网。"]},{"t":"阳朔啤酒鱼","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["剑骨鱼或鲤鱼","漓泉啤酒","番茄","青椒","红椒","大蒜","生姜","葱","桂林辣椒酱","料酒"],"tp":"","d":3,"k":1092,"i":"阳朔啤酒鱼是广西阳朔的地方名菜，选用漓江鲜鱼带鳞煎制，以啤酒代水焖煮，鱼鳞酥脆、鱼肉鲜嫩，啤酒香与番茄微酸交融，风味浓郁独特。鱼肉富含优质蛋白和矿物质，搭配番茄、辣椒，维生素丰富且开胃助食。制作难度中等，对新手稍具挑战，但跟着步骤操作也能成功，预计 30 分钟即可完成。","q":["剑骨鱼或鲤鱼 1 条（约 750g，不去鳞）","料酒 15ml","漓泉啤酒 330ml（1 瓶）","番茄 2 个（约 300g）","青椒 2 个（约 150g）","红椒 1 个（约 80g）","大蒜 6 瓣（约 30g）","生姜 1 块（约 20g）","葱 2 根（约 40g）","桂林辣椒酱 15g","生抽 15ml","老抽 5ml","白糖 5g","食盐 5g","食用油 30ml"],"s":["鱼处理好内脏，保留鱼鳞，清洗干净，从腹部剖开成两半（背部相连），用 15ml 料酒、姜片、食盐 3g 腌制 15 分钟。","番茄切块，青椒红椒切块，大蒜拍碎，生姜切片，葱切段（葱白葱叶分开）","用姜片擦拭锅底，热锅后倒入 30ml 食用油，油热后放入鱼（鱼皮朝下），煎至两面金黄、鱼鳞酥脆，盛出备用。","锅中留底油，放入葱白、姜片、蒜瓣爆香。","加入 15g 桂林辣椒酱，炒出红油。","放入番茄块，翻炒至番茄出汁变软。","倒入整瓶啤酒，加入 15ml 生抽、5ml 老抽、5g 白糖、5g 食盐，搅拌均匀。","放入煎好的鱼，大火烧开后转中小火，盖上锅盖焖煮 15-20 分钟。","开盖，放入青椒红椒块，继续煮 3-5 分钟。","大火收汁至汤汁浓稠，撒上葱叶段，出锅装盘。"],"x":["鱼鳞是这道菜的关键特色，一定要保留，煎炸后会变得酥脆可口。","鱼剖成两半更容易煎透入味，比整条划刀效果更好。","正宗做法使用桂林辣椒酱（非郫县豆瓣酱），搭配漓泉啤酒，没有桂林辣椒酱可以用蒜蓉辣酱代替。","番茄要炒软出汁，这样汤汁更浓郁。"]},{"t":"香煎翘嘴鱼","c":"main","cu":"Chinese","m":56,"p":"fish","ing":["翘嘴鱼","姜","葱","蒜","青椒","香菜","老抽","白糖","豆瓣酱","料酒"],"tp":"","d":4,"k":820,"i":"香煎翘嘴鱼是一道风味浓郁的家常河鲜，鱼身经腌晒后干香紧实，煎至外皮金黄酥脆，肉质细腻咸鲜，带着豆瓣与青椒的微辣回甜。鱼肉富含优质蛋白和不饱和脂肪酸，营养易吸收。制作需要提前腌晒两到四天，烹饪时间约半小时，煎鱼时需耐心控火，对新手稍有挑战，但成菜后香气扑鼻，格外下饭。","q":["注：这个量大概是 2-3 个人的量","翘嘴鱼：2 斤最佳","姜沫：20g","葱：半根（50 克）","蒜：4 个","香菜：个人口味","老抽：2ml（不太喜欢重口的可以不放）","白糖：10g","干辣椒：4-6 个（根据个人口味选择）","料酒：100ml","生抽：4ml","盐：约 50g 用于腌制鱼","食用油：100ml"],"s":["鱼开背杀好（让卖鱼的杀好，千万不要剖腹杀鱼，切记是开背），清洗干净。","鱼表面用盐涂抹均匀，倒入料酒约 80ml,姜末 20g，放入冰箱保鲜层进行腌制 1-2 天。","取出腌制好的鱼，用绳挂起晾晒至半干（约 1-2 天，具体时间需结合气温与阳光）","食用前请将鱼用清水清洗，沥干水分（防止水遇油飞溅）","开大火将锅烧热，迅速改小火，锅中放油，尽量保持整个锅表面有油，将鱼沿锅边划入锅内（先煎鱼背面）","鱼入锅后（和翻面后），不要着急移动鱼的位置（此时容易破皮），煎约 30 秒后，尝试晃动锅。","背面煎约 1 分钟后，翻面煎约 1-2 分钟，煎至两面金黄。","等两面都煎好时，把鱼推向锅边一点，留点空间放入豆瓣酱炒香味，放入姜蒜。","炒出佐料香味后，加入料酒，生抽，老抽，倒入热水，水量和鱼平齐或者少点。","此时改中大火，煮 5-10 分钟，后放入青椒断，白糖，鸡精，十三香，陈醋。","改小火 2-5 分钟，放入葱，香菜，即可出锅。"],"x":["切记鱼是开背杀，腌制时，鱼表面涂抹均匀食盐即可，腌制时间，晾晒时间 1-2 天即可。","煎鱼全程小火，刚入锅时不要移动鱼，会破皮。","青椒断放入后注意观察熟透程度，里面的青椒很好吃，另外香菜最后放。","注意火候的切换，豆瓣酱，白糖的调鲜效果，与陈醋的增香效果。"]},{"t":"鲤鱼炖白菜","c":"main","cu":"Chinese","m":40,"p":"fish","ing":["食用油","姜","蒜","鲤鱼","白菜心/娃娃菜","盐","老抽","生抽","桂皮","八角"],"tp":"","d":3,"k":792,"i":"鲤鱼炖白菜是一道鲜香浓郁的家常炖菜，鱼肉软嫩入味，白菜清甜吸汁，属于典型的北方风味。鲤鱼富含优质蛋白和不饱和脂肪酸，搭配白菜提供膳食纤维和维生素，营养均衡。制作过程需要煎鱼和炖煮，有一定难度但不算复杂，适合有基础烹饪经验的朋友尝试，从备料到出锅大约需要 40 分钟。","q":["注：调料根据鱼的大小进行换算。","食用油：10ml","姜：3 片","蒜：3 瓣（切成块）","鲤鱼：1.2 斤（清理过的）","娃娃菜：13 片（可以多放一些，一顿就缩小了）","盐：5-8 克","老抽：3ml","生抽：6ml","桂皮：1 块","八角：3 个","郫县豆瓣酱：20 克","干辣椒：4-6 个（根据个人口味选择）"],"s":["鲤鱼清洗干净，改刀（在鱼身上多划几个伤口，方便入味）","娃娃菜清洗干净放入盘中备用。","锅中加油，等油热放入“少盐” “姜” “蒜” “郫县豆瓣酱” “桂皮” “八角” 炒出香味。","把鱼放锅里煎（3 分钟）每（30 秒）需要翻面。","加入“水”（水量尽量和鱼平齐，可以少一点点） 放入 “生抽” “老抽” “娃娃菜”。","大火炖 15-20 分钟，汤汁快干时添加 “盐” 即可出锅。"],"x":["也可以放一些粉条，粉条先凉水/热水，需要泡软，可以和娃娃菜一起放入。"]},{"t":"鳊鱼炖豆腐","c":"main","cu":"Chinese","m":44,"p":"fish","ing":["鳊鱼","老豆腐","姜","葱","蒜","老抽","桂皮","冰糖","干辣椒","料酒"],"tp":"","d":3,"k":524,"i":"鳊鱼炖豆腐是一道家常红烧菜，鱼肉鲜嫩入味，豆腐饱吸汤汁，咸鲜微辣。鳊鱼富含优质蛋白和不饱和脂肪酸，豆腐则提供植物蛋白和钙质，搭配起来营养均衡。制作难度适中，煎鱼时稍需耐心防粘，整体步骤清晰，新手也能尝试。从备料到完成约需 40 分钟。","q":["注：这个量大概是 2-3 个人的量","鳊鱼：550 克","老豆腐：400 克","姜：5 片","葱：半根（50 克）","蒜：4 个","老抽：2ml（不太喜欢重口的可以不放）","桂皮：1 块","冰糖：5 块","干辣椒：4-6 个（根据个人口味选择）","料酒：5ml","生抽：4ml","盐：5-8 克（根据个人口味选择）","八角：1 个","香叶：1-3 片","食用油：10ml","热水：400 克"],"s":["鳊鱼改刀，放上姜片和料酒腌制 5-10 分钟。","老豆腐切块后放入水中备用。","锅中加油，可以放点盐在锅里，防止煎鱼的时候粘锅，把腌制的鱼用厨房纸擦干水分，把鱼放到锅中，两面都煎一下。","等两面都煎好时，把鱼推向锅边一点，留点空间放入葱姜蒜，干辣椒，香叶，八角炒出味道。","炒出佐料香味后，加入料酒，生抽，老抽，冰糖，桂皮，倒入热水，水量和鱼平齐或者少点。","大火烧开后，放入老豆腐，豆腐贴在锅边，加入食盐，转小火。","小火烧 10-15 分钟，然后大火收点汁，即可出锅。"],"x":["鱼的两面，各煎 2-4 分钟即可。","煎鱼的时候全程中小火。","最后出锅时，加入一些切碎的大蒜，味道会更好。"]},{"t":"黄油煎虾","c":"main","cu":"Chinese","m":44,"p":"shrimp","ing":["鲜虾","黄油","黑胡椒粒","生抽","盐","白糖","米酒"],"tp":"","d":3,"k":741,"i":"黄油煎虾是一道风味浓郁、虾肉鲜嫩弹牙的家常海鲜菜。鲜虾富含优质蛋白和钙、锌等矿物质，搭配黄油增添了奶香与能量。制作相对简单，只需耐心处理活虾，新手也能顺利上手，总耗时约一小时。","q":["鲜虾 300g","黄油 7g","黑胡椒粒 大概 15ml","食用油 45ml","生抽 10ml","米酒 5ml","白糖 10ml","盐 2.5ml"],"s":["鲜虾摘除头部，顺带扯出虾线（这步处理不好可在下一步开背时取出虾线），使用剪刀剪开或菜刀片开虾背，沥干水分备用。","调制酱汁：小碗放入上述量的全部生抽、米酒、白糖、盐搅匀备用。","中大火热锅，热锅内放入食用油，等待 10 秒让油温升高。","虾全部放入锅中，开始瓶磨黑胡椒，均匀地撒在虾上翻炒。","虾变色后加入黄油，黄油完全融化后倒入调制酱汁，继续翻炒。","大火翻炒 15 秒收汁即可装盘。"],"x":["虾开背才更好入味，不过处理时切记切记小心用刀，新手容易伤到手。","冯小厨的菜谱。"]},{"t":"中式馅饼","c":"main","cu":"Chinese","m":60,"p":"egg","ing":["面粉","肉沫","油","盐","糖","生粉","酱油","风味调料","蒜头","大葱"],"tp":"","d":4,"k":1265,"i":"这道饼外皮微脆内里松软，馅料咸香，属于家常面食。富含碳水化合物和蛋白质，搭配胡萝卜和鸡蛋更添营养。制作难度中等，新手需掌握火候，但步骤明确易上手。从备料到完成大约需要 1 小时。","q":["面粉 200g","肉沫 50g","油 30ml","盐 3g","糖 5g","生粉 10g","酱油 5g","风味调料 3g","蒜头 2 瓣","大葱 1/4 根（靠叶部分）","鸡蛋 （可选，1 个）"],"s":["取肉沫（解冻），加入 1/2 所有上述调料（油、盐、糖、酱油、风味调料）和全部的生粉，搅拌均匀，腌制 30 分钟。","将面粉加入碗中，加入鸡蛋，加入剩下 1/2 所有上述调料，加入相当于面粉 1/2 的水（使得面粉相对粘稠但可以流动），搅拌均匀。","蒜头切为蒜末。","大葱切段。","胡萝卜切末（作为馅料用，所以要求尽量细碎，可用乱刀）"],"x":["将肉沫和胡萝卜末加入面糊后，应该尽量搅匀，保证味道扩散到饼内各处。","肉沫和胡萝卜末即馅料可以使用各类熟馅料替代。"]},{"t":"凉粉","c":"main","cu":"Chinese","m":180,"p":"none","ing":["豌豆淀粉","大蒜","小米辣","辣椒粉","酱油","醋","白糖","鸡精","盐","花生碎"],"tp":"","d":3,"k":539,"i":"凉粉是一道源自四川的传统小吃，口感冰凉爽滑，酸辣开胃，很适合夏天消暑。主要原料是豌豆淀粉，富含碳水化合物，能为身体快速补充能量。制作过程不算复杂，但需要耐心搅煮和长时间冷藏定型，对新手来说难度适中。从煮制到完成大约需要 3-4 小时，其中大部分是等待冷藏的时间，动手操作只需大约半","q":["豌豆淀粉 100g","大蒜 3 瓣","小米辣 3 颗","辣椒粉 10g","酱油 10ml","醋 10ml","白糖 3ml","鸡精 3g","盐 3g","花生碎 5g","香菜 5g"],"s":["准备食材。","把豌豆淀粉和水各 100 克混合搅拌。","往锅中倒入 600g 水，大火煮开后转为小火。","倒入淀粉水，边倒边不断的搅拌，搅拌到浓稠且色泽均匀。","找一个容器，在容器中刷一层薄薄的食用油。","将煮好的淀粉倒入容器中冷藏 2-4 小时。","冷藏后取出，脱模，切条。","大蒜和小米辣剁成沫，放上 10g 辣椒粉，5g 花生碎，热油搅拌均匀。","再加入 10ml 酱油，10ml 醋，5g 白糖，3g 鸡精，3g 盐搅拌均匀。","将调味料倒在凉粉上，然后撒上香菜即可。"],"x":["参考: 制作凉粉的详细步骤。"]},{"t":"利提巧卡","c":"main","cu":"Chinese","m":60,"p":"none","ing":["全麦面粉","茄子","番茄","土豆","洋葱","大蒜","生姜","青辣椒","柠檬","香菜"],"tp":"","d":5,"k":1019,"i":"利提巧卡是印度比哈尔邦的传统主食，由烤得金黄的麦球和烟熏风味的蔬菜泥组成，口感外脆内软，香气浓郁。烤鹰嘴豆粉馅料富含植物蛋白和膳食纤维，搭配茄子、番茄、土豆等蔬菜，营养丰富。制作需要和面、包馅、烤制以及处理蔬菜，步骤较多，对新手有一定挑战，全程大约需要 60 分钟完成。","q":["全麦面粉 200g","烤鹰嘴豆粉 120g","洋葱 1 个（约 80g），切极细碎","青辣椒 2 根，切极细碎","生姜 5g，磨碎","芥末油 15ml","柠檬汁 10ml","香菜叶 10g，切碎","孜然籽 3g","芝麻 5g","红辣椒粉 3g","印度黑盐 3g","盐 3g","温水 约 100ml（用于和面）","酥油 30g（烤好后涂抹用）","茄子 1 个（约 250g）","番茄 2 个（约 180g）","土豆 2 个（约 240g）","大蒜 4 瓣（约 12g）","青辣椒 1 根","芥末油 15ml","盐 4g","香菜叶 10g"],"s":["在碗中混合烤鹰嘴豆粉 120g、切碎的洋葱、青辣椒、生姜。","加入孜然籽 3g、芝麻 5g、红辣椒粉 3g、印度黑盐 3g、盐 3g。","加入芥末油 15ml、柠檬汁 10ml、切碎的香菜叶。","充分混合均匀，馅料应呈松散但可捏合的状态，备用。"],"x":["烤鹰嘴豆粉(Sattu)是比哈尔邦的特色食材，营养价值极高，富含蛋白质和纤维。在中国可能较难购买，可以自制：将鹰嘴豆(Chana)干炒至深棕色后磨成粉。","传统的利提用牛粪饼火(Cow dung cake fire)烤制，赋予独特的烟熏风味。家用烤箱或明火可以替代。","芥末油是这道菜的灵魂，不建议替换。如果买不到芥末油，可以使用菜籽油作为次选。","利提巧卡是印度最古老的食物之一，据传已有数千年历史，是古代士兵的行军食粮。"]},{"t":"印度烤饼","c":"main","cu":"Indian","m":44,"p":"none","ing":["中筋面粉","酸奶","酵母","糖","盐","酥油或黄油","温水","黑芝麻或白芝麻","香菜叶","大蒜"],"tp":"","d":3,"k":559,"i":"这是一道印度风味的发酵烤饼，外表微焦酥脆，内部松软有嚼劲，是咖喱的绝佳搭档。富含碳水化合物和蛋白质，酸奶的加入也让面饼更易消化。制作稍有难度，需注意面团软硬和火候，但平底锅即可操作，提前 1 小时发酵，总耗时约 1.5 小时。","q":["中筋面粉 300g","酸奶 60ml","干酵母 3g","糖 10g","盐 5g","食用油 15ml（和面用）","温水 100ml（约 40°C）","酥油或黄油 30g（涂抹用）","黑芝麻 5g（可选）","香菜叶 10g（可选）","大蒜 3 瓣（约 9g），切碎（蒜蓉版本可选）"],"s":["将干酵母 3g 和糖 10g 溶解在 100ml 温水中（水温约 40°C，不可过烫）","静置 5 分钟，直至表面冒出细泡沫（说明酵母已激活）","在大碗中放入中筋面粉 300g 和盐 5g，混合均匀。","倒入酵母水、酸奶 60ml 和食用油 15ml。","用手揉成光滑柔软的面团（面团应比普通面团稍软，微微粘手是正常的）","揉面 8-10 分钟。","在面团表面涂 3ml 油防止干裂。","用湿布或保鲜膜盖住碗口。","放置在温暖处发酵 至少 1 小时，直至面团膨胀至约两倍大。"],"x":["面团的柔软度是关键，太硬的面团烤出的饼会干硬。面团应该是湿润且略微粘手的状态。","铸铁锅比不粘锅效果更好，能产生更高的温度和更好的焦斑。","烤好后必须立刻涂酥油或黄油，这是印度烤饼香气和口感的关键。","除了原味 Naan，常见的变体还有：蒜蓉烤饼(Garlic Naan)、芝士烤饼(Cheese Naan)、黄油烤饼(Butter Naan)。"]},{"t":"印度焖饭","c":"main","cu":"Indian","m":68,"p":"chicken","ing":["巴斯马蒂长粒香米","鸡腿肉","酸奶","洋葱","番茄","生姜","大蒜","青辣椒","香菜","薄荷叶"],"tp":"","d":5,"k":730,"i":"印度焖饭是源自莫卧儿帝国时期的皇家料理，米粒细长、香料气息浓郁，鸡肉嫩滑、米饭粒粒分明，层次丰富。富含蛋白质和多种香料精华，能提振食欲。制作步骤较繁琐，对新手不太友好，全程约需 90 分钟（鸡肉需提前腌制 1 小时）。","q":["鸡腿肉 500g（去骨，切大块）","酸奶 100ml","生姜 15g，磨碎","大蒜 6 瓣（约 18g），磨碎","红辣椒粉 5g","姜黄粉 3g","印度综合香料粉 5g","盐 5g","柠檬汁 15ml","巴斯马蒂香米 300g（提前浸泡 30 分钟）","水 2000ml（煮米用）","月桂叶 2 片","小豆蔻 3 颗","丁香 4 颗","肉桂棒 1 根（约 5cm）","八角 1 颗","盐 10g","洋葱 3 个（约 300g），切薄片","食用油 50ml（炸洋葱用）","酥油 30g","藏红花 0.5g + 温牛奶 30ml（浸泡用）","薄荷叶 20g","香菜叶 20g"],"s":["在大碗中混合酸奶、磨碎的生姜和大蒜、红辣椒粉、姜黄粉、印度综合香料粉、盐、柠檬汁。","放入鸡肉块，均匀裹上腌料。","盖保鲜膜，冷藏腌制至少 1 小时（过夜更佳）"],"x":["巴斯马蒂香米是制作 Biryani 的必备原料，普通大米无法替代其独特的长粒香气。中国各大电商平台均有售。","密封焖制(Dum)是这道菜的精髓，蒸汽不能泄漏，否则米饭会干燥。","米饭只能煮到七成熟，因为焖制过程中会继续吸水变熟。煮过头会导致最终成品米饭糊烂。","印度焖饭(Biryani)的两大流派：海得拉巴(Hyderabadi)式用生肉铺底焖制，勒克瑙(Lucknowi)式先将肉煮熟再与米饭组装。本食谱采用的是最常见的混合做法。"]},{"t":"可乐炒饭","c":"main","cu":"Chinese","m":20,"p":"pork","ing":["米饭","可乐","鸡蛋","火腿肠","油","生抽","老抽","蚝油","豆瓣酱","葱花"],"tp":"","d":3,"k":913,"i":"这道菜以可乐替代糖调味，带来独特的焦香微甜风味，酱汁浓郁包裹粒粒米饭，属于创意家常炒饭。鸡蛋和火腿肠提供优质蛋白质与能量，搭配主食米饭，营养均衡管饱。操作步骤直观，适合新手尝试，一般 大约 20 分钟便可端上桌。","q":["米饭 200 g","可乐 160 ml","鸡蛋 3 个","火腿肠 20-100 g","油 25 ml","生抽 15 ml","老抽 7.5 ml（如果使用无糖可乐，追加 5 ml，如果不使用豆瓣酱，追加 5 ml）","豆瓣酱 7.5 ml","蚝油 5 ml","葱花 5 g","胡椒粉 1 g"],"s":["将锅烧热后，加入 25 ml 油，放两个鸡蛋，煎至底部完全凝固。","翻面，煎至两面完全凝固。","关火，将鸡蛋取出，剪成 2-5 cm² 的小块后放回锅中（也可以直接用锅铲铲碎）","重新开火，倒入可乐、生抽、老抽、豆瓣酱、蚝油，搅拌均匀。","加热到锅内液体剩 1/3，倒入米饭和火腿肠翻炒。","翻炒均匀后，改小火，锅内食物中心挖一个洞，打入 1 个鸡蛋，盖上锅盖，焖 2 分钟。","开盖翻炒至第三颗鸡蛋熟透，撒上葱花和胡椒粉，出锅。"],"x":["含糖可乐口感更好。","如果喜欢干一点，多炒一会儿。","如果嫌麻烦，可以在第一步直接放 3 个鸡蛋，取消挖洞打另一个鸡蛋的步骤。"]},{"t":"咸肉菜饭","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["大米","青菜","咸肉","冬笋","猪油","料酒","白糖","白胡椒粉"],"tp":"","d":4,"k":847,"i":"这是一道充满上海弄堂风情的家常主食，咸肉的醇香与青菜的清甜在猪油的点化下融进每一粒米饭，既有锅巴焦脆，又保留菜梗爽嫩，层次分明。青菜富含维生素和膳食纤维，咸肉提供蛋白质与能量，荤素搭配均衡。做法并不复杂，但需要掌握分次下菜叶的小技巧，对新手而言稍有挑战。从头备料到出锅，大约需要 ","q":["大米 300 g","水 310 ml（偏硬 300 ml，偏软 325 ml，如果加入冬笋，额外加入 20 ml）","青菜 400 g","咸肉 150 g","冬笋 100 g","猪油 15 g","料酒 15 ml","白糖 0-3 g","白胡椒粉 1 g"],"s":["如果加入冬笋，切薄片后冷水下锅煮 10 分钟去涩味。","咸肉切 1 cm 小丁。","咸肉和冬笋冷锅下 10 g 猪油、料酒、白糖，中小火煸炒到透明冒泡。","青菜切碎，菜梗和菜叶分开放，菜梗切成 0.5 cm 边长的正方形小块，菜叶切成长 2-3 cm，宽 1-1.5 cm 的长方形小块。","菜梗下锅炒到翡翠色。","米淘净后倒进电饭煲，加水。","把炒好的咸肉和菜梗铺在米上。","正常煮饭模式启动，最后 10 分钟开盖快速铺入菜叶。","煮好后焖 5 分钟，再淋 5 g 猪油、白胡椒粉疯狂翻拌均匀。"],"x":["炒好的咸肉和菜梗铺在饭上，煮饭时千万不要搅匀。","尽量不要买“家乡鲜肉”，可以预期会很咸。如果不是淡咸肉可以混入新鲜五花肉丁，或减少咸肉的用量，或将瘦肉部分切下泡入 5% 糖水 20 分钟。","参考资料：咸肉菜饭 - 维基百科。"]},{"t":"基础牛奶面包","c":"main","cu":"Chinese","m":200,"p":"egg","ing":["高筋或中筋面粉 **","鸡蛋 **","糖 **","干酵母","盐","黄油或玉米油 **","谷朊粉","香草精"],"tp":"","d":5,"k":2048,"i":"这款基础牛奶面包通过酵头预发酵简化了传统面包的制作，成品奶香浓郁，质地松软。富含碳水化合物和蛋白质，能为身体提供能量。难度适中，适合烘焙新手尝试，全程大约需要 200 分钟。","q":["cup 是常用的烘焙计量单位，因为可以在体积与重量之间轻松进行换算。 1 cup 250 ml ，一般的， 1 cup 面粉 120 g 。更多的换算见附加内容。","在此，用量较大的用 cup ，较小的用 g 。","30 ℃ 温水（以不烫手为宜） 1 cup","酵母 2 g","盐 2 g","面粉 2½ cup","鸡蛋 1 个","糖或糖浆 ⅛ cup","奶制品 混合后共 ¼ cup （奶粉需要和水混合。）","黄油或玉米油 ⅛ cup","谷朊粉 ¼ ~ ½ cup （可选）","香草精 3 g （可选）"],"s":["酵头是预发酵的产物，通过预发酵，不仅可以提升成功率，而且更长的发酵时间会让面包的风味更好。如果有条件，酵头应该发酵 4 天以达到最佳风味。但对新手来说， 30 分钟的发酵的酵头所呈现的成品就已经很可观了。接下来制作酵头。","首先，将酵母和 30℃ 的温水 用刮刀或厨具混合均匀，静置 5 分钟。之后与面粉混合，搅拌均匀。此时的酵头应该是特别粘稠的面糊。","用布盖上面糊，将面糊放置到温暖的地方进行发酵，时长为 45 ~ 60 分钟。","最终的面糊应该是表面有很多气泡的且体积明显增大。",">1. 确定酵母没有过期。",">2. 确定水温合适。",">3. 延长发酵时间，可以放在冷藏室内过夜。",">4. 可能温度不够，这时可以将烤箱预热至 60℃ ，停止加热后放到烤箱内进行发酵。",">5. 可以再加入等量的酵母搅拌均匀再次发酵并延长发酵时间。",">6. 可以尝试加入 3g 糖再次发酵。","如何制作“永久的”酵头？",">。",">1. 按上述方法制作好酵头后，放到阴凉的地方（甚至是冷藏室！）每1-3天在上面撒上薄薄的一层面粉（只要看不见面糊的厚度就可以！）再次搅拌，然后继续盖上布发酵。如果发酵过快体积过大，可以扔掉一部分。",">2. 等到开始制作面包时，只需留下发酵前体积的酵头继续发酵，剩下的用于面包的制作。",">3. 久而久之，酵头就会产生独特的香味，这种香味对于面包来说是最好的“原料”！"],"x":["注意：虽然给出了原料的具体用量，但室内温度、室内湿度甚至是空气中酵母菌的含量都会影响制作过程。本食谱会在制作过程中尽可能地给予调整建议。","面粉 1 cup （盛一杯后用勺子挂掉多余的部分，不要晃动）","常见原料的换算（仅供参考）","| 体积 /cup |原料 |质量 /g |。"]},{"t":"微波炉腊肠煲仔饭","c":"main","cu":"Chinese","m":15,"p":"egg","ing":["工具","微波炉","2 个大碗","1 个小碗","原料","米 200 ml","腊肠 1 根","鸡蛋 1 个","红萝卜 1 个","盐"],"tp":"","d":2,"k":1039,"i":"这是一道简单快手的粤式风味主食，米饭吸足腊肠油脂后油润咸香，搭配脆嫩青菜和胡萝卜，口感层次丰富。富含碳水化合物、蛋白质和多种维生素，营养均衡。烹饪用微波炉操作，对新手十分友好，预计全程仅需 15 分钟即可享用。","q":["1 人份。"],"s":["将米淘洗干净后倒入 饭碗 内，加入 400ml 的水，盖上盖。","放入微波炉，高火，6 分钟，煮饭途中准备原料。","切好腊肠。","洗好青菜。","切好红萝卜片。","切好葱花。","青菜碗 中放入青菜、红萝卜片，倒入 10 ml 油，放入 5 g 盐。","小碗 中倒入 10 ml 生抽、5 ml 油。","6 分钟后，用毛巾或隔热手套取出碗，可以看见米饭已经八分熟。","在米饭上摆入切片的腊肠，继续高火 2 分钟。","取出腊肠饭，放入 青菜碗，高火 4-5 分钟。","在腊肠饭上摆好青菜，磕入鸡蛋，看个人喜好继续高火 40-60 秒。","取出腊肠饭，此时已经基本完成。","将 小碗 放入，继续高火 30 秒。","在腊肠饭上淋上叮热的生抽，撒上葱花即可。","多余的青菜可以沾着酱油吃。"],"x":[]},{"t":"意式肉酱面","c":"main","cu":"Chinese","m":20,"p":"none","ing":["意大利面","意大利面酱","肉沫","白洋葱"],"tp":"","d":1,"k":1199,"i":"意式肉酱面是一道简单快手的家常西餐，酱汁浓郁、面条筋道，适合忙碌的日常。肉末和洋葱搭配成品意面酱，能快速补充蛋白质与碳水化合物，洋葱还含有膳食纤维。做法对初学者十分友好，全程只需简单切炒，熟练后 15 分钟就能端上桌，比方便面更满足。","q":["意大利面 180 克（可以根据食量上下浮动）","肉沫 80 克（可以根据食量上下浮动）","洋葱大半个 （大约 150 克，通常是肉的两倍重）","意大利面酱 300 克（可以看情况上下浮动）","食用油 10-15ml"],"s":["锅中加水，烧开后放入意面（等待 6 - 12 分钟）","在烧水的时候可以进行下面这些步骤，但请注意煮面的时间。","洋葱切成小丁。","空锅中倒油，中火下入洋葱碎。","时刻搅拌，注意不要让洋葱烧糊，直到洋葱变成半透明状。","下入肉沫，继续搅拌（搅散），直到肉末变成棕色。","加入意大利面酱，稍微搅拌一下即可。","把煮好的意大利面沥干水分并倒入肉酱中搅拌均匀即可（或者直接把做好的肉酱倒在意面上也行）"],"x":["意大利面分为很多不同的粗细，煮面条之前请注意意面盒子上标注的时间。","意大利面酱并不是番茄酱，平常用的番茄酱准确是叫番茄沙司，而意大利面酱虽然和番茄沙司都是调味过的番茄酱，但加的调味料不同。"]},{"t":"手工水饺","c":"main","cu":"Chinese","m":180,"p":"none","ing":["擀面杖","面粉","冷水","直径 30cm 以上的盆","芝麻香油"],"tp":"","d":5,"k":1313,"i":"手工水饺是一道中式经典主食，皮薄馅大、鲜美多汁，饱腹又可以根据个人口味随意调味。猪肉馅提供优质蛋白质和脂肪，搭配韭菜还能补充维生素与膳食纤维。这道菜品对新手来说难度较高，需要掌握和面、擀皮、调馅和煮饺的火候，预计制作时间约 3 小时。","q":["单人，约 20 只","面粉 200g","冷水 150ml","芝麻香油 2-3ml","瘦肉末 250g","肥肉末 20g #不喜可不加","姜 3g","葱 15g","盐 3g","蚝油 2ml","香油 2ml","生抽 2ml","鸡蛋 1 个"],"s":["盆中加入所有面粉。","加入芝麻香油。","面粉中央挖小洞。","分 4-5 次加入水，并搅和，当出现碎末状的稍微干燥面团时。","取消加水，用手将面团压实。","面团压实至可把盆周围的面粉纳入即可，此步骤为面光盆光。","将面团置于桌上，盆倒扣于桌上，环境温度为 25 度，使面团醒发约 45 分钟。","醒发完成后，将面团搓成条状，合成一团，再次搓成条，重复 3 次。","擀成条状，切成 20 份均匀大小面团，并搓成直径约 3-3.5cm 的球状。","压扁面团，在手上，桌上，擀面杖上，及面团上撒上面粉，此步骤防止面团发粘。","用擀面杖将面团擀平，约 8cm 直径，厚约 2mm，中间略微比四周厚 1mm。"],"x":["煮水饺不需要盖锅盖，加三次水就是为了不让饺子一直处于沸腾状态导致表皮破损变成面片。","黑醋 10ml。","姜 一小块 50 克。","香油 2 滴。"]},{"t":"扬州炒饭","c":"main","cu":"Chinese","m":60,"p":"shrimp","ing":["冷饭","鸡蛋","冷冻去皮基围虾","午餐肉罐头","青豆","胡萝卜","玉米粒","葱","油","盐"],"tp":"","d":4,"k":1769,"i":"这是一道配料丰富的升级版炒饭，米饭粒粒分明，鸡蛋嫩滑，搭配虾仁、午餐肉和蔬菜丁，口感层次鲜明，属于淮扬菜系中的经典主食。富含优质蛋白、碳水化合物和多种维生素，营养均衡。步骤虽多但操作直观，对初级烹饪者也较为友好，只需耐心备料。预计制作时长约 1 小时。","q":["冷饭 500g","鸡蛋 2-3 个","冷冻去头去皮基围虾 10-15 只","午餐肉罐头 150g（推荐上海梅林的火腿午餐肉罐头，340g 每罐，一次用半罐）","青豆 30g","胡萝卜 30g","玉米粒 30g","葱 1 根","油 30-40ml","盐 12-15g"],"s":["胡萝卜切丁 0.2cm×0.2cm×0.2cm，备用。","午餐肉切丁 0.2cm×0.2cm×0.2cm，备用。","葱分别取葱白和葱绿，各切成 0.25-0.5cm 的小段，分开备用。","在碗中打入鸡蛋液，均匀搅拌，备用。","将胡萝卜，青豆，玉米粒煮熟捞出，备用（水别倒）","将虾煮熟，捞出备用（水可以倒了）","热锅热油，可以参考学习炒与煎中的热锅双油。","第二次倒油需使用 20-30ml 油，等到第二次凉油热了以后，缓慢倒入鸡蛋（控制碗到油直接的流注直径大约在 0.5cm）不要搅拌。","鸡蛋凝固后立刻捞出，备用。","将午餐肉，青豆，胡萝卜，玉米粒，虾倒入锅中翻炒 1-2 分钟，装盘备用。","水冲一下锅，将杂物冲干净，保证锅内干净（可以有油但是不能有杂质）","热锅热油(10ml)，将葱白放入爆香。","调至小火（如果油温过高可以关火 1-2 分钟），放入米饭，用铲子快速砸击米饭并翻炒，保证米饭均匀沾到油且粒粒分明。","倒入鸡蛋，继续砸击，使鸡蛋碎开并与米饭充分混合。","转大火，倒入其他所有备用配料，快速翻炒 1-2 分钟。","撒入盐，并翻炒至充分混合。","撒入葱绿，翻炒 1 分钟。","关火，装盘。"],"x":["如做完后胳膊酸痛为正常现象，需加强上肢锻炼。","超市有青豆，胡萝卜，玉米粒的混合冷冻包装，可以使用这个省去切丁的烦恼，推荐 Pams Mixed Veges 很便宜，或者类似的都可以用（如下图）"]},{"t":"披萨饼皮","c":"main","cu":"Italian","m":600,"p":"none","ing":["原料","中筋面粉","水","安琪干酵母粉","食用盐","橄榄油","白砂糖","工具","烤箱","烘焙油纸"],"tp":"","d":4,"k":537,"i":"披萨饼皮采用低温隔夜发酵，成品饼底柔软又略带嚼劲，属于家常西式面点。主要提供碳水化合物和少量优质脂肪。制作流程简单，但需要耐心等待面团发酵，对新手也算友好。从准备到烘烤完成，算上隔夜冷藏时间大约需要 10-14 小时，适合提前一天备好。","q":["一个 8 ~ 9 寸的披萨差不多需要 125g 面粉，差不多是一个人的量（成年男性将将够吃的样子）","原材料的混合比例","面粉 : 水 : 橄榄油 : 酵母粉 : 盐 : 糖","面粉 125g x 4 500g，","水 70×5 350g，","橄榄油 7×5 35g，","酵母粉 1×5 5g，","盐 0.6×5 3g，","糖 0.6×5 3g"],"s":["用准备好的温水把酵母粉化开，稍微搅拌小就好，备用。","取准备好的面粉，依次添加盐、橄榄油、白砂糖。","准备混合水和面粉，边加水边搅拌直至水全部加完。","搅拌至看不到干米粉为止。","用差不多三倍大面团的容器装好，密封，冰箱冷藏（4 度） 等待 8~12 小时，一般晚上做第二天就可以用。","观察面团醒发完毕 差不多是原始大小大约两倍算醒发完毕。","取醒发好的面团，均匀分成四份，分别用保鲜膜盖好，备用。","案板撒稍微多一点的干面粉，准备开始揉面。","因为是比较湿的面团，所以粘上干面粉后才没那么粘手，不用揉太多次，面团表面稍微光滑一点就可以了。","用手拉扯，或者擀面杖擀平，也不一定非得擀圆，只要厚度均匀，烤箱放得进去就好。","铺好油纸，放上饼皮，依照个人口味，把准备好的食材放上去，撒上芝士碎。","水果烤箱上 180 度，下 220 度，16 分钟即可。","肉蔬菜烤箱上 200 度，下 230 度，18 分钟即可。","挤上沙拉酱或者其他自己喜欢的酱即可享用~。"],"x":["100 : 70 : 7 : 1 : 0.6 : 0.6。","一定要注意水的比例。","烤箱品质层次不齐，第一次做注意观察火候对披萨的影响。","一般不特别标注是低筋或高筋面粉，基本都是中筋面粉。"]},{"t":"日式咖喱饭","c":"main","cu":"Japanese","m":56,"p":"none","ing":["咖喱块","土豆","胡萝卜","洋葱","肉","蒜头"],"tp":"","d":4,"k":730,"i":"日式咖喱饭是一道浓郁醇厚的家常和风料理，以咖喱块调味，搭配土豆、胡萝卜、洋葱和肉类，口感顺滑绵密、辛香微甜。它富含蛋白质、碳水与多种维生素，能为身体提供充足能量。做法整体不算复杂，但需要掌握火候与搅拌技巧，适合稍有下厨经验的朋友尝试。从备料到出锅约需 1 小时，冷藏后风味更佳。","q":["食材用量与咖喱成正比，用量以 半盒好侍咖喱块(115g) 为例。半盒约六碗份，做好的咖喱在冰箱冷藏后风味更佳，不用担心一个人吃不完。","洋葱 2 个","土豆 2 个","胡萝卜 1 根","蒜头 2~3 瓣","肉 2 斤"],"s":["胡萝卜去头尾，去皮，滚刀切。","洋葱剥去外层去芯，切成月牙状。","土豆去皮、切大块。","肉切块状。","剥蒜拍平切碎。","咖喱块切碎，增加接触面积加速溶解。"],"x":["步骤 1-6 可以在 2-5 的等待过程进行，在这个过程也可以用清水锅煮些蔬菜，或做个煎蛋。","2-5 到 2-6 之间，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材。","mermaid。","graph TD。"]},{"t":"日式肥牛丼饭","c":"main","cu":"Japanese","m":56,"p":"beef","ing":["洋葱","肥牛","葱","白芝麻","味淋"],"tp":"","d":4,"k":774,"i":"一道经典的日式家常盖饭，肥牛片与白洋葱在咸甜酱汁中炖煮入味，肉质软嫩，洋葱甜润，汁香浓郁。牛肉提供优质蛋白和血红素铁，洋葱富含膳食纤维与多种抗氧化物。制作不算复杂，新手只要跟着步骤操作也能轻松完成，炒煮过程约需 30 分钟。","q":["食材用量与米饭成正比，用量以 一杯米(160ml) 为例。约为二人食用分量，吃不完可以放冰箱冷藏，但可能会没那么好吃","洋葱 1 个","肥牛 250 克","葱 1~2 根","白芝麻 5 克"],"s":["洋葱剥去外层去芯，切成月牙状。","葱洗净切成 0.5cm 的小段。","热锅直接放入白芝麻，前后晃动锅体使芝麻均匀受热至略呈金黄色。","肥牛焯水 1 分钟后捞出。","将 40g 味淋（或 30g 料酒），30g 酱油，20g 耗油，5g 糖，5g 老抽（可选，用于调色），在碗中搅拌混合成调料（该步骤可直接将碗放在电子秤上进行）"],"x":["shell。","struct Staple{float 咸度;}。","struct Staple 牛丼。","牛丼.咸度 = 尝一口汤汁。"]},{"t":"汤面","c":"main","cu":"Chinese","m":32,"p":"beef","ing":["牛羊鱼虾等肉类","鸡蛋鸭蛋鹅蛋鸵鸟蛋等蛋类","豆块豆筋豆腐皮等豆制品类","生菜菠菜油麦菜","青椒番茄胡萝卜等蔬菜类。"],"tp":"","d":2,"k":565,"i":"汤面是一道自由搭配的家常主食，汤汁清爽，面条软滑，兼容各种荤素食材，味道可鲜可淡。它富含碳水化合物和优质蛋白质，搭配蔬菜还能补充维生素与膳食纤维，营养均衡又饱腹。做法非常简单，无需厨艺基础，新手也能轻松驾驭。从准备食材到出锅，一般约需 30 分钟。","q":["面类材料：单人一个方便面大小的量，可以在 70-230g 之间选择。","冷水： 加入能浸没面的量，一般在 200 - 400 ml 之间选择","菜类：体积大约和面类相当","其中青菜体积可忽略"],"s":["先将菜类材料切成边长不超过 4cm 的块状，便于煮熟。","如有生肉，则先放入冷水中，盖上锅盖，煮沸腾，先捞出上层血沫，再关火，捞出半熟的肉备用。","先大火将水加热至沸腾，后调至中火。","将较难煮熟的食材放入锅中（比如半熟肉类、香菇类、等最先放入锅中）。为保证煮熟，可在沸腾后计时 10 分钟，特别难熟的大块食材可追加 5 分钟。","将面食放入锅中，适当搅拌确保面和汤充分接触，使液面保持轻微沸腾，煮 5 分钟。加入面后液面易产生白色泡沫，可适当抬起锅盖通气或者撤下锅盖。","将易于煮熟的食材如青菜类放入锅中，适当搅拌以充分浸没，煮 2-5 分钟。","关火，随后加入盐、胡椒粉、香油等自己喜欢的调味料，适当搅拌即可出锅食用。"],"x":["操作流程可根据自己喜好更改，多多尝试会有惊喜。","如掌握不好加盐量，可采用少量多次添加的方法，以免过量。"]},{"t":"河南蒸面条","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["挂面","五花肉","蒜薹","葱 + 姜 + 蒜 + 料酒","盐 + 鸡精 + 十三香","生抽 + 老抽 + 蚝油","麻油","蒸篦子","额外的盆"],"tp":"","d":4,"k":3066,"i":"河南蒸面条是源自河南的家常小吃，面条先蒸后炒再蒸，油润入味，口感劲道爽滑。五花肉和蒜薹提供丰富的蛋白质和膳食纤维，搭配主食带来均衡营养。制作步骤稍多一些，但对新手而言只要按顺序操作就能成功。从备料到出锅，总共约需 40 分钟。","q":["挂面 300g","五花肉 350g","蒜薹 150g","食用油 10-15ml","生抽 15ml","老抽 10ml","蚝油 5ml","盐 2g","鸡精 2g","十三香 1g","葱 10g","姜 5g","蒜 10g","料酒 5ml","麻油 5ml"],"s":["起锅加 7 成水，水开，上蒸篦子。","将挂面，均匀铺开放置，淋 5ml 油并抹匀，蒸 15 分钟。","将挂面和蒸篦子取出，放置一边，并倒掉锅中的水。"],"x":["细的、圆的 （超市大部分都是这种，口感更加劲道）","宽的、扁的 （口感比较软）"]},{"t":"滕州菜煎饼","c":"main","cu":"Chinese","m":15,"p":"pork","ing":["白面煎饼","白菜","粉条","豆腐","胡萝卜","韭菜","鸡蛋","火腿肠","食用油","食盐"],"tp":"","d":2,"k":800,"i":"滕州菜煎饼是山东省滕州市的传统小吃，创始于清代，由王牛臯创制。以白面煎饼包裹白菜、粉条、豆腐等时令蔬菜，搭配鸡蛋、火腿肠，调以油与香料煎烙而成。成品外酥内软、鲜香爽口，适合作为主食或早餐，从备料到出锅大约 15 分钟即可完成。","q":["白面煎饼数量 2 张","白菜 100 g","粉条（干重） 50 g","豆腐 80 g","胡萝卜 50 g","韭菜 30 g（可选）","鸡蛋 1 个","火腿肠 40 g（可选）","食用油 20 ml","食盐 2 g","味精 1 g（可选）","孜然粉 2 g","辣椒粉 2 g（可选）","黑胡椒粉 1 g"],"s":["粉条放入温水中浸泡 10 分钟至变软，捞出沥干，切成不超过 5 cm 的段，备用。","白菜洗净，切成不超过 1 cm 宽的细丝；胡萝卜去皮，切成不超过 1 cm 的细丝；豆腐切成不超过 1 cm 见方的小丁；韭菜洗净，切成不超过 1 cm 的段。全部放入拌碗。","在拌碗中依次加入食用油 15 ml、食盐 2 g、味精 1 g、孜然粉 2 g、黑胡椒粉 1 g、辣椒粉 2 g，用筷子搅拌均匀，使蔬菜表面均匀裹上调料，备用。","平底锅（或鏊子）中火预热，倒入食用油 5 ml 并转动锅体使油铺满锅面。打入鸡蛋，用锅铲将蛋清与蛋黄打散，摊成比煎饼略小的圆形薄蛋皮。","取 1 张煎饼平铺在蛋皮上，使蛋皮贴服于煎饼，将煎饼连蛋皮翻面（蛋皮朝上），转小火备用。","将拌好的蔬菜均匀铺在煎饼（蛋皮朝上）表面，边缘留约 1 cm 不铺菜，防止折叠时漏出。","取第 2 张煎饼覆盖在蔬菜上方，用锅铲轻轻按压使两层煎饼贴合。","开中小火加热 2 分钟至底部微黄，用锅铲将整张菜煎饼翻面，继续加热 2 分钟至另一面微黄、油润。","转最小火继续加热 1 分钟，至两面均呈金黄色、蔬菜熟透（可用筷子插入中心，确认无生蔬菜的阻力）","关火，将菜煎饼两边向中间折叠成约 10 cm 宽的长方形，用锅铲或刀从中间一分为二，盛盘。"],"x":["蔬菜可按喜好替换：菠菜、南瓜、水萝卜、荠菜等均可，单份蔬菜总量保持在 300-350 g。","菜煎饼适合趁热食用；常温放置超过 30 分钟会变软，失去酥脆口感。","若无鏊子，用直径不小于 28 cm 的平底不粘锅即可，注意火候不宜过大以免煎饼焦糊。","白面煎饼可市购；也可用面粉 100 g 加饮用水 150 ml 调成稀面糊，在平底锅上摊制。"]},{"t":"火腿饭团","c":"main","cu":"Chinese","m":60,"p":"pork","ing":["火腿","米饭","水","冷冻青豆","冷冻玉米粒","海苔碎","喜欢的沙拉酱"],"tp":"","d":4,"k":665,"i":"一道简单快手的日式风味饭团，咸香火腿搭配沙拉酱与海苔，口感丰富饱腹。富含碳水化合物、蛋白质和维生素，能快速补充能量。制作难度极低，新手也能轻松上手，从煮饭到完成大约只需 1 小时。","q":["火腿(100g)","米饭(125g)","水(90ml)","冷冻青豆(30g)","冷冻玉米粒(30g)","海苔碎(10g)","喜欢的沙拉酱(20g)","食用油 10-15ml"],"s":["将米饭和水放到电饭锅里，点击米饭模式，等待完成。","冷冻玉米粒和青豆放到锅里，加水没过所有食材，沸腾后静待 2 分钟后，捞出。","火腿切成 1cm 的方块。","与此同时，加入 10ml 食用油，加入火腿翻炒至火腿上色。","将米饭，火腿，海苔碎，青豆，玉米粒，沙拉酱放入碗中，混合均匀即可。","装盘（如果有的话）"],"x":["沙拉酱的程度可以根据个人口味酌情删减。","可以尝试混合沙拉酱。","参考资料：小红书 - 干饭选手又困了。"]},{"t":"炒凉粉","c":"main","cu":"Chinese","m":15,"p":"none","ing":["凉粉","玉米油","大蒜","香葱","豆瓣酱","生抽","老抽","食盐","十三香","中粗辣椒面"],"tp":"","d":3,"k":567,"i":"炒凉粉是一道山西、陕西地区的特色小吃，入口滑嫩，咸香微辣，带着蒜香和酱香。凉粉主要由淀粉制成，能提供丰富的碳水化合物，快速补充能量。烹饪难度适中，适合有一定基础的新手尝试，全程制作大约需要 15 分钟。","q":["凉粉 500g","玉米油 10ml","蒜末 10g","香葱 15g","豆瓣酱 15g","生抽 20ml","老抽 10ml","食盐 5g","十三香 5g","中粗辣椒面 15g","矿泉水 20ml"],"s":["凉粉改刀切麻将块大小。","开小火，起锅烧油，锅烧微热后，下入蒜末爆香后加入豆瓣酱炒出红油。","将凉粉块下入锅中，翻炒 10 秒。","加入生抽提味，老抽上色，翻炒均匀后加入辣椒面继续翻炒均匀。","加入食盐、十三香继续翻炒 10 秒。","加入准备好的矿泉水，再次翻炒 10 秒，待汤汁浓稠后，关火出锅装盘。","撒上葱花即可完成。"],"x":["选择凉粉时最好选用豌豆淀粉制作成的凉粉，条件不允许的话红薯淀粉或其他也可。"]},{"t":"炒年糕","c":"main","cu":"Korean","m":30,"p":"egg","ing":["年糕/白粿","葱","调味料: 酱油，盐","：鸡蛋，青菜"],"tp":"","d":3,"k":960,"i":"这是一道闽南风味的主食，年糕软糯弹牙，带着葱油的焦香，家常又饱腹。以米粉制成的年糕提供充足碳水化合物，搭配鸡蛋和青菜能补充蛋白质与维生素，营养均衡。做法简单，对新手友好，从准备到出锅大约需要 30 分钟。","q":["年糕 250 g","小葱 2 根","食用油 50 ml","酱油 15 ml","盐 1-2g，按口味喜好。"],"s":["锅中加水烧开，煮熟年糕，碗中加水确保年糕不会粘连，捞起年糕备用。","小葱切葱花（将葱白和葱叶分开），青菜切小段备用。","（可选） 制作炒蛋，见西红柿炒蛋。","热锅，加入 30ml 食用油。","将葱白倒入锅中，直至大部分葱白变成焦黄色且发出香味，倒出葱油备用。","重新热锅，加入 20ml 食用油。","加入所有辅料（鸡蛋，青菜等），翻炒均匀。","将年糕的水倒掉，向锅中加入年糕。","加入酱油和盐，翻炒均匀。","关火，加入葱油，翻炒均匀，乘盘。"],"x":["辅料的选择可以根据个人选择酌情添加，如加入瘦肉等。","在煮年糕的时候注意搅拌，以免粘锅。"]},{"t":"炒意大利面","c":"main","cu":"Italian","m":30,"p":"beef","ing":["意大利面","肥牛片","番茄酱 / 黑胡椒酱","菜籽油"],"tp":"","d":3,"k":406,"i":"这道炒意大利面软糯爽口，搭配肥牛和酱料，酱香浓郁，是带有西式风味的家常主食。富含碳水化合物与蛋白质，能快速补充能量。做法简单，新手也能轻松掌握，全程大约需要 30 分钟。","q":["意大利面 50 克 / 人","肥牛 5 片 / 人","食用油 5ml / 50 克意面"],"s":["加入 250 克水 / 人。","待水烧开，下入面条，中火煮 15 - 20 分钟（这个面通常比较硬，捞起来之前最好尝一下，中心如果有一点硬，需要继续煮）","捞出面条，盛入盘中备用。","热锅倒入食用油，待油温中热，下入面条翻炒一分钟（如果太干，加入少量水）","放入 10 克番茄酱、肥牛、加入 2g 食盐，继续翻炒一分钟。","起锅。"],"x":[]},{"t":"炒方便面","c":"main","cu":"Chinese","m":15,"p":"pork","ing":["方便面","鸡蛋","火腿肠"],"tp":"","d":2,"k":789,"i":"这道炒方便面口感 Q 弹筋道，咸香入味，是一道改良自传统煮面的家常快手主食。搭配鸡蛋和火腿肠，丰富了蛋白质和能量来源。做法简单，只需注意冷水冲面保持口感，新手也能轻松完成，全程大约 15 分钟即可出锅。","q":["方便面用量为 1 包/人。","鸡蛋的用量为 1 个/人。","火腿肠的用量为 1 个/人。","食用油的用量为 10 - 18 ml / 人。"],"s":["将火腿肠撕开包装，切成宽度 1cm 的小块。"],"x":["在北京，可以考虑在盛盘后加入芝麻酱。如果芝麻酱太浓稠，可以 1:1 兑水稀释。","必须使用冷水冲面条！冷水能瞬间剥离面条表面的糊化淀粉，并强制中断内部的余温加热，这是保证面条下锅炒不坨、不粘锅、保持 Q 弹的核心原理。","洗面：将方便面面饼放入凉水中浸泡 2 分钟，使其完全吸收水分变湿润，捞出沥干（不用泡软）。","上蒸：将湿面饼放入蒸锅，水开后大火蒸 8 分钟，取出抖散备用（蒸能锁住水分，保证面条弹牙）。"]},{"t":"炒河粉","c":"main","cu":"Chinese","m":56,"p":"beef","ing":["炒河粉、猪肉/牛肉","其他调味料：胡椒粉","盆、盘子"],"tp":"","d":4,"k":822,"i":"炒河粉是一道流行于广东地区的经典小吃，讲究镬气十足、干香爽滑，河粉软韧透亮，搭配肉丝、豆芽和黄瓜丝，口感层次丰富。主要提供碳水化合物和蛋白质，蔬菜的加入也补充了维生素与膳食纤维。按本菜谱操作难度适中，即便新手只要备齐材料也能尝试，整个制作过程约需 30 分钟即可端上餐桌。","q":["河粉用量为 250 g/人，如果需要更大食量，可再加 100g/人。","黄瓜丝 30g/人、面筋块 30g/人、绿豆芽 30g/人、打碎的鸡蛋 1 个/人。","拍碎的蒜瓣 2 个/人、小葱 1 根/人","河粉料可按 20g/人添加，若自行准备炒料可 10g 盐+2g 味精+3g 孜然粉。","淀粉可准备每 100g 肉+5g 淀粉比例准备。","老抽/生抽，分别为每 250g 河粉 10ml/15ml。"],"s":["小葱切碎（葱白和葱叶分开）、蒜瓣拍碎，丢案板上备用。","打碎鸡蛋，捞一点蛋清到一只碗中，剩下的丢入另一只碗中备用。","将绿豆芽放入锅中，大火煮 60 秒。豆芽捞出，过凉水，放入盘中备用。","黄瓜切丝放入盘中备用，可和豆芽丢一起。","处理面筋，单独丢一个盘中。","肉切细条状，加入淀粉与刚刚碗中的鸡蛋清、胡椒粉，顺时针拌匀。","注：超市购买来的凉皮表面一般会有食用油，可以使用自来水清洗。面筋同样。","注：清洗面筋之后，请用手将面筋中的大量水分挤出（不需过于用力）。"],"x":["个人口味根据地区、天气、时间均有不同，调料的具体使用量请据个人情况而定，喜欢辣椒的可以自行添加。"]},{"t":"炒馍","c":"main","cu":"Chinese","m":15,"p":"egg","ing":["馒头","盐","油","孜然粉","五香粉","小葱","鸡蛋"],"tp":"","d":3,"k":767,"i":"炒馍是一道咸香酥脆的家常面食，属于北方风味。馒头丁炒至金黄，外脆里软，孜然与五香粉的加入让风味更加浓郁。可搭配鸡蛋提供蛋白质，搭配小葱增添清香，营养均衡。制作难度适中，新手也能很快上手，预计 大约 15 分钟即可出锅享用。","q":["馒头 2 个（隔天略硬更好）","盐 3g","油 20ml（花生油或芝麻油更好）","孜然粉 3g","辣椒粉 3g","五香粉 3g","小葱 2 棵","鸡蛋 （可选,2 个）"],"s":["将馒头切成小块或小片。","选有鸡蛋的话将鸡蛋打进碗里，打散（可加盐和五香粉各 1g 或不加，等炒的过程中加）。","鸡蛋浇在馒头上，拌匀，鸡蛋不宜过多。","大火热锅，倒入食用油（不锈钢锅怕伤锅的话可以先倒油，烧至油热也可也可）","将馍丁放进去翻炒，翻炒均匀。","将火调小，炒至馍丁呈金黄色。","放入盐，胡椒粉，五香粉。","最后将葱花放入一起翻炒几下。","关火出锅。"],"x":["炒的过程中要注意控制火候，以防炒糊。","火大补救措施将火调小，可沿锅边加油润锅或洒水，注意不要全倒在一个地方，最好分散开。","调味料可根据个人喜好放入其他香料（比如南德调味料）","如果喜欢吃脆的，可以将火开到最小，多翻炒一会，关火后趁锅热再放置一会再倒出，更香脆。"]},{"t":"炸酱面","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["肉丁/肉末","面条","蒜","菜码","豆瓣酱","甜面酱"],"tp":"","d":3,"k":1272,"i":"炸酱面是一道酱香浓郁、面条劲道的传统北京家常面食，搭配清爽菜码，咸甜适口。主要营养来自瘦肉蛋白质和蔬菜维生素，能为人体提供充足能量。做法对新手友好，预计制作时长约 30 分钟，熟练掌握后可通过备菜与炒酱并行进一步缩短时间。","q":["肉丁/肉末 150g","如果 面条 选择了挂面：150g","如果 面条 选择了普通面条：250g","葱 15g","菜码 总量 35g","食用油 10g","豆瓣酱 20g","甜面酱 20g"],"s":["菜码切丝备用。","葱切碎。油锅烧热，下葱和肉，炒至肉完全熟透（无红色）","下豆瓣酱和甜面酱，继续炒至微微粘稠。盛出，得到炸酱。","取大碗，加凉水备用。","煮面条至断生（无白芯），盛入第 4 步装有凉水的碗中。","立即控水捞出，盛入干净的碗中。","取第 3 步炸酱，倒入碗中，拌匀。然后取第 1 步菜码，倒入碗中，拌匀。"],"x":["肉推荐瘦肉丁，口感更好，推荐现买现用。","面条推荐使用普通面条。","面条口感关键在于劲道。勿选龙须等细面。","如有条件（另一个锅）且熟练后，第 2、3 步和 1、4、5、6 步可分时并行执行。"]},{"t":"烙饼","c":"main","cu":"Chinese","m":56,"p":"none","ing":["油","面粉","电饼铛"],"tp":"","d":4,"k":1185,"i":"这道家常烙饼层次分明，外皮酥脆内里柔软，带着油酥的焦香，是北方餐桌上常见的主食。主要提供碳水化合物和能量，适合搭配菜肴一起食用。制作需要一点手法，尤其卷酥和擀饼环节，但跟着步骤操作并不难，新手也能掌握。从和面到烙好，大约需要 1 个小时。","q":["面粉 400g","热水 130ml（80 度）","冷水 130ml"],"s":["将 400g 面粉倒入盆中，一半用凉水和面，一半用热水和面，搅拌成面絮，用手揉成团。用保鲜膜封起来，醒面 40 分钟。","离醒面完成时间还有 10 分钟时，请查看小技巧中的油酥做法（热油酥效果更好）","醒好的面不用揉，稍微摁一下，用一横刀一竖刀将其分成四份。","搓圆，擀开，擀成与电饼铛大小差不多的饼，取 1/4 的油酥，将饼表面涂抹均匀。","沿饼的半径切开，从外圈将其卷成圆锥形，然后将圆锥尾部捏好，防止油酥外漏。","按压面饼圆锥尖的地方，将其压扁，然后再次擀成与电饼铛大小差不多的面饼（厚度约为 3mm）","将电饼铛预热，涂上凉油（热锅凉油），将擀好的饼放入电饼铛中，将饼的上方也刷点油，涂抹均匀（锁住水分），盖上盖子。","大火烙一分钟，打开盖子，将饼翻个面再烙一分钟。","重复以上动作，完成饼的烙制。"],"x":[]},{"t":"芝麻烧饼","c":"main","cu":"Chinese","m":40,"p":"none","ing":["面粉","酵母粉","白糖","十三香","食用油","温水"],"tp":"","d":3,"k":282,"i":"芝麻烧饼是北方家喻户晓的面点，外皮沾满芝麻酥香可口，内层层次分明、松软适口。面粉提供充足的碳水化合物，芝麻含有丰富的钙和不饱和脂肪酸。制作过程虽然包含揉面、做油酥等步骤，但操作并不复杂，初学者也能跟着做出来。从备料到出锅大约需要 40 分钟。","q":["菜谱食材为 7 张饼的量"],"s":["面团：300 克面粉，3 克酵母粉，3 克白糖，180 克温水，20 克食用油，醒面 10 分钟。","油酥：小碗放 30 克面粉，2 克盐，4 克十三香，20 克食用油，拌匀后，静置。","做饼：面擀成长方形，抹上调好的油酥，从一头卷起，切成 7 个面剂子，对折，用虎口收拢即可，先沾水再沾白芝麻，擀成小圆饼。","烙饼：将电饼铛预热，倒入凉油（锅底铺满油），将擀好的饼放入电饼铛中，将饼的上方也刷点油，涂抹均匀盖上盖子，选大饼档,听到叮的一声出锅即可。"],"x":["如果没有电饼铛，也可以用平底锅。","芝麻如果没有也可不用，一样好吃。"]},{"t":"热干面","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["热干面特有的碱水面","小葱","酸豆角","肉末","蒜水","肉汤汁","萝卜干","芝麻酱","辣椒油","胡椒粉"],"tp":"","d":3,"k":1341,"i":"热干面是武汉最具代表性的小吃之一，属于鄂菜系。碱水面条筋道爽滑，裹满浓稠的芝麻酱，搭配酸豆角、萝卜干和肉末，咸香微辣，滋味醇厚。主要提供碳水化合物和蛋白质，芝麻酱也富含钙质。制作简单快捷，新手也能轻松上手，从煮面到拌好大约只需十几分钟。","q":["热干面特有的碱水面 (250g)","小葱 (10g)","酸豆角 (20g)","肉末 (30g)","蒜水 (30ml)","肉汤汁 (30ml)","萝卜干 (50g)","芝麻酱 (40ml)","辣椒油 (0-10ml)","胡椒粉(0-10g)","酱油(5ml)","食盐(3g)","鸡精(0-3g)"],"s":["水煮沸，并加入碱水面，焯烫 25 秒钟捞起。","撒上食盐、鸡精和胡椒粉。","芝麻酱用 90ml 水稀释，搅匀，然后加入。","加入 5ml 酱油，加入 30ml 肉汤汁和蒜水。","加入萝卜干，肉末，酸豆角，葱花。","拌均匀后开吃。"],"x":["辣椒油看个人口味添加。"]},{"t":"照烧鸡腿饭","c":"main","cu":"Japanese","m":30,"p":"chicken","ing":["鸡腿","料酒","生抽","蜂蜜","黑椒碎","黑椒粉","盐","西兰花","胡萝卜","老抽"],"tp":"","d":4,"k":1670,"i":"照烧鸡腿饭是一道甜咸适口的下饭菜，鸡腿煎得焦香后融入浓郁酱汁，口感嫩滑入味。鸡腿肉富含优质蛋白，搭配西兰花和胡萝卜能补充膳食纤维与维生素。制作稍需一点去骨技巧，但整体不复杂，新手跟着步骤也能成功。从备料到出锅，大约 30 分钟就能端上餐桌。","q":["鸡腿 500 g（约 3 只）","料酒 15 ml","生抽 30 ml","蜂蜜 15 ml（没有时使用白糖 20 g + 玉米淀粉 5 g + 0.5 ml 柠檬汁或醋代替）","黑椒碎 5 g","黑椒粉 5 g","盐 2.5 g","西兰花 50 g","胡萝卜 50 g","老抽 12 ml","大蒜 10 g（拍碎，不用切末）","生姜 10 g","食用油 15-25 ml","清水 30 ml","米饭 300-400 g"],"s":["取一只鸡腿，鸡皮朝下放在砧板上。","用刀尖沿着鸡腿骨头的轮廓轻轻划开，从一端到另一端。","用手指或刀背慢慢推开鸡肉，让骨头暴露出来。如果遇到筋膜，用刀尖切断。","当鸡肉完全分离后，握住骨头一端，轻轻扭转并拔出。","重复上述步骤将所有鸡腿去骨。","去骨鸡腿加入黑胡椒粉、黑胡椒碎、盐、姜片腌制 5 分钟。","碗里加入料酒、生抽、蜂蜜、老抽清水拌匀。","蔬菜焯水 1-2 分钟煮熟捞起。","热锅放油 15 ml 放入拍碎的大蒜爆香。","放入鸡腿中小火煎至两面金黄，如果感觉锅中太干，补 5-10 ml 油。","加入调好的酱汁，盖好盖子中小火（在燃气灶上使用小火）焖 5-10 分钟熟透，酱汁浓稠起泡即可。","切件，和蔬菜一起摆在饭面，淋入煎鸡腿的酱汁就可以慢慢享用啦。"],"x":["如果使用白砂糖、淀粉组合代替一定让白砂糖和淀粉完全溶解再下锅，否则容易糊锅。","焖煮时每隔 3-5 分钟翻搅一下，避免局部过热。","如果酱汁冒大泡、颜色变深褐，或边缘出现细密焦糖结晶，立即关火。","参考资料：【照烧鸡腿饭的做法步骤图，照烧鸡腿饭怎么做好吃】小晓姐姐_下厨房。"]},{"t":"煮泡面加蛋","c":"main","cu":"Chinese","m":10,"p":"egg","ing":["泡面","鸡蛋","水"],"tp":"","d":1,"k":550,"i":"煮泡面加蛋是一道便捷的快手主食，口感顺滑，汤味浓郁，适合随时填饱肚子。主要提供碳水化合物和蛋白质，能快速补充能量。做法极其简单，只需烧水、煮面、打入鸡蛋煮熟，新手也能轻松掌握，全程大约 10 分钟即可完成。","q":["泡面 1 包","水 550ml-1000ml，根据锅的情况。以能完整将泡面浸入其中为准。","鸡蛋 1 个"],"s":["先将水加热至沸腾（火候不做严格要求，使用热水会更快）","将取出的面饼放入锅中。","将泡面里附带的佐料放入锅中。","取出筷子轻微拨动泡面，使佐料充分溶解，面饼充分浸泡受热。","盖上锅盖等待约 1 分钟至锅内水再次沸腾。","去壳鸡蛋，加入锅中。","等待约 3 至 4 分钟，即可。"],"x":["单人，能支撑一个成年人不饥饿状态约 3 至 4 小时。","本指南中的鸡蛋包括但不仅限于：生鸡蛋，熟鸡蛋，卤蛋等。","原材料泡面可在楼下便利店购买。","可根据个人需要加入佐料，和其他食材包括但不仅限于：火腿肠，生菜，小肉丝，辣条，鱼干，虾仁，鸡腿。"]},{"t":"猪油拌饭","c":"main","cu":"Chinese","m":20,"p":"pork","ing":["米饭","猪油","生抽","老抽","蚝油","葱花","猪油渣"],"tp":"","d":1,"k":420,"i":"这是一道充满南方家常气息的简单拌饭，米粒被融化的猪油包裹，透着酱油的咸鲜和葱花的清香，是许多孩子食欲不振时的安心之选。主要提供快速碳水与脂肪能量，但胆固醇较高，不宜常吃。制作毫无门槛，哪怕完全不会做饭也能轻松完成，煮好的米饭只要几分钟就能拌出一碗香喷喷的主食。","q":["米饭 200 g","猪油 15 g（添加蚝油时，减少到 10 g）","生抽 5 ml（添加蚝油时，减少到 3 ml）","老抽 2 ml","蚝油 8 g","葱花 0-12 g（初始建议 5 g）","猪油渣 5 g"],"s":["碗底铺猪油。","加入米饭。","淋上酱油与蚝油。","撒上葱花和猪油渣。","搅拌均匀。"],"x":["建议搭配瘦肉和蔬菜食用来均衡营养。","高胆固醇，不建议经常食用。","参考资料：猪油拌饭 - 维基百科，自由的百科全书。"]},{"t":"电饭煲三文鱼炊饭","c":"main","cu":"Chinese","m":45,"p":"fish","ing":["有盐牛油","三文鱼","米","粟米","金菇","冬菇","电饭煲"],"tp":"","d":2,"k":889,"i":"这是一道融合日式炊饭做法的家常料理，米饭吸饱牛油和三文鱼的香气，口感浓郁鲜香。三文鱼提供优质蛋白和不饱和脂肪酸，搭配菌菇更添膳食纤维。操作极其简单，只需用电饭煲一键完成，从备料到出锅大约 45 分钟，非常适合新手尝试。","q":["米 50g / 人","三文鱼 300g / 人","牛油一汤匙 / 人"],"s":["三文鱼去鳞，去骨。","金菇、冬菇切碎。","洗米三次。","把三文鱼、米、牛油放入电饭煲。","想口感浓厚一点，可以加多一汤匙牛油。","根据电饭煲的刻度放水。","把电饭煲調較至煲飯模式，等待大約 30 - 45 分鐘。"],"x":[]},{"t":"空气炸锅照烧鸡饭","c":"main","cu":"Japanese","m":60,"p":"chicken","ing":["丽滋饼干","酱油","糖"],"tp":"","d":4,"k":1854,"i":"这道日式照烧风味的鸡肉饭，甜咸酱汁浓郁，表层烘烤得略微焦脆，内里软嫩多汁，搭配米饭非常下饭。鸡肉和鸡蛋提供丰富的优质蛋白，不过酱油和糖的用量较多，更适合偶尔改善口味。做法简单，只需混合原料交给空气炸锅，新手也能轻松搞定，从准备到出锅大约需要 1 小时。","q":["鸡肉 900g","酱油 100-125ml","糖 60-65g","白醋 30-35ml","丽滋饼干（咸味曲奇可替代） 16 个(48g)","鸡蛋 2 个"],"s":["将酱油、糖和醋混合在一起,搅匀料汁备用。","另一个碗中加入鸡肉、鸡蛋、1/2 料汁和压碎的丽滋饼干。搅拌均匀。","空气炸锅用箔纸碗铺底，加入肉饼混合物，将剩余的料汁均匀的倒在上面。","350°F(177°C) 炸40 分钟。最好在米饭上食用。","在外观呈金黄酥脆后出锅，切块盛盘。"],"x":["米饭的做法参考电饭煲蒸米饭或煮锅蒸米饭。","操作时，需要注意温度以免烫伤。","参考资料：库克美食教程:Air fryer Teriyaki Chicken Meatloaf。"]},{"t":"煮锅蒸米饭","c":"main","cu":"Chinese","m":25,"p":"none","ing":["北方大米","水","厚底煮锅+严丝合缝的锅盖"],"tp":"","d":2,"k":418,"i":"这是一道朴实无华的家常主食，用普通煮锅就能做出软糯适口的米饭。白米饭主要提供碳水化合物，为身体快速补充能量。做法极为简单，新手只需全程关注火候即可轻松掌握，从下米到出锅大约需要 25 分钟。","q":["米：100ml-200ml/人","水：米的体积的 2 倍"],"s":["清洗大米。","将米和水加入煮锅。","大火煮至水沸腾。","搅拌底部防止粘黏。","盖上锅盖，转小火加热 10-15 分钟（根据对软糯程度的喜好），中途切勿打开锅盖。","关火，静置 5 分钟。","Enjoy :)"],"x":["腐国人研究煮米饭，好想送他们个电饭煲！"]},{"t":"电饭煲蒸米饭","c":"main","cu":"Chinese","m":20,"p":"none","ing":["电饭煲","江南米或北方大米","水"],"tp":"","d":1,"k":442,"i":"一道家喻户晓的基础主食，米香纯粹、口感软糯，因水量调节可偏硬或偏润。富含碳水化合物，能快速补充能量，适合搭配各类菜肴。操作极其简单，新手也能轻松上手，从洗米到焖好大约需要四十分钟。","q":["一般一个人可以食用 100ml-200ml 的米。","指尖量水法 （用于精准确定米水量的方法）"],"s":["清洗米。","将米和水一起加入电饭煲中。","连接电饭煲电源，进入加热模式。等待大约 30 分钟。","待电饭煲自动进入保温模式后。","将米在电饭煲中闷 10-15 分钟。","盛出米。"],"x":["江南米，米和水放在电饭煲的容器内，食指触及米时，水量能刚好没过食指的第一个指节又第二个指节 1/4 处（即大约 2.6 厘米）。","北方大米，米和水放在电饭煲的容器内，食指触及米，水量能刚好没过食指的第一个指节（即大约 2 厘米处）。","不论什么容器，水的量都是可以使用“指尖量水法”煮出好米饭。"]},{"t":"红芸豆拌饭","c":"main","cu":"Chinese","m":40,"p":"none","ing":["红芸豆","巴斯马蒂香米或普通大米","洋葱","番茄","生姜","大蒜","青辣椒","香菜","食用油或酥油","姜黄粉"],"tp":"","d":3,"k":1842,"i":"这道北印度家常菜是旁遮普邦和德里地区的传统美食，番茄洋葱汤汁浓郁辛香，炖煮后红芸豆软糯入味，与热米饭拌食温暖饱腹。豆子富含蛋白质、膳食纤维和多种微量元素，营养均衡。做法简单，初学者也能轻松上手，全程制作约 40 分钟，但干豆需提前浸泡 8 小时。浓郁的家常滋味，有妈妈的味道。","q":["干红芸豆 200g（提前浸泡 8 小时）","洋葱 2 个（约 200g），切碎","番茄 3 个（约 300g），切碎（或番茄酱 30ml）","生姜 10g，磨碎","大蒜 4 瓣（约 12g），磨碎","青辣椒 1 根，切缝","食用油 30ml","月桂叶 2 片","姜黄粉 3g","红辣椒粉 5g","香菜粉 5g","孜然粉 3g","印度综合香料粉 3g","盐 6g","水 600ml","香菜叶 15g（装饰用）","大米 200g","水 400ml"],"s":["将干红芸豆用清水浸泡至少 8 小时（过夜），浸泡后体积会膨胀约两倍。"],"x":["红芸豆必须煮熟透才能食用，未熟的红芸豆含有植物血凝素(Phytohaemagglutinin)，可能导致食物中毒。","在印度，Rajma Chawal 被认为是最有家的味道的食物，地位类似于中国的\"红烧肉配米饭\"。","如果想要更浓郁的口感，可以加入 30ml 淡奶油。","剩余的红芸豆咖喱冷藏保存可达 3-4 天，味道会更好。"]},{"t":"老友猪肉粉","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["米粉","猪肉","酸笋","剁椒","豆豉","大蒜","料酒","生抽","白糖","米醋"],"tp":"","d":3,"k":927,"i":"老友猪肉粉酸辣鲜香，米粉爽滑，带着豆豉与酸笋特有的浓郁风味，是典型的南宁家常味。猪肉提供优质蛋白质，米粉则快速补充碳水能量。整体制作中等难度，需注意提前泡发米粉，熟练后大约四十分钟就能端上桌。","q":["米粉（250g 记得 50 度的温水泡半小时）","猪肉(50g)","酸笋(50g)","剁椒（15g 辣椒剁完后, 个人需求适当放。 ）","豆豉(30g)","大蒜(10g)","料酒(10-20ml)","生抽(15ml)","白糖（5g 如果不喜欢糖，可以考虑不放）","米醋(5ml)","盐(5ml)","油(15ml)","生粉(15ml)","胡椒粉(10ml)"],"s":["全部猪肉用料酒、盐、生抽、生粉、胡椒粉倒在一个碗里调味，备用。","热锅不放油，下全部酸笋把水份炒干，炒干的酸笋中间留点空间。","放入 10ml - 15ml 食用油与全部大蒜、 剁椒、 豆豉到炒干的酸笋中间，全部推到中间炒出香味。","放入全部调味好的猪肉，持续放入 10ml 生抽炒一分钟。","放入 5ml 米醋、 10ml 生抽、450ml 清水一起煮开。","水煮开后，放入温水泡好的米粉，继续煮 3 分钟就可以盛盘。"],"x":["记得米粉必须是泡过的才好吃，没有泡过的话是很难吃的！"]},{"t":"老干妈拌面","c":"main","cu":"Chinese","m":20,"p":"none","ing":["面","老干妈","酱油"],"tp":"","d":1,"k":502,"i":"一道香辣开胃的家常快手面食，面条筋道裹满老干妈的豆豉辣香，酱油提鲜，简单却滋味十足。作为主食能快速补充碳水化合物和能量，辣椒素还有助促进食欲。制作毫无门槛，新手也能轻松驾驭，从烧水到出锅只需大约十 分钟。","q":["水 1 升","面量 120 克","老干妈 15ml","酱油 5ml"],"s":["将水倒入锅中并煮沸。","将面均匀放入锅中。","在煮的过程注意搅拌，避免面粘成一坨。","当用筷子挑起一根面且该面能自然地从筷子上滑落时再等 30 秒关火。","将面夹入碗中。","按照上面的计量放入老干妈和酱油。","用筷子将碗里的面、老干妈、酱油拌均匀。","吃。"],"x":[]},{"t":"肉蛋盖饭","c":"main","cu":"Chinese","m":44,"p":"pork","ing":["米饭","鸡蛋","肉馅","老抽","生抽","醋","红葱油","葱","油","糖"],"tp":"","d":3,"k":1822,"i":"这道菜酱香浓郁、咸甜适口，肉馅焦香、鸡蛋嫩滑，盖在热米饭上十分满足，属于家常快手料理。富含优质蛋白质和必需氨基酸，能快速补充能量。做法简单直观，新手也能轻松上手，从备料到出锅大约只需十五分钟。","q":["米饭 240g","鸡蛋 4 个","肉馅 300g","老抽 10ml","生抽 25ml","醋 20ml","红葱油可选 10g","葱 10g","油 30ml","糖 15g"],"s":["煮好米饭，通常使用买米赠送的量杯，一杯米 240g。","锅中放油 30ml。","放入肉馅，调中火煎至两面微焦。","将鸡蛋打入锅中，不要打散，盖上锅盖。","调一个碗汁，碗中放入备好的老抽，生抽，醋，糖，红葱油，搅拌均匀。","打开锅盖，将碗汁倒入锅中，等待三分钟。","关火，将肉蛋盖到米饭上。","安全检查，开始食用盖饭。"],"x":["一份为一人餐，多人餐请等比例增加，但需要考虑锅的容量。","如果喜欢甜口可以增加 10g 糖。","请务必保证做完饭后关掉燃气设备以免发生危险。"]},{"t":"茄子肉煎饼","c":"main","cu":"Chinese","m":30,"p":"pork","ing":["米粉","小麦粉","鸡蛋","煮熟的腊肉","茄子","食用油","食盐"],"tp":"","d":3,"k":904,"i":"这道家常煎饼融合了腊肉的咸香与茄子的软糯，外皮酥脆、内里绵润，是一道充满乡土风味的米粉主食。它富含碳水化合物和优质蛋白质，茄子还能提供膳食纤维和维生素，荤素搭配营养均衡。制作难度中等，需要掌握面糊稠度和煎制火候，但初学者跟着步骤操作也能成功。从备料到出锅大约需要 30 分钟。","q":["制作 1 份，1 份正好够 2 个人吃。","米粉 250g","面粉 50g","鸡蛋 1 个","煮熟的腊肉 100g","茄子 1 根（约 10-15cm 长）","食用油 10-15ml","食盐 1-2g"],"s":["将茄子去皮后切成片，将腊肉切成片，备用。","依次向盆中加入 250g 米粉（大米研磨成的粉）、50g 面粉和 1 个鸡蛋。","边用筷子搅拌，边加入清水（清水用于调节粘稠度），使米粉、面粉、鸡蛋混合成面糊,当面糊能够附着在茄片、肉片上而不掉落时停止加水，而后将所有茄片和肉片放入面糊中，用面糊充分包裹。","平底锅加入食用油10-30ml，开小火。","用筷子或勺子把裹了面糊的茄片、肉片放入锅中，先煎至两面金黄，再煎3-6分钟（煎的过程中，食用油会变少，可再添加食用油）","撒盐，翻炒均匀，起锅装盘。"],"x":["用小火煎。"]},{"t":"葱油拌面","c":"main","cu":"Chinese","m":20,"p":"none","ing":["干面条","小葱","生抽","老抽","白糖"],"tp":"","d":2,"k":355,"i":"葱油拌面是一道经典的上海家常面点，以独特的葱油香味著称，做法简单快捷。富含碳水化合物和脂肪，能快速补充能量。一般初学者只需 20 分钟即可完成，非常适合作为日常快手晚餐。","q":["小葱 100 g","食用油 100 ml","生抽 60 ml","老抽 20 ml","白糖 15 g","干面条 80 g （约相当于 150 g 湿面条）","葱油酱汁 15 ml"],"s":["将 小葱 洗净，切成长段（约 5-7 cm）。葱白和葱绿可以分开。","锅中加入 100 ml 食用油，中火烧热。先放入葱白段，煸炒至微黄。","加入葱绿段，转小火，继续煸炒。","保持小火，耐心煸炒约 15-20 分钟，直至葱段变得焦黄酥脆。","将焦黄的葱段捞出（葱油保留在锅中）。","在锅中的葱油中，加入 60 ml 生抽，20 ml 老抽，15 g 白糖。小火加热并搅拌，约 1 分钟，至糖溶解，酱汁混合均匀。立即关火。将制作好的葱油酱汁倒入容器中，放凉后密封保存。"],"x":["葱油酱汁可以一次制作多份的量，分次使用。以下提供制作葱油酱汁的基础量，以及每份面条所需的葱油酱汁量。","炸葱油时，火一定要小，要有耐心，才能将葱的香味充分炸出。","制作好的葱油酱汁可以冷藏保存一段时间，下次吃面时直接取用。"]},{"t":"蒸卤面","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["猪五花肉","芹菜","鲜面条","葱，姜，蒜","食用油","生抽，老抽，料酒，盐，五香粉","蒸锅，需带笼屉","炒锅","花椒","干红椒"],"tp":"","d":4,"k":1563,"i":"这是一道豫南地区经典的家常面食，荤素搭配，面条吸足汤汁，口感软韧，咸香入味。五花肉提供优质蛋白质和脂肪，芹菜富含膳食纤维。做法简单易学，新手也能从容上手，整体制作约需一小时。","q":["芹菜 两根中等大小的芹菜","五花肉 350g","面条 500g","大葱 10cm","大蒜 5 瓣","姜片 20g","青椒 2 个","干红椒 3 个","花椒 20 粒","盐 10g","五香粉 5g","生抽 15ml","老抽 10ml"],"s":["猪肉去皮，切成 2cm×6cm×0.5 cm 薄片备用。","芹菜去叶，去掉根部 2cm，然后从中对半切开，切成 2cm 段备用。","大蒜去皮切粒备用，葱切 0.2cm 薄片备用，姜切细丝备用。"],"x":["切割猪肉时，可以让菜市场摊贩帮忙，根据经验，请求时机把握在已切割后未付款之前成功率最高。","首次做饭时可以提前备好料防止手忙脚乱，后续熟练后可以并发执行。","两次蒸面条时，都要尽量的弄散开，可以避免蒸好后团在一起。面条太长时可以拽断，方便后续搅拌与盛取。"]},{"t":"蛋包饭","c":"main","cu":"Chinese","m":44,"p":"chicken","ing":["鸡蛋","洋葱","胡萝卜","玉米粒","青豆","火腿肠或鸡胸肉","米饭","番茄酱","食用油","牛奶"],"tp":"","d":3,"k":695,"i":"以嫩滑蛋皮包裹茄汁炒饭，口感丰富，酸甜开胃，是一道经典的日式家庭料理。富含蛋白质、碳水和多种维生素，营养均衡。包裹蛋皮需要一点技巧，但整体难度适中，新手也可尝试，从准备到完成约需 25 分钟。","q":["鸡蛋 2 个","洋葱 30g","胡萝卜 30g","火腿肠或鸡胸肉 50g","玉米粒和青豆总共 30g","米饭 200g","番茄酱 20ml","食用油 15ml","牛奶 10ml（与鸡蛋混合）"],"s":["洋葱、胡萝卜、火腿肠或鸡胸肉切成小丁，备用。","热锅，锅中倒入 10ml 食用油，等待 10 秒加热。","先放入洋葱丁翻炒 1 分钟，出香味后加入胡萝卜、玉米粒、青豆继续翻炒 2 分钟。","加入火腿肠或鸡胸肉丁，炒至变色。","加入米饭炒散后，加入番茄酱 20ml，翻炒均匀，炒饭完成，盛出备用。","鸡蛋打散，加入 10ml 牛奶搅匀。","锅中放入 5ml 食用油，倒入蛋液，轻晃锅底让蛋液均匀铺满锅面。","用小火加热，待蛋液表面半熟状态时，将炒饭放入蛋液中央。","用铲子将蛋皮折叠包住米饭，形成椭圆形状。","用锅铲轻轻推至盘中，整理外形，可在表面挤上少量番茄酱装饰。"],"x":["炒饭用隔夜饭不易粘锅，口感更好。","打蛋时加入牛奶可以让蛋皮更加嫩滑。","操作蛋皮时火力需小，避免底部焦糊。","如果不擅长包裹造型，也可以直接将炒饭铺盘后盖上蛋皮。"]},{"t":"蛋炒饭","c":"main","cu":"Chinese","m":25,"p":"pork","ing":["冷饭","鸡蛋","火腿","黄瓜","胡萝卜","油","盐","胡椒粉","生抽","香葱"],"tp":"","d":3,"k":853,"i":"一道家常蛋炒饭，金黄的蛋丝裹着粒粒分明的米饭，搭配火腿、胡萝卜和黄瓜，口感丰富，咸香适口。鸡蛋提供优质蛋白，胡萝卜增添维生素，碳水化合物带来充足能量。制作步骤稍多，但新手按流程操作也能成功，全程大约需要 25 分钟。","q":["冷饭（500ml）","鸡蛋 （1.5）","火腿（2 个）","黄瓜（可选，30g）","胡萝卜（可选，30g）","油（12ml）","盐（4g - 6g）","胡椒粉（8g）","香葱（1 颗）","生抽（10ml）"],"s":["米饭提前用铲子铲成小块。","火腿肠、胡萝卜、黄瓜等根据需求切片或者块状。","如果家里有熟肉 准备好味道更佳。","将蛋白，蛋黄分开，分别打入一个大碗里，各自搅匀。注意，不要在这一步加盐。","大火热锅，待锅里冒烟放入食用油，放入蛋白，待主体凝固后盛出备用。","如果油够，则直接放入蛋黄，如果油不够则放入食用油并等其升温到大火热锅。","待主体凝固后，将火调至中小火，倒入火腿肠、熟肉，胡萝卜、黄瓜等备料、翻炒 10 秒钟（到爆香）","重新倒入蛋白，翻炒 5s 钟，迅速倒入米饭大火翻炒，为的就是每一粒饭都裹上鸡蛋。","翻炒过程中将米饭的块状捣碎、这一步过程会比较长、待米饭全部捣碎再翻炒均匀即可。","调至小火、加盐、胡椒粉、生抽。","进一步翻炒均匀，能看到一些米饭在锅里有“跳起来”的时候其实就已经差不多了。","最后倒入香葱再翻炒 10s。","关火、盛入碗中。"],"x":["使用隔夜的冷饭炒饭最佳，没有冷饭的同学也可以现煮（可以使用冰箱立马给米饭降温），不过要做到“粒粒分明”的口感就需要炒更久。","炒饭要做到“粒粒分明”其实就是要将饭炒干。为什么要用隔夜的冷饭是因为隔夜已经流失了一定的水分。"]},{"t":"螺蛳粉","c":"main","cu":"Chinese","m":20,"p":"none","ing":["米粉","螺蛳肉包","汤料包","醋包、辣椒油等调味包"],"tp":"","d":1,"k":1109,"i":"螺蛳粉是广西柳州的特色小吃，汤鲜味浓，酸辣爽口，米粉软滑筋道。口味上融合了螺蛳汤的鲜美、酸笋的独特发酵风味和辣椒油的刺激，层次分明。作为主食，米粉提供充足碳水化合物，螺蛳肉包和配料带来一定蛋白质，酸笋则有助于开胃促消化。这道菜所需操作简单，只需按顺序煮熟米粉和调味即可，对新手非常","q":["水 1L"],"s":["锅中加水，将水烧开。","下米粉，煮 3-5 分钟，期间用筷子搅拌，防止米粉粘在一起。","下汤料包，按个人口味添加。","下一部分配料包，如木耳，花生，螺蛳（这部分配料需要煮一会才入味）","下调味包，按个人口味添加。","搅拌后捞出，放入碗中。","下剩下的配料包，如酸笋，豆皮（这部分配料不适合被汤泡太久）","享用美食。"],"x":["根据个人经验，一包袋装螺蛳粉足够一人一餐食（虽然看着很大包）","如果想要更有嚼劲的粉，可以缩短第二步煮粉的时间。","如果想在螺蛳粉中添加炸蛋，请参考炸蛋的教程。","配料的选择请依照个人口味。"]},{"t":"西红柿鸡蛋挂面","c":"main","cu":"Chinese","m":20,"p":"fish","ing":["挂面或者鲜面条也行","西红柿一个","盐","鸡蛋","葱","酱油、蚝油或者鸡精","白砂糖","青椒","香油"],"tp":"","d":2,"k":654,"i":"西红柿鸡蛋挂面是一道家常快手面食，酸甜咸鲜，汤汁浓郁，面条劲道，属于融入北方风味的日常主食。鸡蛋提供优质蛋白，西红柿富含番茄红素和维生素，搭配碳水主食，营养均衡。操作简单，步骤清晰，对新手友好，从备料到完成大约只需 20 分钟。","q":["挂面 1 把（根据食量来）50-100g","西红柿 1 个大概 200g 吧。","鸡蛋 1~2 个","盐 5g","蚝油 5g 或鸡精 3g","白砂糖 2g","酱油 5-8g","食用油的用量为 20g","香油 5g"],"s":["食材
