预处理很重要，无论做什么菜提前进行处理，在菜肴制作过程中才不会慌乱，并且制作是个很舒心的过程，这……可能就是为什么后厨需要一个单独的打荷岗位吧。","小葱洗净并切成葱花。","西红柿切块儿，如果不太会切建议先百度一下~。","青椒切成菱形块。","生鸡蛋打入一个小碗并打散，如果鸡蛋有点腥味可以加 2g 白醋去腥。"],"x":["鸡蛋蛋液中可以加入 2g 黑胡椒味道更好。","熬臊子过程中加入 2g 白胡椒粉提升香辛口味。","煮面条如果一次性煮熟也可以，多次加水是为了让面条口感劲道，面条不粘黏，技巧在于煮沸就加冷水，循环往复两三次即可。"]},{"t":"豆角焖面","c":"main","cu":"Chinese","m":30,"p":"none","ing":["鲜面条","肉","盐","豆角","鸡精","耗油","味精","十三香","生抽","老抽"],"tp":"","d":3,"k":1386,"i":"豆角焖面是一道北方家常面食，面条吸饱汤汁，口感软韧咸香，带着豆角的清爽和肉片的油润。五花肉提供蛋白质和脂肪，豆角富含膳食纤维和维生素，荤素搭配均衡。整体操作不难，但需要留意火候和加汤时机，适合有一定下厨经验的朋友尝试，一般约 30 分钟就能端上桌。","q":["鲜面条 300g。","肉 100g。","豆角 150g。","盐的用量为：2g。","食用油的用量为 10 - 18 ml。","鸡精的用量为：2g。","生抽的用量为：10ml。","耗油的用量为：5g。","十三香的用量为：1g。","老抽的用量为：5ml。","味精的用量为：1g。","热水的用量为：150ml。","葱 10g。","姜 5g。","蒜 10g。"],"s":["将豆角切成 5cm - 6cm 的小段。","将葱切成 1cm - 2cm 小段。","将姜切成 1mm×1mm×3cm 的长条。","将蒜放在砧板上拍碎，切成 1mm 的粒度。","将五花肉切成 2mm 厚度的肉片。","首先将锅烧热，烧去锅内全部水汽，手放过内距离锅底 10cm 处，感觉明显有些许烤手。","加入上述定量的食用油，手持锅柄，离灶 5cm 处，摇晃锅，使食用油充分挂满锅的三分之二（自下而上）。","> ps：不粘锅请忽略上述操作，静待3-5秒油热即可。","放入全部的姜和全部的葱段，翻炒爆香 5 秒（注意！此时有油飞溅的危险，建议带上手套或做好防护措施）。","放入全部的肉片，放入以后不着急饭锅，静置 5 秒后，再翻炒，使所有的肉都裹满食用油。","不断翻炒肉片，待到全部肉片都已经变色，沿锅边均匀淋如准备好的生抽，翻炒均匀。","依次加入准备好的盐、老抽、耗油、十三香、鸡精以及全部准备好的豆角，翻炒 2 分钟。","加入准备好的热水。","水开使用勺子舀出锅内 2 分之一菜汤（注意！不要将菜舀出）。","将所有面条平铺在菜的上方。","盖上锅盖，中火焖 5 分钟。","打开锅盖，将舀出的菜汤使用勺子，以每次一勺的量，均匀撒在面条上。","盖上锅盖，中火焖 3 分钟。","打开锅盖，将所有的蒜、味精均匀撒入。","> ps：此时锅内可能还有水，如果想吃湿一点的请关火，否则不用关火。"],"x":["毛细（顾名思义，就像头发，其实就有点像细粉丝那样细）","细（这个比毛细粗点，跟香头一样）","二细（有点像一般的炒面条那样粗）"]},{"t":"酱拌荞麦面","c":"main","cu":"Chinese","m":20,"p":"none","ing":["荞麦面","黄瓜","红萝卜","老干妈"],"tp":"","d":2,"k":475,"i":"酱拌荞麦面酸甜可口、清凉爽滑，是一道简单快手的家常凉拌面。荞麦面富含膳食纤维和蛋白质，搭配黄瓜、胡萝卜增添清爽口感与维生素，营养均衡。只需煮面、切菜、拌入老干妈，几步搞定，对新手非常友好，一般约 20 分钟便可完成。冷藏后食用风味更佳。","q":["荞麦面 100 g","黄瓜 0.5 根","红萝卜 0.5 根","老干妈 20 ml"],"s":["荞麦面下冷水煮熟，8-10 分钟 后捞出沥干备用。","黄瓜、萝卜 切成小条。","将荞麦面、黄瓜、萝卜放入盘子，放上老干妈，搅拌。"],"x":["荞麦面沥干后可以放冰箱冰镇后口感更佳。","配料可以根据个人喜好选择其他，例如虾仁、肉沫等。","酱料可以根据个人喜欢选择其他，例如花生酱、芝麻酱等。","荞麦面跟其他面条热量几乎一致，所以不适合作为减脂的主食。"]},{"t":"酸辣蕨根粉","c":"main","cu":"Chinese","m":10,"p":"none","ing":["蕨根粉","油泼辣子","酱油","香醋","小米辣","蒜","葱","盐","糖","一口有点深度的锅"],"tp":"","d":2,"k":318,"i":"酸辣蕨根粉口感爽滑筋道，酸辣开胃，是一道家常凉菜，也可当作主食享用。蕨根粉富含淀粉和膳食纤维，能为身体提供能量。这道菜做法格外简单，对新手非常友好，从准备到完成只需 10 分钟。","q":["如果觉得酱料较为清淡，可以加入 2 至 5 克盐","如果想要酱料鲜一些，可以加入 2 克糖"],"s":["锅中加入约为深度 3/5 的水，烧开。","水沸腾后加入蕨根粉，中小火煮 8 分钟。","出锅。"],"x":["酱油 : 醋 : 油泼辣子 = 3 : 2 : 2 （酱料具体量根据蕨根粉多少决定，这个比例仅为保证口味的方向不出错）","葱姜蒜为附加调料，加入可以增添风味，不加也并无大碍。","糖和盐根据个人口味，需要加入的具体量不同，请酌情加入。","建议使用碗作为最终装盘餐具，因为使用盘子会使吃粉变得困难一些。"]},{"t":"醪糟小汤圆","c":"main","cu":"Chinese","m":15,"p":"none","ing":["小汤圆","醪糟","白糖","枸杞"],"tp":"","d":2,"k":957,"i":"醪糟小汤圆是一道香甜软糯的传统中式甜品，酒酿的微酸与糯米的绵滑交融，暖胃又舒心。它富含碳水化合物和少量 B 族维生素，能快速补充能量，也有助促进血液循环。做法毫无门槛，对新手特别友好，从烧水到出锅只需约 15 分钟，是一碗随时都能轻松完成的家常甜汤。","q":["水 300 毫升","小汤圆 250 克","醪糟 50 克","枸杞 5 颗"],"s":["将水倒入锅中并煮沸。","放入小汤圆煮 8 分钟。","放入醪糟和枸杞再煮 2 分钟。","盛入碗中根据个人口味加入白糖并搅拌均匀。","吃。"],"x":["白糖的用量根据个人口味更改。","若喜欢更浓的口感可以减少 100 毫升内的水。","若喜欢软点的枸杞口感，可以将枸杞和小汤圆同时煮。"]},{"t":"陕西油泼面","c":"main","cu":"Chinese","m":30,"p":"none","ing":["鲜面条","盐","葱","蒜","干辣椒面","食用油","生抽","香醋","青菜","锅"],"tp":"","d":2,"k":771,"i":"这道西北传统面食以筋道的扯面和热油泼出的香辣风味著称，是陕西家喻户晓的日常主食。面条富含碳水化合物，搭配青菜和豆芽，能快速补充能量，膳食搭配合理。整个流程简单明了，对新手十分友好，从备料到出锅大约只需 30 分钟。","q":["男生一般 4 根，女生 3 根即可，量大者可适当增加","盐 2g","葱 1 根","大蒜 3 瓣","干辣椒面 15g","食用油 50ml","生抽 10ml","香醋 5ml","青菜 50g","豆芽 50g（选配）"],"s":["扯面的话，用擀面杖（没有擀面杖，用手也行）上下两边轻压，两手拽住左侧和右侧两端，轻轻拉开。","葱切成葱花，蒜切成蒜末备用。","青菜洗净，豆芽洗净备用（如使用）"],"x":["辣椒面的选择很关键，建议使用陕西秦椒面，香而不辣; 陕西八大怪之一: 油泼辣子一道菜😂。","泼油的油温是成败关键，油温过低辣椒不香，油温过高容易糊。","喜欢吃肉的可以加入肉末做成肉臊子油泼面。"]},{"t":"韩式拌饭","c":"main","cu":"Korean","m":45,"p":"beef","ing":["米饭","鸡蛋","火锅牛肉卷","豆芽","蘑菇","胡萝卜","西葫芦","韩式辣酱","雪碧","芝麻"],"tp":"","d":3,"k":1080,"i":"韩式拌饭是一道色彩缤纷、口感丰富的韩国家常料理，甜辣酱汁包裹着米饭、蔬菜、牛肉和溏心蛋，拌匀后一口满足。多种蔬菜提供维生素和膳食纤维，牛肉和鸡蛋补充优质蛋白，营养均衡。制作简单但备菜步骤稍多，新手也能从容完成，从准备到上桌大约需要 45 分钟。","q":["米饭 1 碗 (400g)","鸡蛋 1 颗","火锅牛肉卷 6 卷 60g","豆芽 1 把 80g","蘑菇 50g","胡萝卜 1/4 根","西葫芦 50g","韩式辣酱 25ml","雪碧 2 瓶盖, 20ml","芝麻 10g","芝麻油 20ml","生抽 15ml"],"s":["蔬菜清洗 切丝 放锅中翻炒 食材变软 便可称出。","煮水 等沸腾时 焯牛肉卷 只需煮熟 大概三分钟即可捞出。","煎溏心蛋。","将米饭放在一个碗里 然后倒扣在大碗。","将准备好的蔬菜和肉卷依次绕圈放在米饭上面 将煎蛋放中间。","备酱汁。","10ml 韩式辣酱（甜辣口）+ 5ml 生抽 + 两瓶盖雪碧（减肥的话 可以放无糖雪碧）+ 10g 芝麻 + 5ml 芝麻油。","搅拌上述酱汁，可以再加生抽和盐。","将备好的酱汁倒在摆好盘的碗中。"],"x":["这是道非常简单的菜 过程会比较繁琐 但当将菜肉米饭酱汁搅拌起来吃会很满足。","如果对外观有一定要求 可以用砂锅代替普通碗。"]},{"t":"韭菜盒子","c":"main","cu":"Chinese","m":44,"p":"shrimp","ing":["韭菜","虾仁","鸡蛋","香油","盐","面粉"],"tp":"","d":3,"k":794,"i":"韭菜盒子是一道传统中式面点，外皮金黄酥脆，内馅鲜香多汁。韭菜搭配虾仁和鸡蛋，富含维生素与优质蛋白质。做法简单，对新手也很友好，从和面到出锅大约需要 2.5 小时。","q":["韭菜 500g","虾仁 100g","鸡蛋 3 枚","香油 10ml","盐 5g","面粉 250g"],"s":["将面粉放入大碗中，加入水，搅拌成光滑的面团，静置 30 分钟。","韭菜洗净切碎，加入打散的鸡蛋、5g 盐，搅拌均匀。","将面团分成小剂子，擀成薄圆饼，包入韭菜、虾仁、鸡蛋液。","热锅，加入食用油，放入包好的韭菜盒子，煎至两面金黄，约 3-4 分钟。","盛盘，稍凉后即可享用。"],"x":["制作时可根据个人口味添加豆腐干等配料。","注意煎制时火候，避免外焦内生。"]},{"t":"鲜肉烧卖","c":"main","cu":"Chinese","m":56,"p":"pork","ing":["烧卖皮","猪肉末","生姜末","葱末","生抽","料酒","盐","糖","白胡椒粉","芝麻油"],"tp":"","d":4,"k":1485,"i":"这是一道江南风味的精致点心，皮薄如纸，馅料饱满多汁，咬开时肉香、笋鲜与皮冻融化后的汤汁交融，咸中带甜，口感软嫩弹牙。猪肉和虾仁提供优质蛋白质，冬笋与香菇增添膳食纤维和微量元素，低脂版本进一步减少了饱和脂肪。虽然包制手法需要一点耐心，但整体步骤清晰，新手多加练习也能掌握，从拌馅到出","q":["烧卖皮 240-465 g（约 24-31 张，建议用每张 10g 的烧卖皮 30 张）","猪肉末 300 g（低脂版本用猪里脊或猪前腿肉 280 g）","生姜末 5-10 g","葱末 10-20 g","生抽 15 mL","料酒 10 mL","盐 3-5 g（如果使用浓汤宝，减少 3 g）","糖 2-3 g","白胡椒粉 2 g","芝麻油 5 mL","高汤 30 mL","浓汤宝 6 g（建议家乐牌，约 1/8 块）","冬笋 50 g","皮冻 100 g","香菇 75 g（或干香菇 30 g 泡发）","虾仁 100-200 g（约 20-25 个）","复配食品增稠剂 1.2 g（或玉米淀粉 2 g）","猪油（或鸡油）15 g"],"s":["（低脂版本）取 10 mL 冷水，加入复配食品增稠剂，调成糊糊。","（低脂版本）加入 25 mL 开水，搅拌至半透明凝胶。","（低脂版本）冷却后混入 280 g 纯瘦肉糜 + 15 g 融化猪油（或鸡油）","将猪肉末与生姜末、葱末混合，加入酱油、料酒、盐、糖、白胡椒粉，顺一个方向搅拌上劲。","如果使用浓汤宝，取浓汤宝块加入 15 mL 热水混合，搅拌至乳浊液完全分散，再加入 15 mL 常温水。","慢慢加入水或高汤，继续搅拌，直到馅料吸收水分，变得粘稠，如果觉得肉馅太稠，补 5 mL 水继续搅拌。","加入可选配料（冬笋、皮冻、香菇），最后淋上芝麻油，拌匀。冷藏 30 分钟，让味道融合。","取一张烧卖皮，放上约 20-25 g 馅料（别太贪心，否则包不住）","用虎口轻轻收拢皮子边缘，形成“花瓶”状，顶部留开口。","用手指轻轻压实底部，确保站立稳定。","如果要加虾仁，在顶部加一颗虾仁。","重复包烧卖的步骤，直到包好。","放在蒸笼里，间隔开，避免粘连。","大火蒸 8-10 分钟即可。"],"x":["烧卖中的脂肪主要来自肥肉，低脂版本中的肥肉被移除后为保证口感需要使用少量动物油来补偿。","如果没有烧卖皮，可用大馄饨皮，或者饺子皮擀薄。","皮的直径在 8-10 cm 之间，每张皮重约 10-15g，皮和馅的比例控制在 1:2 - 1:2.5。","绞肉机建议用中档，这样肉末不会太细（像糊糊）也不会太粗（像碎块），保持适中纹理，让馅料口感 Q 弹。"]},{"t":"鲣鱼海苔玉米饭","c":"main","cu":"Chinese","m":5,"p":"fish","ing":["必备：东北米","必备：鲣鱼海苔碎","必备：玉米粒"],"tp":"","d":2,"k":383,"i":"这是一道鲜香味美的日式简餐，米饭粒粒分明，融合了鲣鱼的咸鲜、海苔的酥香与玉米的甜脆。鲣鱼富含优质蛋白和 DHA，搭配海苔的矿物质和玉米的膳食纤维，营养均衡。做法非常简单，新手也能轻松完成，实际动手仅需 5 分钟，加上煮饭总共约 40 分钟即可享用。","q":["鲣鱼海苔碎 20g","玉米粒 80g/袋"],"s":["盛好米饭，放入玉米粒拌好。","放入鲣鱼海苔碎。"],"x":["使用米家小饭煲煮东北米的话，水没过米 3 毫米就行，太多水煮出来不是一粒一粒的饭。"]},{"t":"鹰嘴豆炸饼","c":"main","cu":"Chinese","m":50,"p":"none","ing":["鹰嘴豆","中筋面粉","酸奶","洋葱","番茄","生姜","大蒜","青辣椒","香菜","红茶包"],"tp":"","d":4,"k":1098,"i":"鹰嘴豆咖喱配油炸面饼是北印度经典街头小吃，松软的炸饼搭配香料浓郁的鹰嘴豆，口感层次丰富，酸辣咸香。鹰嘴豆富含植物蛋白和膳食纤维，饱腹又营养。制作步骤稍多，但跟着流程走并不难，适合有一定基础的家常烹饪。约 50 分钟即可完成（鹰嘴豆需提前浸泡 8 小时）。","q":["干鹰嘴豆 200g（提前浸泡 8 小时）","洋葱 2 个（约 200g），切碎","番茄 3 个（约 300g），切碎","生姜 10g，磨碎","大蒜 4 瓣（约 12g），磨碎","青辣椒 2 根，切缝","食用油 30ml","红茶包 1 个","姜黄粉 3g","红辣椒粉 5g","香菜粉 8g","孜然粉 5g","印度综合香料粉 5g","石榴粉 3g（或柠檬汁 15ml）","盐 6g","水 500ml","中筋面粉 250g","酸奶 60ml","食用油 15ml（和面用）","小苏打 2g","盐 3g","温水 约 60ml","食用油 500ml（炸饼用）"],"s":["将干鹰嘴豆用清水浸泡过夜（至少 8 小时），浸泡后体积会膨胀至约两倍。"],"x":["鹰嘴豆提前浸泡是必须步骤，不泡的话煮不软。如果时间紧迫，可以用高压锅将未泡的鹰嘴豆压 20 分钟。","红茶包的作用是给鹰嘴豆上色，使其呈现深棕色。这是印度餐厅的秘诀。","炸饼面团中的酸奶和小苏打是其松软蓬松的关键。面团不宜太硬。","这道菜在印度是国民级的早午餐，从路边摊到高档餐厅都有供应。在中国的印度餐厅中通常被称为\"鹰嘴豆咖喱配炸饼\"。"]},{"t":"麻油拌面","c":"main","cu":"Chinese","m":20,"p":"none","ing":["风干快熟面/任何牌子的快熟面","麻油","胡椒粉","老抽","盐"],"tp":"","d":1,"k":451,"i":"麻油香气浓郁，搭配老抽与胡椒粉简单调味，咸香适口，是一道省时省钱的家常拌面。面条提供充足碳水化合物，麻油含有不饱和脂肪酸与维生素 E，能为身体补充能量。制作毫无难度，厨房新手也能轻松上手，从煮水到拌好只需大约十分钟。","q":["水 1 升","快熟面 1 块","麻油 15ml","老抽 10 克","盐 30 克（可选，这 30g 盐不会被全部食用）","胡椒粉 10 克","生抽 5 克（可选）"],"s":["将水倒入锅中并煮沸 （喜欢吃 q 弹面的同学，可在水里加入 30 克盐，用盐水煮出来的面会比较 q 弹）","将快熟面放入锅中 3 分钟（也可参考当下品牌快熟面的烹饪时间）","当面开始散了可以开始搅拌，让面受热均匀。","将水滤干把面倒入碗中。","按照上面的计量放入麻油，老抽，胡椒粉，生抽（可选）","筷子搅拌均匀。","一道简单即省钱的懒人麻油拌面就完成啦。"],"x":[]},{"t":"麻辣减脂荞麦面","c":"main","cu":"Chinese","m":20,"p":"none","ing":[],"tp":"","d":2,"k":790,"i":"麻辣汤底融合了火锅底料与花生酱、牛奶，口感浓郁顺滑，带有鲜明麻辣风味。搭配高纤维荞麦面与新鲜蔬菜，低卡饱腹，适合减脂期享用。做法毫无难度，无需厨艺基础，全程约 20 分钟即可端锅开吃。","q":["半干荞麦面 100g","娃娃菜 8 片（共 150g）","生菜 6 片（共 80g）","火锅底料 25g","花生酱 15g","全脂牛奶 150ml","生抽 6ml","辣椒油 10ml","醋 20ml","花椒油 10ml","水 500ml"],"s":["娃娃菜、生菜洗好，备用。","锅内倒入 500ml 水，开大火，将荞麦面和娃娃菜放进去，等待水沸腾。","水沸腾后，转小火，加入火锅底料、花生酱、牛奶、生抽、辣椒油，水开后煮 5 分钟。","加入生菜，再煮 2 分钟。","加入醋、花椒油，关火，直接端着小锅开吃。"],"x":["一定要选半干荞麦面，口感最好。","可以随意添加其他东西，比如火锅丸、蛋饺等。","火锅底料、花生酱、牛奶一定要加，口味三大巨头。","如果不能吃酸，可以不加醋。"]},{"t":"上汤娃娃菜","c":"veg","cu":"Chinese","m":20,"p":"egg","ing":["娃娃菜","皮蛋","午餐肉","葱","姜","蒜","盐","糖","淀粉"],"tp":"","d":3,"k":158,"i":"这道上汤娃娃菜清甜鲜美，口感软嫩，属于家常素菜，尤其适合减肥期间食用。娃娃菜富含维生素和膳食纤维，低脂低热量，搭配皮蛋和午餐肉增添风味又不会过多增加负担。制作难度适中，新手也能尝试，从备菜到出锅大约只需 20 分钟。","q":["注意，这道菜仅有足够 2-4 人食用的版本。","娃娃菜 700g","金针菇 10g（看个人喜好, 不喜欢 see you tomorrow 的就不放 😂）","皮蛋 一个（没有也可以不放）","午餐肉（火腿肠都可以替代）"],"s":["娃娃菜洗净, 竖着切开切成段。","葱 3g 切 小段。蒜 10g 切片。姜 10g 切小片。","皮蛋切成丁, 火腿肠或者午餐肉切成丁（1cm 大小的丁）","金针菇洗净撕开。","烧热水娃娃菜放进去十秒钟出一下水捞出。","热锅凉油, 加热锅倒入油过一遍就倒出来, 重新倒入一点油。","调至小火加入葱姜蒜，煎炒出香味即可。","加入适 300g 清水（水量没过娃娃菜即可）, 放入娃娃菜, 金针菇, 午餐肉。","加入调味料蚝油、糖、盐、味精烧开。","煮 3 分钟, 煮开后开始装盘, 盛出娃娃菜后皮蛋放在上面把汤汁浇上去就可以了。","拍照技术有限, 味道还是很不错的。"],"x":[]},{"t":"乾隆白菜","c":"veg","cu":"Chinese","m":10,"p":"none","ing":["大白菜","芝麻酱","陈醋","白糖","香油","熟白芝麻"],"tp":"","d":2,"k":150,"i":"乾隆白菜是一道经典的北京风味凉菜，以手撕白菜心拌上浓稠芝麻酱汁，口感酸甜爽脆、醇厚开胃。白菜富含维生素和膳食纤维，芝麻酱则带来优质脂肪与钙质，清爽解腻又营养。全程不炒不煮，调酱拌匀即可，对新手十分友好，一般仅需 10 分钟便能端上餐桌。","q":["大白菜嫩叶 300g","芝麻酱 30g（约 2 汤匙）","陈醋 45ml（约 3 汤匙，醋与麻酱比例约 3:2）","白糖 5g（约 1 茶匙）","香油 5ml","食盐 1g","熟白芝麻 3g（可选）"],"s":["大白菜只取内部嫩叶（黄色部分），去除菜帮，用手撕成半个巴掌大的块，不要用刀切（手撕截面粗糙更易挂酱）","将撕好的白菜叶冲洗干净，充分控干水分，水分残留会导致酱汁无法挂附。","碗中加入 30g 芝麻酱，先加入 45ml 陈醋，沿同一方向搅拌，将麻酱慢慢稀释开，直至成细线状滴落为止（切勿来回搅拌，会导致芝麻酱\"走油\"）","向麻酱汁中加入 5g 白糖，搅拌均匀；再加入 1g 食盐，搅拌均匀；最后加入 5ml 香油，搅拌均匀（各调料需分次加入并分别搅拌，边加边感受稀稠度）","将调好的麻酱汁均匀淋在白菜叶上，用手轻轻抓拌，使每片菜叶都裹上酱汁。","撒上熟白芝麻，装盘即可食用；若时间充裕，可静置 5 分钟待其入味后再食用。"],"x":["白菜控水是关键，越干越好；湿菜叶挂不住麻酱，整道菜口味会被稀释。","调麻酱汁时必须先用醋\"解\"酱，再依次加入其他调料，切勿一次全部倒入。","陈醋优先选用镇江香醋，颜色与酸香均最为适宜；不建议使用米醋（太淡）或白醋（色浅且味薄）。","本配方为醋糖版，如希望口味更醇厚圆润，可将白糖的一半替换为蜂蜜。"]},{"t":"凉拌木耳","c":"veg","cu":"Chinese","m":32,"p":"none","ing":["干木耳","蒜瓣","白糖","小米辣","盐","香油","生抽","醋","芥末"],"tp":"","d":2,"k":129,"i":"凉拌木耳，由于发放物资中有很多干货，木耳是较为健康的食物。且凉拌木耳的烹饪方式也相对简单。","q":["干木耳: 20g / 湿木耳: 120g","蒜瓣: 2-3 个","小米辣: 2 个","盐: 2 g","糖: 5-10g（依个人口味）","生抽: 15ml","醋: 15ml","香油: 5ml","芥末: （约 2cm）"],"s":["泡发干木耳, 水量约为 400ml, 泡发约 45 分钟。","将泡发好的木耳, 进行去根处理（如图 4, 5, 6）, 并彻底洗净。","起锅烧水，水开后放入木耳, 大火煮 1.5-2 分钟。","将蒜瓣、小米辣切碎放入碗中 （可选取中大碗）, 并依次加入盐、糖、生抽、醋、香油、芥末, 用量如上。","木耳盛出后沥水, 放入上一步碗中。","搅拌充分，端盘。"],"x":["调味品的数量可以根据个人口味进行调整, 如果不喜欢芥末, 可以不加入。","等木耳冷却入味后口味更佳, 约 15 分钟。"]},{"t":"凉拌油麦菜","c":"veg","cu":"Chinese","m":20,"p":"fish","ing":["油麦菜","芝麻酱","酱油","醋","蚝油","白糖","香油","蒜","盐"],"tp":"","d":1,"k":191,"i":"一道清爽解腻的家常凉菜，芝麻酱的醇厚包裹着油麦菜的脆嫩，酸甜咸香交织，非常开胃。油麦菜富含维生素和膳食纤维，芝麻酱则补充钙与健康脂肪，营养均衡。做法毫无难度，切一切、拌一拌就行，从准备到上桌只需十几分钟，特别适合新手和忙碌时快速成菜。","q":["1 颗 油麦菜（约 200g）","15ml 醋","5ml 酱油","10ml 芝麻酱","5ml 香油","5g 糖","10ml 蚝油","两头蒜"],"s":["蒜拍碎切末。","醋，酱油，芝麻酱，香油，糖，蚝油，蒜末放到碗里搅拌均匀。","油麦菜切段，每段不超过 4cm。","油麦菜放到一个大点的盆里，倒入上述碗中酱料，充分搅拌均匀.。"],"x":["芝麻酱可以用花生酱代替。","芝麻酱一定要和油麦菜混合均匀才更好吃.。"]},{"t":"凉拌莴笋","c":"veg","cu":"Chinese","m":32,"p":"none","ing":["莴笋","萝卜","小米辣","姜","蒜头","盐","食用油"],"tp":"","d":2,"k":295,"i":"一道清脆爽口的家常凉拌小菜，莴笋经过腌制后格外脆嫩，带着微微辣意，十分开胃。富含维生素与膳食纤维，热量不高。做法简单，对新手很友好，从备料到上桌大约二十分钟，冰镇后风味更佳。","q":["莴笋 1 根","萝卜 0.25 根","小米辣 2 个","姜 1 片","蒜头 2 粒","盐 5 g","食用油 25 ml"],"s":["莴笋削皮，切小条。萝卜切条，一起放入大碗，加入盐搅拌，放置 10 分钟。","放置后的莴笋用水清洗 1-2 遍。","起锅烧水，放入莴笋，水煮 1 分钟 捞出，沥干水分，放入大碗。","起锅烧油，放入姜片、蒜粒、小米椒煸炒 30-45 S ，倒入莴笋中。","搅拌充分，端盘。"],"x":["萝卜非必须，只是为了增加菜色。","端盘后，可以根据个人口味，额外增加生抽、白砂糖、香醋、芝麻等佐料。","莴笋条的大小看个人口感决定，但莴笋皮要尽量多削点，不然真的影响口感。","冰镇效果更加。"]},{"t":"凉拌豆腐","c":"veg","cu":"Chinese","m":10,"p":"tofu","ing":["豆腐","小葱","大蒜","生抽","香油","醋","白糖","辣椒油"],"tp":"","d":2,"k":343,"i":"这道凉菜清爽可口，富含植物蛋白和钙质，低脂健康，制作简单快捷，一般初学者只需要 10 分钟即可完成。","q":["豆腐 250 g （约 1 块常见大小的豆腐）","小葱 10 g","大蒜 2-3 瓣","生抽 15 ml","香油 5 ml","醋 5 ml（可选）","白糖 2 g（可选）","辣椒油 5 ml（可选）"],"s":["将 豆腐 切成 2 cm 见方的小块，备用。","锅中加入 500 ml 饮用水，大火烧开。","放入 豆腐 块，煮 1-2 分钟，以去除豆腥味并使豆腐口感更紧实。","将 煮好的 豆腐 块捞出，沥干水分，放入碗中，备用。","将 小葱 洗净，切成葱花，备用。","将 大蒜 去皮，切成蒜末，备用。","在一个干净的小碗中，加入 15 ml 生抽，5 ml 香油，5 ml 醋（可选），2 g 白糖（可选）。","加入切好的 大蒜末。","搅拌均匀，使 白糖 充分溶解，酱汁混合均匀。","将制作好的酱汁均匀淋在 豆腐 块上。","撒上切好的 小葱花。","根据个人喜好，淋上 5 ml 辣椒油（可选）。","用 筷子 或勺子轻轻拌匀，即可食用。"],"x":["制作凉拌豆腐时，建议选用质地较硬的北豆腐或老豆腐，不易碎裂，口感更佳。","如果喜欢更清淡的口感，可以省略醋和辣椒油。","酱汁的比例可以根据个人口味进行调整。"]},{"t":"凉拌金针菇","c":"veg","cu":"Chinese","m":10,"p":"none","ing":["金针菇","小葱","大蒜","生抽","醋","白糖","香油","辣椒油"],"tp":"","d":2,"k":163,"i":"凉拌金针菇是一道简单快捷的家常开胃凉菜，口感脆嫩爽滑，咸鲜微酸。金针菇富含膳食纤维和多种维生素，热量较低。制作全程只需焯烫和调味，对新手非常友好，忙碌时也能快速准备。从备菜到完成大约只需 10 分钟。","q":["金针菇 150 g （约 1 小包）","小葱 5 g","大蒜 2 瓣","生抽 15 ml","醋 10 ml","白糖 3 g（可选）","香油 5 ml（可选）","辣椒油 5 ml（可选）"],"s":["将 金针菇 根部切除，用清水冲洗干净，备用。","将 小葱 洗净，切成葱花，备用。","将 大蒜 去皮，切成蒜末，备用。","锅中加入 1000 ml 饮用水，大火烧开。","放入 金针菇，煮 1-2 分钟，至金针菇变软。","将 煮好的 金针菇 捞出，沥干水分，放入一个较大的碗中，备用。","在另一个干净的小碗中，加入 15 ml 生抽，10 ml 醋，3 g 白糖（可选），5 ml 香油（可选）。","加入切好的 大蒜末。","搅拌均匀，使 白糖 充分溶解，酱汁混合均匀。","将制作好的酱汁均匀淋在 金针菇 上。","撒上切好的 小葱花。","根据个人喜好，淋上 5 ml 辣椒油（可选）。","用 筷子 轻轻拌匀，即可食用。"],"x":["金针菇焯水时间不宜过长，以免影响口感。","酱汁的比例可以根据个人口味喜好进行调整。","如果不喜欢吃辣，可以省略辣椒油。"]},{"t":"凉拌黄瓜","c":"veg","cu":"Chinese","m":20,"p":"none","ing":["黄瓜","醋","酱油","蒜"],"tp":"","d":1,"k":107,"i":"这是一道清爽开胃的家常凉菜，口感脆嫩，酸香适口。黄瓜富含水分和维生素，有助于清热解暑、美容养颜。做法非常简单，对新手友好，只需拍碎、调味、腌制 15 分钟，全程约 20 分钟即可完成。","q":["黄瓜 200 克","醋 7.5 ml + 4 ml","酱油 5 ml + 2.5 ml","蒜 3 瓣","盐 0.4 克 + 0.2 克","香油 5 ml + 2 ml","蚝油 5 ml"],"s":["用菜刀将黄瓜拍扁，再剁成长 3 厘米的碎块。","将碎黄瓜装入碗中。","将蒜拍碎切成碎末。","将碗中放入 5 克白糖，搅拌均匀腌制 15 分钟（用糖腌制更好吃，且成色更好不会蔫）","将醋，酱油，盐，蚝油和蒜依次倒入碗中搅拌均匀。","将香油倒入碗中并均匀搅拌。"],"x":["部分情况下黄瓜端头有苦味，请洗净切下后确认。","做好之后直接开吃，亦可先准备好后放入冰箱冷藏（并非冷冻）后食用。","若放入冰箱冷藏，则需使用保鲜膜包紧，并在 8 小时内食用完毕，否则黄瓜会因过度腌制失去清脆口感。","推荐黄瓜去皮，口感更好。"]},{"t":"包菜炒鸡蛋粉丝","c":"veg","cu":"Chinese","m":60,"p":"fish","ing":["包菜","鸡蛋","粉丝","胡萝卜","菜籽油","盐、生抽、老抽、蚝油","葱、蒜、干辣椒"],"tp":"","d":3,"k":570,"i":"包菜炒鸡蛋粉丝是一道咸鲜可口的家常快手菜，脆甜的包菜丝与软韧的粉丝、嫩滑的鸡蛋相互融合，口感层次丰富。包菜富含维生素和膳食纤维，鸡蛋提供优质蛋白质，胡萝卜增添营养，荤素搭配均衡。制作时需要提前浸泡粉丝，整体流程稍多但操作并不复杂，对新手有一定挑战性。从备料到出锅，大约需要 1 小","q":["鸡蛋 2 个","粉丝 1 把","胡萝卜 半 根","菜籽油 20 ml","盐 2 g、生抽 15 ml、老抽 10 ml、蚝油 10 ml","葱 半 根、蒜瓣 2 片、干辣椒 5 根"],"s":["胡萝卜、包菜切丝备用。","粉丝先用冷水浸泡 1 小时，然后将粉丝放入锅中，加入开水烧至粉丝烫软捞出备用。","鸡蛋打入碗中，加入盐后搅拌 15 秒。","葱、蒜、辣椒切成小粒备用。","起锅烧油，倒入鸡蛋，打散炒熟盛出。","再倒入油，放入葱、蒜、干辣椒翻炒 8 秒。","下胡萝卜、包菜丝儿翻炒 30 秒。","放入粉丝。","放调料，生抽 15 ml，老抽 10 ml，蚝油 10 ml，盐 2 克。","放入之前炒好的鸡蛋，翻炒约 15 秒。","出锅摆盘。"],"x":[]},{"t":"印度土豆花菜","c":"veg","cu":"Indian","m":44,"p":"none","ing":["土豆","花菜","洋葱","番茄","生姜","大蒜","青辣椒","香菜","食用油","孜然籽"],"tp":"","d":3,"k":668,"i":"这道印度家常素菜以干香金黄、香料浓郁为特点，土豆绵软、花菜略带焦边，属于北印度风味。土豆和花菜富含膳食纤维与维生素 C，营养均衡。做法简单，对新手友好，从准备到出锅约需 25 分钟。","q":["土豆 2 个（约 250g），去皮切块（约 2cm 大小）","花菜 1 个（约 300g），掰成小朵","洋葱 1 个（约 100g），切碎","番茄 1 个（约 100g），切碎","生姜 8g，磨碎","大蒜 3 瓣（约 9g），切碎","青辣椒 1 根，切碎","食用油 30ml","孜然籽 3g","姜黄粉 3g","红辣椒粉 3g","香菜粉 5g","印度综合香料粉 3g","盐 5g","香菜叶 15g（装饰用）"],"s":["将土豆去皮切成约 2cm 的块状。","将花菜掰成均匀的小朵，大朵可用刀切小。","在炒锅中倒入 30ml 食用油，中火加热。","油热后放入孜然籽 3g，炸至孜然籽变深色且散发香味（约 10 秒，注意不要炸糊）","放入切碎的洋葱，翻炒至洋葱变透明微黄（约 3-4 分钟）","加入生姜、大蒜和青辣椒，翻炒 1 分钟。","加入切碎的番茄，翻炒至番茄软烂（约 2-3 分钟）","加入姜黄粉 3g、红辣椒粉 3g、香菜粉 5g、盐 5g。","翻炒 1 分钟，使香料与蔬菜融合。","放入土豆块，翻炒 2 分钟使土豆表面裹上香料。","放入花菜朵，轻轻翻拌均匀。","盖上锅盖，转中小火，焖 12-15 分钟，期间每 3-4 分钟打开翻炒一次防止粘锅。","当土豆用筷子可轻松戳透、花菜略有焦边时，撒入印度综合香料粉 3g。","翻炒 1 分钟。","关火，撒上香菜叶，盛盘。"],"x":["这道菜是干炒风格(Dry)，不需要加水。如果觉得太干容易粘锅，可以加入极少量水（约 15-30ml），但不宜过多。","土豆块不要切太小，否则容易炒散。","花菜的边缘略微焦黄是正常的，反而会增添风味。","Aloo Gobi 因 2001 年的英国喜剧电影\"Bend It Like Beckham\"（像贝克汉姆一样踢球）而在西方世界广为人知。"]},{"t":"印度葫芦丸子","c":"veg","cu":"Indian","m":40,"p":"none","ing":["瓠瓜","鹰嘴豆粉","洋葱","番茄","生姜","大蒜","青辣椒","香菜","姜黄粉","红辣椒粉"],"tp":"","d":4,"k":571,"i":"这道北印度素菜将葫芦擦丝与鹰嘴豆粉团成丸子，油炸后浸入番茄洋葱咖喱，外酥内软、酱汁浓郁香辛。瓠瓜清润、鹰嘴豆粉提供植物蛋白与膳食纤维，是一道饱腹又均衡的素食。制作涉及油炸和熬酱，步骤稍多但按序操作不难掌握，全程大约需要 40 分钟。","q":["瓠瓜（葫芦）1 根（约 400g）","鹰嘴豆粉 80g","盐 3g","红辣椒粉 3g","香菜粉 3g","食用油（炸丸子用）500ml","洋葱 2 个（约 200g），切碎","番茄 3 个（约 300g），切碎","生姜 10g，磨碎","大蒜 4 瓣（约 12g），磨碎","青辣椒 1 根，切碎","食用油 30ml","姜黄粉 3g","红辣椒粉 5g","香菜粉 5g","孜然粉 3g","印度综合香料粉 3g","盐 5g","水 200ml","香菜叶（装饰用）10g"],"s":["将瓠瓜去皮，用刨丝器刨成细丝。","用手将瓠瓜丝中的水分挤干，尽量挤干，否则丸子炸不成型。","在挤干水分的瓠瓜丝中加入鹰嘴豆粉 80g、盐 3g、红辣椒粉 3g、香菜粉 3g。","用手充分混合均匀，揉成不粘手的面团状。","将混合物搓成直径约 3cm 的小丸子，备用。","在深锅中倒入 500ml 食用油，中火加热至油温约 170°C（放入一小块面团，能快速浮起且冒泡即可）","将丸子分批放入油中，炸 4-5 分钟，直至表面金黄酥脆。","炸好的丸子用厨房纸吸去多余油分，备用。"],"x":["瓠瓜挤水是关键步骤，水分过多会导致丸子散开无法成型。","丸子不宜在酱汁中炖太久，否则会变软失去口感。","此菜在印度通常搭配印度烤饼(Naan)或蒸米饭(Chawal)食用。","\"Kofte\"一词源自波斯语/阿拉伯语，意为\"压碎、磨碎\"，广泛流传于南亚和中东地区。"]},{"t":"地三鲜","c":"veg","cu":"Chinese","m":44,"p":"none","ing":["茄子","土豆","尖椒","葱","姜","蒜","豆瓣酱","生抽","糖","淀粉"],"tp":"","d":3,"k":264,"i":"地三鲜是东北经典家常菜，茄子软糯、土豆绵香、尖椒清脆，酱香咸鲜十分下饭。食材搭配可提供丰富的维生素与膳食纤维，土豆还带来满足的碳水能量。这道菜需要油炸和快速翻炒，有一定技巧要求，新手需稍加练习，制作全程约需 40 分钟。","q":["注意，这道菜仅有足够 2-4 人食用的版本。","茄子 200g","土豆 150g","尖椒 3 - 4 个","淀粉 8g"],"s":["土豆、茄子、尖椒洗净。","土豆去皮。","茄子、土豆均切成 15g 的不规则的小块。","尖椒用手顺着纹路撕即可，撕成比土豆、茄子略大 25%的块。","尽可能除去青椒表面的水分，避免后续炸的时候炸水。考虑使用厨房纸或风干半小时。","葱切 0.5cm 小段，共取 5g。蒜剁碎成蒜蓉取 15g，分成两份，各 7.5g。姜切沫取 5g。","拿一个空碗，放入生抽 10ml、糖 10g、淀粉 8g，加入 80ml 清水，彻底搅拌均匀，作为调料碗，备用。"],"x":["糖比淀粉多是非常合理的。淀粉在这里不负责提供味道，它只是一种物理增稠剂。","茄子在煎炸以后，体积会缩小 4 倍。所以拿的时候可能会注意到茄子下锅很多，出锅很少。这是正常的。","青椒下锅的瞬间可能会爆发很多水分，导致油飞溅。务必下锅时用锅盖当盾牌挡在身前，小心下锅。"]},{"t":"家常日本豆腐","c":"veg","cu":"Chinese","m":30,"p":"pork","ing":["日本豆腐","青椒","胡萝卜","火腿肠","黑木耳","洋葱","生粉","蒜","油","生抽 8 ml"],"tp":"","d":3,"k":946,"i":"家常日本豆腐是一道外酥里嫩的家常快手菜，金黄脆壳包裹着柔滑的玉子豆腐，搭配青椒、胡萝卜等时蔬，可调成咸鲜或酸甜风味，脆嫩咸香。日本豆腐以鸡蛋为主要原料，富含优质蛋白，加上木耳和蔬菜，营养均衡。需要一点煎豆腐的技巧，难度适中，新手也能尝试，全程大约 30 分钟即可上桌。","q":["日本豆腐 300 g（约 3 个）","青椒 120 g（中等大小 1 个）","胡萝卜 50 g","火腿肠 50 g（约 1 根）","黑木耳 30 g（干黑木耳约 10 g 泡发）","生粉 80 g","洋葱 30 g","蒜 10 g（约 2 瓣）","油 160-165 ml","生抽 8 ml","蚝油 15 ml","盐 2 g（如果添加了鸡精，只放 0.5g 或不放）","鸡精 3 g","白砂糖 10 g","番茄酱 15 ml"],"s":["胡萝卜切片，尖椒切薄块，葱蒜碎切好。","把买好的日本豆腐打开袋子切好，切成大概 1 cm 厚的圆柱体。","生粉放到平盘中，准备给豆腐裹面。","轻轻把豆腐放到面粉上，上下两面和周边都裹上面粉，注意不要包裹的太厚。","在平底锅里放 150 ml 油，油能没过豆腐一大半即可，看边缘颜色变成金黄，翻面煎就可以了。","两边都煎好的时候捞出来放在干净的盘里备用。","在炒锅中倒入 10-15 ml 油，放入葱蒜，爆香后放入青椒、胡萝卜、火腿肠、黑木耳。","加入蚝油、生抽、盐、鸡精、白砂糖、番茄酱。","轻轻翻炒至颜色均匀。"],"x":["煎好的豆腐不要放太久，提前准备好配料。","参考资料：【步骤图】家常红烧日本豆腐～超级下饭菜！🎊的做法_家常红烧日本豆腐～超级下饭菜！🎊的做法步骤_下饭菜_下厨房。"]},{"t":"小炒藕丁","c":"veg","cu":"Chinese","m":20,"p":"none","ing":["大葱","小米辣","莲藕","生抽","老抽","耗油","油"],"tp":"","d":3,"k":214,"i":"小炒藕丁是一道快手家常素菜，藕丁脆嫩爽口，咸鲜中带着微微辣意，非常下饭。莲藕富含膳食纤维和维生素，有助于清热润燥。制作简单，只要注意藕丁焯水和调味，厨房新手也能轻松完成。全程大约 20 分钟就能端上餐桌。","q":["大葱 1 段","小米辣 1-2 根 （看个人吃辣程度）","莲藕 1 段","生抽 30 ml","老抽 15 ml","耗油 15 ml","食用油 10-15ml"],"s":["大葱、小米辣切小段，备用。","莲藕去皮，切成不超过 3cm 的小块，放入水中备用（防止氧化发黑）","取炒锅，锅内放入 500ml 凉水，煮沸。","将藕丁下入沸水中，焯水 2 分钟后，取出放入盘中备用。","将锅中水倒掉后，将锅加热干燥，加入 10-15 ml 食用油。","待油温升高后，下入葱花，小米辣爆香。","将处理好的藕丁下入锅中，大火翻炒。","加入生抽、老抽、耗油。","翻炒 2 分钟即可出锅。"],"x":["食用莲藕要挑选外皮呈黄褐色、肉肥厚而白的。如果发黑，有异味，则不宜食用。","请尽量不要使用铁器，会导致莲藕发黑。"]},{"t":"干锅花菜","c":"veg","cu":"Chinese","m":40,"p":"pork","ing":["花菜","五花肉","辣椒","生抽","白糖","蒜","盐","油"],"tp":"","d":3,"k":759,"i":"干锅花菜是一道湘味家常菜，口感脆嫩干香，五花肉焦香四溢，带着微微辣意。花菜富含维生素 C 和膳食纤维，搭配五花肉补充蛋白质与能量。制作难度适中，只需注意焯水后充分沥干并把五花肉煸出油脂，适合有一定基础的烹饪新手。从准备到出锅大约需要 40 分钟。","q":["花菜 400 g","五花肉 100 g","辣椒 1-2 根","生抽 10 ml","白糖 5g","蒜瓣 3-4 个","盐 2 g","油 10 ml"],"s":["花菜朵朝下，没入淡盐水中浸泡 20 分钟。然后洗净用小刀拆成小朵。","入开水锅中焯水 1 分钟，捞出立即用冷水冲淋至完全凉透，沥水备用。","五花肉切成薄片，大蒜白色切下用刀背拍扁，小红辣椒切成段。","锅烧热放油，油热下大葱白爆香。","下五花肉片入锅，用中火煸炒至表面全部变色，继续煸炒一会儿，把肥肉部分的油份逼出一部分。","倒入红辣椒段和花菜，翻炒几下。","加入 10 ml 生抽。","再加入 5 g 白糖，转大火不断翻炒 1 分钟。","把大蒜叶部分切成段，放入锅中，翻炒几下后，关火盖上盖子焖 1 分钟即可。"],"x":[]},{"t":"手撕包菜","c":"veg","cu":"Chinese","m":20,"p":"pork","ing":["包菜","五花肉","小米辣","食用油","料酒","生抽","香醋","鸡精","姜","蒜头"],"tp":"","d":3,"k":1663,"i":"手撕包菜是一道酸辣脆爽的经典湘菜，成菜包菜脆嫩入味，五花肉干香不腻，开胃下饭。包菜富含维生素 C 和膳食纤维，搭配五花肉能提供蛋白质和能量。制作时需要掌握大火快炒的火候，对新手稍有挑战，但按步骤操作也能成功。从备料到出锅大约 20 分钟。","q":["包菜 1 颗","五花肉 200 g","小米辣 2 根","食用油 60 ml","料酒 5 ml","生抽 5 ml","香醋 5 ml","鸡精 2 g","姜 2 片","蒜头 2 粒","蒜苗 0.5 根","盐 5 g"],"s":["包菜对半切开，去掉中间白色部分【参见图一】。","手撕包菜，碗中放入 2 g 盐，清洗包菜并沥干备用【参见图二】。","姜片、蒜头、小米辣、蒜苗处理后备用【参见图三】。","五花肉切片，清水清洗后备用。","锅中加入 30 ml 食用油，倒入包菜翻炒，大火翻炒 1 分钟 后，加入 3 g 盐 ，继续翻炒 2 分钟 后取出备用。","锅中加入 30 ml 食用油，倒入五花肉，大火翻炒 1 分钟。","倒入姜片等材料，翻炒 1 分钟。","倒入包菜翻炒后，加入 香醋、料酒、鸡精、料酒，大火继续翻炒，2 分钟 后出锅。"],"x":["步骤五中，翻炒时间需要实际情况做调整，一般是炒到包菜七分熟后即可。七分熟是指包菜已经出水质感变软。","步骤五中，加盐的作用是锁住包菜水分的同时，给包菜上一点味道。","最后一个步骤中，翻炒时间根据实际情况和个人口感做灵活调整。"]},{"t":"拔丝土豆","c":"veg","cu":"Chinese","m":30,"p":"none","ing":["土豆","食用油","淀粉","白砂糖","水","芝麻"],"tp":"","d":3,"k":1158,"i":"拔丝土豆是一道经典的鲁菜，成菜色泽金黄、糖丝细长，外脆里糯、香甜可口。土豆富含碳水化合物和维生素 C，能快速补充能量。这道菜有一定难度，新手需注意熬糖火候，避免翻沙或焦苦。从备料到出锅，预计制作时长约 30 分钟。","q":["土豆 2 个","食用油 300 ml （土豆能浮在油上面即可）","淀粉 30 g","白砂糖 120 g （要多放糖，这是为了在土豆上面裹上一层厚厚的糖浆，从而产生拔丝的效果）","水 100 ml","芝麻 5 g"],"s":["土豆去皮，切均匀的小块。放入淀粉（不加水）搅拌，使得淀粉覆盖土豆表面。","起锅烧油，放入土豆块，缓缓翻滚煎炸 5-7 分钟 ，直至筷子可以插进土豆。","取出土豆，放入大碗备用。","锅中加入水、白砂糖，沿着一个方向慢慢搅动白砂糖，直到白砂糖颜色变成褐色。","重新倒入土豆，翻炒 30 S 后 出锅。","土豆盛盘，散上芝麻。"],"x":["土豆煎炸不可太熟透，否则在拔丝端盘时不容易定型，影响美观。","对于使用剩余的食用油，可以考虑重新收集到油壶。"]},{"t":"松仁玉米","c":"veg","cu":"Chinese","m":32,"p":"none","ing":["玉米粒","熟松子仁","胡萝卜","食用油","白砂糖","盐","淀粉","水"],"tp":"","d":2,"k":580,"i":"松仁玉米是一道口感清甜脆嫩的家常快手菜，松仁香酥、玉米甜润，属于广受欢迎的北方家常风味。玉米和松仁搭配，能提供丰富的膳食纤维、不饱和脂肪酸和多种维生素，营养均衡。做法简单，新手也能轻松驾驭，从备料到出锅一般只需大约十五 分钟。","q":["玉米粒 200 g（可用罐头甜玉米，也可自备煮熟）","熟松子仁 30 g","胡萝卜 50 g（切小丁，可省略）","食用油 15 ml","白砂糖 10 g","盐 1 g","淀粉 5 g","水 20 ml（用于调淀粉水）"],"s":["玉米粒和胡萝卜丁提前焯水 1 分钟，捞出沥干备用。","热锅凉油，放入胡萝卜丁略炒，再加入玉米粒翻炒。","加入白砂糖和盐，炒匀。","混合水与淀粉成水淀粉，倒入锅中快速翻炒使汤汁略稠。","加入熟松仁翻炒均匀。","出锅装盘。"],"x":["松仁可以提前用小火干炒至微微金黄香脆，更加美味。","使用罐头玉米时应先沥干水分，避免炒制过程中出水过多。","炒制时火候不宜过大，以防糊锅或松仁焦糊。"]},{"t":"椒盐玉米","c":"veg","cu":"Chinese","m":30,"p":"none","ing":["玉米粒","椒盐","芝麻粒","油","淀粉","两个塑料簸箕","若干吸油纸"],"tp":"","d":3,"k":693,"i":"一道外酥里嫩、咸香扑鼻的风味小食，有着川菜馆里常见的干香口感，咬开是玉米自带的清甜。玉米提供丰富的碳水化合物与膳食纤维，搭配芝麻还能补充优质脂肪和维生素 E。这道菜步骤略多但操作简单，需要一点耐心抖水裹粉，对新手比较友好。从解冻到出锅大约需要 30 分钟。","q":["这道菜分量和在川菜馆点的标准分量一样","玉米粒（袋装） 350g","淀粉（在锅里完全能盖住玉米粒表面为准，在 40 - 70g）","椒盐粉 10g","芝麻粒 10g"],"s":["玉米粒都是剥好的，直接解冻即可，温水泡 15 分钟或者灶上开水煮 5 分钟。","拿出一个簸箕，将其假设为 BoxA，垫上吸油纸，倒进解冻好的玉米粒。","shaking shaking shaking! - 直到吸油纸全部变湿为止。","拿出第二个簸箕 BoxB，垫上吸油纸，将 BoxA 的玉米粒全部倒入 BoxB 中。","shaking shaking shaking! - 直到吸油纸全部变湿为止。","重复上述操作多次，直到玉米表面没有明显可见的水滴但保持湿润的状态。","倒入大量淀粉，能够完全盖住玉米粒。","shaking shaking shaking! - 直到淀粉裹住了玉米粒。","开灶 - 放锅 - 倒入油 尽量铺满锅底 但不要太多。","油热 8 成，倒入裹上了淀粉的玉米粒。","中火先煎 30s，不要翻炒，不然淀粉会掉。","轻微翻炒 3 分钟即可出锅。","最重要的一步：撒上 3g 椒盐，撒上芝麻粒！","香喷喷的”椒盐玉米“就做好了。"],"x":["玉米粒不要自己剥，费手的，可以直接外卖软件买菜”已经剥好的玉米粒“，30 分钟 送达后温水解冻。","开水解冻慢就拿开水煮！（ 千万别煮玉米本身，带着包装一起煮，撕掉一个口。"]},{"t":"榄菜肉末四季豆","c":"veg","cu":"Chinese","m":44,"p":"pork","ing":["四季豆","五花肉","橄榄菜","大蒜","小米辣"],"tp":"","d":3,"k":720,"i":"榄菜肉末四季豆是潮汕风味浓厚的家常小炒，口感咸香脆嫩，十分下饭。四季豆富含膳食纤维与维生素，搭配肉末能提供优质蛋白，橄榄菜则带来独特的鲜咸风味。这道菜步骤清晰，新手也能较快上手，只需注意将四季豆彻底炒熟。从备料到出锅，大约三十分钟即可完成。","q":["四季豆 220g","五花肉 100g","橄榄菜 20g","大蒜 10g","小米辣 10g"],"s":["将四季豆洗净，并把筋撕干净，然后切成大小均匀的颗粒备用。","将大蒜拍碎剁成蒜末备用。","将小米辣切成大小均匀的颗粒备用。","将五花肉去皮，然后剁成肉末备用。","将锅烧热，然后加入 20ml 油滑锅，锅滑好之后将热油倒出，然后加入 10ml 冷油，这就是传说中热锅冷油，这么做主要是防止肉末粘锅。","如果家里没有晾油瓶的话，也可以不用滑锅，放入油之后，直接加入肉末开始煸炒，小火煸炒两分钟，炒出猪油。","肉末炒香之后加入蒜末，橄榄菜和小米辣，炒出香味。","加入四季豆开中火煸炒，四季豆至少要炒 5 分钟，一定要保证四季豆熟透，否则可能会食物中毒。","四季豆炒熟后加入 2ml 酱油从锅边淋入，然后加入 2g 盐、1g 鸡精、1g 胡椒粉和 0.5g 糖。","将调料翻炒均匀。","出锅，装盘。"],"x":[]},{"t":"水油焖蔬菜","c":"veg","cu":"Chinese","m":10,"p":"fish","ing":["食用油","盐","蚝油","叶菜类蔬菜"],"tp":"","d":2,"k":92,"i":"水油焖蔬菜是一道简单快手的家常佐餐，通过沸水加几滴油和调料，让叶菜口感软嫩、色泽油亮，既清爽又带有淡淡油香。这种做法有助于提高脂溶性维生素的吸收率，比生吃蔬菜更有营养价值。烹饪难度低，对新手非常友好，从洗菜到出锅一般只需 10 分钟。","q":["叶菜类蔬菜：300g ~ 500g"],"s":["洗净蔬菜。","锅中加入 150ml 水，并烧开。（水不需要能完全没过蔬菜）","加入 3g 盐。","（可选）加入 3ml 蚝油。","加入 2ml 食用油。","下菜， 翻拌一下，然后盖上锅盖焖 1 分钟。","盛盘。"],"x":["叶菜类蔬菜含水量较多，在准备时可能看起来体积很大。实际受热后体积会迅速减小。","不确定咸淡的情况， 可以先少放盐， 在出锅前尝味， 考虑调整加盐。","可以用鸡汤、骨头汤等替代水， 更好吃。","焖的时间不可过长。"]},{"t":"油醋爆蛋","c":"veg","cu":"Chinese","m":32,"p":"fish","ing":["鸡蛋","小米辣","小葱","蒜","油","香醋","生抽","蚝油","白糖"],"tp":"","d":2,"k":471,"i":"这是一道湘味十足的家常快手下饭菜，酸辣鲜香，鸡蛋焦香蓬松裹满浓郁汤汁，十分开胃。鸡蛋提供优质蛋白质和卵磷脂，搭配香醋更有助于促进食欲。做法极其简单，新手友好，从准备到出锅仅需大约十分钟。","q":["鸡蛋 4 个","小米辣 10 g（约 3 个）","食用油 35-50 mL","小葱 10 g","蒜 5 g","香醋 15 mL","生抽 10-15 mL","蚝油 10 g","白糖 0-5 g"],"s":["鸡蛋不需打散，直接打入碗中备用。","香葱切 3cm 长小段即可。","蒜瓣和小米辣放入打蒜器，打成沫。","将香醋、生抽、蚝油、白糖、水加入小碗，搅拌均匀作为糖醋料汁。","油热倒入鸡蛋，等鸡蛋凝固之后铲成大块，倒入蒜沫、小米辣沫、倒入糖醋料汁。","大火收汁、快出锅时加入葱段即可。"],"x":["亲测老恒和酿造香醋零添加口味最好，醋香是本菜灵魂所在。"]},{"t":"洋葱炒鸡蛋","c":"veg","cu":"Chinese","m":5,"p":"egg","ing":["鸡蛋","洋葱","食用油","盐","葱","料酒"],"tp":"","d":2,"k":562,"i":"洋葱炒鸡蛋是一道咸香适口、葱香浓郁的家常菜肴，鸡蛋嫩滑，洋葱清甜，属于国民下饭菜。鸡蛋富含优质蛋白质和多种维生素，洋葱含有膳食纤维和抗氧化物质，是一道营养均衡的快手菜。这道菜操作极其简单，对新手非常友好，从备料到出锅只需约 5 分钟。","q":["鸡蛋 2 个","洋葱 50 g","食用油 50 ml","盐 2 g","料酒 2 ml"],"s":["鸡蛋打入大碗中，加入洋葱片、盐后搅拌 60 S。","起锅烧油，倒入鸡蛋，一面煎炸 30-45 S ，翻面继续翻炒，反复 2-3 分钟 后散上料酒出锅。","鸡蛋装盘，散上葱花。"],"x":[]},{"t":"清炒花菜","c":"veg","cu":"Chinese","m":15,"p":"none","ing":["花菜","大蒜","盐"],"tp":"","d":2,"k":211,"i":"一道常见的家常素菜，口感脆嫩爽口。富含维生素 C 和膳食纤维。做法简单快捷，一般初学者仅需 15 分钟即可完成。","q":["花菜 约 300 g （约 1/2 中等大小的花菜）","大蒜 2-3 瓣","盐 3 g","食用油 15 ml","饮用水 50 ml （用于炒制过程）"],"s":["将 花菜 洗净，用刀或手掰成小朵，粗茎部分可以切片，备用。","将 大蒜 去皮，切成蒜片，备用。","锅中加入 1000 ml 饮用水，大火烧开。","放入 花菜 朵，煮 2-3 分钟，至花菜颜色变浅，口感稍微软化。","将 煮好的 花菜 捞出，沥干水分，备用。","热锅，加入 15 ml 食用油，大火烧热。","放入 蒜片，快速煸炒出香味。","放入 焯好水的 花菜 朵，转中大火，快速翻炒约 2 分钟，使花菜均匀受热。","加入 3 g 盐，继续翻炒均匀。","沿锅边淋入 50 ml 饮用水，盖上锅盖，焖 1 分钟，帮助花菜完全熟透入味。","开盖，快速翻炒均匀，即可出锅。"],"x":["提前将花菜焯水可以缩短炒制时间，并使花菜更容易熟透。","炒制时间可以根据个人喜欢的花菜软硬程度调整。喜欢脆一些可以缩短时间。"]},{"t":"清蒸南瓜","c":"veg","cu":"Chinese","m":15,"p":"none","ing":["南瓜","蒸锅"],"tp":"","d":1,"k":80,"i":"一道原汁原味的家常蒸菜，最大程度保留南瓜的天然甜味与营养，口感软糯香甜，既可当甜点也可作主食。南瓜富含β-胡萝卜素和膳食纤维，有益视力与肠胃健康。制作极其简单，新手也能轻松搞定，从切配到出锅仅需 15-20 分钟。","q":["南瓜 300 g","饮用水 1000 ml （用于蒸锅）"],"s":["将 南瓜 外皮洗净，去除瓜瓤和籽。","将 南瓜 切成厚度大约 2 cm 的片，备用。","在 蒸锅 的锅中加入 1000 ml 饮用水。","将切好的 南瓜 片均匀摆放在盘中。","待蒸锅中的水烧开后，将装有 南瓜 的盘子放入蒸锅中。","盖上锅盖，保持大火蒸 15-20 分钟，直至南瓜变软，可以用筷子轻松穿透。","关火，小心取出盘子。"],"x":["南瓜的品种不同，甜度和口感会有差异。老南瓜通常更甜更面。","南瓜皮含有营养，如果喜欢也可以不去皮蒸，但需要彻底洗净。","蒸的时间取决于南瓜块的大小和厚度，以及南瓜的品种。用筷子测试是判断是否蒸熟的好方法。"]},{"t":"炒土豆和胡萝卜蒸菜","c":"veg","cu":"Chinese","m":20,"p":"none","ing":["土豆","胡萝卜","香葱","蒜瓣","盐","李大厨牌子的炒菜料","李大厨牌子的肉香味","味精","干辣椒"],"tp":"","d":1,"k":610,"i":"这道炒土豆胡萝卜蒸菜采用“先蒸后炒”的做法，成品根根分明、软糯咸香。土豆与胡萝卜富含钾元素和 β-胡萝卜素，营养均衡。全流程简单快速，新手极易上手，从备料到出锅仅需 20 分钟。","q":["土豆 320 克","胡萝卜 200 克","香葱 20g","蒜粒 3 瓣","食盐 1/2 茶匙","李大厨牌子的炒菜料 1/2 茶匙","李大厨牌子的肉香味 1/2 茶匙","味精 1/4 茶匙"],"s":["胡萝卜和土豆切成细丝（可以使用擦丝器）","给胡萝卜和土豆丝裹上面粉（胡萝卜颜色裹成像个小香肠一样，土豆裹的像是面条一样，根根分明,干手抓起来零散的毫不粘连的掉下）","把弄散了混合好的，土豆和胡萝卜丝，使用电蒸锅蒸5分钟/蒸锅在上气后大火蒸5分钟。","注意不能直接锅盖 盖上开蒸，而是先不盖，开蒸后产生热蒸汽，再盖锅（防止粘连）","开大火后 15 秒先道友加葱翻炒，把葱炒香/炒 40 秒,加入混合的土豆和胡萝卜丝翻炒。","20 秒后加入李大厨牌子的炒菜料，随后加入李大厨牌子的肉香味儿，然后加入食盐，然后加入味精，一会儿后出锅，关火。"],"x":[]},{"t":"炒滑蛋","c":"veg","cu":"Chinese","m":5,"p":"egg","ing":["鸡蛋","牛奶"],"tp":"","d":1,"k":391,"i":"炒滑蛋是一道口感嫩滑、蛋香浓郁的经典家常菜，带有淡淡的奶香。鸡蛋富含优质蛋白质和多种维生素，营养丰富，易于吸收。做法非常友好，新手也能轻松掌握，从备料到出锅只需约 5 分钟，是忙碌时快速补充能量的理想选择。","q":["鸡蛋 4 颗","牛奶 30ml","食用油 10ml"],"s":["鸡蛋加入牛奶以及 5ml 食用油搅拌均匀，备用。","大火烧热平底锅约 30s, 加入 5ml 食用油。","烧 30s 转小火, 并且放入搅拌好的鸡蛋。","在锅中静置 5 秒后，用锅铲将蛋液从边缘缓慢推向中间。","翻炒至鸡蛋大致凝固后关火，装盘。"],"x":["最后可根据个人口味撒些黑胡椒或者盐来调味。","参考资料。","甜琛廚房。"]},{"t":"炒茄子","c":"veg","cu":"Chinese","m":44,"p":"pork","ing":["茄子","八角","虾皮","香葱","肉末","酱油","糖","醋","菜籽油或花生油"],"tp":"","d":3,"k":610,"i":"这道家常炒茄子软嫩入味，酱香浓郁，加八角后风味更足。茄子富含膳食纤维、维生素 P 和钾元素，有助于保护心血管。做法简单，对新手友好，全程大火快炒，从备料到出锅大约二十分钟即可完成。","q":["茄子数量 1.8 个","八角 1 个","虾皮 正常男子手抓半把","香葱 2 颗","肉末 50 g","酱油 40 ml","糖 5 g","醋 10 ml"],"s":["将茄子洗净，一刀分为两段（竖切）。每段的茄子切菱形块，将切好的茄子放入碗中待命。","将香葱洗净，并切成葱花放到案板上待命。","切好八角，放到案板上待命。","如果打算放肉末，先用 10 ml（如果是纯瘦肉，用 15 ml）油中火炒至变色（约 1 分钟），然后盛出备用。","开火热锅，直至锅内没有水。","往锅内倒食用油，没过锅底的两倍（油可以多加，但不可少加）。","热油约 6 成熟，放入八角、虾皮、香葱这三种可选性材料。","如果没有八角等可选材料，热油至 9 成熟。","待锅内的油到 9 成熟，将碗中的茄子倒入锅内用锅铲进行翻炒。","翻炒约 40 秒，将锅铲悬空，与锅平行，把酱油倒入锅铲内。一人约 2.5 锅铲（酱油可以少加，但不可多加，会咸）。","茄子炒到半软时（约 1 分钟后），放回预炒的肉末，快速搅拌均匀。","如果打算加入糖和醋，加入糖和醋。","继续进行翻炒。","等到锅内所有茄子变色且变软时捞出。"],"x":["> 注：油、酱油这俩种材料在操作中也有体现，大家可以交叉对比来确定添加材料的数量。","因为酱油的缘故，所以本菜不必加盐。出锅之前可以尝一下，如果不咸可以加微量的盐，下次炒时酱油量要增加。","如果加了虾皮，可以将酱油量酌情减少。","炒本菜时，一直大火即可。"]},{"t":"炒青菜","c":"veg","cu":"Chinese","m":10,"p":"none","ing":["青菜"],"tp":"","d":2,"k":152,"i":"这是一道清爽可口的家常素菜，口感脆嫩、咸鲜回甘。青菜富含维生素与膳食纤维，有助于促进消化。做法非常简单，零基础也能轻松驾驭，从备菜到出锅大约只需 10 分钟。","q":["青菜 100g","蒜瓣 2 粒","食用油 10-15ml（覆盖锅底即可）","食盐 2g","饮用水 70ml","白糖 5g"],"s":["青菜掰成小瓣，用清水洗净，备用。","将蒜瓣剁碎，备用。","中火或大火热锅后，锅内放入 10-15ml 食用油。再等待 30 秒让油温升高。","将准备好的青菜倒入锅中，翻炒至青菜变软（约 1 分钟）。","放入剁碎的蒜瓣。","倒入备好的清水，水位应当完全浸润或即将没过青菜，加入食盐 （2g），继续翻炒约 1 分钟。","最后加入白糖小火加热 2 分钟，加热时盖上锅盖。","盛盘。"],"x":["加入白糖，会让青菜颜色更绿。"]},{"t":"炸洋葱花","c":"veg","cu":"Chinese","m":40,"p":"egg","ing":["黄洋葱","鸡蛋","低筋面粉","玉米淀粉","辣椒粉","黑胡椒粉","食盐","食用油","深锅","厨房温度计"],"tp":"","d":5,"k":850,"i":"炸洋葱花是一道美式餐厅的经典炸物，整颗洋葱下刀不切断，裹粉油炸后花瓣自然张开，像一朵炸开的金色大花。外层酥脆，内里是洋葱本身的甜味，配上蘸酱很适合当聚餐小食。难点在选料、刀工和油温：洋葱要大且甜，切断了花瓣散开，裹粉不充分炸不出酥壳，油温过高则外层焦黑。从准备到出锅大约需要 40","q":["黄洋葱 1 颗（直径 9cm 以上，约 350g）","鸡蛋 1 个（约 50g）","低筋面粉 120g（其中 40g 用于第一次拍粉）","玉米淀粉 40g","冰水 100ml","辣椒粉 2g","黑胡椒粉 1g","食盐 3g","食用油 1200ml（油炸用，实际消耗约 80ml）"],"s":["黄洋葱剥去外层干皮，切掉顶部 5mm，保留底部根盘不切。","从顶部下刀，沿直径方向垂直切到距根盘 1cm 处停止，即不切断根盘。","按同样方式每间隔约 45 度切一刀，共切 16 刀，把整颗洋葱分成 16 瓣。","把洋葱翻面，根盘朝上，同样方式在每两瓣之间补切 1 刀，共补 8 刀。"],"x":["洋葱必须是黄洋葱（甜洋葱）且个头大，紫洋葱辛辣、白洋葱偏水，小颗洋葱瓣太薄容易断。","切洋葱时可以用两根筷子垫在洋葱两侧，刀碰到筷子就停，能避免切断根盘。","泡冰水能让花瓣变脆并自然张开，这一步不能省。"]},{"t":"烤茄子","c":"veg","cu":"Chinese","m":44,"p":"none","ing":["茄子","食用油","酱油","蒜蓉","辣椒","孜然","食用盐"],"tp":"","d":3,"k":145,"i":"烤茄子香气浓郁、外焦里嫩，孜然和蒜蓉的辛香完美融入软糯的茄肉，是街头烧烤风味在家轻松复刻的菜品。茄子富含维生素 P 和花青素，有助于保护心血管、抗氧化。做法需要用到烤箱，但步骤清晰，新手也能在大约半 小时完成，很适合作为家庭聚餐的快手下饭菜。","q":["茄子 1 个 （大约 200g）","食用油 20-30 毫升","酱油 4-6 克","小米椒 1 个 （大约 20g）","蒜蓉 3-4 瓣","孜然 1-3 克","食用盐 0.5-2 克"],"s":["将酱油、孜然、食用盐、蒜蓉和切碎的小米椒置于碗中，均匀搅拌备用。","茄子洗净，用纸巾擦干表面的水分。","用叉子在茄子的一侧扎 4-8 下。","使用 15-25ml 的食用油涂满茄子表面。","将烤箱温度设置为 200℃ （打开烤箱风扇 大火），预热 2 分钟。","将茄子放入烤箱中层或者上层，烤制 12-15 分钟 （茄子表面有褶皱，且能按压 0.3-0.5cm 的深度即可）","取出茄子，用刀茄子上竖着划一个口子。口子居中，上下距 1-1.5cm。","用小刀或者叉子伸入口子，竖着切割茄子内部。","将口子微微掰开，倒入第一步准备的酱料。","再次将茄子放入烤箱，将烤箱温度设置为 200℃ ，烤制 4-7 分钟。","取出，关闭烤箱电源。"],"x":["最终成品和楼下烧烤摊的烤茄子差不多，太香了！","茄子表面有水分、未涂满食用油或未使用叉子扎孔可能导致茄子在烤制的过程中爆裂。","第一次用刀划口子的时候，可以直接将茄子竖直切成两半，然后切割出纹路后涂抹上酱料。"]},{"t":"白灼菜心","c":"veg","cu":"Chinese","m":15,"p":"fish","ing":["新鲜菜心","生抽、蚝油、盐","大蒜、小米辣","食用油"],"tp":"","d":2,"k":86,"i":"这道经典粤菜采用白灼技法，沸水快焯保留菜心的清甜与脆嫩，根茎尤为爽口，味道清淡鲜美。富含维生素 C 和膳食纤维，低脂低热量，适合追求健康饮食的人群。做法非常简单，预估难度仅两星，一般初学者只需 15 分钟即可完成，是快速补充绿叶蔬菜的理想选择。","q":["如下的量两个人够吃，一个人吃直接搭配个米饭也可以的。","新鲜菜心 250g","食用油 10g","调一个灵魂料汁儿","生抽 5g","蚝油 5g","盐、糖 5g","大蒜四五瓣、小米辣一两根"],"s":["菜心洗净，去除根部比较硬或老的地方。此处还用刀刮了刮菜心根茎部分，刮掉外面那层比较硬的，菜心内部更可口，但要注意根茎白灼时长，时间太长的话根茎不脆了。","大蒜切成蒜末，有洋葱顺便加了点洋葱。","调制灵魂料汁：生抽 5g 吧、蚝油 5g，加 3g 糖和 100g 清水半碗成一碗汁儿。",">如果要是加淀粉，汤汁儿煮沸后更容易挂在菜心上，味道会更重一些，广东人可能吃不惯。","一锅 500ml 清水加 5g 盐和 10g 食用油烧开。","将菜心根茎在沸水中烫 1 分钟，直到根茎颜色变成深绿。再将整个菜心放到锅中烫熟 1 分钟，捞起来码入盘中。","开另一小锅将兑好的料汁倒入，小火烧开，放入一半的蒜末，一点点姜丝和小米椒碎。在制作时加了一点点洋葱碎和大蒜，先在锅底倒油，五成热后倒入蒜末、洋葱，稍稍爆香后再加入料汁，加入小米辣煮开。","料汁稍微收汁，煮沸后稍等十来秒吧，后直接浇在菜心上，不要特别多，但蒜末还是很给力的不要少蒜。"],"x":["选择菜心一定要比较新鲜！新鲜！","锅内烧清水要加油和盐。"]},{"t":"皮蛋豆腐","c":"veg","cu":"Chinese","m":5,"p":"tofu","ing":["皮蛋","内酯豆腐","生抽","白砂糖","醋","香油","辣椒油","花生碎","葱花","香菜"],"tp":"","d":1,"k":566,"i":"皮蛋豆腐是一道清爽开胃的凉拌家常菜，松花蛋 Q 弹滑嫩，嫩豆腐入口即化，咸香微酸的口味特别下饭。豆腐富含优质植物蛋白和钙，皮蛋则提供铁、维生素 A 等营养素，搭配食用易于消化吸收。制作过程几乎零门槛，新手也能轻松完成，从备料到上桌仅需 大约 5 分钟。","q":["皮蛋 2 个","内酯豆腐 1 盒","生抽 15 ml","白砂糖 2.5g","醋 15 ml","香油 15 ml","辣椒油 10 ml","花生碎 10 g","葱花 15 g","香菜 1 株"],"s":["先把皮蛋剥壳，切成四瓣。","嫩豆腐切块或者切片放中间。","将生抽、白砂糖、醋、香油、辣椒油调成酱汁，淋上去。","最后可选撒上花生碎、葱花、香菜。"],"x":["豆腐先焯水去豆腥味可以去除豆腥味。","皮蛋切瓣时刀上可以抹点香油防止粘刀。","参考资料：涼拌皮蛋豆腐 by 低配版小當家 - 愛料理。"]},{"t":"糖拌西红柿","c":"veg","cu":"Chinese","m":15,"p":"none","ing":["西红柿","白砂糖","冰箱"],"tp":"","d":2,"k":104,"i":"这是一道适合夏季的家常凉菜，酸甜爽口，制作简便。西红柿富含维生素 C，开胃解腻。新手也能轻松完成，整个过程（包含冷藏）约 15 分钟即可上桌。","q":["一份正好够 2 人吃。","西红柿 2 个（每个西红柿约 100g，共 200g）","白砂糖 20g"],"s":["用刀将西红柿皮米字型划开。","用筷子插入西红柿的菊花，在燃气上转动烤 10 秒（或用开水冲 30 秒），直到西红柿皮卷边。","把西红柿的衣服脱光。","再西红柿大卸八块（沿纹路切可以更多的留汁水），去掉头部根蒂部，备用。","全部切好后，将西红柿在盘子中均匀码一层。","撒上白糖，重复上面一步直到全部西红柿放完。","放入冰箱冷藏 10 分钟。","一盘糖拌西红柿就好了，营养美味，酸甜爽口，夏日解暑又解腻。"],"x":["在制作过程中 请您小心使用刀具。"]},{"t":"素炒豆角","c":"veg","cu":"Chinese","m":20,"p":"none","ing":["豆角","小米椒","葱","蒜","生抽","老抽","耗油","盐"],"tp":"","d":2,"k":107,"i":"这是一道酱香浓郁的家常小炒，豆角软嫩入味，鲜辣下饭。富含膳食纤维和多种维生素，有助于促进消化。做法简单，新手也能轻松上手，从备菜到出锅大约 20 分钟。","q":["注意，受食材个体影响，本菜谱为 2 人份菜谱","豆角 250g","小米椒 2 个","葱 3 圈","蒜 2 颗","生抽 6ml","老抽 2ml","耗油 6ml","盐 6g"],"s":["葱切花，蒜切沫，备用。","生抽、老抽、耗油、盐混合调料汁，备用。","小米椒切圈，备用。","豆角去筋，45° 斜切4-10cm小段，备用。","起锅烧油(10ml - 15ml)，冒烟后放入葱、小米椒，翻炒至闻到香味。","加入豆角，翻炒30s。","加入料汁，开大火翻炒2分钟。","倒入 150ml 水。","转中小火，盖上锅盖焖制 8-10 分钟。","加入蒜切沫，出锅。"],"x":["切豆角需要一定的刀工，不会的可以使用剪刀。"]},{"t":"红烧冬瓜","c":"veg","cu":"Chinese","m":25,"p":"fish","ing":["冬瓜","食用油","料酒","淀粉","生抽","老抽","鸡精","香葱","姜末","蚝油"],"tp":"","d":3,"k":519,"i":"红烧冬瓜是一道色泽红亮、香鲜味美的家常素菜，口感软糯入味，属于大众喜爱的中式烧菜。冬瓜本身富含水分、膳食纤维和维生素 C，具有清热解暑、利尿消肿的作用，搭配简单的调味料，营养又好消化。这道菜对初学者比较友好，操作步骤清晰，只需掌握好火候和调味，预计制作时长约 25 分钟。","q":["冬瓜 300 g","食用油 50 ml","料酒 2 ml","淀粉 10 g","生抽 10 ml","老抽 15 ml","鸡精 3 g","香葱 0.5 根","姜末 1 粒","蚝油 15 ml"],"s":["冬瓜去皮，切 边长不超过 2cm 小块。","起锅烧油，放入冬瓜，缓缓翻滚煎炸 2 分钟 ，直至冬瓜表面泛金黄色。","取出冬瓜，放入大碗备用。","利用锅中的剩余油，依次放入姜末、生抽、蚝油，翻炒 15 S。","重新倒入冬瓜，翻炒 30 S 后，加入开水，水要没过冬瓜表面，大火煮 10 分钟。","加入老抽上色，继续煮，直至冬瓜软糯（筷子可以轻松插近冬瓜）","加入鸡精、料酒、香葱翻炒后 30 S， 取出冬瓜到大碗中。","锅中剩余汤汁保留，倒入水淀粉，煮开后汤汁浇灌在冬瓜表面。"],"x":[]},{"t":"红烧茄子","c":"veg","cu":"Chinese","m":45,"p":"egg","ing":["大蒜","大葱","青辣椒","洋葱","西红柿","青茄子","盐","酱油","鸡蛋","面粉"],"tp":"","d":4,"k":547,"i":"红烧茄子是一道咸香浓郁的家常下饭菜，软糯的茄块吸饱汤汁，搭配柿子椒和番茄，酸辣适口。茄子富含膳食纤维和维生素 P，炸过的茄块香而不腻。制作需要挂糊油炸并慢烧入味，步骤略多但对新手仍可尝试，专注细节就能成功。从备料到出锅大约需要 45 分钟。","q":["青茄子的数量 0.7 个","青辣椒 0.5 个","洋葱 0.3 个","西红柿 1 个","大葱 半颗","大蒜 3 瓣","鸡蛋 1 个","面粉 每个青茄子 150 克","淀粉 面粉 / 4 克","酱油 每个茄子 7 克"],"s":["青茄子、青辣椒、西红柿、洋葱、大葱洗净。","大葱切 5 毫米宽的葱花，大蒜扒皮并拍碎，西红柿切 6 立方厘米的块，青辣椒、洋葱切 5g 的块。","茄子切菱形块（先切 2 公分厚的片，然后再把片切成 2 公分的条，最后斜刀切块儿...）。","将面粉倒入盆中，依次加入少量水，搅拌均匀，呈粘稠糊状。","加入淀粉，加入 30 克水，搅拌均匀。","将鸡蛋打到盆中，加入（面粉 / 20）克的盐，搅拌均匀。","将茄块倒入面糊中，搅拌使茄块的每一面都能沾上面糊。","开大火，热锅，加入 500 毫升的油，当能看到锅里的油冒出一丝烟时，调至小火，将茄块用筷子夹入到油锅，待所有的茄块下锅之后，调至中火，直到茄块变金黄色时捞出，将油倒出。","加入（5）g 的油，放入大蒜、葱花，翻炒 15 秒，放入青辣椒块翻炒 30 秒，放入西红柿翻炒 30 秒。","放入炸好的茄块，加水面高度为锅内食材的 0.8 倍。","放入酱油和（3）g 的盐。","等待，直到汤汁呈粘稠状（水位大概为剩余食材高度的 0.2-0.3 倍），开盖，盛出菜，关火。"],"x":["一定要顺序执行，否则会有灾难性错误......。"]},{"t":"脆皮豆腐","c":"veg","cu":"Chinese","m":30,"p":"fish","ing":["老豆腐","鸡蛋","生抽","老抽","蚝油","白糖","玉米淀粉","平底锅"],"tp":"","d":3,"k":840,"i":"脆皮豆腐外酥里嫩，酱汁咸甜适口，是一道快手下饭菜。豆腐富含植物蛋白和钙质，鸡蛋提供优质蛋白，营养搭配均衡。制作需要耐心煎出金黄脆皮，但步骤清晰，初学者也能掌握，全程大约需要 30 分钟。","q":["老豆腐 1 块 （市场买 1.25 格 × 人）","鸡蛋 2 只 × 老豆腐块数","玉米淀粉 50 g × 老豆腐块数","生抽 20 g","蚝油 10 g","老抽 5 g","白糖 10 g"],"s":["鸡蛋搅拌形成蛋液放置备用。","配置酱料 （20 g 生抽+10 g 蚝油+5 g 老抽+10 g 白糖+10 g 玉米淀粉+200 ml 清水）","老豆腐切片 （个人建议，仅供参考 每人 5 片，厚度 1.2 cm）","玉米淀粉倒入盘中，将老豆腐片粘上淀粉后，粘上蛋液，放置一旁。","热锅，锅内放入 18ml 食用油。等待 10 秒让油温升高。","将粘上蛋液的老豆腐片均匀放入锅中，铺好锅底，小火煎至金黄翻面。","待两面煎至金黄后，倒入酱料，让每块豆腐都沐浴在酱料中，大火 3 分钟至酱汁浓稠。","关火。"],"x":[]},{"t":"芹菜拌茶树菇","c":"veg","cu":"Chinese","m":30,"p":"fish","ing":["闽星茶树菇","芹菜","香油","蚝油","味极鲜","食用盐"],"tp":"","d":2,"k":127,"i":"这是一道清爽脆嫩的凉拌菜，芹菜脆嫩与茶树菇的嚼劲相得益彰，口感层次丰富。富含多种维生素和矿物质，营养又开胃。做法非常简单，新手也能轻松掌握，从备菜到完成只需约 30 分钟。","q":["闽星茶树菇 1 瓶","芹菜 250-300g（推荐 30cm 高的芹菜苗，没有芹菜苗可以用山芹或芹菜代替但是需要稍微焯水断生）","香油 5ml","蚝油 大约 7ml","味极鲜 3ml","食用盐 大约 2g"],"s":["（如果是芹菜苗这一步略过）用热水壶烧一壶热水，备用。","新鲜的芹菜苗或者芹菜摘去黄叶清洗，备用。","（如果是芹菜苗这一步略过）将芹菜摘去叶子单独放一个盆中，将芹菜茎用刀划成 2-3 毫米宽的芹菜条备用，这一步的目的是让芹菜断生的更快更均匀，吃起来更脆更爽口。","芹菜苗切成 4cm 的芹菜段，备用。","（如果是芹菜苗这一步略过）起锅开火，将热水壶的开水倒入锅中待水起泡沸腾。","（如果是芹菜苗这一步略过）将切好的芹菜条放入锅中焯水，大约 20 秒放入芹菜叶,5 秒后关火全部捞出过凉水，备用。","将盆中焯好的芹菜或者芹菜苗撒上准备好的食盐，香油，蚝油和味极鲜搅拌均匀。","将茶树菇倒入盆中搅拌均匀。","装盘。","开吃。"],"x":["焯水时的水位需要没过芹菜。","芹菜叶太老太硬的话可以不要。"]},{"t":"茄子炖土豆","c":"veg","cu":"Chinese","m":45,"p":"none","ing":["茄子","土豆","肉","辣椒","酱油","盐","蒜"],"tp":"","d":3,"k":623,"i":"茄子炖土豆是一道东北家常炖菜，口感绵软咸香，带着辣椒的微辣和蒜香，十分下饭。茄子富含花青素和膳食纤维，土豆提供碳水化合物和维生素 C，加上猪肉的蛋白质，营养均衡又饱腹。这道菜操作流程简单，但需要掌握翻炒和收汁的火候，对新手有一定挑战，预估难度中等。从备料到出锅大约需要 45 分钟","q":["茄子的数量 1 个 （每个茄子约 150g）","土豆数量 1 个（每个土豆约 150g）","肉量 180 克","酱油量 15 毫升","盐量 5 克","辣椒量 50 克（调味，所以无论多少人都放这些。）","蒜量 3 瓣（调味，所以无论多少人都放这些。注意是里面的小瓣 3 瓣，而不是3整头）"],"s":["将茄子、土豆、辣椒洗净，蒜扒皮并拍碎。","将茄子、土豆切成约 6 立方厘米的块，辣椒切成 5 克的小块，肉切成 3 厘米的丝。","开火，热锅，加入13 毫升的油。","当能看到锅里的油冒出一丝烟时，放入辣椒。","煸出辣椒香气后，立刻放入肉，用铲子翻炒 30 秒。","放入土豆，翻炒 30 秒。","放入茄子，翻炒 30 秒。","放入酱油和盐，继续翻炒 5 分钟。","加入水，水面高度为锅内食材高度的 0.9 倍，并盖上锅盖。","等待，直到锅内水的高度剩余食材高度的 0.1 倍时，开盖，放入蒜，搅拌均匀，关火。"],"x":["在操作的第 5-7 步骤中要注意：在此过程中注意锅底如果没有液体（油或水），则加 5 毫升的水再继续翻炒。"]},{"t":"莴笋叶煎饼","c":"veg","cu":"Chinese","m":10,"p":"egg","ing":["莴笋叶","鸡蛋","食用油","生抽","淀粉","鸡精"],"tp":"","d":2,"k":477,"i":"莴笋叶煎饼是一道简单快手的家常小吃，口感外酥里嫩，带有莴笋叶的清香味。莴笋叶富含维生素和膳食纤维，搭配鸡蛋补充优质蛋白，营养均衡。制作过程无需复杂技巧，只需搅拌并煎制两面，新手也很容易上手，预计从备料到出锅仅需 大约 10 分钟。","q":["莴笋叶 50 g","鸡蛋 2 个","食用油 30 ml","生抽 5 ml","淀粉 15 g","鸡精 2 g"],"s":["莴笋叶剁碎，加入鸡蛋、生粉、生抽、鸡精搅拌均匀备用。","起锅烧油，倒入莴笋叶浆汁，均匀平铺在锅面上。","第一面炸 120 S 后，翻面再炸 60 S 后出锅。"],"x":["选择莴笋叶是某省市买到的蔬菜包基本都包含莴笋，可以换成韭菜等。","莴笋叶直接焯水后凉拌有苦味，所以选择做成煎饼的配菜。"]},{"t":"菠菜炒鸡蛋","c":"veg","cu":"Chinese","m":15,"p":"egg","ing":["菠菜","鸡蛋","食用油","食用盐"],"tp":"","d":2,"k":350,"i":"菠菜炒鸡蛋是一道清淡爽口的家常快手菜，菠菜软嫩、鸡蛋鲜香，属于南北皆宜的大众风味。菠菜富含铁、叶酸和维生素，鸡蛋提供优质蛋白与卵磷脂，搭配食用有助于补血养气、增强体质。整道菜操作简单，非常适合烹饪新手，从备料到出锅大约只需 15 分钟。","q":["菠菜 350g","鸡蛋 2 个","食用油 15ml","食用盐 5g"],"s":["菠菜去根，洗净，放在篮子里，焯水。","将鸡蛋打入碗中，搅匀。","热锅，加入 10ml 油。","油热后，倒入鸡蛋液，中火翻炒 15 秒，先煎成蛋饼，然后再用锅铲切成小块。","关火，将鸡蛋块 盛到盘子中，不要洗锅。","重新开火，倒入 5ml 油，油热后，放入菠菜，大火 翻炒 15 秒后，倒入鸡蛋块，翻炒均匀。","加入 5g 盐、100ml 饮用水，大火 翻炒 10 秒。","关火，盛盘。"],"x":[]},{"t":"葱煎豆腐","c":"veg","cu":"Chinese","m":30,"p":"tofu","ing":["白豆腐","葱","青辣椒","盐","鸡精","平底锅"],"tp":"","d":3,"k":364,"i":"外焦里嫩，葱香浓郁，咸鲜微辣，是一道家常风味。豆腐富含植物蛋白和钙质，搭配青椒和葱段，营养均衡。制作难度适中，煎豆腐时需掌握小火慢煎，新手按步骤耐心操作也能做好，全程约 30 分钟。","q":["白豆腐的数量 0.8。","辣椒的数量 1.5 只/三人。","葱的数量 2 根/三人。","盐量 3g。","鸡精量 1.5g。"],"s":["豆腐洗净。切约 5 mm 厚度，置于碟中。","葱洗净，除去根部，切成葱花，备用。","辣椒洗净，切开，去籽，切成 1cm×1cm 状，备用。","热锅，加入9ml 油。","油入锅后，使其均匀布于锅底，均匀放入豆腐，小火煎至金黄翻面。","待两面金黄，盛入碟中备用。","补油至覆盖锅底，倒入辣椒大火翻炒，并铲碾 3 分钟。","倒入豆腐，翻炒，加入盐与鸡精，中火翻炒 1 分钟后倒入 10 ML 水，大火收汁。","出锅前撒上备好的葱花，起锅盛盘。"],"x":[]},{"t":"蒜蓉炒芹菜","c":"veg","cu":"Chinese","m":10,"p":"pork","ing":["芹菜","猪油","蒜","盐"],"tp":"","d":2,"k":150,"i":"蒜蓉炒芹菜是一道清脆爽口、蒜香浓郁的家常快手素菜。芹菜富含膳食纤维、维生素 K 和钾元素。这道菜的灵魂在于「脆」——大火快炒半分钟即出锅，口感脆生生的，一口咬下去还有汁水。从备料到出锅大约只需 10 分钟。","q":["香芹 300 g（约 2 大把）","蒜 4 瓣，切末","猪油 15 ml","盐 2 g"],"s":["芹菜摘去大部分叶子，只保留少量嫩叶。如果梗部较粗，纵向剖开一刀使其粗细一致，然后切成不超过 5 cm 的段（约大拇指长度，太长容易卡嗓子）","蒜切成蒜末，备用。","芹菜段入锅前尽可能沥干水分，甩得越干越好。","炒锅烧热，放入 15 ml 猪油，油热后先撒入 2 g 盐。","放入蒜末，小火炒 10 秒煸香。","转大火，倒入芹菜段，快速翻炒 30 秒，立即出锅。","出锅标准：芹菜看起来半生不熟、颜色翠绿、没有炒软塌，这时的口感最脆。"],"x":["芹菜选香芹（细梗品种）最佳，口感最脆嫩。普通芹菜也可以，但梗粗的需要纵向切细。","大火快炒是关键，芹菜下锅到出锅不超过 1 分钟。炒久了会变软变蔫，失去脆生的口感。","芹菜下锅前一定要尽量沥干水，水分太多会降低锅温，导致变成「煮」而不是「炒」","用猪油炒比食用油更香，如果没有猪油，食用油也可替代。"]},{"t":"蒜蓉空心菜","c":"veg","cu":"Chinese","m":15,"p":"none","ing":["空心菜","蒜末","盐","生抽","筷子","铲子"],"tp":"","d":2,"k":440,"i":"蒜蓉空心菜是一道清脆爽口、蒜香浓郁的家常快手菜，属于典型的川式小炒风味。空心菜富含膳食纤维、维生素和钙质，有助于促进肠道蠕动。做法非常简单，对新手十分友好，从备料到出锅大约只需 15 分钟。","q":["新鲜空心菜 250 g","大蒜半个，切碎为蒜末","食用油 45 ml","盐 2 g","白糖 3 g","生抽 8 ml"],"s":["空心菜洗净，去掉烂叶或者老梗，均匀切成 2 段或者 3 段（防止过长不好炒）","锅里先倒少量油，烧至微微冒烟，此时拿起锅将国内的热油向四周浸润，让油均匀覆盖锅底，然后再倒入剩余的油（热锅凉油法）。","放入蒜末，小火炒 10 到 15 秒煸香。","尽快均匀地放入空心菜，开大火，左手拿铲子，右手拿筷子，配合将空心菜不停翻动，直至软化变绿。","接着不需使用筷子，而是使用铲子快速翻炒已软化的空心菜 15 - 20 秒，使之受热更均匀，撒入盐 2 g ，白糖 3 g，生抽 8 ml。","继续大火翻炒 10 秒，即可出锅。"],"x":["空心菜尽量选择新鲜，鲜嫩的，否则炒出来口感可能会比较老。","实际放入空心菜的量可以根据锅的大小决定，建议不超过一个锅，否则太多的话开始的翻动阶段和后续的翻炒，容易掉出少量空心菜到灶台。","炒空心菜时，一定要开大火，这样空心菜才能快速变软的同时保持脆嫩的口感，大火也有利于炒出生抽的香味。"]},{"t":"蒜蓉西兰花","c":"veg","cu":"Chinese","m":15,"p":"fish","ing":["西兰花 1 个","大蒜 3-4 瓣","生抽","蚝油","白糖"],"tp":"","d":2,"k":187,"i":"这道家常蔬菜以蒜香浓郁、调味简单见长，西兰花焯水后软嫩或微脆，清淡鲜美。富含维生素 C、膳食纤维和多种抗氧化物质，是营养均衡的快手素菜。制作过程不难，新手也能轻松掌握，从备料到出锅一般约 15 分钟即可完成。","q":["西兰花 约 200 g （约 1/2 中等大小的西兰花）","大蒜 3-4 瓣","生抽 10 ml","蚝油 5 ml","白糖 2 g"],"s":["将 西兰花 切成小朵，清洗干净。","将 大蒜 去皮，切成蒜末，备用。","锅中加入 1000 ml 饮用水，大火烧开。","放入 西兰花，保持大火 煮 2-3 分钟，至 西兰花 颜色变翠绿，口感变软。","将 煮好的 西兰花 捞出，沥干水分，摆入盘中，备用。","热锅，加入 10 ml 食用油。油温升高后，放入 大蒜末，小火煸炒出香味。","加入 10 ml 生抽，5 ml 蚝油，2 g 白糖，加入 30 ml 饮用水。","将锅中汤汁烧开。","将烧好的蒜蓉汁 均匀淋在盘中的 西兰花 上。"],"x":["焯水时间不宜超过推荐时长，以免影响西兰花的口感和营养。","如果想保留西兰花更脆的口感，可以缩短焯水时间。"]},{"t":"蒲烧茄子","c":"veg","cu":"Chinese","m":30,"p":"none","ing":["茄子","蒲烧汁","蜂蜜","白糖","生抽","老抽","料酒","水"],"tp":"","d":3,"k":326,"i":"蒲烧茄子是一道咸甜交织、口感软糯的家常菜，借鉴日式蒲烧风味却用中式煎烧手法烹制。茄子富含膳食纤维和多种维生素，有助于清热活血。难度适中，对新手稍需耐心，预计制作时长约 30 分钟。","q":["根据锅的类型决策不同量的油","不粘锅：油汇聚成滴后要散布在茄子的面积","铁锅：摊开后油可以刚好覆盖锅底","1 个长的上小下大的茄子（注意不要使用浙茄和圆茄）","1 份蒲烧汁","20 ml 蜂蜜","15 ml 白糖","40 ml 生抽","10 ml 老抽","20 ml 料酒","100 ml 水"],"s":["茄子削皮、横着切成两段。","蒸 5 分钟。","纵向切开，不要切断，在两边切面各划 2~3 刀至可以摊平。","煎至两面金黄。","往茄子上浇蒲烧汁至没过 1/2 茄子高度。","煎至背面上色，翻面。","同时收汁，若无法收汁可以加入水淀粉（生粉和水的比例在 1:4 到 1:10 根据收汁情况而定）","把剩下的蒲烧汁浇在茄子上。","出锅，一份茄子烧蒲烧汁就烧好了。"],"x":["这个蒲焼き其实很中国，日式的蒲烧其实是烤的。","灵魂其实在于蒲烧汁？也可以买现成的蒲烧汁。","如果觉得腻可以在装盘后撒点切成 2~5 mm 的小葱，颜色搭配上也能不那么单调。","炒茄子（鱼香茄子、酱爆茄子）墙裂推荐浙茄，细长所以切成滚刀块刚刚好，皮很嫩不像这里需要去皮，茄子的味道适中。"]},{"t":"虎皮青椒","c":"veg","cu":"Chinese","m":15,"p":"none","ing":["青椒","大蒜","白糖","醋","生抽","盐","砵或者有一定深度的碗"],"tp":"","d":3,"k":341,"i":"虎皮青椒是一道家常小菜，外皮微焦起皱，口感软嫩带脆，咸鲜中透着酸甜，十分开胃下饭。青椒富含维生素 C 和膳食纤维，有助于增强免疫力、促进消化。制作过程简单明了，只需掌握按压和火候，对新手也比较友好，一般约 15 分钟就能完成。","q":["青椒 5 个，长度在 10-15cm 的最为合适","大蒜 2-3 瓣","油 20ml","白糖 15g","生抽 15ml","香醋 15ml","盐 4g"],"s":["去掉青椒蒂，用自来水冲洗干净。","青椒切长片，平均一个青椒纵向切成 3-4 片即可。","大蒜去皮，切成碎末，体积在 2mm×2mm×2mm 即可。","调料 1：拿一个小碗倒入 20ml 油，将大蒜末放入其中。","调料 2：白糖、生抽、醋、盐全部倒入砵（碗）等容器，搅拌。","将 调料 1 倒入锅中，开火加热 5 成放入青椒，青椒片不要叠在一起，单独成片放置锅中。","用锅铲不停的按压青椒，合适的时候翻面。","翻炒约 2 分钟，待青椒表皮出现褶皱时，倒入 调料 2。","加大火候继续翻炒 30s 后即可出锅盛入盘中。"],"x":[]},{"t":"蚝油三鲜菇","c":"veg","cu":"Chinese","m":15,"p":"fish","ing":["香菇","蟹味菇","白玉菇","小米辣","菜椒","食用油","盐","料酒","淀粉","生抽"],"tp":"","d":3,"k":222,"i":"蚝油三鲜菇是一道鲜美滑嫩的家常快手菜，菌菇吸饱蚝油酱汁，口感软滑有嚼劲，带着微微辣意，清爽不腻。富含植物蛋白、膳食纤维和多种维生素，搭配西蓝花营养均衡。制作简单，新手也能轻松掌握，从备料到出锅仅需 大约 15 分钟。","q":["鲜香菇 2 朵","蟹味菇 30 g","白玉菇 30 g","小米辣 1 根","菜椒 0.5 颗","食用油 10 ml","食用盐 5 g","料酒 2 ml","淀粉 10 g","生抽 10 ml","鸡精 3 g","香葱 0.5 根","姜末 1 粒","蚝油 5 ml","开水 350 ml","西蓝花 100 g"],"s":["蟹味菇、白玉菇 去掉根部泥土，掰散菌朵。","香菇切片（每片厚度 0.5-1 cm，厚点相对薄点更有嚼劲）","生粉倒入小碗中，加入 50ml 水，搅拌生粉直至融化没有颗粒（即水淀粉）备用。","水开，放入西蓝花，清水煮 3 分钟，放入碗中备用。","洗锅烧开水，加入 5 g 食用盐，倒入蟹味菇、白玉菇、香菇，水煮 1 分钟。","1 分钟后，捞出沥干水分。","起锅烧油，待油开始冒小泡，放入姜末、小米辣、菜椒 煸炒 30 S。","倒入三鲜菇，然后依次倒入生抽、蚝油、鸡精，翻炒均匀后，倒入水淀粉。","中火烧干汁，加入料酒、葱花 出锅。","摆上西蓝花。"],"x":[]},{"t":"蚝油生菜","c":"veg","cu":"Chinese","m":15,"p":"fish","ing":["生菜","蚝油","大蒜","生抽","盐","白糖","食用油"],"tp":"","d":2,"k":125,"i":"蚝油生菜是一道爽口鲜香的家常菜，脆嫩的生菜淋上蒜香蚝油汁，咸中带甜，属于粤菜和川菜馆都很常见的快手素菜。富含维生素和膳食纤维，有助于促进消化。做法对新手非常友好，从洗菜到出锅大约只需 15 分钟即可完成。","q":["这道菜分量和在川菜馆点的标准分量一样","生菜 1 棵( 200 g ± 50 )","蚝油 6-8 ml","大蒜 4-5 瓣（做成蒜泥或切碎）","生抽 6 ml","盐 0.5 g","白糖 1 g","食用油 5-8 ml"],"s":["生菜洗净并去掉烂菜叶。","热锅，先放 1 L 清水（凉），然后在锅内放入 2 ml - 3 ml 食用油和 0.5 g 盐，等待锅中的水煮沸。","水沸后，放入生菜，将每一片生菜叶都焯水 10 s。","捞出生菜，控干水份，摆盘 。","调汁：将生抽 10 ml 、蚝油 6-8 ml 、盐 0.5 g 、 白糖 1 g 放入碗中调匀，并加入 10-15 ml 清水（凉）搅拌均匀。","再开火，热锅，放入食用油 5-8 ml，油热放入蒜泥。","等待有蒜香飘出，倒入调好的汁，煮沸即可，立马关火。","将锅中的汤汁均匀地浇在生菜上。"],"x":["这道菜富含维生素，做法简单，尝起来爽口又不上火。"]},{"t":"西红柿炒鸡蛋","c":"veg","cu":"Chinese","m":15,"p":"egg","ing":["西红柿","鸡蛋","食用油","盐","糖","葱花"],"tp":"","d":2,"k":252,"i":"一道酸甜开胃的家常菜肴，嫩滑的鸡蛋裹着软烂多汁的西红柿，是中国家庭餐桌上的经典味道。鸡蛋提供优质蛋白质，西红柿富含维生素 C 和番茄红素，营养均衡好吸收。步骤简单，原材料易得，特别适合厨房新手入门，从头备菜到盛盘出锅大约只需 15 分钟。","q":["西红柿 1 个（约 180g）","鸡蛋 1.5 个","食用油 4ml × 鸡蛋/个","盐 1.5-2g","糖 0-2g","葱花 0-10g"],"s":["西红柿洗净。","可选：去掉西红柿的外表皮。","开水烫表皮，然后将西红柿放入冷水，剥去外皮。","西红柿去蒂，切成边长不超过 4cm 的小块，即为 西红柿块。","将鸡蛋打入碗中，加入 1g 的盐，搅匀，即为 鸡蛋液。","可以考虑向鸡蛋中加入 1ml 醋，这可以去除腥味，令鸡蛋更蓬松。","热锅，加入食用油。","油热后，倒入 鸡蛋液。翻炒至鸡蛋结为固体且颜色微微发黄，即为 半熟鸡蛋。","关火。将 半熟鸡蛋 盛盘，重新开火。","注意：不要洗锅。","加入 西红柿块，锅铲拍打并翻炒 20 秒，或至西红柿软烂。","向锅中加入 半熟鸡蛋，翻炒均匀。","可以考虑加入 10ml 番茄酱和 50ml 清水，增加汤汁。","可以额外加入一些其它熟肉和材料。","加入剩余的盐、糖（可选，如果倾向于甜味版本）、葱花（可选），翻炒均匀。","关火，盛盘。"],"x":["直接在有半熟鸡蛋的锅中加入 西红柿块，与鸡蛋一起翻炒直至西红柿软烂。","加入盐 改为 “加入两滴生抽”。"]},{"t":"西红柿豆腐汤羹","c":"veg","cu":"Chinese","m":15,"p":"tofu","ing":["西红柿","鸡蛋","豆腐","食用油","盐","淀粉","鸡精","香葱","姜","开水"],"tp":"","d":2,"k":242,"i":"一道清淡鲜美的家常汤羹，酸甜开胃，口感嫩滑。西红柿富含维
